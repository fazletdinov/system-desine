version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - bodyclose
    - noctx
  settings:
    depguard:
      rules:
        #region domain-rule
        # Домен — только стандартная библиотека: strict пропускает лишь то, что в allow.
        # deny сужает allow и даёт понятное сообщение для самых частых ошибок.
        domain:
          list-mode: strict
          files: ["**/internal/*/domain/**", "!$test"]
          allow:
            - $gostd
            - messenger/internal/kernel/ident
          deny:
            - pkg: messenger/internal/user
              desc: "домен не зависит от других пакетов проекта (урок 1.1, правило зависимостей)"
            - pkg: messenger/internal/chat
              desc: "домен не зависит от других пакетов проекта (урок 1.1, правило зависимостей)"
            - pkg: messenger/internal/auth
              desc: "домен не зависит от других пакетов проекта (урок 1.1, правило зависимостей)"
            - pkg: messenger/internal/platform
              desc: "домен не зависит от других пакетов проекта (урок 1.1, правило зависимостей)"
            - pkg: net/http
              desc: "домен не знает про транспорт: HTTP — дело адаптера"
            - pkg: database/sql
              desc: "домен не знает про хранилище: оно за портом в usecase"
            - pkg: encoding/json
              desc: "сериализация — в DTO адаптера, не в домене"
            - pkg: log/slog
              desc: "домен не логирует: он возвращает ошибки"
            - pkg: github.com/google/uuid
              desc: "домен не знает, как генерируются id: порт IDGenerator"
        #endregion domain-rule
        # Use case — стандартная библиотека, домен и свои же пакеты (тесты хранилищ в
        # подпакетах usecase). Что use case берёт домен только своего контекста,
        # проверяют правила chat-context и user-context ниже.
        usecase:
          list-mode: strict
          files: ["**/internal/*/usecase/**", "!$test"]
          allow:
            - $gostd
            - messenger/internal/user/domain
            - messenger/internal/user/usecase
            - messenger/internal/chat/domain
            - messenger/internal/chat/usecase
            - messenger/internal/auth/domain
            - messenger/internal/auth/usecase
            - messenger/internal/kernel/ident
          deny:
            - pkg: messenger/internal/user/adapters
              desc: "use case зависит от порта, а не от адаптера"
            - pkg: messenger/internal/chat/adapters
              desc: "use case зависит от порта, а не от адаптера"
            - pkg: messenger/internal/auth/adapters
              desc: "use case зависит от порта, а не от адаптера"
            - pkg: messenger/internal/platform
              desc: "время и id приходят через порты Clock и IDGenerator"
            - pkg: net/http
              desc: "use case не знает про транспорт"
            - pkg: database/sql
              desc: "use case не знает про хранилище"
            - pkg: github.com/google/uuid
              desc: "id приходят через порт IDGenerator"
        adapters:
          list-mode: lax
          files: ["**/internal/*/adapters/**", "!$test"]
          # Исключение для сгенерированного кода: адаптер может импортировать gen своего пакета.
          allow:
            - messenger/internal/user/adapters/httpapi/gen
            - messenger/internal/chat/adapters/httpapi/gen
            - messenger/internal/auth/adapters/httpapi/gen
          deny:
            - pkg: messenger/internal/user/adapters
              desc: "адаптеры не знают друг о друге: связь — через use case"
            - pkg: messenger/internal/chat/adapters
              desc: "адаптеры не знают друг о друге: связь — через use case"
            - pkg: messenger/internal/auth/adapters
              desc: "адаптеры не знают друг о друге: связь — через use case"
        #region chat-context-rule
        chat-context:
          list-mode: lax
          files: ["**/internal/chat/**", "!**/internal/chat/adapters/userchecker/**"]
          deny:
            - pkg: messenger/internal/user
              desc: "контекст chat не зависит от user: порт UserChecker и адаптер userchecker"
            - pkg: messenger/internal/auth
              desc: "контекст chat не знает про auth: кто вызывает — из platform/principal"
        #endregion chat-context-rule
        user-context:
          list-mode: lax
          files: ["**/internal/user/**"]
          deny:
            - pkg: messenger/internal/chat
              desc: "контекст user не знает про чаты"
            - pkg: messenger/internal/auth
              desc: "контекст user не знает про auth: кто вызывает — из platform/principal"
        auth-context:
          list-mode: lax
          files: ["**/internal/auth/**", "!**/internal/auth/adapters/userbridge/**"]
          deny:
            - pkg: messenger/internal/user
              desc: "auth не зависит от user: порты ProfileRegistrar, ProfileValidator и UserLookup, адаптер userbridge"
            - pkg: messenger/internal/chat
              desc: "auth не знает про чаты"
        # Ограничитель хеширования — декоратор над портом: знает только порт (и типы
        # домена в его сигнатуре), а не конкретный хешер и не HTTP (спека 1.5a, §4.7).
        hashlimit:
          list-mode: strict
          files: ["**/internal/auth/adapters/hashlimit/**", "!$test"]
          allow:
            - $gostd
            - messenger/internal/auth/usecase
            - messenger/internal/auth/domain
        # Контексты не знают о пробах: проверки готовности (Postgres в 2a) регистрирует
        # composition root — так контекст не зависит от того, как его здоровье спрашивают.
        contexts-no-health:
          list-mode: lax
          files: ["**/internal/user/**", "**/internal/chat/**", "**/internal/auth/**"]
          deny:
            - pkg: messenger/internal/platform/health
              desc: "пробы собирает composition root (ADR-0008)"
        # Компоненты собирает и запускает composition root: контекст не решает, когда
        # его фоновая работа стартует и в каком порядке останавливается (урок 1.5.6).
        contexts-no-lifecycle:
          list-mode: lax
          files: ["**/internal/user/**", "**/internal/chat/**", "**/internal/auth/**"]
          deny:
            - pkg: messenger/internal/platform/lifecycle
              desc: "компоненты собирает composition root (cmd/messenger)"
        # Жизненный цикл и периодическая работа — чисто технические пакеты: только
        # стандартная библиотека (и errgroup), без контекстов и без друг друга —
        # periodic.Task подходит под lifecycle.Component структурно, импорт не нужен.
        lifecycle:
          list-mode: strict
          files: ["**/internal/platform/lifecycle/**", "!$test"]
          allow:
            - $gostd
            - golang.org/x/sync/errgroup
        periodic:
          list-mode: strict
          files: ["**/internal/platform/periodic/**", "!$test"]
          allow:
            - $gostd
        platform:
          list-mode: lax
          files: ["**/internal/platform/**"]
          deny:
            - pkg: messenger/internal/user
              desc: "platform — общие технические пакеты, без бизнес-контекстов"
            - pkg: messenger/internal/chat
              desc: "platform — общие технические пакеты, без бизнес-контекстов"
            - pkg: messenger/internal/auth
              desc: "platform — общие технические пакеты, без бизнес-контекстов"
        kernel:
          list-mode: strict
          files: ["**/internal/kernel/**", "!$test"]
          allow:
            - $gostd

formatters:
  enable:
    - gofmt
