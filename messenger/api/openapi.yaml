# region info
openapi: 3.0.3
info:
  title: Messenger API
  version: 1.0.0
  description: |
    HTTP API учебного мессенджера (курс system design, модуль 1).
    Контракт — источник правды: Go-типы и интерфейсы сервера генерируются из него
    (oapi-codegen), а тесты проверяют каждый ответ сервера по нему (kin-openapi).
    Ограничения полей здесь — документация для клиентов; решает домен.
# endregion info
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: auth
    description: Регистрация и вход
  - name: users
    description: Пользователи
  - name: chats
    description: Чаты и сообщения
# Закрыто по умолчанию: операция без своего security требует токен. Открытые —
# регистрация и вход — объявляют security: [] явно.
security:
  - bearerAuth: []
paths:
  # region signup-path
  /v1/users:
    post:
      tags: [auth]
      operationId: signUp
      summary: Зарегистрироваться
      description: |
        Создаёт профиль и учётные данные. Пароль — от 15 до 128 символов (кодовых точек
        Unicode), без требований к составу (NIST SP 800-63B-4, §3.1.1.2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: Пользователь создан
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # endregion signup-path
  # region token-path
  /v1/tokens:
    post:
      tags: [auth]
      operationId: createToken
      summary: Войти — получить токен доступа
      description: |
        Обменивает имя и пароль на JWT (EdDSA, срок 15 минут). Форма ответа — как у
        RFC 6749 §5.1, но это не OAuth 2.0: нет клиентов, грантов и scope.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTokenRequest' }
      responses:
        '200':
          description: Токен выдан
          headers:
            Cache-Control:
              description: Токен — секрет; ответ нельзя класть ни в какой кэш.
              required: true
              schema: { type: string, enum: [no-store] }
            Pragma:
              description: То же для кэшей HTTP/1.0.
              required: true
              schema: { type: string, enum: [no-cache] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # endregion token-path
  /v1/users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Мой профиль
      description: Профиль того, кто вызывает, — без знания своего id.
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Профиль пользователя
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/chats:
    # region idempotency
    post:
      tags: [chats]
      operationId: createChat
      summary: Создать чат
      description: |
        Для пары, у которой личный чат уже есть, возвращает его со статусом 200.
        С заголовком Idempotency-Key повтор того же запроса получает сохранённый ответ
        первой попытки (с Idempotent-Replayed: true), и чат не создаётся второй раз.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChatRequest' }
      responses:
        '201':
          description: Чат создан (или повтор ответа о создании)
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '200':
          description: Личный чат для этой пары уже был
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Запрос с этим Idempotency-Key ещё выполняется (idempotency_in_progress) — повторите позже
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    # endregion idempotency
    get:
      tags: [chats]
      operationId: listChats
      summary: Мои чаты
      description: |
        Чаты, где вызывающий — участник, от самых активных: по убыванию времени
        последнего сообщения (у чата без сообщений — времени создания).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница списка чатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/chats/{id}:
    get:
      tags: [chats]
      operationId: getChat
      summary: Чат
      description: Только для участника; постороннему — 403.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Чат
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # region messages-paths
  /v1/chats/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags: [chats]
      operationId: sendMessage
      summary: Отправить сообщение
      description: |
        Повтор с тем же client_message_id (тот же автор, тот же чат, тот же текст) не создаёт
        второе сообщение: сервер отвечает 200 и сохранённым тогда сообщением.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Сообщение сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '200':
          description: Повтор уже сохранённого сообщения — то же сообщение, ничего нового не создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Чат изменился одновременно с вами (conflict) или client_message_id уже использован
            для сообщения с другим текстом (client_message_id_reused)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [chats]
      operationId: listMessages
      summary: История сообщений
      description: От новых к старым. Первая страница — без cursor, следующая — с next_cursor предыдущей.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # endregion messages-paths
components:
  # region security
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authorization: Bearer <access_token из POST /v1/tokens> (RFC 6750). Подпись EdDSA,
        срок 15 минут; ADR-0003.
  # endregion security
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Размер страницы, от 1 до 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    # region pagination
    Cursor:
      name: cursor
      in: query
      description: |
        Непрозрачная строка из next_cursor предыдущей страницы; не разбирайте её и не
        собирайте сами — формат может измениться. Без cursor — первая страница.
      schema: { type: string, maxLength: 512 }
    # endregion pagination
    # region idempotency-components
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ, который клиент генерирует для одной логической операции (обычно UUID) и
        повторяет во всех её попытках. Сервер помнит ключ 24 часа; область ключа — пользователь.
      schema: { type: string, minLength: 1, maxLength: 255 }
  headers:
    IdempotentReplayed:
      description: true — это сохранённый ответ на первую попытку с тем же Idempotency-Key.
      schema: { type: string, enum: ['true'] }
    # endregion idempotency-components
    Location:
      description: Адрес созданного (или найденного) ресурса.
      schema: { type: string }
  responses:
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: |
        Не удалось определить пользователя (unauthenticated) или неверные имя и пароль
        при входе (invalid_credentials).
      headers:
        WWW-Authenticate:
          description: |
            Как аутентифицироваться (RFC 9110 §11.6.1, RFC 6750 §3): Bearer realm="messenger";
            с error="invalid_token", если токен предъявлен, но не прошёл проверку.
          required: true
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Нет доступа
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Конфликт с текущим состоянием
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Idempotency-Key уже использован для другого запроса (idempotency_key_reused)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Тело больше 1 МиБ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Нужен Content-Type application/json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Сбой сервера
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Сервер не успел ответить (timeout) или перегружен (overloaded)
      headers:
        Retry-After:
          description: |
            Через сколько секунд повторить запрос (RFC 9110 §10.2.3). Есть у overloaded:
            очередь хеширования паролей полна, и сервер отказал сразу, не начав работу.
          required: false
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    # region schemas-request
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-z0-9_]+$' }
        display_name: { type: string, minLength: 1, maxLength: 64 }
        password:
          type: string
          minLength: 15
          maxLength: 128
          format: password
          writeOnly: true
          # Генератор делает writeOnly-поле указателем (в ответе его нет); в запросе оно обязательно.
          x-go-type-skip-optional-pointer: true
          description: Хранится только хеш Argon2id; в ответах и журналах не появляется.
    CreateChatRequest:
      type: object
      additionalProperties: false
      required: [kind, member_ids]
      properties:
        kind: { type: string, enum: [direct, group] }
        title: { type: string, maxLength: 128, description: Только для группы. }
        member_ids:
          type: array
          description: Участники без создателя; для личного чата — ровно один.
          items: { type: string, format: uuid, x-go-type: string }
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [client_message_id, text]
      properties:
        client_message_id:
          type: string
          format: uuid
          x-go-type: string
          description: Генерирует клиент; одинаковый во всех повторах этого сообщения.
        text: { type: string, minLength: 1, maxLength: 4096 }
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password:
          type: string
          format: password
          writeOnly: true
          x-go-type-skip-optional-pointer: true
          # Без minLength: при входе политику не применяем — иначе после её ужесточения
          # старые пароли перестали бы подходить, а отказ рассказал бы правила.
          description: Сравнивается с хешем; в ответах и журналах не появляется.
    # endregion schemas-request
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'JWT; предъявлять в заголовке Authorization: Bearer.' }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 0, description: Секунды до истечения токена. }
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, created_at]
      properties:
        id: { type: string, format: uuid, x-go-type: string }
        username: { type: string }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
    Chat:
      type: object
      additionalProperties: false
      required: [id, kind, member_ids, created_at, last_activity_at]
      properties:
        id: { type: string, format: uuid, x-go-type: string }
        kind: { type: string, enum: [direct, group] }
        title: { type: string, description: Только у группы. }
        member_ids:
          type: array
          items: { type: string, format: uuid, x-go-type: string }
        created_at: { type: string, format: date-time }
        last_activity_at:
          type: string
          format: date-time
          description: Время последнего сообщения; у чата без сообщений — время создания.
    Message:
      type: object
      additionalProperties: false
      required: [id, client_message_id, chat_id, author_id, text, seq, sent_at]
      properties:
        id: { type: string, format: uuid, x-go-type: string }
        client_message_id: { type: string, format: uuid, x-go-type: string }
        chat_id: { type: string, format: uuid, x-go-type: string }
        author_id: { type: string, format: uuid, x-go-type: string }
        text: { type: string }
        seq: { type: integer, format: int64, minimum: 1 }
        sent_at: { type: string, format: date-time }
    # region pagination-schemas
    MessagePage:
      type: object
      additionalProperties: false
      description: Страница истории от новых к старым.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей (более старой) страницы; null — дальше ничего нет.
    ChatPage:
      type: object
      additionalProperties: false
      description: Страница списка чатов, самые активные первыми.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Chat' }
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей страницы; null — дальше ничего нет.
    # endregion pagination-schemas
    # region problem-schema
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 с расширениями code, request_id, invalid_params.
      required: [type, title, status, instance, code]
      additionalProperties: false
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ProblemCode' }
        request_id: { type: string }
        invalid_params:
          type: array
          items: { $ref: '#/components/schemas/InvalidParam' }
    InvalidParam:
      type: object
      additionalProperties: false
      required: [name, reason]
      properties:
        name: { type: string }
        reason: { type: string }
    ProblemCode:
      type: string
      enum: [bad_json, body_too_large, client_message_id_reused, conflict, idempotency_in_progress,
             idempotency_key_reused, internal, invalid_credentials, invalid_input, method_not_allowed,
             not_found, not_member, overloaded, timeout, unauthenticated, unsupported_media_type,
             username_taken]
    # endregion problem-schema
