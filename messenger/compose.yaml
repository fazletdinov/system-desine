name: messenger

services:
  messenger:
    build:
      context: .
      args:
        VERSION: compose
    image: messenger:local
    # Сервер стартует только после того, как migrate применил миграции и вышел с кодом 0:
    # упавшие миграции останавливают выкладку, а не дают серверу работать со старой схемой.
    # db — отдельно, хотя migrate уже ждал его: при docker compose stop/restart compose
    # останавливает зависимых первыми, и сервер закрывает пул раньше, чем уходит база.
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # region service
    # Порт — только на loopback хоста: снаружи сервис доступен через шлюз (модуль 6),
    # а не напрямую.
    ports:
      - "127.0.0.1:8080:8080"
      # Служебный порт (pprof, /debug/flight) — только loopback: pprof раскрывает стеки
      # и командную строку, а CPU-профиль на 30 с — уже нагрузка (ADR-0013).
      - "127.0.0.1:6060:6060"
    environment:
      MESSENGER_JWT_KEY_FILE: /run/secrets/jwt_key
      # Строка подключения — файлом-секретом, как ключ JWT: в ней пароль (урок 2.9).
      MESSENGER_DATABASE_URL_FILE: /run/secrets/db_url
      # Размер пула (урок 2.9, закон Литтла); умолчание бинаря — 10.
      MESSENGER_DB_MAX_CONNS: ${MESSENGER_DB_MAX_CONNS:-10}
      # Мягкий лимит GC ~90 % от mem_limit: рантайм Go не читает memory.max сам,
      # и без этой строки куча растёт до OOM-kill (урок 1.17).
      GOMEMLIMIT: 230MiB
      # Период фоновой очистки ключей идемпотентности (урок 1.5.6). Значения ниже —
      # умолчания: ${VAR:-…} берёт переменную из окружения, где запущен compose, и урок
      # 1.5.6 так переопределяет их для опытов с перегрузкой, не правя файл.
      MESSENGER_IDEMPOTENCY_SWEEP_EVERY: ${MESSENGER_IDEMPOTENCY_SWEEP_EVERY:-1m}
      # Хеш Argon2id берёт 19 МиБ: N одновременных — N × 19 МиБ сверх кучи (ждущие в
      # очереди память хеша не держат). cpus: 1 — одно ядро квоты, и второй параллельный
      # хеш его только поделит, поэтому N = 1, хотя GOMAXPROCS здесь 2 (урок 1.17).
      # Очередь — 4 × N: сверх неё вход и регистрация сразу получают 503 overloaded.
      MESSENGER_HASH_CONCURRENCY: ${MESSENGER_HASH_CONCURRENCY:-1}
      MESSENGER_HASH_QUEUE: ${MESSENGER_HASH_QUEUE:-4}
      # Служебный порт и flight recorder (урок 1.5.10). Бинарь по умолчанию служебный
      # порт не открывает; compose — учебный стенд, здесь он включён, чтобы снимать
      # профили. Снимки по запросам дольше порога — в /tmp: файловая система контейнера
      # только для чтения, а /tmp — tmpfs. docker compose cp tmpfs не видит, поэтому на
      # стенде файл только отмечается в журнале, а сам снимок берут с GET /debug/flight;
      # в продакшене каталог — том, который забирает агент сбора.
      # Форма ${VAR-…} без двоеточия: умолчание — только если переменная не задана,
      # поэтому явное пустое значение выключает (MESSENGER_DEBUG_ADDR= docker compose up
      # — без служебного порта; тогда обнулите и MESSENGER_FLIGHT_DIR, он требует порта).
      MESSENGER_DEBUG_ADDR: ${MESSENGER_DEBUG_ADDR-:6060}
      MESSENGER_FLIGHT_DIR: ${MESSENGER_FLIGHT_DIR-/tmp}
      MESSENGER_FLIGHT_THRESHOLD: ${MESSENGER_FLIGHT_THRESHOLD:-1s}
    secrets:
      - jwt_key
      - db_url
    # Безопасность запуска: файловая система только для чтения, ни одной capability,
    # запрет повышать привилегии через setuid. Мессенджеру ничего из этого не нужно.
    read_only: true
    # tmpfs живёт в памяти и считается в mem_limit контейнера, а GOMEMLIMIT его не
    # видит. Потолок 32 МиБ — два снимка flight recorder по MaxBytes (16 МиБ); сверх
    # него запись получает ENOSPC, и Dumper пишет в журнал «снимок не записан», а не
    # отнимает память у кучи до OOM-kill.
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    mem_limit: 256m
    cpus: 1
    # Столько же, сколько Kubernetes ждёт по умолчанию: дренаж + остановка укладываются.
    stop_grace_period: 30s
    # endregion service
    # healthcheck не задаём: он есть в образе (HEALTHCHECK в Dockerfile).

  # region migrate
  # Миграции — одноразовый сервис из того же образа: применяет встроенные в бинарь
  # миграции и выходит. Отдельный шаг, а не часть старта сервера: несколько экземпляров
  # не применяют их наперегонки, и серверу не нужны права на DDL (урок 2.8).
  migrate:
    image: messenger:local
    command: ["migrate", "up"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MESSENGER_DATABASE_URL_FILE: /run/secrets/db_url
    secrets:
      - db_url
    # Повтор после сбоя — решение человека: миграция, упавшая на середине, откатана
    # целиком, и слепой перезапуск упал бы так же.
    restart: "no"
    # HEALTHCHECK образа пробует HTTP-порт сервера, а migrate его не открывает: без
    # отключения контейнер числился бы unhealthy, пока применяет миграции.
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    mem_limit: 64m
  # endregion migrate

  # region db
  db:
    # Тег для человека, digest — для воспроизводимости: тег 18.6-trixie могут
    # перепубликовать с новой базой Debian. Тот же образ — в labs/2a и в тестах
    # (platform/pgtest.Image, совпадение проверяет тест).
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: messenger
      POSTGRES_DB: messenger
      # Пароль — файлом-секретом, как ключ JWT: переменная окружения видна в docker inspect.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Для psql внутри контейнера: docker compose exec db psql — без -U и -d.
      PGUSER: messenger
      PGDATABASE: messenger
    secrets:
      - db_password
    # Порт наружу не публикуется: базу видит только сеть compose. Посмотреть данные —
    # docker compose exec db psql.
    # Том, а не слой контейнера: данные переживают docker compose down и пересоздание
    # контейнера (стираются только down -v). С PostgreSQL 18 образ хранит данные в
    # /var/lib/postgresql/18/docker, и том монтируется на каталог выше.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # По TCP, а не через unix-сокет: при первом запуске на пустом томе образ создаёт
      # базу временным сервером с listen_addresses='' — сокет уже отвечает, а TCP нет.
      # Проверка через сокет объявила бы db healthy в этом окне, migrate получил бы
      # connection refused на db:5432 и вышел с кодом 1. TCP слушает только рабочий
      # сервер после init-скриптов.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U messenger -d messenger"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # Потолок памяти: shared_buffers по умолчанию 128 МиБ, плюс процесс на каждое
    # соединение (пул мессенджера — 10, урок 2.9) с work_mem 4 МиБ на сортировку и кэш
    # каталога. 512 МиБ — с запасом для учебного стенда; без потолка база под нагрузкой
    # отъедала бы память у мессенджера на той же машине.
    mem_limit: 512m
    # /dev/shm контейнера по умолчанию 64 МиБ, а параллельные запросы берут разделяемую
    # память оттуда; при нехватке запрос падает с «could not resize shared memory segment».
    shm_size: 128m
    stop_grace_period: 30s
  # endregion db

volumes:
  db-data:

# region secrets
# Ключ — файлом, а не переменной окружения: окружение видно в docker inspect и
# /proc/<pid>/environ. Ключ создаёт go run ./cmd/keygen -out jwt.pem.
secrets:
  jwt_key:
    file: ./jwt.pem
# endregion secrets
  # Пароль базы и строка подключения с ним — тоже файлами (как их создать — README).
  db_password:
    file: ./secrets/db_password
  db_url:
    file: ./secrets/db_url
