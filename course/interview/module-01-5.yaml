module: "01-5"
title: "Модуль 1.5. Конкурентность и рантайм Go"
questions:
  # 1.5.1
  - id: goroutine-vs-thread
    lesson: 01-5-go-concurrency/01-goroutines-scheduler
    topic: Планировщик
    level: M+
    question: "Почему Go может позволить себе горутину на каждое соединение, а в Java до 21-й версии поток на соединение считался ошибкой проектирования? Где дешевизна горутины кончается?"
    answer: |
      **Тезис:** горутина — поток в пространстве пользователя: она стартует со стеком 2 КиБ, который растёт копированием, а переключает её рантайм без входа в ядро. Но дешёвая обёртка не делает дешёвым то, что горутина держит.

      **Почему:** в лабе горутина обошлась в 2052 байта и около 1 мкс на «создать и дождаться запуска», поток — в 7 мкс. Круг между двумя горутинами через каналы — около 320 нс, между двумя потоками — 8,5 мкс: одно переключение 160 нс против 4 мкс. «8 МиБ на поток» — это резерв виртуальной памяти у `pthread`. Go без cgo создаёт потоки сам, с системным стеком 16 КиБ, и реально тронутых страниц у ждущего потока — 15–20 КиБ. Главная цена потока — время и работа ядра, плюс пределы: 10 000 потоков в рантайме Go, `pids.max` у контейнера. А ожидание сети поток вообще не держит: горутина паркуется в netpoller.

      **Компромисс:** 100 000 пустых горутин — около 196 МиБ одних стеков, а у живого обработчика стек дорастает до 8–16 КиБ. Это сравнимо с `GOMEMLIMIT` мессенджера (230 МиБ). Поэтому число одновременных горутин всё равно ограничивают — семафором или `errgroup.SetLimit` — и у каждой должен быть владелец.

      **Пример из мессенджера:** `net/http` запускает `go c.serve(…)` на каждое соединение. Замер урока 1.5.7: 10⁵ простаивающих соединений — 5,6 КиБ процесса на соединение, а потоков ОС единицы.
    checklist:
      - "стек горутины стартует с 2 КиБ и растёт копированием"
      - "переключение горутин — в пространстве пользователя: около 160 нс против 4 мкс у потоков"
      - "цена потока — время и работа ядра, а не 8 МиБ RSS (без cgo стек потока 16 КиБ)"
      - "ожидание сети не держит поток: горутина паркуется в netpoller"
      - "число одновременных горутин всё равно ограничивают, у каждой есть владелец"
    red_flags:
      - "«горутины бесплатны, можно запускать на каждый элемент»"
      - "«поток занимает 8 МиБ памяти» без оговорки про виртуальную память"
    follow_ups:
      - q: "Сколько потоков ОС у сервиса со 100 000 открытых соединений?"
        a: "Единицы: `GOMAXPROCS` работающих, запасные и `sysmon`. Горутины, ждущие сеть, запаркованы в netpoller. Тысяча потоков появится, только если тысяча горутин одновременно сидит в блокирующих системных вызовах или в cgo."

  - id: gmp-and-syscalls
    lesson: 01-5-go-concurrency/01-goroutines-scheduler
    topic: Планировщик
    level: S
    question: "Нарисуйте модель GMP. Что происходит с P, когда горутина ушла в блокирующий системный вызов? Почему восемь горутин в `syscall.Nanosleep` добавили потоки ОС, а восемь в `time.Sleep` — ни одного?"
    answer: |
      **Тезис:** G — горутина, M — поток ОС, P — право исполнять Go-код; P ровно `GOMAXPROCS`, и у каждого своя очередь на 256 мест, слот `runnext` и `mcache`. Горутина в системном вызове держит свой M, а P у неё отбирают и отдают другому потоку.

      **Почему:** свободный P ищет работу в `findRunnable`. Раз в 61 такт он берёт одну горутину из глобальной очереди, иначе две горутины, порождающие друг друга, заморили бы её голодом. Дальше — `runnext` и своя очередь, глобальная очередь пачкой, `netpoll(0)`, кража половины чужой очереди (до четырёх проходов), и только потом сон. При системном вызове `entersyscall` оставляет P при потоке: большинство вызовов идёт микросекунды. Если вызов затянулся дольше такта `sysmon`, а у P есть работа (или нет ни свободных P, ни ищущих работу потоков, или прошло больше 10 мс), `retake` отбирает P, и `handoffp` запускает на нём другой поток — при нужде новый. `time.Sleep` — таймер рантайма: горутина паркуется и отдаёт и P, и M. Отсюда +6 потоков против +0: было 5, запасные пошли в дело, недостающие рантайм создал.

      **Компромисс:** сокеты потоков не держат, а файлы и cgo держат. Тысяча горутин, читающих медленный диск, — тысяча потоков, а на 10 001-м программа падает с `thread exhaustion`. Такие вызовы ограничивают семафором, как любой дорогой ресурс.

      **Пример из лабы:** `sched/syscall` — 5 потоков до и 11 во время восьми `Nanosleep`; `time.Sleep` — 5 и 5. В мессенджере все ожидания — сеть, каналы и таймеры, поэтому ста тысячам соединений хватает единиц потоков.
    checklist:
      - "P — право исполнять Go-код, их ровно `GOMAXPROCS`"
      - "локальная очередь на 256 мест, `runnext`, глобальная очередь под замком"
      - "порядок поиска работы: глобальная раз в 61 такт, своя, глобальная, netpoller, кража половины"
      - "долгий системный вызов: `sysmon` отбирает P (`retake` → `handoffp`), M остаётся в ядре"
      - "`time.Sleep` и сеть поток не держат, файлы и cgo держат"
    red_flags:
      - "«горутина в системном вызове блокирует всё приложение»"
      - "«`GOMAXPROCS` — максимальное число потоков»"
    follow_ups:
      - q: "Сервис в контейнере с `cpus: 4`, коллега ставит `GOMAXPROCS=32`. Что будет?"
        a: "32 P выберут квоту cgroup за первую восьмую периода и простоят остаток в троттлинге: задержка скачками до длины периода (100 мс), пропускная способность та же. Явное значение ещё и выключит пересчёт: с Go 1.25 рантайм сам берёт лимит CPU из cgroup и пересматривает его раз в секунду."

  - id: async-preemption
    lesson: 01-5-go-concurrency/01-goroutines-scheduler
    topic: Планировщик
    level: S
    question: "Горутина крутит цикл без вызовов функций. Как рантайм снимет её с процессора? Почему до Go 1.14 такой цикл мог остановить всю программу, а не одну горутину?"
    answer: |
      **Тезис:** `sysmon` замечает, что P занят одной горутиной дольше кванта 10 мс (`forcePreemptNS`), и включает два механизма: кооперативный через пролог функций и асинхронный через сигнал `SIGURG`, который появился в Go 1.14.

      **Почему:** кооперативный: `preemptone` пишет в `stackguard0` значение `stackPreempt`, и проверка стека в прологе следующей вызванной функции уводит горутину в планировщик. Цикл без вызовов пролога не проходит и просьбы не видит. Асинхронный: потоку горутины приходит `SIGURG`, обработчик проверяет, что горутина в безопасной точке, и подменяет контекст так, будто она сама вызвала `asyncPreempt`, а та сохраняет все регистры. `SIGURG` выбран, потому что им почти никто не пользуется, его не трогают отладчики и libc, лишний приход безвреден, и он есть на всех Unix. До 1.14 такой цикл держал P навсегда, а остановка мира для сборщика ждала и его — стояли все горутины.

      **Компромисс:** квант 10 мс — точка на оси «справедливость против пропускной способности»: короче — больше переключений и холодных кэшей, длиннее — растёт задержка ждущих. Асинхронное вытеснение не мгновенное: в небезопасной точке рантайм просто попробует позже.

      **Пример из лабы:** `sched/preempt` на одном P — `main` просыпается через 10–15 мс вместо запрошенных 10, а с `GODEBUG=asyncpreemptoff=1` — через 1,6–1,8 с, когда цикл закончился сам.
    checklist:
      - "`sysmon` и квант 10 мс (`forcePreemptNS`)"
      - "кооперативное вытеснение через `stackguard0` и пролог функции"
      - "асинхронное вытеснение сигналом `SIGURG` с Go 1.14, безопасные точки"
      - "до 1.14 цикл без вызовов мог заморозить всю программу через остановку мира сборщика"
      - "почему выбран именно `SIGURG`"
    red_flags:
      - "«горутина уступает процессор только на вызовах функций и каналах»"
      - "«`runtime.Gosched()` нужен, чтобы другие горутины успели поработать»"
    follow_ups:
      - q: "Почему вытесненная горутина встаёт в глобальную очередь, а не в свою локальную?"
        a: "Иначе она тут же снова получила бы тот же P. Исключение — вытеснение ради остановки мира: тогда её кладут в `runnext` её P, чтобы она продолжила сразу после паузы."

  # 1.5.2
  - id: channel-close-ownership
    lesson: 01-5-go-concurrency/02-channels
    topic: Каналы
    level: M+
    question: "Почему отправка в закрытый канал паникует, а чтение из него спокойно возвращает ноль? Кто должен закрывать канал, если писателей несколько?"
    answer: |
      **Тезис:** `close` — обещание отправителя «больше значений не будет». Для получателя это нормальный конец потока, а отправка после него — нарушение протокола. Поэтому закрывает тот, кто пишет, и только один.

      **Почему:** получение из закрытого канала дочитывает буфер, потом отдаёт ноль и `ok == false`, а `for range` заканчивается — как `io.EOF` у файла. Отправленному после закрытия значению некуда деться, а молча выбросить его — потерять данные. Поэтому паника, и паникует даже отправитель, который ждал в `sendq` в момент закрытия. Повторный `close` и `close(nil)` тоже паникуют: значит, две части программы считают себя владельцами. Получатель не может знать, что писатели закончили. Если писателей несколько, закрывает отдельная горутина после `wg.Wait()`, а потребитель останавливает производителей сигналом в обратную сторону — отменой `ctx`. Если отдавать потребителю `<-chan T`, закрыть канал не даст компилятор.

      **Компромисс:** закрывать необязательно: это сигнал получателям, а не освобождение ресурса, канал без ссылок соберёт сборщик мусора. И сигнал закрытием одноразовый: если остановку могут вызвать из нескольких мест, нужен `sync.Once` или `context`, у которого `cancel` можно звать сколько угодно раз.

      **Пример из мессенджера:** фоновые компоненты останавливаются по `ctx.Done()` — это тот же закрываемый канал внутри `cancelCtx`. А горутина второго сигнала выходит, когда её владелец `run` в `defer` закрывает `sigCh`.
    checklist:
      - "`close` — обещание отправителя; чтение из закрытого: буфер, потом ноль и `ok == false`"
      - "отправка в закрытый, повторный `close` и `close(nil)` — паника"
      - "закрывает единственный писатель; при нескольких — отдельная горутина после `wg.Wait()`"
      - "потребитель останавливает производителя отменой `ctx`, а не закрытием чужого канала"
      - "направление `<-chan T` в типе — проверка владения компилятором"
    red_flags:
      - "«получатель закрывает канал, чтобы производитель остановился»"
      - "проверка «закрыт ли канал» перед `close`"
    follow_ups:
      - q: "Чем `ctx.Done()` лучше голого `close(done)`?"
        a: "Это тот же закрываемый канал, но `cancel` можно звать многократно, есть причина (`Err`, `context.Cause`), срок и дерево отмены. Голый `chan struct{}` уместен для узкого сигнала внутри одного пакета."

  - id: channel-internals
    lesson: 01-5-go-concurrency/02-channels
    topic: Каналы
    level: S
    question: "Горутина G1 ждёт на `<-ch` небуферизованного канала, G2 выполняет `ch <- x`. Сколько раз копируется `x`, куда и на каком P запустится G1? И зачем `select` сортирует свои каналы по адресу?"
    answer: |
      **Тезис:** канал — структура `hchan` под мьютексом: кольцевой буфер и очереди ждущих `sendq` и `recvq`. G2 находит G1 в `recvq` и копирует значение прямо в её стек — одна копия. Затем G1 встаёт в `runnext` текущего P, того, где работает G2.

      **Почему:** `chansend` → `send` → `sendDirect` делает `memmove` по адресу из `sudog.elem`, то есть в переменную G1 на её стеке. Это единственное место, где одна горутина пишет в стек другой, поэтому барьер записи сборщика ставится вручную. Через буфер вышло бы две копии и повторный захват замка. Потом `goready` → `ready` кладёт G1 в `runnext` и будит свободный P (`wakep`): G1 стартует на тёплом кэше и наследует остаток кванта. `select` держит замки всех своих каналов сразу. Без единого порядка захвата `select` по `a, b` и `select` по `b, a` взяли бы по замку и ждали бы друг друга вечно, поэтому `lockorder` сортирует их по адресу `hchan`. Порядок опроса отдельный и случайный (`pollorder`): отсюда равномерный выбор среди готовых веток и отсутствие приоритетов. Ветки с nil-каналом в `pollorder` не попадают — так nil выключает ветку.

      **Компромисс:** прямая передача экономит копию, но каждая операция с ожиданием — парковка и пробуждение через планировщик, а `select` на N веток — N замков и N `sudog`. Незанятый мьютекс — один CAS, поэтому канал хорош для передачи владения и сигналов, а не как счётчик под замком.

      **Пример из мессенджера:** ограничитель хешей занимает место в очереди `select`-ом с `default`. Проверка и действие идут под одним замком канала, а `len(ch) < cap(ch)` устарел бы раньше, чем мы успели отправить.
    checklist:
      - "`hchan`: буфер с `recvx`/`sendx`, очереди `sendq`/`recvq`, мьютекс"
      - "прямая передача в стек ждущего получателя — одна копия"
      - "разбуженная горутина — в `runnext` текущего P, через планировщик"
      - "`lockorder` по адресу против взаимной блокировки, `pollorder` случайный"
      - "nil-канал выключает ветку `select`"
    red_flags:
      - "«канал — lock-free очередь»"
      - "«`select` выбирает первую готовую ветку по тексту»"
    follow_ups:
      - q: "Цикл `select` по `jobs` и `ctx.Done()` после отмены ещё обрабатывает задания. Почему и как сделать, чтобы отмена побеждала?"
        a: "Если готовы обе ветки, выбор случайный, приоритетов нет. Проверять `ctx.Err()` в начале каждой итерации до `select`, а саму обработку задания тоже делать с `ctx`."

  - id: time-after-in-loop
    lesson: 01-5-go-concurrency/02-channels
    topic: Каналы
    level: M+
    question: "В горячем цикле стоит `select { case v := <-in: …; case <-time.After(time.Second): … }`. Это утечка памяти? Ответьте для Go 1.21 и для Go 1.27."
    answer: |
      **Тезис:** до Go 1.23 — да: каждый несработавший таймер живёт до срабатывания. С 1.23 (в 1.27 — всегда) утечки нет, но остаётся цена: три аллокации и около 248 байт на итерацию.

      **Почему:** до 1.23 таймер сразу вставал в кучу таймеров P, а та держала и таймер, и его канал. С 1.23 канал таймера синхронный, и таймер попадает в кучу P, только пока на его канале кто-то заблокирован (`needsAdd`: `blocked > 0`). Если никто не ждёт, таймер — обычный объект без внешних ссылок, и сборщик мусора уберёт его вместе с каналом. В Go 1.27 настройку `asynctimerchan` удалили совсем, и поведение больше не зависит от строки `go` в `go.mod`. Лаба `chan/timers`: миллион итераций с `time.After` — 236,5 МиБ выделено и 70 циклов сборки, куча в конце 0,79 МиБ; один `Timer` с `Reset` — 0 байт и 0 циклов.

      **Компромисс:** для редкого ожидания — один запрос, один таймаут — `time.After` удобен, и документация 1.27 не видит причин предпочитать `NewTimer`. В цикле на миллионы итераций переиспользуют один `Timer`. И смысл тоже разный: `time.After` в цикле — таймаут на итерацию, а общий срок операции задают один раз до цикла через `context.WithTimeout`.

      **Пример из мессенджера:** `periodic.Task` держит один `Timer` и взводит его `Reset` после каждой итерации. `Reset` без «слива» канала корректен как раз потому, что с 1.23 канал таймера синхронный.
    checklist:
      - "до Go 1.23 несработавший таймер живёт до срабатывания — настоящая утечка"
      - "с 1.23 таймер без ждущих не лежит в куче таймеров P и собирается сборщиком"
      - "в 1.27 `asynctimerchan` удалён, поведение не зависит от `go.mod`"
      - "цена осталась: аллокации и работа сборщика, около 248 байт на итерацию"
      - "таймаут на итерацию против общего срока операции"
    red_flags:
      - "«`time.After` в цикле — всегда утечка» без версии Go"
      - "«утечки нет, значит, бесплатно»"
    follow_ups:
      - q: "Go 1.21, 50 000 сообщений в секунду, `time.After(30*time.Second)` в цикле. Сколько памяти держат таймеры?"
        a: "Одновременно живут 50 000 × 30 = 1,5 млн таймеров, около 248 байт каждый — порядка 350 МиБ живой кучи. На 1.27 живая куча не растёт, но остаётся около 12 МиБ мусора в секунду."

  # 1.5.3
  - id: plain-bool-flag
    lesson: 01-5-go-concurrency/03-memory-model
    topic: Модель памяти
    level: M+
    question: "Одна горутина крутит `for !done {}`, другая ставит `done = true`. На Go 1.27 программа исправно завершается. Почему это всё равно ошибка?"
    answer: |
      **Тезис:** это гонка данных: запись и чтения ничем не упорядочены, а модель памяти Go прямо говорит, что такой цикл не обязан завершиться. «Работает» — свойство сегодняшнего компилятора, а не обещание языка.

      **Почему:** гонка данных — два обращения к одной ячейке, хотя бы одно запись, хотя бы одно не атомарное, и между ними нет отношения «происходит раньше». Времени в определении нет: `time.Sleep` порядка не создаёт. `gc` 1.27.2 действительно перечитывает флаг на каждой итерации (`CMPB main.plainDone(SB), $0`). Но модель допускает вынос чтения из цикла, а Бём показал такое преобразование у компиляторов C: чтение один раз до цикла — и цикл вечный. Кроме того, данные, записанные до флага, не обязаны быть видны после него: буфер записи процессора, ARM. Детектор гонок ловит это в трёх прогонах из трёх и выходит с кодом 66.

      **Компромисс:** `atomic.Bool` почти ничего не стоит: на amd64 `Load` — обычный `MOV`, но компилятор его не выбросит и не переставит, а `Store` — `XCHG`, сливающий буфер записи. Для сигнала остановки ещё лучше `ctx.Done()` или закрытие канала: и порядок, и пробуждение без холостого цикла.

      **Пример из мессенджера:** флаг дренажа проб — `draining atomic.Bool` в `platform/health`. Его ставит обработчик SIGTERM, читает каждый запрос к `/readyz`, и замок ему не нужен.
    checklist:
      - "определение гонки данных: нет «происходит раньше», есть запись, не атомарно"
      - "«работает сегодня» — свойство компилятора, а не гарантия модели памяти"
      - "`time.Sleep` не создаёт порядок"
      - "лечение: `atomic.Bool`, а для остановки — `ctx.Done()` или закрытие канала"
      - "`-race` ловит гонку, даже если поломки не было"
    red_flags:
      - "«на x86 это безопасно»"
      - "«это просто флаг, гонка безобидная»"
    follow_ups:
      - q: "G1 делает `x = 1; r1 = y`, G2 — `y = 1; r2 = x`. Возможно ли на x86 `r1 == 0` и `r2 == 0`?"
        a: "На обычных переменных — да, из-за буфера записи: в замере урока так вышло в 2–6 % раундов. На атомиках Go — нет: они последовательно согласованы, и атомарная запись на x86 — `XCHG`, сливающий буфер."

  - id: multiword-race
    lesson: 01-5-go-concurrency/03-memory-model
    topic: Модель памяти
    level: S
    question: "Две горутины по очереди присваивают одной переменной-интерфейсу разные значения, третья вызывает у неё метод. Программа падает с `nil pointer dereference` и `pc=0x1`, хотя `nil` в коде нет. Объясните механизм. Что Go обещает программе с гонкой?"
    answer: |
      **Тезис:** интерфейс — два машинных слова, `itab` и данные, а присваивание — две отдельные записи. Читатель склеил `itab` одного значения с данными другого, и вызов прыгнул по адресу 1. Для значений больше слова Go не обещает «старое или новое».

      **Почему:** главная гарантия модели — DRF-SC: программа без гонок ведёт себя последовательно согласованно. Для программы с гонкой Go, в отличие от C и C++, не оставляет неопределённого поведения. Реализация может сообщить о гонке и остановиться (`-race`), чтение слова видит одно из реально записанных значений, а компилятору запрещено вводить записи и перечитывать значения. Но строки, срезы и интерфейсы многословны и могут прочитаться «рваными», и модель прямо называет последствие — произвольную порчу памяти. В `race/iface` читатель взял `itab` от `callback` и указатель на ячейку с числом 1 от `small(1)`. `callback.Speak` вызывает функцию-значение, то есть читает адрес кода по указателю, находит там 1 и прыгает туда. Ядро присылает `SIGSEGV`, а `sigpanic` превращает адрес ниже `0x1000` в «nil pointer».

      **Компромисс:** Java делает гонку безопасной, потому что у неё нет многословных значений с указателями. Go платил бы за то же двойными атомарными записями или лишним указателем на каждый интерфейс и срез, то есть замедлил бы все корректные программы. Поэтому в Go нет «немножко гонки»: упасть — это ещё повезло, срез с чужой длиной может молча писать в чужую память.

      **Пример из мессенджера:** если понадобится менять конфигурацию или обработчик на лету, новое значение публикуют неизменяемым снимком за `atomic.Pointer[T]` или читают под `RWMutex`, а не присваивают полю. Хранилища мессенджера держат все общие карты под замками.
    checklist:
      - "интерфейс — два слова, присваивание не атомарно"
      - "DRF-SC и что Go обещает программе с гонкой: слово целиком, без значений «из воздуха»"
      - "многословные значения (строка, срез, интерфейс) рвутся — порча памяти"
      - "отличие от C/C++ (неопределённое поведение) и Java (нет многословных указателей)"
      - "лечение: `atomic.Pointer` на неизменяемый снимок или замок"
    red_flags:
      - "«в худшем случае прочитается старое значение»"
      - "«без `unsafe` испортить память в Go невозможно»"
    follow_ups:
      - q: "Почему гонка на `map` падает с `fatal error: concurrent map writes`, и можно ли это перехватить?"
        a: "Рантайм сам замечает часть одновременных записей и вызывает `fatal`, а не `panic`. `recover` такое не перехватывает: процесс завершается."

  - id: race-detector
    lesson: 01-5-go-concurrency/03-memory-model
    topic: Модель памяти
    level: M+
    question: "Тесты с `-race` зелёные годами, а в проде нашлась гонка в том же пакете. Как устроен детектор гонок и почему он её пропустил?"
    answer: |
      **Тезис:** `-race` — это ThreadSanitizer, вкомпилированный в программу. Он инструментирует каждое обращение к памяти, строит «происходит раньше» по векторным часам и сравнивает обращение с несколькими последними из теневой памяти. Найти он может только гонку, которая случилась в этом прогоне и которую он ещё помнит.

      **Почему:** каналы, мьютексы, атомики и запуск горутины передают векторы часов. Обращение считается гонкой, если в векторе текущей горутины значение для другой горутины меньше эпохи её обращения. На каждые 8 байт программы — 4 ячейки теневой памяти по 32 бита, и давнее обращение вытесняется новыми. Если стек старого обращения уже перезаписан в журнале горутины, TSan v3 обычно молчит. Отсюда три причины пропуска: путь с гонкой не выполнялся в тестах; в тестах не было одновременности; история кончилась. В лабе `race/iface` на одном P не дал ни одного отчёта за 7 прогонов, а на 12 P — 5 отчётов в каждом. Ложных срабатываний по устройству почти не бывает.

      **Компромисс:** цена в разы. На контрактных тестах хранилища мессенджера время выросло в 3,9 раза, память — в 7,8; на микробенчмарке атомика — примерно в 12 раз. Поэтому `-race` гоняют в CI на каждый PR и на стенде под нагрузкой, но не в продакшене.

      **Пример из мессенджера:** контрактный тест хранилища чатов запускает 16 горутин, которые одновременно пишут и читают, — без такой нагрузки `-race` проверял бы пустоту. В CI тесты идут с `-race`.
    checklist:
      - "ThreadSanitizer: инструментирование доступов и векторные часы"
      - "видит только выполненные и реально одновременные обращения"
      - "история конечна: теневая память и журнал стеков"
      - "тесты с нагрузкой из нескольких горутин, `-count`, `-cpu=1,4`"
      - "цена: время и память в разы — CI и стенд, а не прод"
    red_flags:
      - "«`-race` зелёный — значит, гонок нет»"
      - "«детектор ловит и логические гонки вида «проверил, потом записал»»"
    follow_ups:
      - q: "Поймает ли детектор пару атомиков `count` и `sum`, из которых читатель считает среднее?"
        a: "Нет: обе ячейки атомарны, гонки данных нет. Это логическая ошибка — пара читается несогласованно. Лечится мьютексом на оба поля или снимком `{Count, Sum}` за одним `atomic.Pointer`."

  # 1.5.4
  - id: mutex-starvation-mode
    lesson: 01-5-go-concurrency/04-sync
    topic: sync и атомики
    level: S
    question: "Что происходит внутри `sync.Mutex.Lock`, если замок свободен, и что — если занят? Зачем мьютексу режим голодания?"
    answer: |
      **Тезис:** свободный замок берётся одним CAS, и этот быстрый путь встраивается в вызывающую функцию. Занятый — до четырёх попыток покрутиться, потом сон на семафоре рантайма. Режим голодания включается, когда ждущая горутина ждёт дольше 1 мс, и тогда замок передаётся из рук в руки.

      **Почему:** мьютекс — два `int32`: `state` (занят, разбужен, голодание, число ждущих) и `sema`. Крутиться (`procyield`, 30 инструкций `PAUSE`) разрешено, только если машина многоядерная, где-то работает другой P, который может отпустить замок, и своя очередь пуста. Разбуженная горутина замок не получает, а соревнуется с горутинами, уже выполняющимися на CPU, и может проигрывать бесконечно — это issue #13086. С Go 1.9: ждала больше `starvationThresholdNs` (1 мс) — ставит бит `mutexStarving`. Тогда `Unlock` отдаёт замок первому в очереди через `Semrelease` с `handoff` и уступает ему квант, а новички не крутятся и встают в хвост. Выход — когда получивший замок последний в очереди или ждал меньше 1 мс.

      **Компромисс:** нормальный режим — пропускная способность: горячая горутина берёт замок без переключения. Режим голодания — ограниченная хвостовая задержка ценой скорости. В лабе `starve` быстрая горутина при удержании 2 мс ждала обычно 3–5 мс, около двух удержаний, — ограниченно, а не бесконечно.

      **Пример из мессенджера:** хранилище ключей идемпотентности — обычный `Mutex`: `Reserve` проверяет и пишет под одним замком. А где замок станет узким местом, покажет профиль mutex со стеком того, кто держал.
    checklist:
      - "быстрый путь — один CAS, встраивается"
      - "спиннинг до 4 попыток при условиях, затем семафор рантайма"
      - "разбуженная горутина соревнуется с новичками на CPU (barging)"
      - "режим голодания: порог 1 мс, передача из рук в руки, новички в хвост"
      - "выход из режима: последний в очереди или ждал меньше 1 мс"
    red_flags:
      - "«`sync.Mutex` — честная очередь FIFO»"
      - "«`Lock` каждый раз уходит в ядро»"
    follow_ups:
      - q: "Почему профиль mutex приписывает время `Unlock`, а не `Lock`?"
        a: "Он записывает стек владельца в конце критической секции вместе со временем, которое из-за него прождали другие: причина — тот, кто держал долго. Стеки ждущих — в профиле block."

  - id: rwmutex-vs-mutex
    lesson: 01-5-go-concurrency/04-sync
    topic: sync и атомики
    level: M+
    question: "Когда `RWMutex` быстрее `Mutex`, а когда медленнее? Почему ответ «читатели же идут параллельно» неполный?"
    answer: |
      **Тезис:** `RWMutex` выигрывает, когда чтений намного больше, чем записей, и секция чтения длинная. На короткой секции он упирается в собственный счётчик читателей и может проиграть обычному `Mutex`.

      **Почему:** `RLock` и `RUnlock` — это `readerCount.Add(±1)`, две атомарные записи в одну общую ячейку. Логически читатели друг друга не ждут, но их ядра гоняют кэш-линию со счётчиком (issue #17973). Замер на чтении одного поля: на одном ядре разницы нет, на четырёх `RWMutex` медленнее в 1,6 раза (28,35 против 17,23 нс), на восьми — быстрее в 1,5 раза. На секции, которая суммирует 4096 чисел, `RWMutex` быстрее в 5,5–7,3 раза на четырёх ядрах и в 10–11 раз на восьми. Плюс две ловушки из устройства: писатель имеет приоритет, поэтому повторный `RLock` той же горутины при ждущем писателе — взаимная блокировка, а повысить `RLock` до `Lock` нельзя.

      **Компромисс:** `RWMutex` сложнее для рассуждения, а на коротких секциях его выигрыш непредсказуем. Для одного поля — атомик или неизменяемый снимок за `atomic.Pointer`, для «проверить и записать» — сразу `Lock`.

      **Пример из мессенджера:** у хранилища чатов `RWMutex` оправдан: `ListMessagesBefore` делает двоичный поиск и копирует страницу, `ListChatsByMember` обходит все чаты. У хранилищ пользователей чтение — один поиск в карте, там хватило бы `Mutex`. Хранилище идемпотентности — `Mutex`, потому что `Reserve` проверяет и пишет.
    checklist:
      - "`RLock`/`RUnlock` — две атомарные записи в общий счётчик читателей"
      - "выигрыш — на длинных секциях чтения, проигрыш возможен на коротких"
      - "рекурсивный `RLock` при ждущем писателе — взаимная блокировка"
      - "`RLock` нельзя повысить до `Lock`; после `RUnlock` и `Lock` условие проверить заново"
      - "для одного поля — атомик или снимок за `atomic.Pointer`"
    red_flags:
      - "«для чтения `RWMutex` всегда быстрее»"
    follow_ups:
      - q: "Почему повторный `RLock` в тестах не виснет, а в проде виснет?"
        a: "Он виснет, только если между двумя `RLock` встал писатель: `Lock` делает счётчик отрицательным, и новый `RLock` засыпает. В тестах писателя в этот момент обычно нет."

  - id: hot-counter-cache-line
    lesson: 01-5-go-concurrency/04-sync
    topic: sync и атомики
    level: M+
    question: "Горячий счётчик запросов на восьми ядрах сделан на `atomic.Int64`, и он стал узким местом. Почему атомик плохо масштабируется и как это лечат? При чём тут кэш-линия?"
    answer: |
      **Тезис:** масштабирование определяет не наличие замка, а то, сколько ядер пишут в одну кэш-линию. Лечат разделением данных — шардированием ячеек с паддингом.

      **Почему:** кэши согласуются линиями по 64 байта на x86. Чтобы записать, ядро забирает линию в монопольное владение, и при общей ячейке линия переезжает между ядрами на каждой операции. Замер: атомарный счётчик — 7,15 нс на одном ядре и 14,76 нс суммарно на восьми, то есть восемь ядер делают вдвое меньше операций в секунду, чем одно. CAS-цикл ещё хуже — 36 нс: на восьми ядрах на операцию приходится 0,5–0,7 неудачного CAS. Шардированный счётчик, где у каждой горутины своя ячейка, — 1,10 нс суммарно, в 14 раз больше операций, чем у общего атомика. Родственная беда — ложное разделение: два независимых счётчика в одной линии стоят 35 нс против 6,1 нс с паддингом в 56 байт.

      **Компромисс:** чтение суммы — обход ячеек и не мгновенный снимок, плюс память на паддинг и сложность. Для метрик это приемлемо. А неблокирующий алгоритм — гарантия прогресса, а не скорости: он упирается в ту же горячую линию, что и мьютекс.

      **Пример:** так устроен сам рантайм — `sync.Pool` держит по `poolLocal` на каждый P, дополненный до 128 байт, а Go внутри берёт размер линии 64 байта на x86 и 128 на arm64. В мессенджере единственный атомик — флаг дренажа, а горячие счётчики появятся с метриками.
    checklist:
      - "когерентность по линиям 64 байта: запись забирает линию себе"
      - "атомик и CAS-цикл упираются в одну горячую линию"
      - "ложное разделение: независимые поля в одной линии"
      - "шардирование с паддингом, сумма при чтении"
      - "lock-free — гарантия прогресса, а не скорости"
    red_flags:
      - "«lock-free всегда быстрее мьютекса»"
      - "«атомики масштабируются линейно»"
    follow_ups:
      - q: "Можно ли держать соединения с базой в `sync.Pool`?"
        a: "Нет: на каждой сборке мусора пул переносит объекты в «жертвенный» кэш, а на следующей выбрасывает их без `Close`; число и исправность он не контролирует. Для соединений — пул драйвера (в модуле 2 это `pgxpool`) или `http.Transport`."

  # 1.5.5
  - id: bounded-concurrency-choice
    lesson: 01-5-go-concurrency/05-patterns
    topic: Паттерны конкурентности
    level: M+
    question: "Нужно обработать 10 000 элементов, не больше 8 одновременно. Семафор на канале, `errgroup.SetLimit`, `semaphore.Weighted` или пул воркеров — что выберете и почему?"
    answer: |
      **Тезис:** для группы подзадач одной операции — `errgroup` с `SetLimit` и `WithContext`. Семафор на канале — для доступа к ресурсу из многих независимых мест, `Weighted` — для бюджета разного веса, пул — когда у воркера дорогое долгоживущее состояние.

      **Почему:** `SetLimit` внутри — тот же семафор на канале (`sem chan token`) плюс `WaitGroup`, первая ошибка через `sync.Once` и отмена `ctx` с этой ошибкой как причиной (`context.Cause`). Гарантию даёт модель памяти: k-е получение из канала ёмкостью C происходит раньше завершения (k+C)-й отправки. Место занимают до `go`, иначе горутины создаются все сразу и просто ждут. `g.Go` при исчерпанном лимите ждёт места и на `ctx` не смотрит, поэтому цикл сам проверяет `ctx.Err()` перед каждым `g.Go`. В лабе после ошибки в задаче 50 выполнилось 48 задач из 200 за 124 мс, а не все 200 за 500 мс. Сам ограничитель стоит 0,3–0,6 мкс на задачу — на хеше в 17 мс это 0,002 %.

      **Компромисс:** самописный пул — это свои каналы задач и ошибок, своё правило закрытия, своя отмена и остановка, то есть источник утечек и взаимных блокировок. `errgroup` — 150 строк, которые читали тысячи людей. Пул оправдан состоянием воркера или задачами короче микросекунд. И помнить: паника в задаче не передаётся в `Wait`, а роняет процесс.

      **Пример из мессенджера:** `lifecycle.Run` держит компоненты в двух группах `errgroup`, но без `WithContext`: отмена там двухступенчатая. Ограничитель хешей — два канала-семафора, потому что ему нужен отказ без ожидания.
    checklist:
      - "`errgroup.SetLimit` — семафор на канале + `WaitGroup` + первая ошибка + отмена"
      - "место занимают до запуска горутины"
      - "`g.Go` не смотрит на `ctx`: проверять `ctx.Err()` или брать `TryGo`"
      - "`Weighted` — вес и строгая очередь FIFO; пул — состояние воркера"
      - "выбор по коду, который придётся поддерживать, а не по наносекундам"
    red_flags:
      - "захват места семафора внутри горутины"
      - "`_ = g.Wait()` без причины"
    follow_ups:
      - q: "Что вернёт `Wait`, если ошиблись три задачи?"
        a: "Первую по времени ошибку: её записал тот, кто первым прошёл `sync.Once`. Остальные отброшены, а задачи, слушающие `ctx`, выйдут с `context.Canceled`."

  - id: backpressure-littles-law
    lesson: 01-5-go-concurrency/05-patterns
    topic: Паттерны конкурентности
    level: S
    question: "Сервису приходит в 2,5 раза больше запросов, чем он успевает обработать. Ждать в очереди, отбрасывать или сразу отказывать? Как выбрать размер очереди?"
    answer: |
      **Тезис:** для синхронных запросов — короткая ограниченная очередь и отказ сверх неё (`503` с `Retry-After`). Длину очереди выбирают из допустимой задержки по закону Литтла, а не «побольше, чтобы не отказывать».

      **Почему:** если запросы приходят быстрее, чем уходят (λ > μ), неограниченная очередь растёт со скоростью λ − μ, и задержка растёт линейно со временем перегрузки: W(t) = (1 − μ/λ)·t. Модель урока — 4 воркера по 100 мс (40 задач в секунду) и 100 задач в секунду. Через 20 с пул с ожиданием выполнил 800 задач с медианной задержкой 11,5 с, семафор с отказом — те же 800 с задержкой 0,3 с, а горутина на задачу — всего 210 задач по 16,6 с. Клиент с таймаутом 5 с давно ушёл: пропускная способность 40 в секунду, а полезная (goodput) — ноль, и ушедшие клиенты ещё и повторяют запросы. В ограниченной очереди задержка ограничена по построению: в среднем (N + Q) / μ, а худшее ожидание при FIFO — (Q / N + 1) × S. Отсюда Q ≈ W_доп × μ − N.

      **Компромисс:** отказ теряет часть клиентов и требует, чтобы они повторяли с паузой и джиттером. Ожидание годится для фоновой работы, где источник можно притормозить: очередь сообщений, пакетная обработка. Отбрасывать молча можно только то, что не жалко: метрики, статус «печатает…».

      **Пример из мессенджера:** хешер паролей — N = `GOMAXPROCS` (в compose 1), Q = 4N, сверх — `503 overloaded` с `Retry-After: 1`. Оценка худшего ожидания 5 × 17 мс ≈ 85 мс не пережила замера: при 12 параллельных хешах один длится 38 мс, и выходит около 190 мс.
    checklist:
      - "три политики — ждать, отбросить, отказать — и для кого какая"
      - "неограниченная очередь: задержка растёт линейно, goodput падает до нуля"
      - "закон Литтла: L = λW, Q из допустимой задержки"
      - "худшее ожидание (Q / N + 1) × S при очереди FIFO"
      - "время операции мерить при N параллельных, а не в одиночку"
    red_flags:
      - "«поставим буфер побольше, чтобы не отказывать»"
      - "отказ без `Retry-After` и клиенты без джиттера"
    follow_ups:
      - q: "Хеш 17 мс, 8 ядер, допустимое ожидание 100 мс. Какие N и Q?"
        a: "N = 8; μ ≈ 8 / 0,017 ≈ 470 в секунду; (N + Q) / μ ≤ 0,1, значит N + Q ≤ 47 и Q ≈ 39. Но сначала замерить хеш при восьми параллельных: он будет дольше 17 мс."

  - id: goroutine-leaks
    lesson: 01-5-go-concurrency/05-patterns
    topic: Паттерны конкурентности
    level: S
    question: "Число горутин сервиса растёт и не возвращается к прежнему уровню. Какие бывают причины утечек, как найти виновную строку и как не допускать их в коде?"
    answer: |
      **Тезис:** утечка — горутина, навсегда заблокированная: отправка без получателя, чтение канала, который никто не закроет, цикл без выхода, ожидание без `ctx`. Находят её по метрике `/sched/goroutines:goroutines` и профилю `goroutineleak`, а не допускают структурной конкурентностью и тестами в `synctest`.

      **Почему:** стек живой горутины — корень сборщика мусора: она держит всё, на что ссылается. Профиль `goroutineleak` (в Go 1.27 обычный профиль) запускает особый цикл сборки. Стеки заблокированных горутин в нём не корни, и если примитив, на котором ждёт горутина, недостижим из живого кода, разбудить её некому — она утекла. Он не найдёт утечку, если канал достижим из глобальной переменной или из работающей горутины, и не смотрит на сон, сеть и системные вызовы. Запрос профиля — полный цикл сборки, поэтому его снимают по требованию. В тестах `synctest.Test` паникует, если после возврата функции теста в пузыре остались заблокированные горутины.

      **Компромисс:** буфер на число задач лечит вечную блокировку, но работа продолжается без владельца после возврата функции — `synctest` роняет и такой тест. `errgroup` с `Wait` и `ctx` даёт «ни одна горутина не переживает функцию», ценой ожидания самой долгой задачи, если задачи не умеют отменяться.

      **Пример из мессенджера:** под смешанной нагрузкой `goroutine?debug=1` показал 30 горутин, после нагрузки — 13, а `goroutineleak` — `total 0`. Всё долгоживущее — компоненты с `Run(ctx)` под одним владельцем, `lifecycle.Run`.
    checklist:
      - "причины: отправка без получателя, чтение без закрытия, цикл без выхода, ожидание без `ctx`"
      - "признак — растущие `/sched/goroutines` и ждущие горутины"
      - "`goroutineleak` через сборщик: недостижимый примитив, и его пределы"
      - "структурная конкурентность: `errgroup` или `WaitGroup` и ожидание перед возвратом"
      - "`synctest.Test` ловит утечки и работу без владельца в тестах"
    red_flags:
      - "«лишние горутины уберёт сборщик мусора»"
      - "`time.Sleep` в тесте, «чтобы горутина успела»"
    follow_ups:
      - q: "Почему канал результата для вызова с таймаутом создают с буфером 1?"
        a: "Если вызывающий ушёл по `ctx.Done()`, читать результат некому, и отправка в небуферизованный канал повесила бы горутину навсегда. Буфер 1 даёт ей положить результат и выйти."

  # 1.5.6
  - id: shutdown-order
    lesson: 01-5-go-concurrency/06-background-work
    topic: Жизненный цикл
    level: M+
    question: "В сервисе HTTP-сервер и фоновый публикатор событий. В каком порядке их останавливать по SIGTERM и как обеспечить этот порядок в коде?"
    answer: |
      **Тезис:** сначала то, что принимает работу (Front), потом то, что её обслуживает (Back). Каждый долгоживущий компонент — `Run(ctx) error`, а владелец отменяет компоненты по стадиям и дожидается их.

      **Почему:** во время дренажа HTTP ещё принимает запросы, и они опираются на фон: кладут события в очередь публикатора. Остановить фон вместе с фронтом — значит заставить запросы дренажа писать в очередь, которую никто не разбирает, и клиенты получат 500 во время «плавной» остановки. Kubernetes не гарантирует, что под уйдёт из балансировки раньше SIGTERM, поэтому сервис сам делает `/readyz` → 503, выжидает `DRAIN_DELAY` и только потом `Shutdown`. В `lifecycle.Run` фоновые компоненты получают контекст на `context.WithoutCancel`: сигнал до них не доходит, а `stopBack()` вызывается после `front.Wait()`. Наружу уходит первая по времени ошибка — причина, а не следствие.

      **Компромисс:** бюджет: 5 с дренажа, до 10 с `Shutdown` и до 2 с фону — 17 с при сроке платформы 30 с. Горутину нельзя остановить снаружи: компонент, который игнорирует отмену, переживёт `Run`, поэтому после такой ошибки процесс выходит, а не перезапускает компоненты. И `nil` без отмены — тоже сбой (`ErrStoppedEarly`): компонент перестал работать молча.

      **Пример из мессенджера:** журнал остановки — «останавливаюсь: /readyz отвечает 503», «сервер остановлен», «фоновые компоненты остановлены», ровно в порядке стадий. Тест на `synctest` проверяет время на точное равенство: сбой фона на 3-й секунде плюс 5 с дренажа — `Run` вернулся ровно через 8 с.
    checklist:
      - "у каждой горутины владелец и способ остановки; контракт `Run(ctx) error`"
      - "сначала Front, потом Back — и почему"
      - "дренаж: `/readyz` → 503, пауза, `Shutdown`"
      - "бюджет остановки меньше срока платформы"
      - "горутину не убить снаружи: зависший компонент — выход процесса"
    red_flags:
      - "«отменим всё одним `ctx` одновременно»"
      - "горутина, запущенная в конструкторе, и метод `Close()`"
    follow_ups:
      - q: "Зачем своя обработка второго SIGTERM, если после `stop()` от `NotifyContext` Go и так завершится?"
        a: "Процесс умрёт молча, с кодом, который зависит от окружения: 130 или 143 вне контейнера, 143 у PID 1 на Go 1.27, а у PID 1 на Go 1.26 — 2, как у паники. Своя функция пишет причину в журнал и всегда выходит с кодом 1."

  - id: background-panic
    lesson: 01-5-go-concurrency/06-background-work
    topic: Жизненный цикл
    level: S
    question: "Фоновая очистка в сервисе запаниковала. Поставите ли вы `recover` в фоновые горутины? А если очистка не запаниковала, а вернула ошибку?"
    answer: |
      **Тезис:** нет: паника в фоне роняет процесс, и это честнее, чем жить дальше. Ошибка компонента останавливает процесс тем же аккуратным путём, что и сигнал, с кодом 1. А временную ошибку одной итерации пишут в журнал и пробуют снова.

      **Почему:** `recover` работает только в отложенной функции той же горутины. Паника чужой горутины не перехватывается ничем, рантайм печатает стек и завершает процесс с кодом 2. Паника значит, что программа в состоянии, которого автор не предусмотрел: горутина могла упасть с захваченным мьютексом или посреди изменения карты. `recover` останавливает раскрутку, но ничего не чинит — громкий отказ становится тихой порчей. В HTTP-обработчике панику ловят, потому что у запроса есть граница состояния: его данные выбрасываются вместе с ним. У фоновой задачи такой границы нет. Упавший процесс видно — код выхода, счётчик перезапусков, `CrashLoopBackOff`. А «живой без очистки» — это растущая память и OOM-kill через шесть часов без видимой связи с причиной.

      **Компромисс:** цена — перезапуск экземпляра. Сегодня это потеря данных в памяти, после модуля 2 — секунды прогрева. Это идея crash-only (Candea, Fox): состояние вне процесса, повторяемые запросы, быстрый перезапуск. Супервизор в стиле Erlang в Go не работает: у горутин общая память, и перезапуск компонента на испорченном состоянии хуже падения.

      **Пример из мессенджера:** ADR-0012. `periodic.Task` пишет ошибку итерации на уровне `Warn` и работает дальше, а `recover` в нём нет намеренно. Коды выхода: 0 — штатно, 1 — сбой компонента или второй сигнал, 2 — паника, 137 — SIGKILL.
    checklist:
      - "`recover` ловит панику только своей горутины; необработанная паника — код 2"
      - "граница состояния: запрос против общего состояния процесса"
      - "ошибка компонента → аккуратная остановка и код 1"
      - "временная ошибка итерации — журнал и повтор, а не сбой компонента"
      - "crash-only: перезапуск как штатный путь"
    red_flags:
      - "`defer recover()` в каждой горутине «для надёжности»"
      - "`log.Fatal` или `os.Exit` в фоновой горутине"
    follow_ups:
      - q: "Паника хешера внутри запроса регистрации: процесс упадёт? Освободится ли место в ограничителе?"
        a: "Не упадёт: `Hash` выполняется синхронно в горутине запроса, панику ловит `middleware.Recover` и отвечает 500. Место возвращается через `defer`; без него N + Q паник навсегда заняли бы все места."

  - id: hash-limiter-design
    lesson: 01-5-go-concurrency/06-background-work
    topic: Жизненный цикл
    level: S
    question: "Регистрация считает Argon2id: 19 МиБ и десятки миллисекунд процессора на хеш. Пятьдесят одновременных регистраций убили контейнер на 256 МиБ. Спроектируйте защиту и выберите числа."
    answer: |
      **Тезис:** ограничить число одновременных хешей N по процессору и памяти, поставить короткую очередь Q и отказывать сверх неё `503` с `Retry-After`. N выбирать заметно ниже точки, где сборщик мусора начинает пробуксовывать.

      **Почему:** по памяти: (230 − 21) / 19 ≈ 11 хешей до `GOMEMLIMIT`. По процессору больше `GOMAXPROCS` хешей не ускоряет: 12 параллельных дали 271 хеш в секунду, 24 — 259, а памяти вдвое больше. Устройство — два канала-семафора. `slots` ёмкостью N + Q захватывается без ожидания: `select` с `default`, мест нет — `ErrOverloaded`. `run` ёмкостью N захватывается с ожиданием, но в `select` с `ctx.Done()`. Освобождение — через `defer`, и при панике тоже. Дешёвые проверки (имя пользователя) — до дорогой. Замер в контейнере: N = 2, Q = 4 — 8 ответов `201` и 42 ответа `503`, отказ на сервере стоил 14–217 мкс, пик памяти 87 МиБ. При N = 30 — OOM-kill в обоих прогонах.

      **Компромисс:** у самого лимита медленно всё, даже отказы: при N = 14 и 20 они стоили 0,1–0,5 с. Трасса урока 1.5.10 показала почему: в основном ожидание процессора за хешами и троттлинг квотой, плюс помощь разметке до 61 мс за раз. Запас по памяти — это и запас по задержке. Потолок 256 в конфигурации — защита от лишнего нуля в переменной.

      **Пример из мессенджера:** `hashlimit` — декоратор над портом `PasswordHasher`, use case'ы об ограничении не знают. `ErrOverloaded` объявлен рядом с портом в `auth/usecase`, а `httpapi` переводит его в `503 overloaded` с `Retry-After: 1`. В compose N = 1, Q = 4.
    checklist:
      - "N из ресурса: процессор (`GOMAXPROCS`) и память (N × 19 МиБ)"
      - "Q из допустимой задержки, сверх — `503` с `Retry-After`"
      - "захват места в очереди без ожидания, захват исполнения — с `ctx`"
      - "освобождение через `defer`, в том числе при панике"
      - "N ниже точки пробуксовки сборщика, а не у самого лимита"
    red_flags:
      - "«поднимем лимит памяти контейнера»"
      - "семафор на N без предела ожидающих"
    follow_ups:
      - q: "Почему не `x/sync/semaphore`?"
        a: "Он ждёт сколько угодно (`Acquire`) или не ждёт вовсе (`TryAcquire`): длину очереди не ограничить без второго счётчика. Вес и справедливая очередь хешам не нужны, а два канала дают то же меньшим кодом."

  # 1.5.7
  - id: netpoller-read
    lesson: 01-5-go-concurrency/07-netpoller
    topic: Сеть и netpoller
    level: S
    question: "100 000 горутин «заблокированы» в `conn.Read`, а потоков ОС единицы. Как это устроено — от системного вызова до пробуждения горутины?"
    answer: |
      **Тезис:** сокет неблокирующий и один раз зарегистрирован в `epoll` по фронту. `Read` сначала пробует `read`, на `EAGAIN` паркует горутину на `pollDesc`, а планировщик сам опрашивает `epoll` и делает готовые горутины готовыми к запуску.

      **Почему:** `net` открывает сокеты с `SOCK_NONBLOCK`, `runtime_pollOpen` один раз на жизнь сокета регистрирует `EPOLLIN|EPOLLOUT|EPOLLRDHUP|EPOLLET`. `poll.FD.Read` всегда начинает с `read`, и только `EAGAIN` ведёт в `netpollblock`: `rg` из `pdNil` в `pdWait`, `gopark`, затем в `rg` записывается сама горутина. Если событие пришло между `read` и парковкой, в `rg` уже `pdReady`, и сна не будет. Будит `netpoll` — `epoll_pwait` на 128 событий. Его зовёт `findRunnable`: неблокирующе (`netpoll(0)`) перед кражей работы, а если работы нет нигде — блокирующе, но только после того, как поток отдал P. Ещё — `sysmon`, если сеть не опрашивали больше 10 мс, и старт мира после остановки. `epoll_wait` платит за готовые сокеты, а не за наблюдаемые, как `select` и `poll`.

      **Компромисс:** режим по фронту дешевле для ядра, но требует читать до `EAGAIN` — Go соблюдает это сам. Обычные файлы `epoll` не принимает (`EPERM`), и чтение файла честно держит поток. `io_uring` для сети Go не использует: кольцо фиксированного размера, конкуренция за него, а Docker по умолчанию запрещает его вызовы.

      **Пример из мессенджера:** в профиле горутин под нагрузкой 8 горутин соединений стоят в `internal/poll.runtime_pollWait` — восемь клиентов ждут следующего запроса по keep-alive, не держа ни одного потока.
    checklist:
      - "неблокирующий сокет, `EAGAIN`, парковка на `pollDesc`"
      - "регистрация в `epoll` один раз, по фронту; читать до `EAGAIN`"
      - "кто будит: `netpoll(0)` перед кражей, блокирующий опрос после отдачи P, `sysmon`, старт мира"
      - "`epoll_wait` платит за готовые, `select` и `poll` — за все"
      - "файлы `epoll` не поддерживает — чтение файла держит поток"
    red_flags:
      - "«на каждое соединение рантайм держит поток»"
      - "«ядро присылает Go сигнал, когда пришли данные»"
    follow_ups:
      - q: "Почему регистрация по фронту не теряет данные, если обработчик прочитал не всё, что пришло?"
        a: "Каждый `Read` сначала делает `read` и ждёт только после `EAGAIN`, поэтому оставшиеся байты заберёт следующий `Read` без всякого события."

  - id: connection-cost
    lesson: 01-5-go-concurrency/07-netpoller
    topic: Сеть и netpoller
    level: S
    question: "Сколько стоит одно простаивающее TCP-соединение в Go-сервисе с горутиной на соединение? Разложите по частям и скажите, как это измерить."
    answer: |
      **Тезис:** в замере на 10⁵ соединений — 5,6 КиБ RSS процесса Go (стек 4 КиБ, около 0,9 КиБ структур и буфер `bufio` на 4 КиБ, пока не тронутый) и ещё около 4,6–5 КиБ структур ядра в `Slab`. Без своего буфера (буфер из пула на время чтения) — 3,6 КиБ процесса.

      **Почему:** стек: цепочка `ReadString` → … → `gopark` занимает 1,39 КиБ, а без роста горутине доступно около 1,1 КиБ из 2: защитная зона `stackGuard` — 928 байт. Поэтому стек вырос до 4 КиБ. Куча: `runtime.g` 456 байт (класс 480), `netFD` 128 байт, два адреса, `bufio.Reader` и буфер. Стеки и куча дают 8,8 КиБ, а RSS — 5,6: страницу буфера, в которую ни разу не писали, ядро не выделило. `pollDesc` (296 байт) живёт вне кучи. В `/proc/net/sockstat` соединения почти не видны: там статистика всей машины, `inuse` растёт на 2N при клиенте на той же машине, а `mem` считает только буферы данных. Структуры сокетов видны в `Slab` из `/proc/meminfo`: 4,6–4,95 КиБ на сокет. Мерить — `runtime/metrics` (стеки, объекты кучи, `/gc/scan/stack`), `VmRSS` и `Slab` до и после, с `runtime.GC()` перед снимком.

      **Компромисс:** горутина на соединение — последовательный код, `net/http`, `crypto/tls` и все таймауты. Цикл событий, как у Камардина (свой `epoll`, горутина из пула на событие), убирает стек и буфер у молчащих соединений, но превращает код в машину состояний и требует своей интеграции с TLS и HTTP. Его 24 КБ складываются из наших же частей: 2 горутины по 4 КиБ и 4 буфера по 4 КиБ.

      **Пример из мессенджера:** шлюз WebSocket модуля 3 начнём с горутины на соединение и буферов по размеру сообщений. TLS в замер не входил — это гипотеза, которую проверим в модуле 3.
    checklist:
      - "стек вырос 2 → 4 КиБ из-за глубины цепочки `bufio`"
      - "куча: дескриптор горутины (480 Б), `netFD`, адреса, буфер"
      - "RSS меньше выделенного: нетронутые страницы буфера"
      - "ядро: `Slab` около 5 КиБ на сокет, `sockstat` его не видит"
      - "числа — из замера (`runtime/metrics`, `VmRSS`, `/proc/meminfo`), а не из статьи"
    red_flags:
      - "«соединение стоит 8 МиБ, как поток»"
      - "«`sockstat mem` ноль — значит, ядру сокеты ничего не стоят»"
    follow_ups:
      - q: "Что изменится, когда клиенты начнут писать?"
        a: "Страница буфера каждого соединения станет резидентной: RSS вырастет примерно на 4 КиБ на соединение. Буфер 64 КиБ «на всякий случай» на 10⁵ соединений — 6,4 ГБ, и это всплывёт только под реальной нагрузкой."

  - id: read-deadline-idle
    lesson: 01-5-go-concurrency/07-netpoller
    topic: Сеть и netpoller
    level: M+
    question: "Сервер ставит `SetReadDeadline(time.Now().Add(time.Minute))` сразу после `Accept` и дальше читает в цикле. Клиент пишет каждые 10 секунд. Что произойдёт и сколько стоит правильный вариант?"
    answer: |
      **Тезис:** через минуту после подключения `Read` вернёт `i/o timeout`, хотя клиент активен: дедлайн — момент времени, а не таймаут простоя. Таймаут простоя продлевают перед каждым чтением, и это дёшево.

      **Почему:** `SetReadDeadline` не запускает ни горутину, ни поток: он заводит таймер рантайма в `pollDesc`, в куче таймеров P. Сработал — `netpolldeadlineimpl` помечает дедлайн истёкшим и будит горутину, а `Read` возвращает ошибку с `os.ErrDeadlineExceeded` внутри. Успешные чтения дедлайн не сдвигают. Продление — перестановка таймера в куче P без системного вызова. Проверяют ошибку через `errors.Is(err, os.ErrDeadlineExceeded)` или `Timeout()` у `net.Error`, а не по тексту.

      **Компромисс:** без дедлайна соединение клиента, пропавшего без `FIN` (выключился телефон), висит часами и держит дескриптор и горутину. Слишком короткий таймаут рвёт живых, но редко пишущих клиентов. Значение выбирают по протоколу — по тому, как часто клиент обязан что-то присылать.

      **Пример из мессенджера:** `http.Server` ставит дедлайны на соединение перед каждым этапом — так работают `ReadTimeout`, `WriteTimeout` и `IdleTimeout` (урок 1.17).
    checklist:
      - "дедлайн абсолютный, успешное чтение его не сдвигает"
      - "продлевать перед каждым чтением"
      - "устройство: таймер рантайма в `pollDesc`, без потоков и системных вызовов"
      - "проверка через `errors.Is(err, os.ErrDeadlineExceeded)`"
      - "без дедлайна мёртвые клиенты держат дескрипторы и горутины"
    red_flags:
      - "«на каждый таймаут рантайм запускает горутину или поток»"
      - "сравнение текста ошибки с «i/o timeout»"
    follow_ups:
      - q: "Сервис в контейнере на тысячном соединении начал получать `too many open files`. Почему и что проверить?"
        a: "Жёсткий лимит `ulimit -n` — 1024. Go с 1.19 поднимает мягкий лимит до жёсткого, но не выше. Жёсткий задают снаружи (`--ulimit nofile`, `LimitNOFILE`) и печатают в журнал при старте."

  # 1.5.8
  - id: escape-analysis
    lesson: 01-5-go-concurrency/08-stack-heap
    topic: Память и аллокатор
    level: M+
    question: "Как Go решает, где живёт переменная — на стеке или в куче? Назовите главные причины «побега» и объясните, почему `-gcflags=-m` пишет `does not escape`, а аллокация в куче всё равно есть."
    answer: |
      **Тезис:** решает компилятор escape-анализом: если адрес значения может попасть в кучу или пережить кадр функции, значение выделяется в куче, иначе — в кадре стека. `new` не значит «в куче».

      **Почему:** анализ держит два инварианта: указатель на стек не хранится в куче и не переживает объект. Главные причины побега: возврат указателя; сохранение в интерфейс, глобальную переменную или замыкание, которое переживёт вызов (`fmt.Println(p)` уводит `p` через `...any`); неизвестный размер; слишком большой объект (64 КиБ для неявных выделений, 128 КиБ для явных); отправка указателя в канал; вызов метода через интерфейс. С Go 1.25 `make([]T, n)` с переменной `n` получает в кадре буфер на 32 байта и проверку при выполнении. Если ёмкость больше, `makeslice` выделяет память в куче — поэтому «does not escape» и всё же аллокация: 4 `int` — 0 аллокаций, 5 — одна. Встраивание (бюджет 80) меняет решение: маленький конструктор, возвращающий указатель, после встраивания часто ничего не выделяет, а «escapes» в выводе относится к телу функции, а не к каждому вызову.

      **Компромисс:** анализ консервативен: ошибиться в сторону кучи можно, в сторону стека нельзя. Контроля меньше, чем в C++ или Rust. Поэтому смотрят `-m` в месте вызова, а число аллокаций проверяют `testing.AllocsPerRun` или `-benchmem`.

      **Пример из мессенджера:** профиль `allocs` урока 1.5.10 — 54 % байт дают буферы Argon2id (большие объекты прямо из `mheap`), а по числу объектов лидируют JSON через рефлексию и разбор JWT — почти 40 % объектов.
    checklist:
      - "решает компилятор; инварианты: стек не виден из кучи и не переживает кадр"
      - "причины побега: возврат указателя, интерфейс, глобальная, замыкание, размер, канал"
      - "`does not escape` у `make` с переменной длиной — буфер 32 байта, а не гарантия"
      - "встраивание меняет решение; смотреть `-m` в месте вызова"
      - "проверять числом аллокаций: `-benchmem`, `AllocsPerRun`"
    red_flags:
      - "«`new` всегда выделяет в куче»"
      - "«указатель передавать дешевле, чем копировать» без замера"
    follow_ups:
      - q: "Почему аргументы вызова C через cgo всегда убегают в кучу?"
        a: "Стек горутины может переехать, а где C хранит адреса, рантайм не знает. cgo передаёт аргументы в непрозрачный для анализа `_Cgo_use`, и они уходят в кучу, которая не перемещается."

  - id: stack-growth-copy
    lesson: 01-5-go-concurrency/08-stack-heap
    topic: Память и аллокатор
    level: S
    question: "Как растёт стек горутины, почему его можно переносить в другое место памяти и когда он сжимается? Как это проявилось в замере 10⁵ соединений?"
    answer: |
      **Тезис:** пролог функции сравнивает указатель стека с `stackguard0`. Не хватает места — `morestack` → `newstack` выделяет стек вдвое больше, и `copystack` переносит в него старый, поправляя указатели по картам стека. Сжимает стек сборщик: если занято меньше четверти — вдвое.

      **Почему:** переносить можно по двум причинам. Компилятор пишет для каждой функции карты, где в кадре указатели. А escape-анализ гарантирует, что на стек не указывает ничего снаружи. Редкие исключения рантайм правит вручную — например, `sudog` горутины, ждущей в канале (`adjustsudogs`). Отсюда же запрет отдавать указатели на стек коду на C. Рост амортизирован: 2 + 4 + … + S/2 < S. Адаптивный старт (Go 1.19): каждая сборка считает средний занятый стек, прибавляет `stackGuard` и округляет до степени двойки. Сжатие идёт только в безопасной точке и за один цикл только вдвое: с 8 МиБ до 4 КиБ — одиннадцать циклов.

      **Компромисс:** адаптивный старт срабатывает и во вред: двести горутин, оказавшихся во время сборки на глубине 1000 (около 70 КиБ стека), сделали стартовый стек всех новых горутин 128 КиБ до следующего цикла. Копирование дорого, когда горутин много и каждая растёт заново.

      **Пример из лабы:** в `netpoll` стек горутины с `bufio` — 4 КиБ из-за глубины цепочки (занято 1,39 КиБ при доступных 1,1), а без `bufio` — 2 КиБ. Пара лишних кадров в обработчике удваивает стек у ста тысяч горутин. Следить — метрикой `/gc/stack/starting-size:bytes`.
    checklist:
      - "пролог, `stackguard0`, `morestack` → удвоение и копирование"
      - "почему можно двигать: карты стека и инварианты escape-анализа"
      - "сжатие сборщиком: меньше четверти — вдвое, только в безопасной точке"
      - "адаптивный начальный размер по среднему"
      - "глубина цепочки задаёт стек у всех горутин: 2 → 4 КиБ"
    red_flags:
      - "«стек горутины фиксированный, 2 КиБ»"
      - "«после всплеска стек сразу возвращается»"
    follow_ups:
      - q: "Почему горутина, ждущая на канале, не ломает перенос своего стека?"
        a: "Её `sudog` держит адрес переменной на стеке. `copystack` берёт замки каналов, на которых она ждёт, и поправляет эти адреса (`adjustsudogs`)."

  - id: allocation-cost
    lesson: 01-5-go-concurrency/08-stack-heap
    topic: Память и аллокатор
    level: M+
    question: "Бенчмарк: `[]item` быстрее `[]*item` в три раза. Почему указатели дороже и какая часть цены не видна в `ns/op`? Как маленький объект выделяется без замка, если куча общая?"
    answer: |
      **Тезис:** каждый элемент по указателю — это аллокация, промах кэша при чтении и объект для разметки в каждом цикле сборщика. Массив значений без указателей — один объект в спане «без указателей», который сборщик не сканирует вовсе.

      **Почему:** маленький объект выделяет `mallocgc` из `mcache` текущего P: найти свободный бит в спане нужного класса размеров (67 классов до 32 КиБ) без замков, потому что P в каждый момент принадлежит одному M. К общему `mcentral` идут, когда спан заполнился, к `mheap` под замком — за страницами. Объекты больше 32 760 байт сразу идут в `mheap`, а объекты меньше 16 байт без указателей пакует tiny-аллокатор. Замер: 19,38 против 6,22 мкс, 1000 аллокаций против 0 — около 13 нс на объект в куче. Невидимая часть цены — сборщик: аллокации приближают цикл, объекты с указателями надо разметить, а во время разметки выделяющая горутина платит помощью разметке. В продакшене эту цену оплачивает чужой запрос.

      **Компромисс:** приёмы — предвыделение, значения вместо указателей, переиспользование буфера, `strconv` вместо `fmt.Sprintf` (в 2,5 раза быстрее), `sync.Pool`. Без профиля это преждевременная оптимизация, а читаемость — тоже цена.

      **Пример из мессенджера:** профиль урока 1.5.10 показал, что главный «едок» объектов — разбор JWT и JSON, а не хранилище. Переписывать ничего не стали: около 0,1 мс процессора на проверку токена — цена stateless-токенов, и решать будут по профилю продакшена.
    checklist:
      - "три цены: аллокация, локальность памяти, работа сборщика"
      - "спаны без указателей: массив значений не сканируется"
      - "`mcache` на P — выделение без замка; `mcentral` и `mheap` реже"
      - "помощь разметке: цена аллокаций ложится на чужие запросы"
      - "сначала профиль `allocs`, потом бенчмарк и `benchstat`"
    red_flags:
      - "«аллокация в Go бесплатна, есть же сборщик»"
      - "оптимизация аллокаций без профиля"
    follow_ups:
      - q: "Буферы `bytes.Buffer` из `sync.Pool`: обычно 2 КиБ, но раз в минуту бывает выгрузка на 50 МиБ. Что будет?"
        a: "Раздутый буфер вернётся в пул, и `Get` отдаст его обычному запросу: `Reset` обнуляет длину, но не ёмкость. Не возвращать в пул буферы больше порога, например 64 КиБ, или держать отдельный пул для больших."

  # 1.5.9
  - id: tricolor-write-barrier
    lesson: 01-5-go-concurrency/09-gc
    topic: Сборщик мусора
    level: S
    question: "Как работает трёхцветная разметка и зачем ей барьер записи? Какой барьер у Go и что он дал?"
    answer: |
      **Тезис:** белые объекты сборщик ещё не нашёл, серые нашёл, но не просмотрел, чёрные просмотрел целиком. Конкурентная разметка теряет живой объект, если чёрный получил указатель на белый, а путь к белому от серых исчез. Барьер записи не даёт этому случиться. У Go с 1.8 гибридный барьер — Юасы и Дейкстры вместе: он держит слабый инвариант и позволяет сканировать каждый стек один раз, не останавливая мир.

      **Почему:** A чёрный, B серый держит единственный указатель на белый F. Горутина делает `A.next = F` и `B.f = nil` — F останется белым, и очистка освободит живой объект. Барьер Дейкстры затеняет новое значение и держит сильный инвариант (чёрный не указывает на белый). Барьер Юасы затеняет старое и держит слабый (у белого остаётся путь от серого). Записи в собственный кадр функции барьер не перехватывает, иначе он стоял бы на каждом присваивании локальной переменной. Поэтому до 1.8 стеки пересканировали в паузе, и при сотнях тысяч горутин пауза росла до десятков миллисекунд. Гибридный барьер затеняет старое значение всегда, а новое — пока стек текущей горутины не просканирован. Release notes 1.8: паузы обычно меньше 100 мкс. Новые объекты во время разметки сразу помечаются чёрными, отсюда «плавающий мусор».

      **Компромисс:** барьер — несколько инструкций на запись указателя во время разметки (вне её — одна проверка флага), плюс 25 % процессора на фоновую разметку. Сборщик не перемещает объекты и не делит их на поколения: барьер чтения не нужен, а роль «питомника» играет стек благодаря escape-анализу.

      **Пример из лабы:** `gctrace` — самая долгая пауза до 197 мкс и при `GOGC=400`, и у лимита памяти, при 64 МиБ живых данных и гигабайте мусора в секунду. А `/gc/heap/live` под непрерывной сборкой показал 394 МиБ при примерно 250 МиБ настоящих данных — плавающий мусор.
    checklist:
      - "три цвета и условие потери объекта"
      - "сильный и слабый инварианты; барьеры Дейкстры и Юасы"
      - "гибридный барьер Go 1.8: стек сканируется один раз, без пересканирования в паузе"
      - "две короткие паузы за цикл, не зависящие от размера кучи"
      - "новые объекты во время разметки чёрные — плавающий мусор"
    red_flags:
      - "«барьер нужен, потому что сборщик двигает объекты»"
      - "«главная цена сборщика Go — паузы»"
    follow_ups:
      - q: "Почему у Go нет барьера чтения и поколений?"
        a: "Барьер чтения нужен перемещающим сборщикам, а Go объекты не двигает. Поколения пробовали: барьер для них оказался «быстрым, но недостаточно быстрым», а короткоживущие объекты в Go и так чаще живут на стеке."

  - id: gogc-gomemlimit
    lesson: 01-5-go-concurrency/09-gc
    topic: Сборщик мусора
    level: M+
    question: "Сервис в контейнере с лимитом памяти 256 МиБ. Что выставить: `GOGC`, `GOMEMLIMIT`, оба? Как считается цель кучи?"
    answer: |
      **Тезис:** `GOMEMLIMIT` на 5–10 % ниже лимита контейнера (у мессенджера 230 МиБ из 256) и `GOGC` по умолчанию. `GOGC=off` — только вместе с лимитом и только когда живые данные намного меньше лимита и память ни с кем не делится.

      **Почему:** цель по `GOGC` — живая куча + (живая куча + стеки + глобальные) × `GOGC` / 100, не меньше 4 МиБ; стеки и глобальные входят в формулу с Go 1.18. Цикл начинается раньше цели, на триггере — между 0,7 и 0,95 пути к ней. Цель по лимиту — лимит минус вся не-кучевая память рантайма, минус превышение и 3 % запаса, но не ниже живой кучи. Pacer берёт меньшую из двух. `GOGC` линейно меняет процессор на память. Лаба с 64 МиБ живых и гигабайтом мусора в секунду: `GOGC=400` — 10 циклов за 3 с, 4,8 % CPU, куча до 487 МиБ; `GOGC=100` с лимитом 100 МиБ — 284 цикла и 53 % CPU при куче 86 МиБ; `GOGC=off` с лимитом 256 МиБ — 25 циклов и 12,8 % против 44 и 20,6 % у `GOGC=100` без лимита. Лимит, равный лимиту контейнера, ведёт к OOM-kill: cgroup считает всю память — бинарник, cgo, `tmpfs`, буферы сокетов, — а Go только свою.

      **Компромисс:** у лимита сервис становится медленным, а не мёртвым: сборщик работает почти непрерывно. И лимит мягкий: живые данные выше него он не удержит. Если окружением вы не управляете, лимит не ставят.

      **Пример из мессенджера:** `compose.yaml` — `mem_limit: 256m`, `GOMEMLIMIT=230MiB`, `cpus: 1`. Рантайм выставляет `GOMAXPROCS` = 2, и выделенного воркера разметки нет: 2 × 0,25 = 0,5, работает только дробный.
    checklist:
      - "формула цели кучи со стеками и глобальными; триггер раньше цели"
      - "`GOGC` линейно меняет процессор на память"
      - "цель от `GOMEMLIMIT`; pacer берёт меньшую"
      - "`GOMEMLIMIT` на 5–10 % ниже лимита контейнера: cgroup считает больше"
      - "когда `GOGC=off` с лимитом правилен, а когда нет"
    red_flags:
      - "«`GOGC=off` ускоряет сервис»"
      - "`GOMEMLIMIT`, равный лимиту контейнера"
    follow_ups:
      - q: "Живая куча 80 МиБ, стеки 4 МиБ, глобальные 1 МиБ, `GOGC=100`. Какая цель?"
        a: "80 + (80 + 4 + 1) × 1 = 165 МиБ; при `GOGC=50` — 80 + 85 × 0,5 = 122,5 МиБ. Цикл начнётся раньше, на триггере."

  - id: gc-cpu-limiter
    lesson: 01-5-go-concurrency/09-gc
    topic: Сборщик мусора
    level: S
    question: "Из-за утечки живые данные сервиса выросли выше `GOMEMLIMIT`. Что будет происходить по шагам? Что такое спираль смерти и как рантайм её предотвращает?"
    answer: |
      **Тезис:** цель кучи прижимается к живой куче, циклы идут без перерыва, и помощь разметке съедает время запросов. Ограничитель CPU сборщика держит его долю около 50 %: отключает помощь разметке и позволяет куче вырасти выше лимита. Утечку он не лечит, а только отсрочивает OOM-kill.

      **Почему:** без защиты каждая сборка почти ничего не освобождает, горутины всё больше времени тратят на помощь разметке, и программа почти останавливается — это спираль смерти, или пробуксовка. Ограничитель (`mgclimit.go`) — дырявое ведро. Время сборщика его наполняет, время мутатора опустошает один к одному, поэтому равновесие — половина. Ёмкость — одна процессорная секунда на P, кредита нет. Ведро полно — ограничитель включён: помощь разметке отключается, фоновые 25 % остаются, возврат памяти ОС ради лимита прекращается. Работает он всегда, а не только с `GOMEMLIMIT`: при `GOGC=10` без лимита сборщик взял около 61 %, и ограничитель включился. Но настоящую спираль создаёт именно лимит. Лаба `limiter`: в окнах 1–3 сборщик взял 38, 59 и 72 % — ведро наполнялось, в четвёртом окне ограничитель включился, дальше 55–60 %.

      **Компромисс:** память сверх лимита в обмен на живучесть: руководство обещает замедление не больше чем вдвое. При утечке процесс всё равно дойдёт до лимита контейнера и получит OOM-kill, но успеет показать деградацию на графиках. И «около 50 %» — свойство ведра: метрика `/cpu/classes/gc/total` считает воркеров простоя и знаменатель иначе и может показывать больше.

      **Пример из мессенджера:** у лимита памяти (N = 14 хешей) трасса показала 133 цикла сборки за 5 с и помощь разметке до 61 мс за раз. Но главной причиной медленных отказов оказалось ожидание процессора, а не сборщик.
    checklist:
      - "цель от лимита не ниже живой кучи → циклы без перерыва"
      - "спираль смерти: помощь разметке съедает процессор"
      - "ограничитель: дырявое ведро, около 50 %, отключает помощь разметке"
      - "включён всегда, не только с `GOMEMLIMIT`"
      - "утечку не лечит: память уходит за лимит, потом OOM-kill"
    red_flags:
      - "«ограничитель работает, только если задан `GOMEMLIMIT`»"
      - "«`GOMEMLIMIT` — жёсткий лимит, выше него куча не вырастет»"
    follow_ups:
      - q: "Метрика показывает 57 % CPU на сборщик при включённом ограничителе. Он сломан?"
        a: "Нет: ведро не считает воркеров простоя и вычитает простой из общего времени, фоновую разметку считает ровно как 25 %, а без гистерезиса ограничитель «мигает». Метрика и ведро меряют разное."

  # 1.5.10
  - id: cpu-profile-vs-trace
    lesson: 01-5-go-concurrency/10-profiling
    topic: Профилирование
    level: S
    question: "Отказы `503` у лимита памяти длятся по 300 мс, хотя код отказа — микросекунды. CPU-профиль показывает помощь разметке 0,7 %. Где искать причину и что вы ожидаете там увидеть?"
    answer: |
      **Тезис:** в трассе исполнения. Вопрос про ожидание, а CPU-профиль видит только время на процессоре: сигнал `SIGPROF` приходит 100 раз в секунду процессорного времени. В трассе видно очередь готовых горутин, помощь разметке с настенным временем и паузы на шкале, а рядом нужен `cpu.stat` cgroup для троттлинга.

      **Почему:** помощь разметке в трассе — от входа в `gcAssistAlloc` до выхода, включая парковку в очереди помощи (`gcParkAssist`), которая процессор не тратит. Прогон урока 1.5.10 с N = 14: за 5,16 с трассы — 133 цикла сборки, помощь разметке вне хеша 69 раз, самая долгая 61 мс. `-pprof=sched` — 31,6 с ожидания P на 5 с трассы: 14 хешей и обработчики делят `GOMAXPROCS` = 2. `cpu.stat` — 88 периодов троттлинга из 735, около 46 мс заморозки на поток, и, скорее всего, отсюда паузы остановки мира до 47 мс. В среднем процесс взял 41 % квоты, но волнами. Итог: гипотеза «виновата помощь разметке» подтверждена частично, главное — ожидание процессора. Лечение — N ниже: с N = 1 отказы стоят 0–28 мс.

      **Компромисс:** трасса после Go 1.21 стоит 1–2 % процессора вместо 10–20 %, но это поток событий, а не сводка. Flight recorder держит её постоянно — последние 10 с в кольцевом буфере — и пишет снимок по событию.

      **Пример из мессенджера:** служебный порт отдаёт `/debug/pprof/trace?seconds=5` и `/debug/flight`, сводку печатает `scripts/trace-summary.sh`. Снимок по медленному запросу пишется не чаще раза в минуту.
    checklist:
      - "CPU-профиль — только время на процессоре; ожидание в нём не видно"
      - "трасса: очередь готовых (`-pprof=sched`), помощь разметке по горутинам, паузы на шкале"
      - "троттлинг квотой виден в `cpu.stat`, а не в Go"
      - "flight recorder — для редких событий"
      - "лечение — меньше параллельной работы (N), а не настройка сборщика"
    red_flags:
      - "«в профиле сборщик 0,7 %, значит, он ни при чём»"
      - "«процесс взял 41 % CPU, значит, процессора хватает»"
    follow_ups:
      - q: "Чем профиль block отличается от трассы при поиске ожидания?"
        a: "Block — накопленная статистика с выборкой (в мессенджере одно событие на 10 мкс ожидания) по каналам, `select`, мьютексам и `WaitGroup`; сеть, системные вызовы и очередь планировщика в него не входят. Трасса — журнал событий со временем и причиной каждого ожидания."

  - id: reading-cpu-profile
    lesson: 01-5-go-concurrency/10-profiling
    topic: Профилирование
    level: M+
    question: "Вы сняли CPU-профиль регистрации на ноутбуке: Argon2id — три четверти процессора. Стоит ли оптимизировать хеш? Как вы читаете `-top`?"
    answer: |
      **Тезис:** нет: профиль описывает код под конкретной нагрузкой. Профиль смешанной нагрузки мессенджера дал проверке JWT 35 % (одна `ed25519.Verify` — около 28 %), сериализации JSON — около 29 %, а Argon2id — около 13 %. Читать надо с `-top -cum`: найти первую функцию своего кода с большим `cum`, а `flat` смотреть внутри неё.

      **Почему:** `flat` — выборки, где функция на вершине стека, `cum` — где она где угодно в стеке. По `flat` на первых местах `Syscall6` (12 %) и `feMul` (10 %) — «сеть и какая-то математика». `cum` показал цепочку `Bearer.Authenticate` → `jwt.Verify`. Профиль — статистика: 1974 выборки за 20 с, доли в десятые процента — шум, а вызовов он не считает. Ноутбук — не продакшен: другая нагрузка, ядра, квота, данные. Только регистрации — 2,51 с процессора и Argon2id 75 %; смешанная нагрузка (2390 чтений в секунду) — 19,74 с и 13,4 %. И блок на флейм-графе — функция на одном пути, а строка `-top` — сумма по всем путям.

      **Компромисс:** около 0,1 мс на проверку подписи — цена stateless-токенов. Кэш проверок — это секреты в памяти и вопрос отзыва, решать его будут по профилю продакшена. А профиль с продакшена требует безопасного служебного порта.

      **Пример из мессенджера:** по профилю не стали ни оптимизировать хеш, ни включать PGO. Лаба дала −7,46 %, но профиль учебного стенда нерепрезентативен, и по документации такой профиль даёт «мало или никакого улучшения».
    checklist:
      - "`flat` против `cum`; начинать с `-top -cum` и своего кода"
      - "профиль — выборка 100 Гц: малые доли — шум, вызовы не считаются"
      - "профиль зависит от нагрузки: снимать с продакшена"
      - "флейм-граф: блок — один путь, строка `-top` — сумма по путям"
      - "в мессенджере аутентификация дороже хеша"
    red_flags:
      - "оптимизация по профилю синтетической нагрузки"
      - "«`flat` показывает, что дорого в моём коде»"
    follow_ups:
      - q: "Почему мессенджер не коммитит `default.pgo`, хотя PGO в лабе дал −7,46 %?"
        a: "Профиль для PGO должен описывать продакшен, а у нас только стенд. PGO появится вместе с профилями продакшена: слитыми с нескольких экземпляров и обновляемыми по расписанию (модуль 12)."

  - id: pprof-exposure
    lesson: 01-5-go-concurrency/10-profiling
    topic: Профилирование
    level: M+
    question: 'Коллега добавил в сервис `import _ "net/http/pprof"`. Чем это опасно и как правильно отдавать профили в продакшене?'
    answer: |
      **Тезис:** пустой импорт регистрирует обработчики в `http.DefaultServeMux`. Если сервер отдаёт его наружу, профили, командная строка и стеки доступны всем. Профили отдают на отдельном служебном слушателе: выключенном по умолчанию, не опубликованном наружу, с потолком длительности.

      **Почему:** `/debug/pprof/cmdline` отдаёт секреты из флагов, `goroutine?debug=2` — устройство кода и значения в аргументах. `profile?seconds=3600` занимает профилировщик на час: в Go 1.27.2 `pprof.Profile` сам продлевает дедлайн записи (`configureWriteDeadline`), а не отказывает, а второй CPU-профиль получит `cpu profiling already in use`. В мессенджере пустой `MESSENGER_DEBUG_ADDR` — порта нет. Обработчики регистрируются явно на своём `ServeMux` в `platform/debugserver`, `depguard` запрещает `net/http/pprof` в остальных пакетах, в compose порт привязан к `127.0.0.1`, `?seconds` больше 60 — `400` до вызова pprof. Основной порт на `/debug/pprof/` отвечает `401`, а с токеном — `404`.

      **Компромисс:** вместе с портом включаются профили mutex (1/100) и block (10 мкс) и flight recorder. По профилю это около 2 % процессора на трассировщик и 7,6 МиБ буферов, плюс до 16 МиБ на каждый запрос `/debug/flight`. Снаружи стенд цену не различил: шум прогонов ±20–50 %. Граница — сеть, а не роль в токене: одна ошибка в проверке роли открыла бы всё.

      **Пример из мессенджера:** решение записано в ADR-0013. В Kubernetes служебный порт не входит в `Service`, доступ закрывает `NetworkPolicy`, а оператор ходит через `kubectl port-forward`.
    checklist:
      - "пустой импорт регистрирует обработчики в `DefaultServeMux`"
      - "угрозы: `cmdline`, стеки, долгий профиль как отказ в обслуживании"
      - "отдельный слушатель, выключен по умолчанию, не публикуется наружу"
      - "свой потолок `seconds`: pprof сам продлевает дедлайн записи"
      - "профили ожидания — с выборкой, а не `rate = 1`"
    red_flags:
      - "pprof на основном порту «за аутентификацией admin»"
      - "`runtime.SetBlockProfileRate(1)` навсегда в продакшене"
    follow_ups:
      - q: "Сколько flight recorder'ов можно завести в одном процессе?"
        a: "Активен может быть только один. Поэтому в мессенджере его создаёт корень композиции, а остальные получают узкий порт с `WriteTo`."
