# Банк вопросов мини-интервью модуля 1 (урок 1.20).
# Схема — interview/schema.ts, проверки банка — interview/bank.test.ts.
# answer — Markdown (тезис → почему → компромисс → пример из мессенджера);
# checklist, red_flags и follow_ups — строчный Markdown: `код`, **жирный**.
# Ссылок в тексте нет: ссылку на урок строит компонент с учётом базового пути.
module: "01"
title: "Модуль 1. Сервис на Go"
questions:
  # 1.1
  - id: ports-at-consumer
    lesson: 01-go-service/01-architecture
    topic: Архитектура
    level: M+
    question: "Use case отправки сообщения должен проверить участников чата, а они лежат в Postgres. Как он получит данные, не завися от базы? И почему интерфейс репозитория нельзя положить рядом с его реализацией в `adapters/postgres`?"
    answer: |
      **Тезис:** use case объявляет у себя узкий порт — интерфейс вроде `ChatFinder` с одним методом — и получает реализацию через конструктор; Postgres-адаптер реализует этот интерфейс.

      **Почему:** так зависимость в исходном коде направлена внутрь (адаптер импортирует use case и домен), хотя вызов во время работы идёт наружу. Это и есть инверсия зависимостей. Если же интерфейс лежит в `adapters/postgres`, use case обязан импортировать этот пакет, а с ним и драйвер базы: стрелка смотрит наружу, тест use case'а начинает зависеть от Postgres-адаптера. Порт принадлежит тому, кто им пользуется, и содержит только нужные этому сценарию методы.

      **Компромисс:** лишний уровень косвенности и больше файлов. Для CLI-утилиты с одним источником данных это не окупается; раскладывать по слоям стоит, когда появляется второй источник данных или второй транспорт.

      **Пример из мессенджера:** порты объявлены в `chat/usecase`, реализация — в `chat/adapters/memory`, связывает их корень композиции. Направление стрелок проверяет `depguard` в `golangci-lint`: Go запрещает только циклы импорта, а не импорт «наружу».
    checklist:
      - "порт объявляет потребитель (use case), а не реализация"
      - "зависимость в коде внутрь, вызов во время работы наружу — инверсия зависимостей"
      - "узкий интерфейс под сценарий, реализация приходит через конструктор"
      - "конкретные типы создаёт только корень композиции (`main`)"
      - "правило проверяется автоматически (`depguard`), а не только на ревью"
    red_flags:
      - "«интерфейс кладут рядом с реализацией, так удобнее»"
      - "«Go запрещает циклы импорта, этого достаточно»"
      - "use case сам создаёт подключение к базе"
    follow_ups:
      - q: "Двум use case'ам нужны разные методы одного хранилища. Сколько интерфейсов объявлять?"
        a: "По одному у каждого потребителя, ровно с теми методами, которые он зовёт. Одна реализация удовлетворит оба: в Go интерфейсы реализуются неявно."
      - q: "Когда такая раскладка — лишняя?"
        a: "В маленькой утилите с одним источником данных и одним способом запуска. Слои добавят файлы, а заменять нечего."

  # 1.2
  - id: invariant-value-vs-aggregate
    lesson: 01-go-service/02-domain
    topic: Домен и ошибки
    level: M+
    question: "Правила «текст не длиннее 4096 символов» и «писать в чат может только участник» оба доменные. Почему первое живёт в объекте-значении, а второе — в агрегате? Что будет, если их перепутать?"
    answer: |
      **Тезис:** правило значения проверяется по самому значению при создании, а правило состояния — тем, кто это состояние держит.

      **Почему:** чтобы проверить длину, достаточно текста: `NewText` отвергает плохую строку, и невалидный `Text` создать нельзя. Чтобы проверить членство, нужен список участников конкретного чата — его держит агрегат `Chat`, и проверка стоит в `Post`, единственном способе добавить сообщение. Если правило членства вынести в обработчик или use case, второй транспорт (WebSocket, gRPC) его забудет. Если длину проверять в агрегате, тот же текст придётся перепроверять везде, где он появляется.

      **Компромисс:** больше типов и конструкторов вместо голых строк, зато гарантия «невалидный объект нельзя создать» держится компилятором и закрытыми полями. Слабое место Go — нулевое значение: `Text{}` создаётся из любого пакета, поэтому нужен `IsZero` или проверка на входе.

      **Пример из мессенджера:** длина считается в рунах через `utf8.RuneCountInString` — `len` считал бы байты и отверг бы 2049 кириллических букв. Нарушение длины — `ValidationError` и 400, нарушение членства — `ErrNotMember` и 403.
    checklist:
      - "правило значения — в конструкторе объекта-значения"
      - "правило, которому нужно состояние, — в методе агрегата"
      - "невалидный объект нельзя создать: закрытые поля и конструктор"
      - "разные ошибки: валидация (400) против нарушения правила (403)"
      - "длина в символах, а не в байтах"
    red_flags:
      - "все проверки в HTTP-обработчике"
      - "`len(s)` для длины в символах"
      - "агрегат отдаёт наружу свой срез без копии"
    follow_ups:
      - q: "Почему `Members()` возвращает `slices.Clone`, если поле и так закрыто?"
        a: "Срез — ссылка на массив. Вернув его, мы дали бы вызывающему писать в участников агрегата мимо методов и ломать сортировку, на которой держится поиск."
      - q: "В контексте chat свой `UserID`, хотя в user есть такой же. Это нарушение DRY?"
        a: "Нет: совпал код, а не знание. Общий тип склеил бы контексты; а вот формат UUID — общее знание, его вынесли в `kernel/ident`, когда появилась третья копия."

  # 1.3
  - id: errors-is-not-strings
    lesson: 01-go-service/03-errors
    topic: Домен и ошибки
    level: M+
    question: "Почему ошибки в Go различают через `errors.Is` и `errors.As`, а не сравнением текста? Что сломается, если use case обернёт ошибку через `%v`, а не `%w`?"
    answer: |
      **Тезис:** ошибка — значение, и различать её надо по значению или типу, а не по тексту сообщения.

      **Почему:** текст меняют ради читаемости, переводят, дополняют контекстом при обёртке — сравнение строк сломается молча. `%w` сохраняет цепочку, и `errors.Is` находит сигнальную ошибку (`ErrChatNotFound`) на любой глубине; `errors.As` достаёт ошибку с данными (`*ValidationError` с полем и причиной). `%v` вставляет только текст: цепочка обрывается, и адаптер вместо 404 ответит 500. Тест, проверяющий лишь `err != nil`, этого не заметит.

      **Компромисс:** обёрнутая через `%w` ошибка становится частью API пакета. Ошибку библиотеки (`pgx.ErrNoRows`) наружу не пропускают: адаптер переводит её в доменную, иначе use case начнёт зависеть от драйвера `pgx`. Иногда цепочку обрывают намеренно.

      **Пример из мессенджера:** сбой генератора id use case оборачивает без `%w`, чтобы `ValidationError` из разбора не превратился в 400 — клиент ни в чём не виноват, это 500. Правило «обработай или верни»: хранилище и use case только оборачивают, а лог пишет один адаптер.
    checklist:
      - "сигнальная ошибка — `errors.Is`, ошибка с данными — тип и `errors.As`"
      - "`%w` сохраняет цепочку, `%v` обрывает"
      - "ошибки библиотек переводятся в доменные на границе адаптера"
      - "обрыв цепочки бывает намеренным: кто виноват, а не где случилось"
      - "логирует один уровень, остальные оборачивают"
    red_flags:
      - "`strings.Contains(err.Error(), \"not found\")`"
      - "use case проверяет `pgx.ErrNoRows`"
      - "каждый уровень пишет ошибку в лог и возвращает её"
    follow_ups:
      - q: "Как `errors.Is(err, ErrInvalid)` даёт true для любой `*ValidationError`?"
        a: "У типа есть метод `Is(error) bool`, который отвечает true на `ErrInvalid`; `errors.Is` вызывает его на каждом узле. Сам метод не должен разворачивать цепочку — это делает `errors.Is`."
      - q: "Как проверить, что ошибка правильная, в тесте?"
        a: "Проверять `errors.Is`/`errors.As` на ожидаемую ошибку, а не `err != nil`. Линтер `errorlint` ловит сравнения через `==` и `%v` при обёртке."

  # 1.4
  - id: optimistic-locking-version
    lesson: 01-go-service/04-usecases
    topic: Конкурентность и context
    level: S
    question: "Два пользователя одновременно пишут в один чат, и в истории появились два сообщения с seq 5. Как это происходит и как вы это исправите, не запирая чат на время всего сценария?"
    answer: |
      **Тезис:** это потерянное обновление в схеме «прочитал — посчитал — записал»; лечится оптимистической блокировкой — версией агрегата, которую хранилище сверяет атомарно с записью.

      **Почему:** оба запроса прочитали чат с версией 4, оба посчитали следующий seq = 5 и оба записали. Use case передаёт ожидаемую версию в `AppendMessage`, и хранилище пишет, только если версия не изменилась, — иначе `ErrConcurrentUpdate`. Проигравший перечитывает чат и повторяет всю связку (`FindChat` → `Post` → запись), потому что правила агрегата проверялись на устаревшем состоянии.

      **Компромисс:** при горячем чате повторы тратят работу, поэтому попыток ограниченное число (`MaxSendAttempts = 3`), после чего клиент получает 409. Пессимистический замок (`sync.Mutex` на чат) проще, но не работает, когда экземпляров сервиса несколько, и держит всех в очереди.

      **Пример из мессенджера:** проверка версии и запись — под одним `Lock`; проверка под `RLock` с записью под отдельным `Lock` оставила бы окно гонки. Id и время сообщения берутся до цикла повторов, чтобы у сообщения был один id на все попытки. Хранилище держит снимок агрегата, а не указатель — иначе версия сравнивалась бы сама с собой.
    checklist:
      - "назван механизм: read-modify-write и потерянное обновление"
      - "версия сверяется атомарно с записью, в одной операции хранилища"
      - "повторяется вся связка, а не одна запись"
      - "ограничение числа попыток и ответ 409"
      - "почему не мьютекс: несколько экземпляров сервиса"
    red_flags:
      - "«поставим мьютекс в обработчик»"
      - "проверка версии и запись в разных критических секциях"
      - "«тест без конфликтов прошёл, значит гонки нет»"
    follow_ups:
      - q: "Что изменится, если генерировать id сообщения внутри цикла повторов?"
        a: "Каждая попытка станет новым сообщением. Пока проигравшая попытка ничего не пишет, вреда нет, но пропадёт постоянный id, на котором держится защита от повторов клиента."
      - q: "Как то же сделать в Postgres?"
        a: "`UPDATE ... SET version = version + 1 WHERE id = $1 AND version = $2` и проверить число затронутых строк, либо уникальный индекс на (chat_id, seq)."

  # 1.5
  - id: context-cancel-chain
    lesson: 01-go-service/05-context
    topic: Конкурентность и context
    level: S
    question: "Клиент закрыл соединение посреди запроса. Как отмена доходит от HTTP-сервера до хранилища, и почему сервер всё равно может работать на ушедшего клиента?"
    answer: |
      **Тезис:** сервер отменяет `r.Context()`, контекст передаётся первым аргументом через use case в хранилище, и каждый, кто может ждать, проверяет `ctx.Err()` или ждёт `ctx.Done()`. Отмена в Go кооперативная.

      **Почему:** контекст лишь сообщает об отмене, остановиться должен сам код. Вызов, который контекст не принимает, отмены не увидит и будет ждать до конца. Дедлайн потомка не может быть позже родительского: `WithTimeout(ctx, 5s)` внутри запроса с секундным сроком проживёт не дольше секунды.

      **Компромисс:** проверка в каждом методе — шум, но без неё работа на ушедшего клиента продолжается. Работа, которая должна пережить запрос (аудит, отправка уведомления), берёт `context.WithoutCancel`: он сохраняет значения, но не отмену, — плюс свой срок и владельца горутины.

      **Пример из мессенджера:** use case проверяет контекст перед каждым повтором, хранилище — на входе. Начатая под замком запись в памяти не прерывается, чтобы не оставить карты несогласованными: гарантия звучит как «отменённый до вызова хранилища запрос ничего не пишет». Таймаут запроса ставит middleware `Timeout`, а `WriteTimeout` сервера не останавливает обработчик, который игнорирует контекст.
    checklist:
      - "`ctx` первым аргументом по всей цепочке"
      - "отмена кооперативная: код сам проверяет `ctx.Err()`/`ctx.Done()`"
      - "дедлайн потомка не позже родителя"
      - "фоновая работа — `WithoutCancel` плюс свой срок и владелец горутины"
      - "`context.Canceled` от ушедшего клиента — не ошибка сервера"
    red_flags:
      - "контекст хранится в поле структуры"
      - "`go audit.Record(r.Context(), ev)`"
      - "«отмена контекста убивает горутину»"
    follow_ups:
      - q: "Обработчик зовёт библиотеку без context, она висит 40 с. Таймаут запроса 10 с, `WriteTimeout` 15 с. Что увидит клиент?"
        a: "Через 10 с отменится контекст, но обработчик его не смотрит. `WriteTimeout` лишь ставит дедлайн записи и обработчик не останавливает. Через 40 с запись провалится, клиент увидит обрыв, а не 503."
      - q: "Как прервать блокирующий вызов, который не принимает context?"
        a: "Связать отмену с операцией вручную, например `context.AfterFunc`, который закроет соединение и прервёт чтение."

  # 1.6
  - id: fake-vs-mock-contract
    lesson: 01-go-service/06-tests
    topic: Тесты
    level: M+
    question: "Тесты use case'а на моках хранилища зелёные, а в проде в истории дубли seq. Что не так с такими тестами и как построить тесты, которые это ловят?"
    answer: |
      **Тезис:** мок проверяет ожидания автора теста, а не поведение хранилища; use case тестируют на фейке, а одинаковость фейка и настоящей реализации доказывает контрактный тест порта.

      **Почему:** мок, запрограммированный отвечать «успешно» на любую запись, никогда не вернёт конфликт версии, и логика повторов не проверена. Фейк — рабочая упрощённая реализация (хранилище в памяти), он ведёт себя как настоящий. Контрактный тест — одна батарея проверок, которую проходят все реализации порта; проверка «устаревшая версия → `ErrConcurrentUpdate`» уронит хранилище без проверки версии.

      **Компромисс:** фейк надо писать и поддерживать, и он может разойтись с настоящей базой — отсюда контракт. Моки уместны для редких сбоев, которые фейк воспроизвести не может, и для проверки взаимодействия на границе.

      **Пример из мессенджера:** `memory.Store` — фейк, `storetest.Run` — контракт, каждая проверка получает своё хранилище через `newStore(t)`, потому что идут параллельно. Гонки данных ловит `-race`, а логическую гонку «проверил под RLock — записал под Lock» — только проверка результата под нагрузкой.
    checklist:
      - "мок проверяет сценарий автора, фейк — поведение"
      - "контрактный тест: одна батарея для всех реализаций порта"
      - "домен и use case тестируются без БД и сети"
      - "`-race` ловит гонки данных, но не логические гонки"
      - "изоляция параллельных проверок: своё состояние у каждой"
    red_flags:
      - "«покрытие 100 %, значит всё проверено»"
      - "мок на каждый вызов с проверкой порядка вызовов"
      - "«`-race` нашёл бы любую гонку»"
    follow_ups:
      - q: "Без `-race` тест прошёл 100 раз, с ним упал с первого. Как?"
        a: "Детектору достаточно двух несинхронизированных обращений к памяти, одно из которых запись. Обычный прогон заметит гонку, только если она дала видимую ошибку."
      - q: "Нужен ли тест на геттер `ID()`?"
        a: "Нет: его проверяет любой тест, который сравнивает id. Отдельный тест удвоит код и ничего нового не поймает."

  # 1.7
  - id: thin-http-adapter
    lesson: 01-go-service/07-http-adapter
    topic: HTTP и REST
    level: M+
    question: "Что значит «тонкий HTTP-обработчик»? Где проходит граница между тем, что он проверяет сам, и тем, что делает use case, и как ошибка use case'а становится HTTP-статусом?"
    answer: |
      **Тезис:** обработчик — ведущий адаптер с тремя шагами: разобрать запрос, вызвать use case с `r.Context()`, смаппить результат или ошибку в ответ. Бизнес-правил в нём нет.

      **Почему:** любое правило, которое имело бы смысл для WebSocket или gRPC, иначе пришлось бы писать в каждом транспорте. Обработчик проверяет только HTTP: тело — JSON нужного типа, не больше лимита, без неизвестных полей (защита от mass assignment). DTO с тегами `json` живут в адаптере, домен о формате провода не знает, а маппер переводит явно.

      **Компромисс:** DTO и мапперы — лишний код рядом с доменными типами, зато переименование в домене не ломает клиентов и внутреннее (версия агрегата) не утекает в API.

      **Пример из мессенджера:** таблица ошибок — одно место: `ValidationError` → 400, `ErrNotFound` → 404, `ErrNotMember` → 403, `ErrConcurrentUpdate` → 409, дедлайн → 503, всё остальное → 500 с общим текстом и деталями в лог. 4xx — виноват клиент, 5xx — мы, и по 5xx будят дежурного. Ушедшему клиенту не отвечают и пишут в лог на уровне Info. Пустую историю маппер отдаёт как `[]`, а не `null`.
    checklist:
      - "разобрать → вызвать → смаппить; правил в адаптере нет"
      - "проверки HTTP-уровня: тип тела, размер, неизвестные поля"
      - "DTO и маппер, домен без тегов `json`"
      - "единая таблица ошибок, 4xx против 5xx по виновнику"
      - "детали 500 — только в лог"
    red_flags:
      - "обработчик проверяет длину текста или членство"
      - "отдаёт доменную структуру с тегами `json`"
      - "текст ошибки драйвера уходит клиенту"
    follow_ups:
      - q: "Почему корень композиции — `run() error`, а не код в `main` с `os.Exit(1)`?"
        a: "`os.Exit` не выполняет `defer`. В `run` ошибка возвращается обычным путём, отложенная уборка отрабатывает, и только `main` выходит с кодом 1."
      - q: "Почему 401, а не 400, если заголовок личности — не UUID?"
        a: "Это «не знаю, кто вы», и клиент должен заново войти, а не править форму. Обработчик разбирает личность до вызова use case."

  # 1.8 (1)
  - id: post-retry-semantics
    lesson: 01-go-service/08-resources
    topic: HTTP и REST
    level: M+
    question: "Соединение оборвалось до ответа. Почему HTTP-клиент может сам повторить `GET`, но не `POST`? Что из этого следует для дизайна API?"
    answer: |
      **Тезис:** методы HTTP различаются свойствами: безопасный метод ничего не меняет, идемпотентный даёт тот же эффект при повторе. `GET` безопасен и идемпотентен, `POST` — ни то ни другое.

      **Почему:** RFC 9110: клиент не должен (SHOULD NOT) автоматически повторять неидемпотентный запрос, если не знает, что повтор безопасен: два `POST` могут создать два сообщения. `PUT` и `DELETE` идемпотентны по определению — важен эффект, а не число вызовов, хотя ответы могут различаться (второй `DELETE` получит 404).

      **Компромисс:** раз сеть теряет ответы всегда, API, где создание — это `POST`, должен сам сделать его безопасным для повтора: естественным ключом или заголовком `Idempotency-Key`. Это стоит хранения ключей и усложняет сервер, но иначе мобильный клиент в метро плодит дубли.

      **Пример из мессенджера:** ресурсы — существительные (`/v1/chats/{id}/messages`), действие — метод. Коды статуса — часть контракта: 201 на создание, 200 на повтор существующего личного чата. Новое необязательное поле в ответе совместимо при терпимом читателе, а версия API — в пути `/v1`.
    checklist:
      - "безопасность и идемпотентность методов, разница между ними"
      - "клиент не повторяет неидемпотентный запрос сам"
      - "идемпотентность — про эффект на сервере, не про одинаковый ответ"
      - "вывод: `POST` создания нужно сделать идемпотентным ключом"
    red_flags:
      - "«POST идемпотентен, если сервер написан аккуратно»"
      - "«PUT и POST — одно и то же»"
      - "глаголы в путях вместо методов"
    follow_ups:
      - q: "Добавили в ответ поле `last_message_at`. Это ломающее изменение?"
        a: "Нет, если клиенты игнорируют незнакомые поля (терпимый читатель). Удаление поля из запроса при строгом разборе уже ломает старых клиентов."

  # 1.8 (2)
  - id: auth-before-router
    lesson: 01-go-service/08-resources
    topic: HTTP и REST
    level: S
    question: "`GET /v1/nope` без токена получает 401, а с токеном — 404. Это баг? Объясните, как устроен конвейер middleware и почему порядок важен."
    answer: |
      **Тезис:** не баг, а следствие порядка: аутентификация стоит до маршрутизатора, поэтому аноним получает 401 на любой путь.

      **Почему:** middleware — матрёшка: каждый слой оборачивает следующий, и порядок определяет, что видит каждый. Снаружи — `RequestID`: идентификатор нужен любому ответу, включая 401 и 404. Затем журнал доступа, внутри него перехват паники, чтобы журнал увидел обычный ответ 500, потом аутентификация и только потом маршрутизатор. Аноним не может перебором путей узнать, какие маршруты существуют.

      **Компромисс:** middleware не знает, какой шаблон выбрал бы `ServeMux`, поэтому открытые маршруты (выдача токена) перечисляются явным коротким списком «метод путь», а всё остальное закрыто по умолчанию. Личность от middleware к обработчику идёт через context — другого канала сквозь `http.Handler` нет, — а от обработчика в use case явным полем команды: так зависимость видна в сигнатуре и одинаково заполняется из HTTP, gRPC или фоновой задачи.

      **Пример из мессенджера:** ошибки маршрутизации (404, 405) тоже отдаются в общем формате; обёртка `RouteErrors` для найденного маршрута зовёт `mux.ServeHTTP`, иначе пропали бы `r.Pattern` и параметры пути.
    checklist:
      - "middleware как матрёшка, порядок определяет поведение"
      - "аутентификация до маршрутизатора — аноним не перечисляет пути"
      - "открытые маршруты — явный короткий список, остальное закрыто"
      - "личность: context до обработчика, явное поле команды дальше"
    red_flags:
      - "«надо поменять порядок, чтобы 404 было честным»"
      - "use case достаёт пользователя из context"
      - "открытость маршрута решает каждый обработчик сам"
    follow_ups:
      - q: "Почему перехват паники стоит внутри журнала доступа, а не снаружи?"
        a: "Паника останавливается на `Recover`, он пишет 500, и журнал на пути наружу видит обычный ответ. Будь `Recover` снаружи, паника пролетела бы мимо журнала, и строки о запросе не осталось бы."
      - q: "Что ответит сервер на `POST /v1/tokens` без токена?"
        a: "Дойдёт до обработчика входа: маршрут в списке открытых. Получить токен можно только без токена."

  # 1.9 (1)
  - id: contract-first-vs-code-first
    lesson: 01-go-service/09-contract-first
    topic: Контракт
    level: M+
    question: "Contract-first или code-first: что вы выберете для публичного API и почему? Что именно в вашем подходе гарантирует, что сервер выполняет описание?"
    answer: |
      **Тезис:** для API, которым пользуются чужие клиенты, — contract-first: контракт OpenAPI пишется и ревьюится первым, он источник правды, а код подстраивается под него.

      **Почему:** при code-first описание — следствие кода и честно отражает случайные изменения: переименовали поле в Go — сломали клиентов, и описание это «задокументировало». Contract-first делает изменение API явным шагом с ревью. Из контракта генерируют типы сервера и клиентов, поэтому они не расходятся.

      **Компромисс:** нужен генератор, его версия и правила; сгенерированный код громоздкий. Главное же — не название подхода, а ответ на вопрос «что проверяет, что сервер выполняет описание?». Code-first с проверкой ломающих изменений в CI защищает от многого, а contract-first без проверки — просто документация.

      **Пример из мессенджера:** `oapi-codegen` генерирует `ServerInterface` и типы по пакету на контекст, чтобы граница контекстов сохранилась. Входы проверяет компилятор, ответы — контрактный тест через kin-openapi со строгим статусом. Ограничения в контракте — документация для клиентов, решает домен.
    checklist:
      - "контракт — источник правды, изменение API начинается с него"
      - "генерация кода из контракта: сервер и клиенты не расходятся"
      - "нужна проверка соответствия, иначе это просто документ"
      - "цена: генератор, громоздкий код, дисциплина"
    red_flags:
      - "«Swagger сгенерируется из кода — это и есть контракт»"
      - "«раз есть генерация, проверять ответы не нужно»"
    follow_ups:
      - q: "Зачем по пакету `gen` на контекст, если `ErrorResponse` сгенерируется дважды?"
        a: "Общий пакет открыл бы адаптеру чатов DTO пользователей в обход портов. Знание записано один раз — в контракте, Go-типы лишь его проекции."

  # 1.9 (2)
  - id: compiler-vs-contract-test
    lesson: 01-go-service/09-contract-first
    topic: Контракт
    level: S
    question: "Коллега предлагает удалить контрактные тесты: «у нас генерация из OpenAPI, компилятор всё проверит». Прав ли он? Что компилятор ловит, а что нет?"
    answer: |
      **Тезис:** нет. Компилятор проверяет то, что обработчик получает из контракта, но не то, что он отдаёт.

      **Почему:** параметры пути, поля тела запроса и набор операций пришли в Go-типах и сигнатуре `ServerInterface` — забытая операция или опечатка в поле не соберётся. Ответ же обработчик пишет сам через `http.ResponseWriter` и функцию с `v any`: поле не того типа, лишнее поле или недокументированный статус компилятор не видит. Это ловит только проверка настоящего ответа по схеме.

      **Компромисс:** режим `strict-server` проверяет и ответы типами, но меняет форму обработчиков и усложняет работу с потоками и заголовками. Мы выбрали обычный режим плюс контрактный тест. У kin-openapi по умолчанию неописанный статус считается допустимым, поэтому флаг `IncludeResponseStatus` включён — каждый статус есть обещание клиенту.

      **Пример из мессенджера:** так нашёлся тест, который проверял 404 у регистрации — такого ответа в контракте не было. Ограничения тел запросов вроде `maxLength` контрактный тест не проверяет: решает домен, и расхождение — ошибка документации.
    checklist:
      - "компилятор проверяет входы: параметры, тела запросов, набор операций"
      - "ответы пишутся через `any` — их проверяет только тест по схеме"
      - "неописанный статус должен быть ошибкой (строгий режим)"
      - "альтернатива `strict-server` и её цена"
    red_flags:
      - "«генерация = гарантия соответствия»"
      - "тесты сравнивают ответ с захардкоженным JSON вместо схемы"
    follow_ups:
      - q: "Хотим добавить в `Message` поле `edited_at`. В каком порядке?"
        a: "Контракт → `go generate` → маппер и тест. Начать с маппера не выйдет: поля нет в сгенерированном типе, а ответ через map уронит контрактный тест."

  # 1.10 (1)
  - id: problem-details-detail
    lesson: 01-go-service/10-problem-details
    topic: Ошибки API
    level: M+
    question: "Вы вводите единый формат ошибок по RFC 9457. Какие поля в нём есть, что вы добавите своего и что ни в коем случае нельзя писать в `detail`?"
    answer: |
      **Тезис:** формат `application/problem+json` с полями `type`, `title`, `status`, `detail`, `instance`; свои расширения — короткий машинный `code`, `request_id` для поддержки и `invalid_params` для полей формы.

      **Почему:** у всех ошибок API — от валидации до паники и ошибок маршрутизации — один формат, и клиент пишет обработку один раз. `status` в теле нужен, потому что тело уходит в логи и письма, где строки статуса нет, а прокси может её подменить. В `detail` — только то, что помогает клиенту исправить запрос.

      **Компромисс:** `code` формально дублирует `type`, но `type` — длинный URI, привязанный к документации, а `code` удобен в `switch`, метриках и журналах; разойтись они не могут, так как `type` строится из `code`. Реестр кодов — часть контракта.

      **Пример из мессенджера:** нельзя писать в `detail` текст ошибки драйвера, SQL, имена таблиц, пути и стеки, имена Go-типов и сведения о чужих ресурсах — это OWASP API8:2023. Дедлайн — 503, а не 504: 504 — ответ шлюза, а мессенджер — конечный сервер.
    checklist:
      - "поля RFC 9457 и `application/problem+json`"
      - "один формат для всех источников ошибок"
      - "расширения: `code`, `request_id`, `invalid_params`"
      - "в `detail` только то, что помогает исправить запрос"
      - "внутренности — в журнал под `request_id`"
    red_flags:
      - "стек вызовов или текст ошибки БД в ответе"
      - "клиент ветвится по тексту `detail`"
      - "разные форматы ошибок у разных обработчиков"
    follow_ups:
      - q: "Почему наш истёкший дедлайн — 503, а не 504?"
        a: "504 по RFC 9110 — шлюз не дождался вышестоящего сервера. Мы сами сервер; 503 говорит «временно не могу, повторите»."
      - q: "Список кодов записан и в Go, и в контракте. Это не нарушение DRY?"
        a: "Знание одно, но генерировать одно из другого нельзя; поэтому тест сверяет оба списка и падает при расхождении."

  # 1.10 (2)
  - id: forbidden-vs-not-found
    lesson: 01-go-service/10-problem-details
    topic: Ошибки API
    level: S
    question: "Посторонний запрашивает чужой чат. Отвечать 403 или 404? Какие соображения вы взвесите и что делает мессенджер?"
    answer: |
      **Тезис:** 403 честнее и удобнее для отладки, 404 скрывает само существование ресурса. Выбор зависит от того, можно ли перебором найти чужие идентификаторы и опасно ли знание о существовании.

      **Почему:** если не-участник получает 403 `not_member`, а несуществующий чат — 404, по разнице ответов посторонний узнаёт, что чат с таким id есть. Это утечка сведений о чужих ресурсах. GitHub на чужой приватный репозиторий отвечает 404 именно поэтому.

      **Компромисс:** 404 для всего мешает честному пользователю: «чат удалили или меня исключили?» — и усложняет поддержку. Если id угадываемые (автоинкремент), утечка реальна и выбор в пользу 404; если id случайные, перебор бесполезен.

      **Пример из мессенджера:** сейчас 403 для не-участника и 404 для несуществующего чата. Спасают UUIDv7 с 74 случайными битами: перебором чужой чат не найти. Решение записано как осознанное и будет пересмотрено при разборе OWASP API Top 10.
    checklist:
      - "разница ответов — канал утечки существования ресурса"
      - "угадываемость id определяет риск"
      - "цена 404 для честного пользователя и поддержки"
      - "решение записано и обосновано, а не случайно"
    red_flags:
      - "«403 всегда правильнее, так в RFC»"
      - "не видит утечки в разнице ответов"
    follow_ups:
      - q: "Где ещё возникает такая же утечка?"
        a: "Во входе: разные ответы на «нет пользователя» и «не тот пароль», а также разное время ответа. Это перечисление пользователей."

  # 1.11 (1)
  - id: offset-vs-keyset
    lesson: 01-go-service/11-pagination
    topic: Пагинация
    level: M+
    question: "Почему для истории чата не подходит `?page=3&size=50`? Чем keyset лучше offset и чем за это платят?"
    answer: |
      **Тезис:** offset ломается на изменяемом списке и дорожает с глубиной; keyset — «дай записи после последнего показанного ключа» — стабилен и стоит одинаково на любой странице.

      **Почему:** пока пользователь читает страницу, приходят новые сообщения, и «пропусти 50» сдвигается: на следующей странице он увидит дубли, а при удалении — пропуски. `OFFSET 999950` заставляет базу прочитать и отбросить почти миллион строк. Keyset опирается на индекс: `WHERE seq < $last ORDER BY seq DESC LIMIT 50` читает 50 строк независимо от глубины.

      **Компромисс:** нельзя прыгнуть на «страницу 20 000» и показать номера страниц; нужен строгий порядок — ключ из нескольких полей, если основное поле не уникально (`last_activity_at`, затем `id`). Чат, который «всплыл» выше курсора, не попадёт в текущее листание — его доставит реальное время.

      **Пример из мессенджера:** история листается по `seq` от новых к старым, список чатов — по паре (активность, id). Сервер просит у хранилища `limit+1` записей, чтобы узнать, есть ли продолжение, без `COUNT(*)`; конец списка — `next_cursor: null`.
    checklist:
      - "дубли и пропуски у offset при вставках и удалениях"
      - "стоимость offset растёт с глубиной, keyset — константа по индексу"
      - "строгий порядок: составной ключ при неуникальном поле"
      - "`limit+1` вместо `COUNT`"
      - "цена: нет произвольного перехода на страницу N"
    red_flags:
      - "«offset нормально, просто кешируем страницы»"
      - "сортировка по неуникальному полю без тай-брейкера"
    follow_ups:
      - q: "Три чата с одинаковым временем, страница — 2. Что во второй странице?"
        a: "Ровно третий чат: курсор несёт время и id второго, сравнение идёт по паре. Без id «строго меньше» потеряло бы третий, «меньше или равно» повторило бы два."

  # 1.11 (2)
  - id: opaque-cursor
    lesson: 01-go-service/11-pagination
    topic: Пагинация
    level: S
    question: "Коллега предлагает вместо base64-курсора отдавать `?before_seq=951`: «ключ же одно число». Что вы ответите? Нужно ли курсор подписывать?"
    answer: |
      **Тезис:** курсор должен быть непрозрачным: клиент передаёт его обратно и не строит сам.

      **Почему:** голый ключ становится частью контракта: клиенты начнут вычислять `before_seq = last − 50`, и любое изменение — составной ключ, другой порядок, шардирование с позицией в каждом шарде — их сломает. Непрозрачный курсор оставляет серверу свободу менять содержимое. Ещё он несёт версию формата (старый курсор после смены формата даёт понятный отказ) и привязку к списку — курсор чата A не открывает чат B.

      **Компромисс:** курсор можно прочитать и собрать заново — это base64 от JSON. Подписывать его нужно, только если он несёт то, что клиенту нельзя видеть или менять: фильтры прав, внутренние идентификаторы. Подделка нашего курсора даёт лишь другую позицию в чате, куда у клиента и так есть доступ, потому что сервер заново проверяет членство и вид списка.

      **Пример из мессенджера:** в курсоре — версия, вид списка, id чата и `seq`; сервер проверяет каждое поле и отвечает 400 на чужой или испорченный курсор.
    checklist:
      - "клиент не вычисляет ключ — свобода менять формат"
      - "версия формата и привязка к списку внутри курсора"
      - "всё из курсора сервер проверяет заново (права, вид списка)"
      - "подпись нужна, только если в курсоре есть секретное или права"
    red_flags:
      - "«base64 защищает курсор от подделки»"
      - "права доступа выводятся из содержимого курсора"
    follow_ups:
      - q: "Что увидит пользователь, если в чат с третьей страницы списка пришло сообщение?"
        a: "Чат всплывёт выше курсора и не попадёт в текущее листание; повториться не может, активность только растёт. Клиент поднимет его сам по доставке в реальном времени."

  # 1.12 (1)
  - id: retry-without-duplicates
    lesson: 01-go-service/12-idempotency
    topic: Идемпотентность
    level: M+
    question: "Мобильный клиент отправил сообщение, получил таймаут и повторил запрос — у собеседника два одинаковых сообщения. Как это исправить? Почему не годится «перед повтором проверить историю через GET»?"
    answer: |
      **Тезис:** клиент генерирует id сообщения (`client_message_id`) один раз и шлёт его со всеми попытками; сервер атомарно проверяет уникальность и записывает. Повтор получает уже сохранённое сообщение.

      **Почему:** доставка в сети — «как минимум один раз»: ответ может потеряться после успешной записи, и клиент не отличит это от неудачи. Проверка через `GET` — та же ошибка «проверить, затем действовать», только на клиенте: первый запрос может сохраниться уже после того, как `GET` его не нашёл. К тому же искать не по чему — «ок» можно отправить дважды намеренно.

      **Компромисс:** ключ — обещание конкретного клиента, поэтому уникален в тройке (чат, автор, `client_message_id`), а не глобально: иначе чужой ключ позволил бы получить чужое сообщение. Клиенту надо хранить ключ до подтверждения.

      **Пример из мессенджера:** повтор отвечает 200 с тем же сообщением, первая отправка — 201. Проверка и запись — одна операция хранилища под одним замком, поэтому падение процесса не оставляет промежуточного состояния.
    checklist:
      - "повторы неизбежны: ответ теряется после записи"
      - "ключ генерирует клиент и шлёт со всеми попытками"
      - "проверка и запись — одна атомарная операция на сервере"
      - "область ключа: автор и чат, а не глобально"
    red_flags:
      - "«отключим повторы на клиенте»"
      - "дедупликация по тексту и времени"
      - "проверка «есть ли уже» отдельным запросом перед записью"
    follow_ups:
      - q: "Почему повтор отвечает 200, а не 201?"
        a: "Use case знает, что ничего не создал: сообщение уже было. 201 Created был бы неправдой."

  # 1.12 (2)
  - id: idempotency-key-header
    lesson: 01-go-service/12-idempotency
    topic: Идемпотентность
    level: S
    question: "У создания группы нет естественного ключа. Как устроить `Idempotency-Key` на сервере, и что будет, если процесс упадёт между созданием группы и сохранением ответа?"
    answer: |
      **Тезис:** middleware хранит по ключу (в области пользователя) отпечаток запроса и ответ первой попытки; повтор получает тот же ответ байт в байт с пометкой `Idempotent-Replayed: true`.

      **Почему:** у записи два состояния. Пока первая попытка выполняется — «в работе», и параллельный повтор сразу получает 409 `idempotency_in_progress`: ждать значило бы держать горутины. Готово — сохранены статус, тело, `Content-Type` и `Location`. Тот же ключ с другим отпечатком (метод, путь, тип тела, тело) — 422 `idempotency_key_reused`. 5xx освобождает ключ, а 4xx — окончательный ответ. Ключи живут сутки, и эта политика опубликована в контракте.

      **Компромисс:** это три отдельные операции — занять ключ, создать группу, сохранить ответ — в разных хранилищах без общей транзакции. Падение между созданием и сохранением оставит ключ «в работе», а после его истечения повтор создаст вторую группу; у нас ключи в памяти, и перезапуск теряет их все. Закрывается это хранением ключей в той же базе и атомарными фазами в одной транзакции (модуль 2a).

      **Пример из мессенджера:** для сообщений выбран естественный ключ именно потому, что он атомарен уже сейчас; `Idempotency-Key` — для создания групп. Ограничение записано в ADR-0005.
    checklist:
      - "ключ в области пользователя плюс отпечаток запроса"
      - "состояния «в работе» и «готово»; 409 на параллельный повтор"
      - "повтор отдаёт сохранённый ответ, а не пересчитанный"
      - "другой отпечаток с тем же ключом — 422"
      - "окно неатомарности и как его закрывают (одна транзакция)"
    red_flags:
      - "повтор ждёт завершения первой попытки"
      - "«ключи в памяти — и так надёжно»"
      - "ключ глобальный, без пользователя"
    follow_ups:
      - q: "Клиент исправил запрос после 415 и повторил с тем же ключом. Что получит?"
        a: "422: у исправленного запроса другой отпечаток. Исправил запрос — бери новый ключ."
      - q: "Почему Stripe сохраняет даже ответ 500?"
        a: "Stripe не знает, что успело выполниться до сбоя (деньги могли уйти), и повтор опаснее. Мы освобождаем ключ, потому что 5xx у нас возникает до записи — это допущение, строгим оно станет с транзакцией."

  # 1.13 (1)
  - id: password-hashing-argon2id
    lesson: 01-go-service/13-passwords
    topic: Безопасность
    level: M+
    question: "Как вы будете хранить пароли? Почему не SHA-256 с солью, и как поменять параметры хеширования, когда пользователи уже зарегистрированы?"
    answer: |
      **Тезис:** только специальной функцией хеширования паролей — Argon2id с солью и параметрами памяти, итераций и параллелизма.

      **Почему:** база утечёт — вопрос времени. SHA-256 быстрый: видеокарта перебирает миллиарды кандидатов в секунду. Соль делает хеш каждой записи уникальным и убивает заранее посчитанные таблицы, но не замедляет перебор одной записи. Argon2id медленный и memory-hard: каждому вычислению нужны десятки мебибайт, и тысячи параллельных вычислителей видеокарты упираются в память.

      **Компромисс:** каждая проверка стоит серверу процессор и память (у нас около 17 мс), поэтому вход нужно ограничивать по частоте, иначе медленный хеш становится вектором отказа в обслуживании. Шифровать пароли нельзя: ключ утечёт вместе с базой.

      **Пример из мессенджера:** хеш хранится в формате PHC — алгоритм, параметры и соль записаны в самом хеше, поэтому `Verify` проверяет старые хеши по старым параметрам. Перехешировать можно только при успешном входе, когда пароль снова у сервера. Политика по NIST SP 800-63B-4: длина от 15 символов, без правил состава и принудительной смены.
    checklist:
      - "специальная функция (Argon2id), а не быстрый хеш"
      - "зачем соль и чего она не даёт"
      - "memory-hard против параллелизма видеокарт"
      - "параметры внутри хеша (PHC) и перехеширование при входе"
      - "цена проверки и ограничение частоты"
    red_flags:
      - "«шифруем пароль AES»"
      - "MD5/SHA-1/SHA-256 с солью «достаточно»"
      - "правила вида «цифра, заглавная, спецсимвол»"
    follow_ups:
      - q: "Соль должна быть секретной?"
        a: "Нет: её работа — уникальность. Секрет-«перец» — отдельная мера с ключом вне базы."

  # 1.13 (2)
  - id: login-user-enumeration
    lesson: 01-go-service/13-passwords
    topic: Безопасность
    level: S
    question: "Форма входа отвечает одинаковым текстом и на неверный пароль, и на несуществующего пользователя. Можно ли всё равно узнать, какие имена зарегистрированы? Как это закрыть?"
    answer: |
      **Тезис:** можно — по времени ответа. Закрывается фиктивным хешем: каждый отказ стоит ровно одну проверку хеша.

      **Почему:** наивный код для несуществующего имени отвечает сразу, а для существующего сначала считает Argon2id — разница в 17 мс видна даже через интернет, если повторить запрос сотню раз и усреднить шум. Это атака по времени. При старте `Login` один раз хеширует бесполезный пароль теми же параметрами и, когда пользователя нет, вызывает `Verify` против него. Секреты сравнивают функцией с постоянным временем.

      **Компромисс:** регистрация всё равно обязана сказать «имя занято» — эта утечка неизбежна, её делают дорогой ограничением частоты и CAPTCHA. Важно, чтобы вход не добавлял к ней вторую, бесплатную и без следов.

      **Пример из мессенджера:** одна доменная ошибка `ErrInvalidCredentials` и один код `invalid_credentials`; настоящая причина обёрнута внутрь и уходит в журнал под `request_id`. Профиль без учётных данных (окно неатомарности регистрации) тоже идёт через `reject` с фиктивным хешем, а не через 500.
    checklist:
      - "одинаковый текст ответа — необходимое, но не достаточное условие"
      - "канал времени ответа и усреднение шума"
      - "фиктивный хеш теми же параметрами"
      - "причина — в журнал, клиенту — общий отказ"
      - "регистрация — неизбежная утечка, её делают дорогой"
    red_flags:
      - "«добавим случайную задержку» как единственная мера"
      - "500 на пользователя без пароля"
    follow_ups:
      - q: "Почему фиктивный хеш считается тем же хешером при старте, а не захардкожен?"
        a: "Чтобы при смене параметров его стоимость менялась вместе с настоящими хешами, и время отказа оставалось одинаковым."

  # 1.14 (1)
  - id: jwt-verification
    lesson: 01-go-service/14-jwt
    topic: Безопасность
    level: S
    question: "Что вы обязательно проверяете при приёме JWT и в каком порядке? Какие известные атаки это закрывает?"
    answer: |
      **Тезис:** приложение само задаёт допустимые алгоритмы, ищет ключ по `kid` в своём списке, проверяет подпись и только потом claims: `exp` (обязателен), `nbf`/`iat`, `iss`, `aud`, непустой `sub`.

      **Почему:** поле `alg` пишет автор токена, возможно атакующий. Библиотека, которая ему верит, пропустит `alg: none` или даст путаницу алгоритмов — подпись HS256 открытым ключом RS256 в роли секрета. RFC 8725 требует белый список алгоритмов. `kid` — тоже ввод: поиск ключа по пути или SQL-конкатенацией даёт инъекцию. Без проверки `aud` токен «для платежей» откроет мессенджер. Пока подпись не проверена, claims — просто текст от неизвестного автора.

      **Компромисс:** допуск на расхождение часов (`Leeway`) нужен, но расширяет окно жизни токена. Короткий срок жизни заменяет отзыв: проверка без хранилища, зато заблокированный пользователь работает до `exp`.

      **Пример из мессенджера:** список алгоритмов из одного `EdDSA`, `kid` — ключ в словаре, заполненном при старте, допуск 30 с, срок жизни 15 минут. Каждая атака — отдельный тест.
    checklist:
      - "белый список алгоритмов, не верить `alg` из токена"
      - "подпись до claims"
      - "`exp` обязателен, допуск на часы"
      - "`aud` и `iss` — токен выпущен для нас"
      - "`kid` — недоверенный ввод"
    red_flags:
      - "декодирует payload и верит ему без проверки подписи"
      - "«JWT зашифрован, значит его нельзя подделать»"
    follow_ups:
      - q: "Коллега предлагает зашифровать JWT, «чтобы не подделали». Что не так?"
        a: "Подделку предотвращает подпись. Шифрование (JWE) скрывает содержимое — другая задача; секретов в токене быть не должно."

  # 1.14 (2)
  - id: jwt-asymmetric-and-revocation
    lesson: 01-go-service/14-jwt
    topic: Безопасность
    level: M+
    question: "Токен проверяют шлюз и пять сервисов. Почему не подпись HMAC? И что делать, если пользователя заблокировали, а его токен ещё действует?"
    answer: |
      **Тезис:** при многих проверяющих — асимметричная подпись (Ed25519): подписывает только сервис выдачи закрытым ключом, остальные проверяют открытым. Отзыв — коротким сроком жизни плюс отдельным механизмом, если нужен мгновенный отказ.

      **Почему:** у HMAC один ключ и для подписи, и для проверки. Раздав его шестерым, мы дали каждому право выпускать токены, и утечка из любого — подделка для всех. Открытым ключом подписать нельзя.

      **Компромисс:** самодостаточный токен проверяется без похода в хранилище — это и масштабирование, и проблема: отозвать его до `exp` нельзя. Сессия в базе отзывается мгновенно, но каждый запрос ходит в базу. Средний путь — короткий access-токен (15 минут), refresh-токены на сервере и список отозванных `jti` для срочных случаев.

      **Пример из мессенджера:** Алису заблокировали в 12:00, токен выпущен в 11:55 — он принимается до 12:10 плюс 30 с допуска. Это осознанное ограничение; отзыв и refresh-токены появятся в разделе о безопасности API. Эндпоинт `POST /v1/tokens` — не OAuth, а простой вход по паролю.
    checklist:
      - "HMAC — общий секрет: каждый проверяющий может выпускать"
      - "асимметричная подпись: закрытый ключ только у выдающего"
      - "самодостаточный токен нельзя отозвать до `exp`"
      - "короткий срок жизни, refresh и список отозванных как компромисс"
    red_flags:
      - "«раздадим HMAC-секрет всем сервисам»"
      - "срок жизни токена — неделя «для удобства»"
    follow_ups:
      - q: "Почему ответ на неудачный вход общий, а журнал — подробный?"
        a: "Ответ видит атакующий, журнал — только операторы. Причина нужна им, чтобы заметить перебор; пароль не пишется никуда."

  # 1.15
  - id: container-isolation
    lesson: 01-go-service/15-container-internals
    topic: Контейнеры
    level: S
    question: "Что именно изолирует контейнер и чего не изолирует? Можно ли считать его границей безопасности уровня виртуальной машины?"
    answer: |
      **Тезис:** контейнер — обычный процесс, которому ядро Linux дало свои «очки» (namespaces) и лимиты (cgroups). Ядро у него общее с хостом, поэтому это не граница уровня VM.

      **Почему:** namespaces дают свой вид на PID, точки монтирования, сеть, hostname, IPC, пользователей; `pivot_root` меняет корень всего mount namespace, OverlayFS собирает файловую систему из слоёв, cgroups ограничивают память, CPU и число процессов. Но каждый системный вызов выполняет то же ядро, и уязвимость ядра (Dirty COW, CVE-2022-0185) или рантайма (CVE-2019-5736 в runc) — путь наружу. Общие и настенные часы, `/proc/meminfo` описывает всю машину.

      **Компромисс:** безопасность обычного контейнера держится на дополнительных барьерах: урезанных capabilities, seccomp, AppArmor/SELinux, маскировании `/proc` и `/sys`. `--privileged` снимает их все и делает контейнер почти хостом. Если общего ядра мало — gVisor или microVM (Kata, Firecracker), ценой скорости системных вызовов и старта.

      **Пример из мессенджера:** лаба `minicontainer` собрала ту же изоляцию без Docker в пару сотен строк: изолирует ядро, а Docker даёт формат образа, сборку, реестр и одну команду запуска. Порядок важен: cgroup создают до запуска процесса (`CLONE_INTO_CGROUP`), иначе он успеет поработать без лимитов.
    checklist:
      - "namespaces — что процесс видит, cgroups — сколько может"
      - "общее ядро: уязвимость ядра или рантайма — побег"
      - "capabilities, seccomp, LSM как реальные барьеры"
      - "`--privileged` снимает барьеры"
      - "сильная изоляция: gVisor, microVM и их цена"
    red_flags:
      - "«контейнер — лёгкая виртуальная машина со своим ядром»"
      - "«root в контейнере безопасен, это же контейнер»"
    follow_ups:
      - q: "Контейнер с лимитом 256 МиБ показывает 250 МиБ памяти и живёт, а другой убит с кодом 137 при куче 200 МиБ. Как?"
        a: "У первого почти всё — страничный кэш, его ядро вытесняет. У второго невытесняемой памяти больше `memory.max`, и ядро убило его SIGKILL: 128 + 9 = 137."
      - q: "Почему `ps` внутри контейнера видит один процесс?"
        a: "PID namespace даёт свою нумерацию, а свой `/proc`, смонтированный внутри, показывает только процессы этого namespace. На хосте тот же процесс виден под другим номером."

  # 1.16
  - id: dockerfile-layer-cache
    lesson: 01-go-service/16-image
    topic: Контейнеры
    level: M+
    question: "Как вы напишете Dockerfile для Go-сервиса, чтобы сборка была быстрой, а образ — маленьким и безопасным? Почему важен порядок инструкций?"
    answer: |
      **Тезис:** multi-stage сборка: в стадии сборки сначала `COPY go.mod go.sum` и `go mod download`, потом `COPY . .` и статический `go build` с cache mount; в финальной стадии — только бинарь на distroless, базовые образы закреплены по digest.

      **Почему:** ключ кэша шага включает ключ родителя, и промах катится вниз до конца стадии. Отдельное копирование манифестов модулей делает слой зависимостей независимым от правок кода. `ARG VERSION` объявляют после скачивания зависимостей: он входит в ключи следующих `RUN`. Удалять мусор отдельной инструкцией бесполезно — байты остаются в предыдущем слое; cache mount держит кэш компилятора вне образа.

      **Компромисс:** distroless без shell и пакетного менеджера — меньше поверхность атаки, зато отладка через `docker debug` или эфемерный контейнер. Закрепление по digest даёт повторяемость и защиту от подмены тега, но само не обновляется — нужен бот обновлений.

      **Пример из мессенджера:** `CGO_ENABLED=0` обязателен: в образе `golang` есть `gcc`, cgo включится, и бинарь станет динамическим — в distroless static он упадёт с «no such file or directory» из-за отсутствующего загрузчика. `-trimpath` убирает пути машины, `.dockerignore` не пускает лишнее в контекст.
    checklist:
      - "порядок слоёв: редко меняющееся выше, код ниже"
      - "промах кэша катится вниз"
      - "multi-stage: в образ попадает только бинарь"
      - "статическая сборка `CGO_ENABLED=0`"
      - "закрепление базовых образов по digest плюс обновления"
    red_flags:
      - "`COPY . .` первой строкой"
      - "`RUN rm -rf` отдельной инструкцией «чтобы уменьшить образ»"
      - "`FROM golang:latest` в продакшене"
    follow_ups:
      - q: "Сканер показал 0 пакетов в scratch и 6 в distroless. Scratch безопаснее?"
        a: "Нет: в scratch те же сертификаты и tzdata лежат без записей в базе пакетов, и сканер их не видит. «0 пакетов» значит «не видно», а не «нет»."

  # 1.17 (1)
  - id: liveness-vs-readiness
    lesson: 01-go-service/17-service-in-container
    topic: Контейнеры
    level: M+
    question: "Чем проба живости отличается от пробы готовности? Что будет, если `/livez` проверяет базу данных, а база недоступна две минуты?"
    answer: |
      **Тезис:** liveness отвечает «процесс жив и не завис» — при провале контейнер перезапускают; readiness — «можно ли слать трафик» — при провале экземпляр выводят из балансировки, не трогая.

      **Почему:** если liveness проверяет базу, при её минутном сбое проваливаются все экземпляры разом, оркестратор перезапускает их, теряются кэши и пулы, а новые процессы разом ломятся в больную базу. Минутный сбой зависимости становится полным отказом — каскадный рестарт. Недоступная база — дело readiness: экземпляр жив и вернётся в трафик за секунды. Startup-проба даёт терпеливый срок на старт.

      **Компромисс:** readiness по зависимостям убирает из трафика все экземпляры сразу, если зависимость общая, — но это честно: без базы запрос не обслужить. Пробы мимо цепочки API, без аутентификации и журнала доступа.

      **Пример из мессенджера:** при SIGTERM `/readyz` сразу отвечает 503, затем пауза `DRAIN_DELAY` (5 с), в которую запросы ещё обслуживаются, пока балансировщик узнаёт об уходе, и только потом `Shutdown` до 10 с. `HEALTHCHECK` в образе смотрит в `/livez`, иначе дренаж выглядел бы как «unhealthy»; Kubernetes его игнорирует и выполняет пробы из манифеста.
    checklist:
      - "liveness → перезапуск, readiness → вывод из трафика"
      - "liveness не проверяет зависимости: каскадный рестарт"
      - "дренаж: сначала 503 на readiness, пауза, потом `Shutdown`"
      - "startup-проба для долгого старта"
    red_flags:
      - "одна ручка `/health` для обеих проб, проверяющая базу"
      - "`Shutdown` сразу по SIGTERM без паузы"
    follow_ups:
      - q: "Зачем пауза после SIGTERM, если `Shutdown` и так дожидается запросов?"
        a: "`Shutdown` первым делом закрывает сокет, а балансировщик ещё шлёт трафик: новые запросы получат connection refused. Пауза — время, за которое об уходе узнают все."
      - q: "Почему `docker stop` у автора убил контейнер через 3 с, а не через 10?"
        a: "Умолчание задаёт демон: у Docker Engine 10 с, Docker Desktop ставит 3. Поэтому срок задают явно (`stop_grace_period`) с запасом над худшим случаем 15 с."

  # 1.17 (2)
  - id: pid1-sigterm
    lesson: 01-go-service/17-service-in-container
    topic: Контейнеры
    level: S
    question: "Почему процесс в контейнере может «не услышать» `docker stop`? Что изменится для Go-сервиса без `signal.Notify`, и чем опасна shell-форма `ENTRYPOINT`?"
    answer: |
      **Тезис:** процесс из `ENTRYPOINT` — PID 1 своего namespace, и ядро доставляет ему только те сигналы, на которые он поставил обработчик; действие по умолчанию «завершить» к нему не применяется.

      **Почему:** программа без обработчика SIGTERM в роли PID 1 сигнал не заметит, и через срок остановки придёт SIGKILL (код 137). Рантайм Go обработчик ставит сам, поэтому Go-сервис без `signal.Notify` не зависнет, а умрёт сразу: у PID 1 — `exit(2)`, код 2. Но это обрыв: ни дренажа, ни `Shutdown`, ни `defer`. Настоящая ловушка — когда PID 1 не наша программа: скрипт-обёртка без `exec` или shell-форма `ENTRYPOINT`, где PID 1 становится `sh`, который сигнал не пересылает.

      **Компромисс:** некоторые оболочки оптимизируют `sh -c` с простой командой через `exec`, и shell-форма «случайно работает» — до первого изменения строки или базового образа. Поэтому правило — только exec-форма. `tini` (`--init`) нужен, когда сервис порождает процессы и должен собирать зомби.

      **Пример из мессенджера:** `signal.NotifyContext` превращает SIGTERM в отмену контекста, и остановкой управляет наш код; `ENTRYPOINT ["/messenger"]` в exec-форме; в distroless shell нет вовсе, так что обёртку и не написать.
    checklist:
      - "PID 1 получает только сигналы с обработчиком"
      - "Go ставит обработчик сам: без `Notify` — мгновенный выход с кодом 2"
      - "обёртка без `exec` и shell-форма делают PID 1 оболочкой"
      - "exec-форма как правило, `tini` — когда есть дети"
    red_flags:
      - "«Go сам корректно завершится по SIGTERM, Notify не нужен»"
      - "`ENTRYPOINT /app` строкой"
      - "увеличить срок остановки вместо обработки сигнала"
    follow_ups:
      - q: "Почему код 137?"
        a: "Процесс убит сигналом 9 (SIGKILL), а код выхода по сигналу — 128 + номер сигнала."

  # 1.17 (3)
  - id: go-runtime-in-cgroup
    lesson: 01-go-service/17-service-in-container
    topic: Контейнеры
    level: S
    question: "Go-сервис в контейнере с `--memory 256m` периодически убивают по OOM, хотя живых данных около 135 МиБ. Почему, и что вы сделаете? Как Go видит лимит CPU?"
    answer: |
      **Тезис:** рантайм Go не читает `memory.max`: сборщик мусора ориентируется на `GOGC`, и цель кучи — живые данные плюс столько же, то есть 270 МиБ при лимите 256. Лечится явным `GOMEMLIMIT` на 5–10 % ниже лимита контейнера.

      **Почему:** куча растёт к цели, упирается в лимит cgroup, и ядро убивает процесс. `GOMEMLIMIT` — мягкий лимит на память рантайма: подходя к нему, сборщик запускается чаще. Запас нужен, потому что ядро считает и то, чего рантайм не знает: страничный кэш, буферы сокетов, память cgo.

      **Компромисс:** лимит мягкий: при настоящей утечке сборщик возьмёт до ~50 % CPU, сервис замедлится и всё равно получит OOM-kill, зато деградацию видно на графиках заранее. С CPU иначе: с Go 1.25 рантайм на Linux сам читает `cpu.max` и берёт меньшее из числа процессоров и лимита, периодически пересчитывая; лимит меньше 2 округляется до 2, чтобы сборщик мог работать параллельно с кодом.

      **Пример из мессенджера:** `mem_limit: 256m` и `GOMEMLIMIT=230MiB` в compose; при `cpus: 1` `GOMAXPROCS` равен 2, и это не ошибка — явное `GOMAXPROCS=1` отключило бы и пересчёт при изменении лимита.
    checklist:
      - "Go не читает лимит памяти cgroup, цель кучи по `GOGC`"
      - "`GOMEMLIMIT` ниже лимита контейнера с запасом и почему"
      - "мягкий лимит не спасает от утечки"
      - "`GOMAXPROCS` учитывает `cpu.max` с Go 1.25, минимум 2"
    red_flags:
      - "«Go сам видит лимит памяти контейнера»"
      - "`GOMEMLIMIT` равен лимиту контейнера"
      - "«поставим `GOMAXPROCS=1`, раз `cpus: 1`»"
    follow_ups:
      - q: "Что было до Go 1.25 с `GOMAXPROCS` в контейнере?"
        a: "Оно равнялось числу процессоров машины: 64 потока при квоте в одно ядро выбирали её за миллисекунды и стояли в троттлинге до конца периода. Лечили `automaxprocs` или явной переменной."

  # 1.18 (1)
  - id: aggregate-required-check
    lesson: 01-go-service/18-ci
    topic: CI/CD
    level: S
    question: "В монорепозитории CI запускает проверки только для изменённых частей. Как сделать обязательную проверку для защиты ветки, чтобы PR не висел вечно и не проходил, когда ничего не проверено?"
    answer: |
      **Тезис:** фильтр путей — на уровне джоб, а не workflow, и одна агрегирующая джоба (`ci-ok`) с `if: always()` — единственная обязательная проверка.

      **Почему:** у GitHub три вида пропуска ведут себя по-разному. Джоба, пропущенная условием `if:`, отчитывается Success. Workflow, пропущенный фильтром `on.paths`, фильтром веток или `[skip ci]`, не создаёт джоб вовсе, и обязательная проверка висит в Pending навсегда. Если упадёт джоба фильтра, все зависимые будут пропущены — то есть Success, и ворота открыты.

      **Компромисс:** агрегатор зависит от всех джоб через `needs` и сам решает: `failure` или `cancelled` среди итогов — красный, `success` и `skipped` — зелёный. С `success()` он был бы пропущен при первом падении (и стал бы зелёным), с `!cancelled()` не запустился бы в отменённом прогоне. Цена — ещё одна джоба и дисциплина дописывать её `needs`.

      **Пример из мессенджера:** джоба `changes` с `dorny/paths-filter` выдаёт флаги, ворота читают их в `if:`; PR только с README проходит, потому что все ворота пропущены, а `ci-ok` зелёный. В настройках репозитория одно стабильное имя, и переименование джоб не требует правки ruleset вне ревью.
    checklist:
      - "пропуск по `if:` — Success, пропуск workflow — Pending"
      - "фильтр на уровне джоб"
      - "агрегирующая джоба — единственная обязательная"
      - "`always()` и разбор `needs.*.result`"
      - "падение джобы фильтра не открывает ворота"
    red_flags:
      - "`on.paths` у обязательного workflow"
      - "сделать обязательными все джобы по именам"
      - "`if: success()` у агрегатора"
    follow_ups:
      - q: "Почему на push в `main` фильтр не применяется?"
        a: "`main` обязан быть проверен целиком: от него собираются релизы, и пропуск по фильтру спрятал бы поломку, которую внёс соседний PR."

  # 1.18 (2)
  - id: action-pinning-sha
    lesson: 01-go-service/18-ci
    topic: CI/CD
    level: M+
    question: "Зачем закреплять GitHub Actions по SHA коммита, а не по тегу? От чего это защищает, а от чего нет?"
    answer: |
      **Тезис:** тег в git изменяем — его можно перевесить на другой коммит; полный SHA указывает на конкретный код, и выполнится именно он.

      **Почему:** при атаке на tj-actions/changed-files злоумышленник перевесил теги на вредоносный коммит, и тысячи workflow, закреплённых по тегу, выполнили его код с доступом к секретам. Закрепление по SHA от этого защищает. Комментарий `# v7.0.1` рядом оставляет версию читаемой, а Dependabot обновляет и SHA, и комментарий.

      **Компромисс:** SHA не защищает от кода, который был вредоносен или уязвим уже в момент закрепления; от вложенных действий, которые само действие тянет по тегу; от бинарников, которые действие скачивает; от imposter commit из форка. Обновления надо читать, а не сливать вслепую. Поэтому второй слой — минимальные права: `permissions` по минимуму на workflow, остальное — джобе, и `persist-credentials: false`, чтобы украсть было почти нечего.

      **Пример из мессенджера:** все действия в `ci.yml` закреплены по полному SHA с комментарием версии; данные событий попадают в `run:` только через `env:`, а не подстановкой `${{ }}`, чтобы не было инъекции в скрипт.
    checklist:
      - "тег изменяем, SHA — нет"
      - "реальный инцидент (tj-actions) и что он дал атакующему"
      - "остаточные риски: транзитивные действия, скачанные бинарники, вредоносный исходный код"
      - "минимальные права как второй слой"
      - "обновление закреплений ботом с ревью"
    red_flags:
      - "«используем `@v4`, мейнтейнеры надёжные»"
      - "«SHA — значит безопасно полностью»"
      - "`permissions: write-all`"
    follow_ups:
      - q: "Внешний контрибьютор в PR из форка дописал в workflow шаг, который отправляет env наружу. Что он получит?"
        a: "На `pull_request` — токен только на чтение и без секретов. Опасен `pull_request_target` с checkout и запуском кода PR: чужой код выполнится с секретами базового репозитория (pwn request)."

  # 1.19
  - id: provenance-what-proves
    lesson: 01-go-service/19-delivery
    topic: CI/CD
    level: S
    question: "Вы выкатываете образ из реестра. Как убедиться, что его собрал ваш конвейер из вашего кода, и что доказывает подписанная аттестация происхождения, а что нет?"
    answer: |
      **Тезис:** выкатывать по digest и проверять подписанную аттестацию происхождения (provenance) — например `gh attestation verify` с указанием владельца, репозитория и workflow.

      **Почему:** тег вроде `main` изменяем: узлы, перезапущенные позже, скачают другой образ, и откат ничем не назван. Право записи в реестр само ничего не доказывает — токен могут украсть. Аттестация GitHub подписана короткоживущим сертификатом Fulcio, выданным по OIDC-удостоверению workflow, и записана в журнал прозрачности Rekor: в сертификате репозиторий, workflow и коммит. Образ, собранный и залитый мимо `release.yml`, проверку не пройдёт; подписан digest, поэтому изменённый после подписи образ — тоже.

      **Компромисс:** аттестация удостоверяет происхождение, а не безопасность. Она не ловит уязвимый или вредоносный код, честно собранный конвейером, и компрометацию зависимостей до сборки (как xz) — это задача ревью, сканеров и SBOM. Проверка только по `--owner` пропустит сборку другим репозиторием того же владельца. Provenance от BuildKit подробный, но не подписан — это опись, а не подпись.

      **Пример из мессенджера:** `release.yml` собирает мультиархитектурный образ по проверенному `head_sha`, кладёт SBOM и provenance, подписывает аттестацию; Dependabot обновляет закреплённые digest и SHA с выдержкой.
    checklist:
      - "выкатка по digest, а не по изменяемому тегу"
      - "подпись по OIDC-удостоверению workflow, журнал прозрачности"
      - "что проверять: владелец, репозиторий, workflow, ветка"
      - "происхождение ≠ безопасность: SBOM, сканеры, ревью"
    red_flags:
      - "«образ в нашем приватном реестре — значит наш»"
      - "provenance BuildKit без подписи как доказательство"
      - "выкатка по `latest`"
    follow_ups:
      - q: "Что такое SBOM и чем он полезен после выкатки?"
        a: "Опись компонентов образа с версиями. Когда выходит новая уязвимость, по SBOM за минуты видно, какие образы её содержат, без пересборки и ручного разбора."
