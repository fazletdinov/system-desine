system-design:
  term: Проектирование систем (system design)
  en: System Design
  short: Выбор компонентов системы, связей между ними и компромиссов так, чтобы система выполняла требования при реальной нагрузке.
  long: |
    Это ответ на вопрос «из чего собрать систему и почему именно так». Если код — это кирпичи, то system design — план здания: где несущие стены, сколько этажей выдержит фундамент и что будет, если половина лифтов сломается. В курсе мы проектируем мессенджер и каждое решение фиксируем вместе с причинами.
  links:
    - title: Клеппман, «Высоконагруженные приложения», гл. 1
functional-requirements:
  term: Функциональные требования
  en: Functional requirements
  short: Что система должна делать — её возможности с точки зрения пользователя.
  long: |
    Отвечают на вопрос «что?»: отправить сообщение, создать группу, найти сообщение по слову. Обычно формулируются как «пользователь может…». Не говорят ничего о скорости и надёжности — это задача нефункциональных требований.
non-functional-requirements:
  term: Нефункциональные требования
  en: Non-functional requirements
  short: Насколько хорошо система должна работать — скорость, доступность, надёжность, масштабируемость, стоимость.
  long: |
    Отвечают на вопрос «как хорошо?»: сообщение доставляется за 1 секунду в 99% случаев, сервис доступен 99,95% времени. Именно они определяют архитектуру: функция «отправить сообщение» одинакова для 100 и для 100 миллионов пользователей, а архитектура — совершенно разная.
scalability:
  term: Масштабируемость
  en: Scalability
  short: Способность системы справляться с ростом нагрузки за счёт добавления ресурсов.
  long: |
    Вертикальное масштабирование — купить сервер мощнее; горизонтальное — добавить ещё серверов. Вертикальное проще, но упирается в потолок самой большой машины. Горизонтальное почти не ограничено, но требует, чтобы систему можно было разделить. Подробно — модули 2.5 и 9.
  links:
    - title: Клеппман, гл. 1, «Масштабируемость»
availability:
  term: Доступность
  en: Availability
  short: Доля времени, когда система отвечает на запросы корректно; обычно выражается в «девятках» (99,9%).
  long: |
    99,9% в год означает до 8,76 часа простоя, 99,99% — до 52,6 минуты. Каждая следующая «девятка» стоит заметно дороже: нужны резервирование, автоматическое переключение и дисциплина выкаток.
  links:
    - title: Google SRE Book, гл. 3 «Embracing Risk»
      url: https://sre.google/sre-book/embracing-risk/
reliability:
  term: Надёжность
  en: Reliability
  short: Способность системы продолжать работать правильно, даже когда что-то ломается.
  long: |
    Сбои неизбежны: диски умирают, сеть теряет пакеты, программисты ошибаются. Надёжная система не та, где ничего не ломается, а та, где поломка одной части не превращается в аварию для пользователя. Клеппман разделяет сбой (fault) — отказ компонента — и отказ (failure) — когда система перестала обслуживать пользователя.
  links:
    - title: Клеппман, гл. 1, «Надёжность»
durability:
  term: Долговечность данных
  en: Durability
  short: Гарантия, что подтверждённые данные не потеряются даже при сбое сервера.
  long: |
    Если мессенджер ответил «отправлено», сообщение не должно исчезнуть после перезагрузки сервера. Достигается записью на диск до подтверждения (fsync) и копиями на других машинах (репликация, модуль 8).
consistency:
  term: Согласованность
  en: Consistency
  short: Насколько одинаково и актуально разные пользователи и копии данных видят одно и то же состояние системы.
  long: |
    Пока данные лежат в одной базе на одном сервере, вопрос почти не возникает. Как только появляются копии на разных машинах, копия может отставать: вы отправили сообщение, обновили страницу — а его нет, потому что чтение ушло на отстающую копию. Строгая согласованность обещает, что все видят одно и то же сразу, но стоит задержки и доступности; слабая — дешевле, но допускает такие сюрпризы. Слово многозначное: «C» в ACID (модуль 2b) означает другое — соблюдение инвариантов базы. Подробно — модули 8 и 10.
  links:
    - title: Клеппман, гл. 5 и 9
latency:
  term: Задержка
  en: Latency
  short: Время, которое проходит от отправки запроса до получения ответа (или одного шага этого пути).
  long: |
    Измеряется в единицах времени: наносекундах для памяти, миллисекундах для сети. Пользователь ощущает именно задержку. Описывать её нужно перцентилями, а не средним — среднее скрывает самых медленных и самых недовольных пользователей.
  links:
    - title: Клеппман, гл. 1, «Описание производительности»
throughput:
  term: Пропускная способность (фактическая)
  en: Throughput
  short: Сколько работы система выполняет за единицу времени — например, запросов в секунду.
  long: |
    Задержка — «как быстро обслуживается один клиент», throughput — «сколько клиентов обслуживается за секунду». Они связаны, но не одно и то же: можно повысить throughput пачками (батчингом), но при этом увеличить задержку отдельного запроса.
bandwidth:
  term: Ширина канала
  en: Bandwidth
  short: Максимальный объём данных, который канал может передать за единицу времени (например, 1 Гбит/с).
  long: |
    Аналогия — число полос на шоссе. Больше полос — больше машин в час, но каждая машина едет до цели не быстрее. Поэтому «более толстый канал» не уменьшает задержку запроса через океан.
rps:
  term: RPS (запросов в секунду)
  en: Requests Per Second
  short: Число запросов, которые система получает или обрабатывает за одну секунду.
  long: |
    Главная единица нагрузки. Часто встречается также QPS (queries per second) — по смыслу то же самое. Удобное правило: 1 миллион запросов в сутки ≈ 12 RPS в среднем.
dau:
  term: DAU (активные пользователи за день)
  en: Daily Active Users
  short: Число уникальных пользователей, которые хотя бы раз воспользовались продуктом за сутки.
  long: |
    Отправная точка почти любой оценки нагрузки. Рядом встречается MAU (Monthly Active Users) — за месяц; DAU всегда не больше MAU.
percentile:
  term: Перцентиль (p50, p95, p99)
  en: Percentile
  short: Значение, ниже которого лежит заданная доля измерений; p99 = 120 мс значит, что 99% запросов быстрее 120 мс.
  long: |
    p50 — медиана, «типичный» запрос. p99 — хвост: 1 из 100 запросов медленнее. Хвосты важны, потому что при загрузке одной страницы делается много запросов, и шанс встретить медленный растёт.
  links:
    - title: Клеппман, гл. 1, «Перцентили»
sli:
  term: SLI (индикатор уровня обслуживания)
  en: Service Level Indicator
  short: Измеряемая метрика качества сервиса — например, доля запросов, выполненных успешно быстрее 300 мс.
  long: |
    SLI — это «градусник» сервиса: число, которое можно снять и сравнить с целью. Берут то, что чувствует пользователь: долю успешных ответов, задержку по p99, свежесть данных. Например, «за последние 5 минут 99,95% запросов отправки сообщения завершились успехом быстрее 300 мс». Из SLI строится SLO, а следят за ним в модуле 12.
  links:
    - title: Google SRE Book, гл. 4
      url: https://sre.google/sre-book/service-level-objectives/
slo:
  term: SLO (цель уровня обслуживания)
  en: Service Level Objective
  short: Целевое значение SLI за период — например, «99,9% запросов за 30 дней успешны и быстрее 300 мс».
  long: |
    Если SLI — градусник, то SLO — отметка «нормальная температура». Это внутренняя цель команды: достаточно строгая, чтобы пользователи были довольны, и достаточно мягкая, чтобы её можно было выполнять. Цель 99,9% за 30 дней допускает примерно 43 минуты «плохой» работы. SLO определяет бюджет ошибок и появляется в расчётах модуля 0, а мониторинг — в модуле 12.
  links:
    - title: Google SRE Book, гл. 4
      url: https://sre.google/sre-book/service-level-objectives/
sla:
  term: SLA (соглашение об уровне обслуживания)
  en: Service Level Agreement
  short: Договор с клиентом о качестве сервиса с последствиями (например, компенсацией) при нарушении.
  long: |
    SLA — юридическое обещание, SLO — внутренняя цель. SLO обычно строже SLA, чтобы команда успела отреагировать до того, как придётся платить.
error-budget:
  term: Бюджет ошибок
  en: Error budget
  short: Допустимый объём «плохой» работы, следующий из SLO; при SLO 99,9% за 30 дней это около 43 минут.
  long: |
    Бюджет можно «тратить» на рискованные выкатки и эксперименты. Когда он исчерпан, команда переключается с новых функций на надёжность.
  links:
    - title: Google SRE Book, гл. 3
      url: https://sre.google/sre-book/embracing-risk/
ip-address:
  term: IP-адрес
  en: IP address
  short: Числовой адрес устройства в сети, по которому доставляются пакеты (например, 93.184.216.34).
dns:
  term: DNS (система доменных имён)
  en: Domain Name System
  short: Распределённая «телефонная книга» интернета — переводит имя вроде api.example.com в IP-адрес.
  long: |
    Ответы DNS кэшируются на устройстве и у провайдера на время TTL. Поэтому повторные запросы почти бесплатны, а смена IP-адреса сервера доходит до пользователей не мгновенно.
tcp:
  term: TCP
  en: Transmission Control Protocol
  short: Протокол, который поверх ненадёжной сети даёт надёжный упорядоченный поток байтов между двумя программами.
  long: |
    TCP пересылает потерянные пакеты и восстанавливает порядок. Плата за это — установка соединения («рукопожатие», 1 RTT) до передачи данных. Подробно — модуль 0b.
tls:
  term: TLS
  en: Transport Layer Security
  short: Протокол шифрования поверх TCP; именно он превращает HTTP в HTTPS.
  long: |
    TLS 1.3 договаривается о ключах за 1 RTT (TLS 1.2 — за 2). Также проверяет сертификат, то есть что вы говорите именно с тем сервером, а не с подменой.
  links:
    - title: RFC 8446 (TLS 1.3)
      url: https://www.rfc-editor.org/rfc/rfc8446
rtt:
  term: RTT (время кругового пути)
  en: Round-Trip Time
  short: Время, за которое пакет доходит до получателя и ответ возвращается обратно.
  long: |
    Внутри одного дата-центра — около 0,5 мс, между континентами — 100–150 мс. Нижняя граница — скорость света в оптоволокне (~200 000 км/с), поэтому никакие оптимизации кода не сделают запрос через океан быстрее нескольких десятков миллисекунд.
http:
  term: HTTP
  en: HyperText Transfer Protocol
  short: Протокол «запрос — ответ» поверх TCP (или QUIC), на котором работают веб и большинство API.
load-balancer:
  term: Балансировщик нагрузки
  en: Load balancer
  short: Компонент, который принимает входящие запросы и распределяет их между несколькими серверами.
  long: |
    Позволяет добавлять серверы незаметно для клиента и выводить из работы сломанные. Подробно — модуль 2.5 (в том числе Nginx).
tls-termination:
  term: TLS-терминация
  en: TLS termination
  short: Расшифровка TLS на балансировщике, после которой запрос внутри дата-центра идёт к серверам уже без шифрования (или с отдельным внутренним).
  long: |
    Представьте охранника на входе в офис: он один проверяет документы у всех посетителей, а внутри сотрудники уже не проверяют друг друга на каждом шагу. Так и балансировщик берёт на себя тяжёлую работу по шифрованию, и серверам приложения не нужно держать сертификаты и тратить на это процессор. Цена вопроса — внутри сети трафик идёт открытым, поэтому в строгих системах его шифруют отдельно (mTLS — взаимная проверка сертификатов обеими сторонами, модуль 6.7). Настраиваем в модуле 2.5.
application-server:
  term: Сервер приложения
  en: Application server
  short: Процесс с бизнес-логикой (в нашем курсе — Go-сервис), который обрабатывает запрос и обращается к базе данных.
  long: |
    Это «повар» на кухне: балансировщик принёс заказ, сервер приложения проверил его, сходил в базу за продуктами и отдал готовый ответ. Хорошая привычка — делать его stateless, то есть не хранить состояние между запросами в памяти процесса: тогда любой из десяти одинаковых серверов может обработать любой запрос. Первый такой сервис мы пишем в модуле 1.
database:
  term: База данных
  en: Database
  short: Система, которая надёжно хранит данные и позволяет их эффективно искать и изменять (у нас — PostgreSQL).
fsync:
  term: fsync
  en: fsync
  short: Системный вызов, который заставляет ОС реально записать данные из памяти на диск, а не только в кэш.
  long: |
    Без fsync данные могут «жить» в кэше ОС и пропасть при отключении питания. Базы данных вызывают fsync перед тем, как подтвердить транзакцию, — это часть гарантии долговечности. Подробно — модуль 2b (WAL).
data-center:
  term: Дата-центр (ЦОД)
  en: Data center
  short: Здание с серверами, сетью и питанием; сетевые задержки внутри одного ЦОД — доли миллисекунды.
cpu-cache:
  term: Кэш процессора (L1, L2, L3)
  en: CPU cache
  short: Очень быстрая маленькая память внутри процессора; обращение к L1 — около 1 нс, в ~100 раз быстрее RAM.
  long: |
    Аналогия — рабочий стол: самое нужное лежит под рукой (L1), остальное в ящике стола (L2, L3), а всё прочее в архиве через коридор (RAM). Размер L1 — десятки килобайт, L3 — десятки мегабайт, и чем дальше уровень, тем он медленнее: порядка 1 нс, нескольких нс и десятков нс соответственно (порядок величины). Поэтому код, который обходит массив подряд, работает заметно быстрее кода, прыгающего по памяти. Встретится в уроке про таблицу задержек в модуле 0.
ram:
  term: Оперативная память (RAM)
  en: Random Access Memory
  short: Основная рабочая память сервера; быстрая (~100 нс на обращение), но теряет данные при выключении.
  long: |
    RAM — это стол, на котором разложена текущая работа: быстрый, но небольшой и пропадающий при выключении. Обращение к ней занимает порядка 100 нс, а у сервера её обычно десятки или сотни гигабайт. Сравните с диском: SSD медленнее на два-три порядка, HDD — ещё больше. Поэтому кэши (модуль 4) держат в памяти то, что читают чаще всего.
ssd:
  term: SSD
  en: Solid-State Drive
  short: Твердотельный накопитель без движущихся частей; случайное чтение — десятки микросекунд.
  long: |
    SSD хранит данные в микросхемах флеш-памяти, поэтому ему не нужно ничего перемещать механически, как жёсткому диску. Случайное чтение блока в 4 КБ занимает порядка десятков микросекунд (около 16 мкс по оценке Colin Scott, 2020; порядок величины, зависит от модели), то есть в сотни раз дольше обращения к RAM, но в сотни раз быстрее HDD. Именно SSD сегодня стоят под большинством баз данных, о чём мы говорим в модулях 2a и 2b.
hdd:
  term: HDD
  en: Hard Disk Drive
  short: Жёсткий диск с вращающимися пластинами; перемещение головки (seek) занимает миллисекунды.
  long: |
    Это проигрыватель винила: чтобы прочитать нужное место, головку надо подвести к дорожке (seek, порядка 5–10 мс) и дождаться, пока пластина провернётся. Поэтому последовательное чтение у HDD быстрое, а случайное — очень медленное: порядка сотен операций в секунду против десятков тысяч у SSD (порядок величины). За гигабайт HDD зато дешевле, и их используют для архивов и холодных данных (к которым обращаются редко). В таблице задержек модуля 0 это самая медленная ступень.
log-scale:
  term: Логарифмическая шкала
  en: Logarithmic scale
  short: Шкала, на которой каждое деление означает умножение (×10), а не прибавление; позволяет на одном графике показать и 1 нс, и 150 мс.
  long: |
    На обычной линейной шкале рядом с 150 мс отрезок в 1 нс невозможно разглядеть: это в 150 миллионов раз меньше. На логарифмической каждое деление — это ×10 (1 нс, 10 нс, 100 нс, 1 мкс и так далее), поэтому все числа умещаются на одном графике. Расплата в том, что на глаз разница кажется меньше, чем на деле: два соседних деления — это уже в 10 раз. Так устроена визуализация задержек в модуле 0.
littles-law:
  term: Закон Литтла
  en: Little's law
  short: L = λ × W — среднее число запросов в системе равно интенсивности потока, умноженной на среднее время пребывания.
  long: |
    Пример: 1000 RPS × 0,1 с = в среднем 100 одновременно обрабатываемых запросов. Отсюда размеры пулов соединений и число воркеров.
back-of-envelope:
  term: Оценка «на салфетке»
  en: Back-of-the-envelope estimation
  short: Быстрый приблизительный расчёт нагрузки и объёмов с округлением до порядка величины.
  long: |
    Цель — не точное число, а ответ на вопрос «это 10 серверов или 10 000?». Для этого числа округляют до удобных: в сутках примерно 100 тысяч секунд, миллион запросов в сутки — это около 12 RPS. Например, 10 млн пользователей по 40 сообщений в день дают 400 млн сообщений, то есть около 4000 записей в секунду в среднем. Такие расчёты мы делаем для мессенджера в модуле 0, а тренируем в мини-интервью каждого модуля.
  links:
    - title: Сюй, «System Design», т. 1, гл. 2
peak-factor:
  term: Коэффициент пика
  en: Peak factor
  short: Во сколько раз пиковая нагрузка выше средней (например, вечером или в Новый год).
  long: |
    Система обязана выдержать пик, а не среднее: мост рассчитывают не на среднее число машин в сутки, а на вечернюю пробку. Если в среднем 4000 RPS, а пик вдвое выше, проектировать нужно под 8000 RPS и выше. Ориентировочно это 2–5 раз (оценка, порядок величины, а не факт), а для конкретного продукта значение берут из данных или осознанно оценивают. Используется в расчёте нагрузки мессенджера в модуле 0.
replication-factor:
  term: Коэффициент репликации
  en: Replication factor
  short: Сколько копий каждого фрагмента данных хранится (обычно 3) — ради надёжности и доступности.
  long: |
    Это число копий важного документа в разных сейфах: потеряли один, остаются другие. При коэффициенте 3 данные переживают потерю двух машин, но занимают в три раза больше места. Поэтому при оценке хранилища объём сырых данных умножают на коэффициент репликации: 10 ТБ сообщений превращаются в 30 ТБ на дисках. В расчётах он появляется в модуле 0, а сама репликация разбирается в модуле 8.
retention:
  term: Срок хранения
  en: Retention
  short: Как долго система хранит данные, прежде чем удалить или перенести их в архив.
  long: |
    Данные не бесплатны: чем дольше мы их храним, тем больше дисков, резервных копий и денег. Если мессенджер хранит сообщения 5 лет, а за год набегает 10 ТБ, хранилище вырастет примерно до 50 ТБ (до учёта репликации и роста аудитории). Срок хранения также может диктоваться законом или продуктом, и его выбирают при сборе требований. Учитываем в оценке хранилища в модуле 0.
metadata:
  term: Метаданные
  en: Metadata
  short: Данные о данных — например, у сообщения это id, автор, чат, время отправки, статус.
  long: |
    Это библиотечная карточка: сама книга лежит на полке, а в карточке написано, кто автор, когда издана и где стоит. У сообщения текст — это «книга», а id, автор, чат, время и статус доставки — карточка. Метаданные малы (сотни байт) и их читают очень часто, поэтому их хранят отдельно от тяжёлого содержимого вроде файлов и картинок. В оценке объёма хранилища в модуле 0 мы считаем их отдельной строкой.
active-recall:
  term: Активное воспроизведение
  en: Active recall
  short: Приём обучения — вспомнить и объяснить материал самому, не подглядывая, вместо перечитывания.
  long: |
    Перечитывание создаёт иллюзию знания: текст кажется знакомым, но воспроизвести его трудно. Усилие вспомнить, наоборот, укрепляет память, как нагрузка укрепляет мышцу. Закройте урок и попробуйте объяснить его вслух за минуту. Поэтому в курсе после уроков идут вопросы для самопроверки, а в конце каждого модуля — мини-интервью.
  links:
    - title: Brown, Roediger, McDaniel, «Make It Stick»
spaced-repetition:
  term: Интервальное повторение
  en: Spaced repetition
  short: Повторение материала с растущими паузами (через день, неделю, месяц), чтобы он перешёл в долговременную память.
  long: |
    Знания забываются быстрее всего сразу после изучения, и каждое своевременное повторение замедляет забывание. Поэтому повторять лучше редко, но вовремя: например, через день, через неделю, через месяц, а не пять раз подряд в один вечер. Это как поливать растение по расписанию, а не заливать за раз. В курсе к ранним темам намеренно возвращаются в более поздних модулях.
  links:
    - title: Brown, Roediger, McDaniel, «Make It Stick»
adr:
  term: ADR (запись архитектурного решения)
  en: Architecture Decision Record
  short: Короткий документ — контекст, рассмотренные варианты, принятое решение и его последствия.
  long: |
    ADR — это судовой журнал решений: через год никто не помнит, почему выбрали именно эту базу, и запись отвечает на вопрос «а почему так?». Обычно хватает одной страницы: что мы решали, какие варианты рассматривали, что выбрали и чем за это заплатили. В курсе мы пишем ADR на ключевых развилках мессенджера, начиная с модуля 0; шаблон и первый ADR мессенджера — в уроке 1.1.
  links:
    - title: Michael Nygard, «Documenting Architecture Decisions»
      url: https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
websocket:
  term: WebSocket
  en: WebSocket
  short: Протокол постоянного двустороннего соединения поверх TCP, по которому сервер сам присылает данные клиенту без нового запроса.
  long: |
    Обычный HTTP устроен как письмо: клиент спрашивает — сервер отвечает, и без вопроса сервер ничего прислать не может. WebSocket похож на телефонный звонок: соединение открывается один раз (начинается как HTTP-запрос и «переключается» на другой протокол) и остаётся открытым, а говорить могут обе стороны в любой момент. Поэтому мессенджеры доставляют по нему новые сообщения мгновенно. Цена — состояние: каждое открытое соединение занимает память сервера, и при падении сервера все его клиенты разом переподключаются. Строим WebSocket-шлюз в модуле 3.
  links:
    - title: RFC 6455 (The WebSocket Protocol)
      url: https://www.rfc-editor.org/rfc/rfc6455
sharding:
  term: Шардирование
  en: Sharding
  short: Разбиение данных на части (шарды), которые хранятся на разных серверах, — чтобы распределить объём и нагрузку на запись.
  long: |
    Представьте картотеку, которая перестала помещаться в один шкаф: карточки на А–К ставят в первый шкаф, на Л–Я — во второй. Каждый шкаф — шард, а правило «какая карточка в каком шкафу» задаёт ключ шардирования (например, идентификатор чата). Шардирование помогает, когда один сервер не вмещает данные или не успевает их записывать. Платим сложностью: запросы, которым нужны данные из нескольких шардов, становятся дорогими, а перенос данных при добавлении серверов — отдельная задача. Подробно — модуль 9.
  links:
    - title: Клеппман, гл. 6
fan-out:
  term: Веерная рассылка
  en: Fan-out
  short: Размножение одного события на многих получателей — например, доставка одного сообщения всем участникам группы.
  long: |
    Одна запись превращается во много доставок, как одно объявление по радио слышат все приёмники. В личном чате веер маленький, в группе на тысячу человек — тысяча доставок, в канале на миллион подписчиков — миллион. Есть два подхода: разложить копии получателям сразу при записи (fan-out on write) или собирать ленту при чтении (fan-out on read); у каждого свои компромиссы по нагрузке и задержке. Разбираем в модуле 7. В Go тем же словом называют раздачу задач из одного канала нескольким горутинам-воркерам, обратная операция — fan-in; об этом — урок 1.5.5.
  links:
    - title: Клеппман, гл. 1 (пример с Twitter)
e2e-encryption:
  term: Сквозное шифрование (E2E)
  en: End-to-end encryption
  short: Шифрование, при котором сообщение могут прочитать только отправитель и получатель, а сервер передаёт его, не видя содержимого.
  long: |
    При обычном TLS письмо шифруется только «в пути»: сервер мессенджера его расшифровывает, хранит и может прочитать. При сквозном шифровании ключи есть только у устройств собеседников, и сервер работает как почтальон с запечатанным конвертом. Платим функциями: сервер не может искать по сообщениям, а синхронизация истории на новое устройство и групповые чаты сильно усложняются. В курсе полноценное E2E не реализуем, только разбираем идею в модуле 6.7.
middleware:
  term: Middleware (промежуточный обработчик)
  en: Middleware
  short: Обёртка вокруг обработчика, которая выполняется до и после него и делает общую для всех запросов работу.
  long: |
    Проверка токена, логирование, метрики, ограничение скорости — всё это нужно каждому запросу, и писать это в каждом обработчике незачем. Middleware принимает обработчик и возвращает новый, который сначала делает свою часть, потом вызывает исходный. Обработчики оборачивают друг в друга цепочкой, и порядок важен: сначала идёт присвоение id запроса и восстановление после паники, потом логирование, потом аутентификация, а за ней уже бизнес-обработчик. Подробно — часть 1b (middleware аутентификации) и модуль 12.
dto:
  term: DTO (объект передачи данных)
  en: Data Transfer Object
  short: Структура, которая описывает данные на границе системы, например тело HTTP-запроса, и не совпадает с доменной моделью.
  long: |
    Формат запроса и ответа меняется по своим причинам, а доменная модель — по своим. DTO разводит их: на границе данные разбираются в DTO, проверяются и явно переводятся в доменные сущности. Подробно — урок 1.7.
wal:
  term: WAL (журнал предзаписи)
  en: Write-ahead log
  short: Журнал, в конец которого база сначала дописывает каждое изменение и сбрасывает его на диск, а сами таблицы обновляет позже.
  long: |
    Правило «сначала журнал, потом данные» делает долговечность дешёвой: чтобы подтвердить транзакцию, достаточно одной последовательной записи в конец журнала и одного fsync, а страницы таблиц, разбросанные по диску, можно обновить позже, в фоне. После сбоя база перечитывает журнал и восстанавливает всё, что успела подтвердить. В PostgreSQL журнал лежит в каталоге pg_wal. Подробно — модуль 2b.
index:
  term: Индекс
  en: Index
  short: Отдельная структура рядом с таблицей, по которой база находит строки по значению столбца, не читая всю таблицу.
  long: |
    Как алфавитный указатель в конце книги: чтобы найти страницу про WAL, не нужно листать книгу целиком. В PostgreSQL обычный индекс — B-дерево: отсортированные значения ключа со ссылками на строки таблицы. Платим за это местом на диске и скоростью записи: каждая вставка или изменение строки обновляет и все индексы таблицы. Подробно — модуль 2b. Какие индексы нужны, диктуют [паттерны доступа](#access-pattern) (урок 2.5).
  links:
    - title: Документация PostgreSQL, гл. «Indexes»
      url: https://www.postgresql.org/docs/current/indexes.html
udp:
  term: UDP
  en: User Datagram Protocol
  short: "Протокол доставки отдельных датаграмм без соединения, подтверждений и порядка."
  long: |
    UDP просто отправляет датаграмму и забывает о ней: ни рукопожатия, ни повторной отправки, ни гарантии порядка. Зато нет ни задержки на установку соединения, ни блокировки очереди из-за одного потерянного пакета. Поэтому на UDP работают DNS-запросы, видеозвонки и QUIC, а надёжность, если она нужна, строят сверху. Подробно — модуль 0b.
socket:
  term: Сокет
  en: Socket
  short: "Конечная точка соединения в программе: адрес и порт; в ОС — файловый дескриптор."
  long: |
    Сокет — это «розетка», в которую программа включает сетевое соединение: для ОС это обычный файловый дескриптор, из которого читают и в который пишут. TCP-соединение однозначно задаётся четвёркой: IP и порт клиента, IP и порт сервера. Поэтому один серверный порт обслуживает тысячи клиентов, а упереться можно в лимит открытых дескрипторов (`ulimit -n`). В Go за сокетом стоит `net.Conn`. Подробно — модуль 0b.
port:
  term: Порт
  en: Port
  short: "Число 0–65535, по которому ОС понимает, какой программе отдать пакет."
  long: |
    IP-адрес приводит пакет на нужную машину, порт — к нужной программе на ней, как номер квартиры после адреса дома. Порты ниже 1024 по традиции отдают системным службам (HTTP — 80, HTTPS — 443), остальные клиентская сторона берёт временно из эфемерного диапазона. В Linux по умолчанию это около 28 тысяч портов (32768–60999), и при множестве коротких соединений к одному серверу они могут закончиться. Подробно — модуль 0b.
mtu:
  term: MTU
  en: Maximum Transmission Unit
  short: "Максимальный размер пакета, который проходит через сетевой интерфейс без деления; в Ethernet — 1500 байт."
  long: |
    Это размер «конверта», который сеть пропускает целиком. В Ethernet MTU равен 1500 байт; за вычетом заголовков IP (20 байт) и TCP (20 байт) на данные остаётся 1460 байт — это и есть типичный MSS. Если пакет больше, его либо делят на части, либо отбрасывают с сообщением об ошибке. Поэтому MTU важен для VPN и туннелей: их заголовки отъедают место. Подробно — модуль 0b.
encapsulation:
  term: Инкапсуляция
  en: Encapsulation
  short: "Каждый уровень сети заворачивает данные верхнего уровня в свой заголовок, как письмо в конверт."
  long: |
    HTTP-запрос уходит в TCP-сегмент с заголовком из портов и номеров, сегмент — в IP-пакет с адресами, пакет — в Ethernet-кадр с MAC-адресами. На приёмной стороне каждый уровень снимает свой конверт и отдаёт содержимое выше. Благодаря этому уровни независимы: HTTP не знает, идёт ли он по Wi-Fi или по оптике. Цена — накладные расходы: на каждый пакет в Ethernet приходится порядка 54 байт заголовков (14 + 20 + 20). Подробно — модуль 0b.
cwnd:
  term: Окно перегрузки
  en: Congestion window, cwnd
  short: "Сколько байт TCP-отправитель может держать в полёте без подтверждения, чтобы не перегрузить сеть."
  long: |
    Отправитель не знает, сколько данных выдержит сеть, поэтому начинает осторожно и наращивает окно, пока всё доходит. Потеря пакета — сигнал перегрузки, и окно резко сокращается. В Linux начальное окно — 10 сегментов, около 14,6 КБ (RFC 6928), поэтому маленький ответ уходит за один RTT, а большой разгоняется несколько RTT. Подробно — модуль 0b.
slow-start:
  term: Медленный старт
  en: Slow start
  short: "Начальная фаза TCP: окно перегрузки растёт вдвое каждый RTT, пока не случится потеря или порог."
  long: |
    Название обманчиво: рост экспоненциальный, просто старт с малого окна. Каждый подтверждённый сегмент увеличивает окно на сегмент, поэтому за RTT оно удваивается: 10, 20, 40, 80 сегментов. Фаза кончается при потере пакета или на пороге slow start threshold, дальше окно растёт медленнее (в учебной модели Reno — линейно; Linux по умолчанию использует CUBIC, и это упрощение). Для вас это значит, что свежее соединение медленнее прогретого — ещё один довод за пул соединений. Подробно — модуль 0b.
retransmission:
  term: Повторная передача
  en: Retransmission
  short: "Повторная отправка сегмента, который TCP считает потерянным: по таймеру или после трёх дубликатов ACK."
  long: |
    TCP нумерует байты, и получатель в каждом ACK говорит, какой байт ждёт следующим. Если пришли три дубликата ACK (то есть четыре ACK с одним и тем же номером), отправитель решает, что сегмент потерян, и шлёт его заново, не дожидаясь таймера (fast retransmit). Если ACK нет совсем, срабатывает таймер повторной передачи, и он гораздо медленнее: в Linux минимум 200 мс (RFC 6298 задаёт начальный RTO в 1 с), а после каждой неудачи срок удваивается. Каждая потеря стоит минимум одного дополнительного RTT. Подробно — модуль 0b.
time-wait:
  term: TIME_WAIT
  en: TIME_WAIT
  short: "Состояние закрытого TCP-соединения на стороне, закрывшей первой; в Linux длится 60 с."
  long: |
    Сторона, первой закрывшая соединение, ещё минуту держит его в памяти, чтобы запоздавший пакет старого соединения не попал в новое с теми же адресами и портами. Само по себе состояние безвредно, но при тысячах коротких соединений в секунду оно копится и съедает эфемерные порты клиента. Типичный пример — сервис, который на каждый запрос открывает новое соединение вместо пула. Подробно — модуль 0b.
nagle:
  term: Алгоритм Нейгла
  en: Nagle's algorithm
  short: "Склеивание мелких записей в один сегмент, пока ждём ACK; в Go по умолчанию отключён (TCP_NODELAY)."
  long: |
    Если приложение пишет по пять байт, каждый такой кусок в своём пакете с 40 байтами заголовков — расточительно. Алгоритм Нейгла держит мелкие записи, пока не придёт ACK на предыдущие, и отправляет их вместе. Для интерактивных запросов это добавляет задержку, особенно в паре с отложенными ACK на другой стороне (в Linux обычно от 40 мс, до 200 мс). Go включает `TCP_NODELAY` по умолчанию, поэтому буферизовать записи нужно самому, через `bufio`. Подробно — модуль 0b.
datagram:
  term: Датаграмма
  en: Datagram
  short: "Отдельное самостоятельное сообщение UDP: дойдёт целиком или не дойдёт вовсе."
  long: |
    В отличие от потока байтов TCP, датаграмма — это сообщение со своими границами: сколько отправили, столько получатель и прочитает за один раз. Ни нумерации, ни подтверждения нет: пакеты могут потеряться, прийти не по порядку или продублироваться. Максимальная полезная нагрузка UDP по IPv4 — 65 507 байт, но на практике держат её в пределах MTU, чтобы не делить пакет. Подробно — модуль 0b.
dns-record:
  term: DNS-запись
  en: DNS resource record
  short: "Строка в зоне DNS: имя, тип (A, AAAA, CNAME, MX, TXT…), значение и TTL."
  long: |
    Зона DNS — это, по сути, таблица таких строк. Запись A сопоставляет имя IPv4-адресу, AAAA — IPv6, CNAME — это псевдоним на другое имя, MX указывает почтовый сервер, TXT хранит произвольный текст (например, подтверждения владения доменом). У каждой записи есть TTL, который говорит кэшам, как долго ей верить. Подробно — модуль 0b.
ttl:
  term: TTL
  en: Time To Live
  short: "Сколько секунд ответ разрешено хранить в кэше (в DNS); в IP — счётчик переходов."
  long: |
    В DNS это срок годности записи: пока он не истёк, резолвер отвечает из кэша и не ходит дальше. Типичные значения — от 60 секунд до суток; чем больше TTL, тем меньше нагрузка, но тем дольше до пользователей доходит смена IP. В заголовке IP одноимённое поле — это другое: счётчик переходов через маршрутизаторы (обычно 64), по нему пакет, зациклившийся в сети, в конце концов отбрасывается. Подробно — модуль 0b.
resolver:
  term: Резолвер
  en: Resolver
  short: "Программа или сервер, который находит IP-адрес по имени, обходя DNS-серверы и кэшируя ответы."
  long: |
    Ваше приложение не обходит корневые, TLD- и авторитетные серверы само — оно спрашивает резолвер (у провайдера, 8.8.8.8 или в локальной сети), а тот делает обход и запоминает результат на время TTL. Есть и «заглушка» в самой ОС или библиотеке: в Go это встроенный резолвер либо вызов `getaddrinfo` из libc. Ошибки здесь выглядят как «no such host» или таймаут, хотя сервер жив. Подробно — модуль 0b.
certificate:
  term: Сертификат
  en: X.509 certificate
  short: "Документ «этот открытый ключ принадлежит этому имени», подписанный центром сертификации."
  long: |
    Это как паспорт сервера: имя (например, example.com), открытый ключ, срок действия и подпись центра сертификации. Клиент проверяет подпись по цепочке до корневого сертификата, которому доверяет, сверяет имя с тем, что набрал пользователь, и срок действия. Не прошла любая проверка — соединение рвётся. Типичный срок жизни сертификата Let's Encrypt — 90 дней, и сроки сокращаются, поэтому продление автоматизируют. Подробно — модуль 0b.
ca:
  term: Центр сертификации
  en: Certificate Authority, CA
  short: "Организация, чьей подписи на сертификатах доверяют клиенты; корневые CA встроены в ОС и браузеры."
  long: |
    CA проверяет, что запрашивающий действительно управляет доменом, и подписывает его сертификат. Клиенту не нужно знать каждый сервер: достаточно доверять примерно полутора сотням корневых сертификатов из хранилища ОС или браузера. Это точка общего доверия, и ошибка CA бьёт по всем: поэтому сертификаты публикуют в открытых журналах (Certificate Transparency). Во внутренних сетях используют собственный CA. Подробно — модуль 0b.
sni:
  term: SNI
  en: Server Name Indication
  short: "Расширение TLS: клиент сообщает имя сайта в начале рукопожатия, чтобы сервер выбрал нужный сертификат."
  long: |
    Один IP-адрес часто обслуживает сотни сайтов, а сертификат нужен до того, как HTTP-запрос с заголовком Host вообще отправлен. Поэтому клиент пишет имя сайта прямо в первое сообщение TLS, и сервер выбирает подходящий сертификат. Без SNI вы получите сертификат по умолчанию и ошибку «имя не совпадает». В классическом TLS имя передаётся открытым текстом; шифрует его только расширение ECH. Подробно — модуль 0b.
alpn:
  term: ALPN
  en: Application-Layer Protocol Negotiation
  short: "Расширение TLS, через которое клиент и сервер договариваются о протоколе — h2 или http/1.1."
  long: |
    Клиент в первом сообщении TLS перечисляет, какие протоколы умеет: например, h2 и http/1.1. Сервер выбирает один в ответе, и никаких дополнительных RTT на выбор не тратится. Так браузеры и Go-клиент узнают, что можно говорить по HTTP/2. Если сервер h2 не предложил, разговор идёт по HTTP/1.1. Подробно — модуль 0b.
session-resumption:
  term: Возобновление TLS-сессии
  en: Session resumption
  short: "Повторное подключение по сохранённому секрету без полного рукопожатия и проверки сертификата."
  long: |
    После полного рукопожатия сервер выдаёт клиенту билет — зашифрованный секрет предыдущей сессии. При следующем подключении клиент предъявляет билет, и стороны пропускают проверку сертификата и подпись CertificateVerify: личность сервера уже подтверждена в прошлый раз. Обмен ключами ECDHE при этом остаётся (режим psk_dhe_ke, в Go-клиенте он единственный), поэтому прошлые сессии не расшифровать, даже если билет украдут позже. Возобновление укладывается в тот же 1 RTT, а с 0-RTT данные уходят уже в первом пакете. Подробно — модуль 0b.
keep-alive:
  term: Keep-alive
  en: HTTP persistent connection
  short: "Повторное использование одного TCP-соединения для нескольких HTTP-запросов."
  long: |
    Открывать TCP и TLS на каждый запрос дорого: это 2–3 RTT до первого байта данных. В HTTP/1.1 соединение по умолчанию остаётся открытым, и следующий запрос идёт по тому же каналу без рукопожатий. Go-клиент делает это сам, но только если вы прочитали и закрыли тело ответа. Не путайте с TCP keep-alive: тот лишь проверяет, жив ли собеседник. Подробно — модуль 0b.
connection-pool:
  term: Пул соединений
  en: Connection pool
  short: "Набор открытых соединений, которые программа держит и переиспользует вместо открытия новых."
  long: |
    Как стоянка такси: машины уже ждут, и не нужно каждый раз вызывать новую. В Go за пул HTTP-соединений отвечает `http.Transport`; его настройки (`MaxIdleConnsPerHost` по умолчанию равен 2!) прямо влияют на задержки при нагрузке. Слишком мал — соединения постоянно открываются заново, слишком велик — вы держите лишние дескрипторы и нагружаете сервер. Тот же приём применяют для баз данных: в курсе с PostgreSQL работает пул `pgxpool` драйвера pgx. Подробно — модуль 0b.
multiplexing:
  term: Мультиплексирование
  en: Multiplexing
  short: "Передача нескольких независимых потоков по одному соединению вперемешку."
  long: |
    В HTTP/1.1 на одном соединении запросы идут по очереди, поэтому браузер открывает до шести соединений на хост. В HTTP/2 каждый запрос получает номер потока, а кадры разных потоков чередуются в одном TCP-соединении. Получается одно соединение вместо шести и общий разогнанный cwnd. Но потеря одного TCP-пакета всё равно задерживает все потоки: это блокировка начала очереди уровня TCP. Подробно — модуль 0b.
head-of-line-blocking:
  term: Блокировка начала очереди
  en: Head-of-line blocking
  short: "Задержка всех следующих данных из-за одного застрявшего впереди пакета или запроса."
  long: |
    Как очередь в кассу, где у первого человека зависла карта: стоят все, хотя их покупки готовы. В HTTP/1.1 медленный ответ блокирует следующие на том же соединении. В HTTP/2 эту проблему решили на уровне HTTP, но она осталась на уровне TCP: TCP отдаёт данные строго по порядку, и потерянный пакет задерживает все потоки. HTTP/3 убирает её, потому что QUIC делает потоки независимыми. Подробно — модуль 0b.
hpack:
  term: HPACK
  en: HPACK
  short: "Сжатие HTTP-заголовков в HTTP/2 через общий словарь уже переданных заголовков."
  long: |
    Заголовки запросов к одному сервису почти одинаковы: Host, User-Agent, Cookie повторяются сотни раз. HPACK хранит таблицу уже переданных заголовков на обеих сторонах и вместо повторного текста шлёт индекс записи. Так заголовок в 500 байт во втором запросе занимает несколько байт. Таблица привязана к соединению, ещё один довод за его переиспользование. Подробно — модуль 0b.
quic:
  term: QUIC
  en: QUIC
  short: "Транспорт поверх UDP со встроенным TLS 1.3 и независимыми потоками; основа HTTP/3."
  long: |
    QUIC объединяет то, что в TCP+TLS шло раздельно: надёжную доставку, шифрование и мультиплексирование. Рукопожатие занимает 1 RTT вместо 2–3, а потеря пакета задерживает только тот поток, которому он принадлежал. Работает поверх UDP в пространстве пользователя, а не в ядре, поэтому развивается быстрее, но и процессора пока ест больше. Подробно — модуль 0b.
zero-rtt:
  term: 0-RTT
  en: Zero round-trip time resumption
  short: "Отправка данных в первом же пакете повторного подключения; ценой возможного повтора запроса."
  long: |
    При повторном подключении клиент использует сохранённый секрет и отправляет данные приложения сразу вместе с первым сообщением, без ожидания рукопожатия. Задержка до первого байта сокращается на 1 RTT. Цена: злоумышленник может перехватить и повторить такой пакет, и сервер выполнит запрос дважды. Поэтому по 0-RTT безопасно слать только идемпотентные запросы, например GET. Подробно — модуль 0b.
netem:
  term: netem
  en: Network emulator
  short: "Модуль Linux tc, который добавляет на интерфейс задержку, потери и переупорядочивание пакетов."
  long: |
    Это способ превратить быструю локальную сеть в плохую: например, `tc qdisc add dev eth0 root netem delay 100ms loss 1%` добавляет 100 мс и 1% потерь на исходящий трафик интерфейса. Так на ноутбуке воспроизводят поведение сети между континентами или перегруженного мобильного канала. В лабораторных модуля 0b мы применяем его внутри контейнеров. Подробно — модуль 0b.
pcap:
  term: pcap
  en: Packet capture
  short: "Формат файла с записанными сетевыми пакетами; его пишет tcpdump и открывает Wireshark."
  long: |
    Это «видеозапись» сетевого трафика: каждый пакет с временной меткой и всеми заголовками. `tcpdump -w trace.pcap` записывает её на сервере, а Wireshark открывает на ноутбуке и разбирает по уровням. Чаще всего запись решает споры вроде «сеть виновата или приложение»: видно, кто и когда отправил запрос, и сколько секунд ушло на ответ. Подробно — модуль 0b.
clean-architecture:
  term: Чистая архитектура
  en: Clean Architecture
  short: "Подход, при котором бизнес-логика лежит в центре и не знает про базу, HTTP и фреймворки, а все зависимости направлены к ней."
  long: |
    Представьте луковицу: в центре правила предметной области, вокруг сценарии, дальше адаптеры, снаружи фреймворки и базы. Внешний слой можно заменить, не трогая внутренний, потому что внутренний про внешний ничего не знает. Подробно — урок 1.1.
dependency-rule:
  term: Правило зависимостей
  en: Dependency Rule
  short: "Код внутреннего слоя не импортирует код внешнего: зависимости направлены только к центру."
  long: |
    Это главное правило слоистой архитектуры: domain не знает про usecase, usecase не знает про adapters. Нарушение легко заметить по импортам, поэтому в мессенджере его проверяет линтер. Как только внутренний слой начинает зависеть от внешнего, заменить внешний без переписывания внутреннего уже нельзя. Подробно — урок 1.1.
hexagonal-port:
  term: Порт (портов и адаптеров)
  en: Port
  short: "Интерфейс, который объявляет потребитель и через который он общается с внешним миром, не зная реализации."
  long: |
    Порт похож на розетку: сценарию нужно «сохранить пользователя», и он описывает это интерфейсом у себя дома. Что за розеткой, Postgres или память, ему безразлично. Порт объявляют в пакете потребителя, а не реализации, иначе зависимость развернётся не в ту сторону. Не путать с сетевым портом. Подробно — урок 1.1.
adapter:
  term: Адаптер
  en: Adapter
  short: "Код, который подключает внешний мир к ядру: реализует порт или переводит внешний запрос в вызов use case."
  long: |
    Бывает входящий (HTTP-обработчик превращает запрос в вызов use case) и исходящий (репозиторий на Postgres реализует порт хранилища). Как переходник для розетки: ядро остаётся прежним, меняется только переходник. Адаптеры не знают друг о друге. Подробно — урок 1.1.
composition-root:
  term: Корень композиции
  en: Composition Root
  short: "Единственное место, где создаются все объекты приложения и связываются друг с другом, обычно main."
  long: |
    Остальной код получает зависимости в конструктор и сам ничего не создаёт. Поэтому в main видно весь граф приложения целиком, а в тестах любую зависимость можно подменить. Это сборочный цех, а не бизнес-логика. Подробно — урок 1.1.
big-ball-of-mud:
  term: Большой ком грязи
  en: Big Ball of Mud
  short: "Система без внятной структуры, где всё зависит от всего и любая правка ломает что-то далёкое."
  long: |
    Так выглядит проект, в котором обработчик сам ходит в базу, считает бизнес-правила и шлёт уведомления. Каждая новая функция попадает в самое удобное место, и через год никто не понимает, что на что влияет. Слои и правило зависимостей нужны, чтобы ком не вырос. Подробно — урок 1.1.
ddd:
  term: DDD (предметно-ориентированное проектирование)
  en: Domain-Driven Design
  short: "Подход, в котором структуру кода строят по языку и правилам предметной области, а не по технологиям."
  long: |
    Сначала разбираемся, что на самом деле значит «чат», «участник» и «сообщение» для бизнеса, и только потом пишем структуры. В курсе мы берём лёгкую версию: единый язык, ограниченные контексты, сущности и инварианты. Подробно — урок 1.2.
bounded-context:
  term: Ограниченный контекст
  en: Bounded Context
  short: "Граница, внутри которой слова предметной области имеют одно точное значение."
  long: |
    Слово «пользователь» в контексте регистрации — это логин и профиль, а в контексте чата — участник с ролью. Один общий класс на оба значения разрастается и путает, поэтому у каждого контекста своя модель. В мессенджере два контекста: user и chat. Подробно — урок 1.2.
ubiquitous-language:
  term: Единый язык
  en: Ubiquitous Language
  short: "Общий словарь терминов, одинаковый в разговорах, документах и именах в коде."
  long: |
    Если продакт говорит «участник чата», то в коде должен быть Member, а не User2 или ChatPerson. Когда названия в коде и в речи расходятся, на переводе между ними теряются смысл и время. Подробно — урок 1.2.
entity:
  term: Сущность
  en: Entity
  short: "Объект предметной области с собственной идентичностью: два объекта с одинаковыми полями остаются разными, если у них разные id."
  long: |
    Пользователь меняет имя, но остаётся тем же пользователем, потому что его определяет id, а не набор полей. Сущность живёт долго и меняется. Противоположность — объект-значение. В проектировании базы то же слово означает «то, о чём хранят данные»: в мессенджере это пользователь, чат, сообщение, и у каждой сущности своя таблица; связи между ними описывает [связь](#relationship). Подробно — уроки 1.2 и 2.1.
value-object:
  term: Объект-значение
  en: Value Object
  short: "Неизменяемый объект без идентичности, который определяется только своими значениями."
  long: |
    Сумма денег 100 рублей равна любой другой сумме в 100 рублей, их можно свободно подменять. Так же устроен текст сообщения: после создания не меняется, а правила проверяются при создании. Значение, которое нельзя создать невалидным, упрощает весь остальной код. Подробно — урок 1.2.
aggregate:
  term: Агрегат
  en: Aggregate
  short: "Группа связанных объектов, которую меняют только целиком через один корневой объект, чтобы сохранять инварианты."
  long: |
    Чат с его участниками и счётчиком сообщений: нельзя добавить сообщение в обход чата, иначе нарушится нумерация. Корень агрегата — единственная точка входа, он же отвечает за целостность. Хранят и блокируют агрегат целиком. Подробно — уроки 1.2 и 1.4.
invariant:
  term: Инвариант
  en: Invariant
  short: "Условие, которое должно быть истинным всегда, пока объект существует."
  long: |
    Например, «имя пользователя от 3 до 32 символов» или «отправитель — участник чата». Инвариант охраняется там, где объект создаётся и меняется, а не в HTTP-обработчике: обработчик можно обойти, домен нет. Подробно — урок 1.2.
use-case:
  term: Use case (сценарий использования)
  en: Use Case
  short: "Один сценарий работы приложения, например «отправить сообщение», оформленный отдельным типом с одним методом."
  long: |
    Use case оркестрирует: получает данные, загружает агрегаты через порты, вызывает доменную логику и сохраняет результат. Правил предметной области в нём почти нет, они в домене. Один сценарий — один тип с методом Execute. Подробно — урок 1.4.
sentinel-error:
  term: Сигнальная ошибка
  en: Sentinel Error
  short: "Ошибка, объявленная как переменная пакета, по которой вызывающий узнаёт, что именно случилось."
  long: |
    В Go это var ErrChatNotFound = errors.New(...). Вызывающий сравнивает через errors.Is, а не по тексту. Переменная становится частью публичного контракта пакета, так что называть и добавлять такие ошибки стоит осторожно. Подробно — урок 1.3.
error-wrapping:
  term: Обёртка ошибки
  en: Error wrapping
  short: "Добавление контекста к ошибке через fmt.Errorf с глаголом %w без потери исходной ошибки."
  long: |
    Получается цепочка: «отправка сообщения: загрузка чата: чат не найден». Читателю лога понятно, где случилось, а errors.Is всё равно находит исходную причину в глубине цепочки. Подробно — урок 1.3.
go-context:
  term: context.Context
  en: context.Context
  short: "Объект Go, который несёт через цепочку вызовов сигнал отмены, дедлайн и несколько значений запроса."
  long: |
    Его передают первым аргументом во всё, что может долго ждать: запросы к базе, сети, другие сервисы. Когда клиент закрыл соединение, контекст отменяется, и вся цепочка может прекратить работу. В структуре его хранить нельзя. Подробно — урок 1.5.
cancellation:
  term: Отмена
  en: Cancellation
  short: "Сигнал «результат больше не нужен, прекращай работу», который доходит до всех, кто работает на этот запрос."
  long: |
    Без отмены закрытый клиентом запрос продолжает грузить базу ради никому не нужного ответа. В Go отмена кооперативная: работа сама проверяет ctx.Done() или ctx.Err() и аккуратно останавливается. Подробно — урок 1.5.
deadline:
  term: Дедлайн
  en: Deadline
  short: "Момент времени, после которого операция считается проваленной и должна остановиться."
  long: |
    В отличие от таймаута «не дольше 2 секунд» дедлайн абсолютный: «до 12:00:03». Поэтому его удобно передавать вниз по цепочке: каждый следующий вызов видит, сколько времени осталось всей операции, а не начинает отсчёт заново. Подробно — урок 1.5.
data-race:
  term: Гонка данных
  en: Data race
  short: "Одновременный доступ двух горутин к одной памяти без синхронизации, где хотя бы один доступ — запись."
  long: |
    Результат непредсказуем: счётчик теряет приращения, структура читается наполовину обновлённой. Значения из нескольких машинных слов — интерфейс, срез, строка — могут прочитаться «рваными» (тип от одного значения, данные от другого), и программа падает или портит память. Лечится мьютексом, каналом или атомарными операциями. Гонка данных — не то же самое, что логическая гонка за порядком событий. По модели памяти Go гонка — это два обращения к одной ячейке без отношения «происходит раньше», хотя бы одно из которых — запись и хотя бы одно не атомарное. Подробно — уроки 1.5.3 и 1.6.
race-detector:
  term: Детектор гонок
  en: Race detector
  short: "Режим -race в Go, который во время работы программы замечает одновременный доступ к памяти без синхронизации."
  long: |
    Ловит только те гонки, которые реально случились в этом прогоне, поэтому нужны тесты, нагружающие код из нескольких горутин. Замедляет программу в несколько раз, так что используется в тестах и CI, а не в проде. Внутри — теневая память и векторные часы: у каждой горутины свой счётчик логического времени, и два обращения считаются гонкой, если ни одно из них не «знает» о другом по часам. Об этом — в модели памяти. Подробно — уроки 1.5.3 и 1.6.
test-double:
  term: Тестовый дубль
  en: Test double
  short: "Заменитель настоящей зависимости в тесте: фейк, стаб или мок."
  long: |
    Как дублёр в кино: делает то, что нужно сцене, без риска для оригинала. Дубли позволяют проверить use case без базы и сети. По классификации Месароша их пять: пустышка (dummy) только заполняет параметр и не вызывается; стаб (stub) возвращает заранее заданные ответы; шпион (spy) — стаб, который ещё и записывает, как его вызывали; фейк (fake) — упрощённая, но рабочая реализация; мок (mock) заранее знает, каких вызовов ждать, и сам проверяет их. Подробно — урок 1.6.
fake:
  term: Фейк
  en: Fake
  short: "Упрощённая рабочая реализация зависимости, например хранилище в памяти вместо Postgres."
  long: |
    Настоящая логика, но без настоящих затрат: данные лежат в map, а не на диске. Тест проверяет итоговое состояние, а не последовательность вызовов, поэтому не ломается от рефакторинга. Подробно — урок 1.6.
mock:
  term: Мок
  en: Mock
  short: "Тестовый дубль, который заранее знает, какие вызовы ожидает, и проваливает тест, если вызовы не те."
  long: |
    Проверяет поведение: «метод Save вызван ровно один раз с таким аргументом». Полезен для побочных эффектов вроде отправки письма, но на каждый вызов его применять вредно: тест тогда повторяет код и ломается при любом рефакторинге. Подробно — урок 1.6.
contract-test:
  term: Контрактный тест
  en: Contract test
  short: "Набор тестов, который одинаково проверяет любую реализацию порта и фиксирует его обязательное поведение."
  long: |
    Одну батарею запускают против хранилища в памяти и, позже, против Postgres. Если оба проходят, подменять одно другим безопасно. Так контракт порта становится исполняемой проверкой, а не комментарием. Подробно — урок 1.6.
table-driven-test:
  term: Табличный тест
  en: Table-driven test
  short: "Тест, в котором список случаев задан таблицей, а логика проверки написана один раз."
  long: |
    Каждая строка таблицы — имя, вход и ожидаемый результат, а цикл с t.Run запускает их по очереди. Добавить случай — значит добавить строку, а не копировать функцию. Стандартная идиома Go. Подробно — урок 1.6.
test-pyramid:
  term: Пирамида тестов
  en: Test pyramid
  short: "Модель, по которой быстрых изолированных тестов много, интеграционных меньше, а сквозных совсем немного."
  long: |
    Чем выше уровень, тем тест медленнее, хрупче и дороже в поддержке, зато ближе к настоящему поведению. Домен и use case проверяют юнит-тестами, адаптеры на реальной базе — интеграционными, а сквозные оставляют для главных сценариев. Подробно — урок 1.6.
optimistic-locking:
  term: Оптимистическая блокировка
  en: Optimistic locking
  short: "Способ избежать потерянных обновлений: изменение принимается, только если версия объекта не изменилась с момента чтения."
  long: |
    Мы не запираем объект на время работы, а надеемся, что конфликтов мало. При записи сравниваем версию: если кто-то успел изменить раньше, получаем конфликт и повторяем попытку. Дёшево при редких конфликтах. Подробно — урок 1.4.
mapper:
  term: Маппер
  en: Mapper
  short: "Функция, которая явно переводит одну структуру в другую, например DTO запроса в доменный объект."
  long: |
    Скучный, но важный код: он держит модели разных слоёв независимыми. Изменение формата JSON затрагивает только DTO и маппер, а доменные структуры остаются нетронутыми. Подробно — урок 1.7.
linter:
  term: Линтер
  en: Linter
  short: "Программа, которая автоматически находит в коде подозрительные места и нарушения правил, не запуская его."
  long: |
    В Go обычно запускают golangci-lint — больше сотни линтеров под одной командой. В мессенджере один из них, depguard, ещё и страж архитектуры: он запрещает лишние импорты между слоями, и проверка (golangci-lint run локально и в CI) падает на нарушении. Компилятор такой код соберёт — остановит его именно линтер. Правило, которое проверяет машина, не зависит от внимательности ревьюера. Подробно — урок 1.1.
uuidv7:
  term: UUIDv7
  en: UUID version 7
  short: "Формат идентификатора, в начале которого лежит время создания, так что новые id идут по возрастанию."
  long: |
    Обычные случайные UUID разбросаны по индексу, и вставки в базу дороже. В UUIDv7 первые 48 бит — время в миллисекундах, поэтому записи падают в конец индекса, а сортировка по id почти совпадает со временем создания. Подробно — урок 1.4. Встроенная `uuidv7()` есть и в PostgreSQL 18, но мессенджер генерирует id в приложении, чтобы знать его до `INSERT`; сравнение с [суррогатным ключом](#surrogate-key) на `bigint` и замер — урок 2.3.
rest:
  term: REST
  en: Representational State Transfer
  short: Архитектурный стиль Филдинга для сетевых API — ресурсы, единый интерфейс методов и отсутствие состояния сессии на сервере.
  long: |
    Идея простая. Всё, чем оперирует API, — это ресурсы с адресами, а действия над ними выражаются небольшим общим набором методов (GET, POST, PUT, DELETE). Сервер не помнит клиента между запросами: каждый запрос несёт всё нужное, например токен в заголовке, поэтому любой экземпляр сервера может ответить на любой запрос. В мессенджере `GET /v1/chats` вернёт список чатов, а `POST /v1/chats` создаст новый — и ни тот ни другой не зависят от того, какой процесс обработал предыдущий запрос.
  links:
    - title: Fielding, «Architectural Styles and the Design of Network-based Software Architectures», гл. 5
resource:
  term: Ресурс
  en: Resource
  short: То, на что указывает URI — отдельная сущность или их коллекция.
  long: |
    Ресурс — это существительное API, а не действие. Различают коллекцию (`/v1/chats` — все чаты) и элемент (`/v1/chats/{id}` — конкретный чат). Глагол берётся из метода HTTP, поэтому мы пишем `POST /v1/chats`, а не `/createChat`. Так адресов остаётся мало, а действия над ними единообразны.
safe-method:
  term: Безопасный метод
  en: Safe method
  short: Метод HTTP, который по определению не меняет состояние сервера, — GET, HEAD, OPTIONS.
  long: |
    По RFC 9110 клиент, вызывая безопасный метод, не просит ничего менять и не несёт ответственности за последствия. Поэтому такие запросы можно свободно кешировать, предзагружать и повторять. Если `GET /v1/chats` вдруг удалял бы чат, любой поисковый робот или предзагрузка браузера стали бы причиной потери данных.
  links:
    - title: RFC 9110, раздел 9.2.1 «Safe Methods»
idempotent-method:
  term: Идемпотентный метод
  en: Idempotent method
  short: Метод HTTP, повтор которого даёт тот же эффект, что и один вызов, — безопасные методы, а также PUT и DELETE.
  long: |
    Повторив `DELETE /v1/chats/42` три раза, вы получите тот же итог, что и после одного: чата нет. Это позволяет клиенту без страха повторить запрос, если ответ потерялся в сети. POST этим свойством не обладает: два одинаковых `POST /v1/chats/42/messages` создадут два сообщения. Чтобы сделать POST безопасным для повтора, нужен ключ идемпотентности.
  links:
    - title: RFC 9110, раздел 9.2.2 «Idempotent Methods»
status-code:
  term: Код статуса
  en: HTTP status code
  short: Трёхзначное число в ответе HTTP, которое коротко сообщает, чем закончился запрос; часть контракта API.
  long: |
    Первая цифра задаёт класс: 2xx — успех, 3xx — перенаправление, 4xx — ошибка клиента, 5xx — ошибка сервера. Клиентский код ветвится именно по статусу, поэтому его выбор — не украшение, а обещание. Например, мессенджер отвечает 201 на создание сообщения, 404 на несуществующий чат и 409 на конфликт, а клиент по нему решает, повторять ли запрос. Повтор имеет смысл при 5xx, 429 и 408 (для идемпотентных запросов или с ключом идемпотентности, урок 1.12), а остальные 4xx повторять бессмысленно — запрос надо исправить.
  links:
    - title: RFC 9110, раздел 15 «Status Codes»
api-versioning:
  term: Версионирование API
  en: API versioning
  short: Способ выпускать несовместимые изменения, не ломая старых клиентов; у нас версия живёт в пути, `/v1`.
  long: |
    Мобильное приложение нельзя обновить у всех пользователей одновременно, поэтому сервер должен годами понимать старых клиентов. Когда изменение нельзя сделать совместимым, появляется новая версия, `/v2`, а `/v1` продолжает работать до объявленной даты вывода. Версия в пути проста и заметна в логах; альтернативы — заголовок или параметр медиатипа — чище в теории, но неудобнее на практике.
breaking-change:
  term: Ломающее изменение
  en: Breaking change
  short: Изменение контракта, после которого ранее работавший клиент перестаёт работать.
  long: |
    Ломают: удаление или переименование поля, смена типа, превращение необязательного параметра в обязательный, изменение смысла статуса. Не ломают: новое необязательное поле в ответе или новый эндпоинт, если клиенты не падают на незнакомых полях. Поэтому в мессенджере поле `last_message` в ответе добавить можно, а переименовать `title` в `name` — только в новой версии API.
content-type:
  term: Content-Type
  en: Content-Type
  short: Заголовок HTTP с медиатипом тела сообщения, например `application/json` или `application/problem+json`.
  long: |
    Тело запроса или ответа — просто байты, и получатель должен знать, как их читать. Content-Type это сообщает: `application/json` для обычных данных и `application/problem+json` для ошибок в формате Problem Details. Сервер вправе отвергнуть тело с неожиданным типом кодом 415, а клиент по типу ответа понимает, пришли ему данные или описание ошибки.
  links:
    - title: RFC 9110, раздел 8.3 «Content-Type»
openapi:
  term: OpenAPI
  en: OpenAPI Specification
  short: Машиночитаемое описание HTTP API в формате YAML или JSON — пути, методы, параметры, тела и ошибки.
  long: |
    Один файл `api/openapi.yaml` отвечает на вопросы «какие есть эндпоинты, что в них отправлять и что вернётся». Из него получают документацию, клиентские SDK, серверные заготовки и тесты. Для команды это единый источник правды: если фронтенд и бэкенд расходятся во мнении, прав тот, чьё описание совпадает с файлом.
  links:
    - title: OpenAPI Specification
contract-first:
  term: Contract-first
  en: Contract-first (API-first)
  short: Подход, при котором сначала пишется контракт API, а код подгоняется под него, — в противовес code-first.
  long: |
    При code-first контракт получается побочным продуктом кода, и любая правка обработчика может незаметно изменить API. При contract-first мы сначала согласуем `openapi.yaml`, обсуждаем его с командами клиентов, а потом генерируем из него код. Цена — дисциплина и генератор в сборке, выигрыш — клиенты и сервер могут разрабатываться параллельно и не расходятся.
code-generation:
  term: Генерация кода
  en: Code generation
  short: Получение исходного кода программой из описания; такой код не правится руками.
  long: |
    Из `openapi.yaml` генератор строит типы запросов и ответов и интерфейс сервера, и мы реализуем только интерфейс. Сгенерированные файлы лежат в каталогах `gen/`, помечены строкой `Code generated … DO NOT EDIT.` и коммитятся в репозиторий. Правка вручную бессмысленна: следующий запуск `go generate` её затрёт, поэтому чинят контракт или шаблон, а не результат. Свежесть генерации проверяет `npm run check:messenger`.
json-schema:
  term: JSON Schema
  en: JSON Schema
  short: Язык описания формы JSON-документа — типов полей, обязательности, ограничений.
  long: |
    Схема говорит: «это объект, поле `text` — строка длиной от 1 до 4000 символов, поле `chat_id` обязательно». В OpenAPI на JSON Schema описаны все тела запросов и ответов, поэтому одну и ту же схему можно использовать и для генерации кода, и для валидации входа на границе системы.
  links:
    - title: json-schema.org
backward-compatibility:
  term: Обратная совместимость
  en: Backward compatibility
  short: Свойство нового кода понимать данные и запросы, созданные старой версией.
  long: |
    Новый сервер обязан принимать запросы старых клиентов, а в паре с прямой совместимостью (старый код читает данные нового) это позволяет обновлять части системы по очереди, без остановки. На практике это правило аддитивности: добавлять можно, удалять и менять смысл нельзя. Клеппман показывает, что та же задача возникает при формате хранимых данных и сообщений в очередях, а не только в REST.
  links:
    - title: Клеппман, гл. 4 «Кодирование и эволюция»
problem-details:
  term: Problem Details (RFC 9457)
  en: Problem Details for HTTP APIs
  short: Стандартный JSON-формат описания ошибки HTTP API с полями `type`, `title`, `status`, `detail`.
  long: |
    Вместо собственного формата ошибок в каждом сервисе берут общий, с типом `application/problem+json`. Поле `type` — устойчивый идентификатор проблемы, на который клиент может опираться, `detail` — подробность для человека, а можно добавлять свои поля. Мессенджер отвечает на отправку в несуществующий чат объектом с `status: 404` и понятным `type`, и клиенту не нужно разбирать текст.
  links:
    - title: RFC 9457
offset-pagination:
  term: Offset-пагинация
  en: Offset pagination
  short: Постраничная выдача по схеме «пропусти N записей, верни M»; проста, но страдает от дрейфа и дорогих больших смещений.
  long: |
    Запрос `?offset=100&limit=50` буквально превращается в `OFFSET 100 LIMIT 50`. База вынуждена прочитать и выбросить первые 100 строк, поэтому чем глубже страница, тем дороже запрос. Кроме того, пока клиент листает, в начало списка приходят новые сообщения, и страницы сдвигаются — это дрейф страниц. Для ленты чата, которая постоянно растёт, такой способ плох.
keyset-pagination:
  term: Keyset-пагинация
  en: Keyset (seek) pagination
  short: Постраничная выдача по схеме «дай M записей после последнего увиденного ключа»; стабильна при вставках и не дорожает с глубиной.
  long: |
    Клиент говорит: «дай 50 сообщений старше сообщения X», и база идёт по индексу прямо к нужному месту, ничего не пропуская. Новые записи в начале списка не сдвигают уже просмотренное, поэтому дублей и пропусков нет. Цена — нельзя прыгнуть сразу на страницу 17, только вперёд и назад, но для ленты сообщений это именно то, что нужно.
  links:
    - title: Use The Index, Luke — «Paging Through Results»
cursor:
  term: Курсор пагинации
  en: Pagination cursor
  short: Непрозрачная для клиента строка, в которой сервер закодировал, с какого места продолжать выдачу.
  long: |
    Ответ содержит поле `next_cursor`, а клиент просто возвращает его в следующем запросе, не заглядывая внутрь. Внутри обычно закодирован ключ последней записи, например время и id сообщения. Раз содержимое курсора не часть контракта, сервер вправе потом поменять устройство ключа, не сломав клиентов.
page-drift:
  term: Дрейф страниц
  en: Page drift
  short: Дубли и пропуски записей при листании offset-ом списка, который меняется во время просмотра.
  long: |
    Вы прочли страницу 1 из 50 сообщений, и за это время пришли ещё 3. Теперь страница 2 начнётся на три записи раньше, чем вы ожидали, и вы увидите дубли. Если же сообщения удаляются, часть записей проскочит незамеченной. Лекарство — keyset-пагинация, привязанная к ключу, а не к номеру позиции.
idempotency:
  term: Идемпотентность
  en: Idempotency
  short: Свойство операции, при котором повторный вызов не меняет результат сверх первого раза.
  long: |
    В сети запрос может дойти, а ответ — потеряться, и клиент не знает, выполнилось ли действие. Если операция идемпотентна, он просто повторит её и не создаст дубль. Для мессенджера это критично: нажатие «отправить» при плохой связи не должно породить два одинаковых сообщения.
  links:
    - title: Клеппман, гл. 11, «Идемпотентность»
idempotency-key:
  term: Ключ идемпотентности
  en: Idempotency key
  short: Заголовок `Idempotency-Key`, которым клиент помечает попытку, чтобы сервер мог узнать повтор и не выполнять действие дважды.
  long: |
    Клиент генерирует уникальный ключ для каждого логического действия и посылает его при каждой попытке. Сервер запоминает ключ вместе с результатом: увидев тот же ключ снова, он возвращает сохранённый ответ, а не выполняет работу заново. Если ключ совпал, а запрос другой, это ошибка клиента, и различить случаи помогает отпечаток запроса.
  links:
    - title: IETF draft «The Idempotency-Key HTTP Header Field»
natural-key:
  term: Естественный ключ
  en: Natural key
  short: "Ключ из самих данных предметной области, а не выданный базой: email, код страны, у нас — тройка «чат, автор, `client_message_id`»."
  long: |
    Его значение существует вне базы: его знает пользователь, клиент или внешний справочник. Против него стоит [суррогатный ключ](#surrogate-key) — идентификатор без бизнес-смысла. Естественный ключ хорош, когда он неизменен и короток (код страны `RU`, пара внешних ключей в таблице-связке), и плох, когда может поменяться (имя пользователя, email) — тогда пришлось бы править все ссылки. Обычная практика: первичный ключ суррогатный, а естественный объявлен `UNIQUE`. В мессенджере клиент сам присваивает сообщению `client_message_id` до отправки, и уникальность `(chat_id, author_id, client_message_id)` делает повтор отправки безопасным (урок 1.12) — см. [ограничение](#constraint). Подробно — урок 2.3.
at-least-once:
  term: Как минимум один раз
  en: At-least-once delivery
  short: Гарантия доставки, при которой сообщение может прийти повторно, но не пропадёт.
  long: |
    Чтобы не терять данные, отправитель повторяет попытку, пока не получит подтверждение. Подтверждение само может потеряться, и тогда получатель увидит дубль. Поэтому at-least-once почти всегда сочетают с идемпотентной обработкой на стороне получателя: повтор безвреден. Противоположные гарантии — at-most-once (может потеряться) и недостижимо дорогое exactly-once.
  links:
    - title: Клеппман, гл. 11
request-fingerprint:
  term: Отпечаток запроса
  en: Request fingerprint
  short: Хеш метода, пути, типа и тела запроса, по которому отличают настоящий повтор от другого запроса с тем же ключом идемпотентности.
  long: |
    Клиент мог по ошибке использовать один `Idempotency-Key` для двух разных запросов. Сервер хранит вместе с ключом отпечаток первого запроса и сравнивает его с новым. Совпал — это повтор, возвращаем сохранённый ответ; не совпал — отвечаем ошибкой, а не молча отдаём результат чужой операции.
authentication:
  term: Аутентификация
  en: Authentication
  short: Проверка того, кто вы, — подтверждение личности вызывающего.
  long: |
    Вопрос аутентификации — «кто делает запрос?». В мессенджере пользователь предъявляет логин и пароль и получает токен, а дальше каждый запрос несёт токен, по которому сервер определяет личность. Не путайте с авторизацией: знать, кто вы, ещё не значит разрешать вам читать чужие чаты.
authorization:
  term: Авторизация
  en: Authorization
  short: Проверка того, что вам можно, — решение о том, разрешено ли данному пользователю данное действие.
  long: |
    Личность уже известна из аутентификации, теперь решаем, позволить ли ей действие. В мессенджере читать сообщения чата может только его участник, и это правило проверяет use case, а не транспорт. Отказ в аутентификации даёт 401, отказ в авторизации — 403.
password-hashing:
  term: Хеширование паролей
  en: Password hashing
  short: Хранение не самого пароля, а результата специально медленной функции от пароля и соли.
  long: |
    Если база утечёт, злоумышленник не должен получить пароли. Обычный быстрый хеш вроде SHA-256 не годится: видеокарта перебирает миллиарды вариантов в секунду. Для паролей используют намеренно дорогие функции, такие как Argon2id, bcrypt или scrypt, которые замедляют перебор до непрактичного.
  links:
    - title: OWASP Password Storage Cheat Sheet
salt:
  term: Соль
  en: Salt
  short: Случайные байты, уникальные для каждого хеша пароля, которые не позволяют использовать готовые радужные таблицы.
  long: |
    Без соли два пользователя с одинаковым паролем получили бы одинаковые хеши, а злоумышленник мог бы заранее вычислить хеши популярных паролей. Соль добавляется к паролю перед хешированием и хранится рядом с хешем открыто: её цель не секретность, а уникальность. Современные функции вроде Argon2id генерируют соль сами и кладут её в итоговую строку.
argon2id:
  term: Argon2id
  en: Argon2id
  short: Функция хеширования паролей, требующая много памяти и потому дорогая для перебора на GPU; первый выбор OWASP.
  long: |
    Победитель конкурса Password Hashing Competition 2015. Её стоимость задаётся тремя параметрами — памятью, числом проходов и параллелизмом, — и именно память делает массовый перебор на видеокартах невыгодным. Вариант id сочетает защиту от атак по сторонним каналам и от перебора на GPU. В мессенджере пароли хранятся как строка Argon2id вместе с параметрами и солью.
  links:
    - title: RFC 9106
timing-attack:
  term: Атака по времени
  en: Timing attack
  short: Вывод секрета из того, сколько времени сервер тратит на ответ.
  long: |
    Сравнение строк, которое останавливается на первом несовпавшем символе, отвечает быстрее при раннем расхождении, и атакующий по замерам подбирает значение символ за символом. Для сравнения секретов используют функции с постоянным временем, например `subtle.ConstantTimeCompare`. Та же проблема в логине: если для несуществующего имени ответ приходит быстрее, чем для существующего, мы раскрываем, кто зарегистрирован.
user-enumeration:
  term: Перебор пользователей
  en: User enumeration
  short: Выяснение, какие имена или адреса зарегистрированы, по различиям в ответах или времени ответа.
  long: |
    Если сервер отвечает «такого пользователя нет» на одно имя и «неверный пароль» на другое, атакующий получает список настоящих аккаунтов. Поэтому логин отвечает одинаково в обоих случаях и тратит одно и то же время, в том числе хеширует пароль для несуществующего пользователя. Исключения неизбежны, например при регистрации: имя занято, и это придётся сообщить.
jwt:
  term: JWT
  en: JSON Web Token
  short: Токен по RFC 7519 из трёх частей — заголовка, набора утверждений и подписи, закодированных в base64url.
  long: |
    JWT самодостаточен: сервер проверяет подпись и читает из токена, кто пользователь и до какого времени он действует, не обращаясь к базе. Это удобно для масштабирования, но у токена нет «кнопки отзыва» — он действует, пока не истечёт срок. Содержимое не зашифровано, только подписано, поэтому секреты в токен класть нельзя.
  links:
    - title: RFC 7519
claim:
  term: Claim
  en: Claim
  short: Утверждение внутри токена, например `sub` (субъект), `exp` (срок действия), `aud` (адресат).
  long: |
    Claims — это пары «ключ и значение» в теле JWT. Зарегистрированные имена несут определённый смысл: `sub` — идентификатор пользователя, `iat` — время выдачи, `exp` — момент истечения. Сервер проверяет не только подпись, но и сами утверждения: токен с истёкшим `exp` или чужим `aud` отвергается, даже если подпись верна.
digital-signature:
  term: Цифровая подпись
  en: Digital signature
  short: Доказательство, что данные подписал владелец закрытого ключа и что с тех пор они не менялись.
  long: |
    Подписывающий вычисляет подпись от данных своим закрытым ключом, а проверяющий убеждается в ней открытым. Любое изменение данных делает подпись недействительной, а подделать её без закрытого ключа нельзя. Так сервер доверяет JWT, не храня никакого состояния о выданных токенах.
public-key-cryptography:
  term: Криптография с открытым ключом
  en: Public-key cryptography
  short: Схема с парой ключей — закрытым, которым подписывают, и открытым, которым проверяют.
  long: |
    Закрытый ключ хранится только у того, кто подписывает, а открытый можно раздать всем. Для токенов это означает, что проверять подпись могут многие сервисы, но выпускать токены умеет только один. С симметричной схемой (общий секрет, HMAC) любой, кто умеет проверять, умеет и подделывать, поэтому с ростом числа сервисов асимметричная становится безопаснее.
bearer-token:
  term: Bearer-токен
  en: Bearer token
  short: "Токен «предъявителя» — кто его держит, тот и проходит; передаётся в заголовке `Authorization: Bearer …`."
  long: |
    Сервер не проверяет, тот ли это человек, которому токен выдан, — достаточно самого токена. Поэтому токен нужно защищать так же, как пароль: передавать только по TLS, не писать в логи и не хранить в URL. Короткий срок жизни ограничивает ущерб, если токен всё же утёк.
  links:
    - title: RFC 6750
token-expiry:
  term: Срок жизни токена
  en: Token expiry
  short: Момент, после которого токен недействителен (claim `exp`); короткий срок заменяет мгновенный отзыв.
  long: |
    Самодостаточный токен нельзя отозвать, не заведя на сервере список отозванных, а это возвращает состояние, от которого мы хотели избавиться. Выход — выдавать токены на короткое время, например 15 минут: даже украденный токен быстро перестанет работать. Платой становится необходимость продлевать токен, обычно через отдельный долгоживущий refresh-токен.
request-id:
  term: Идентификатор запроса
  en: Request ID
  short: Метка, по которой ответ клиента связывают со строками в логах сервера.
  long: |
    Middleware присваивает каждому запросу уникальный id, кладёт его в контекст, пишет в каждую строку лога и возвращает клиенту в заголовке `X-Request-ID`. Когда пользователь жалуется на ошибку, он называет этот id, и разработчик за секунды находит всю цепочку событий. В распределённой системе тот же id передают между сервисами.
shared-kernel:
  term: Общее ядро
  en: Shared Kernel
  short: Небольшая часть модели и кода, общая для двух контекстов и меняемая только по соглашению между командами.
  long: |
    Это паттерн из DDD Эванса: два ограниченных контекста совместно владеют узким набором понятий. В мессенджере это `kernel/ident` — проверка формата идентификатора, нужная и чату, и пользователю. Ядро должно быть маленьким и ни от чего проектного не зависеть, иначе оно превратится в свалку, которую никто не смеет менять.
  links:
    - title: Эванс, «Предметно-ориентированное проектирование», гл. 14
anti-corruption-layer:
  term: Антикоррупционный слой
  en: Anti-Corruption Layer
  short: Переводчик между моделями двух контекстов, не дающий чужим понятиям просочиться в вашу модель.
  long: |
    Контекст чатов не должен знать, как устроен пользователь, но ему нужно проверить, что участник существует. Поэтому он объявляет у себя узкий порт `UserChecker`, а адаптер `userchecker` переводит вызов на язык контекста user. Если user поменяет свою модель, правка останется в одном адаптере, а домен чатов не заметит. Тот же приём применён между auth и user в адаптере `userbridge`.
  links:
    - title: Эванс, «Предметно-ориентированное проектирование», гл. 14
unit-of-work:
  term: Unit of Work
  en: Unit of Work
  short: Объект, который собирает изменения одной бизнес-операции и фиксирует их единой транзакцией.
  long: |
    Регистрация пользователя меняет сразу несколько агрегатов: учётную запись и профиль. Unit of Work открывает транзакцию, даёт репозиториям работать внутри неё и в конце делает commit либо rollback, так что наполовину выполненной операции не остаётся. Use case видит лишь узкий порт и не знает про `pgx.Tx`.
  links:
    - title: Фаулер, «Patterns of Enterprise Application Architecture»
container:
  term: Контейнер
  en: Container
  short: Обычный процесс Linux, которому ядро ограничило видимое (namespaces) и доступные ресурсы (cgroups) и подменило корневую файловую систему.
  long: |
    Контейнер не виртуальная машина: своего ядра у него нет, все контейнеры хоста работают на одном ядре. Процесс сервиса `messenger` в контейнере видит только свои процессы, свои сетевые интерфейсы и свою корневую файловую систему из образа, а лимиты памяти и CPU ему задаёт cgroup. Из хоста тот же процесс виден в обычном `ps`. Подробно — урок 1.15.
  links:
    - title: namespaces(7), cgroups(7)
namespace:
  term: Пространство имён (namespace)
  en: Namespace
  short: Механизм ядра Linux, который даёт процессу собственное представление об одном глобальном ресурсе, например о списке процессов, сетевых интерфейсах или точках монтирования.
  long: |
    Типов несколько: `pid`, `net`, `mnt`, `uts`, `ipc`, `user`, `cgroup`, `time`. Процесс в новом `pid` namespace считает себя процессом с номером 1 и не видит чужих процессов, в новом `net` namespace у него свой набор интерфейсов и таблица маршрутов. Namespace только прячет ресурсы, но не ограничивает их количество — это работа cgroup. Создаётся системными вызовами `clone(2)`, `unshare(2)`, присоединиться к существующему можно через `setns(2)`.
  links:
    - title: namespaces(7)
cgroup:
  term: Контрольная группа (cgroup)
  en: Control group
  short: Механизм ядра Linux, который ограничивает и учитывает ресурсы группы процессов — память, CPU, число процессов, ввод-вывод.
  long: |
    В cgroup v2 все контроллеры собраны в одном дереве каталогов в `/sys/fs/cgroup`. Лимит задаётся записью в файл: `memory.max` ограничивает память, `cpu.max` — долю процессорного времени, `pids.max` — число процессов. Процесс попадает в группу, когда его PID записывают в `cgroup.procs`. Превысил `memory.max` — ядро убивает процесс (OOM-kill), превысил `cpu.max` — ядро притормаживает его (троттлинг).
  links:
    - title: Documentation/admin-guide/cgroup-v2.rst
rootfs:
  term: Корневая файловая система контейнера (rootfs)
  en: Root filesystem
  short: Дерево каталогов, которое процесс в контейнере видит как `/`; собирается из слоёв образа.
  long: |
    Внутри rootfs лежат только файлы образа, например статический бинарь `messenger` и корневые сертификаты, без чужих файлов хоста. Ядро одно на всех, поэтому в rootfs нет ядра, только пользовательское пространство. Подмена корня выполняется через `pivot_root` в отдельном mount namespace.
pivot-root:
  term: pivot_root
  en: pivot_root
  short: Системный вызов Linux, который меняет корень всего mount namespace, и старый корень после этого можно отмонтировать.
  long: |
    В отличие от `chroot`, который лишь меняет для процесса точку отсчёта путей, `pivot_root` перекладывает корень mount namespace целиком, а прежний корень становится обычной точкой монтирования, которую затем отмонтируют. Поэтому из контейнера, построенного на `pivot_root`, нельзя выбраться «вверх» к файлам хоста тем способом, каким выходят из плохо настроенного `chroot`. Так делают контейнерные рантаймы, а в лабе курса — наш `minicontainer`.
  links:
    - title: pivot_root(2)
overlayfs:
  term: OverlayFS
  en: OverlayFS
  short: Файловая система ядра Linux, которая накладывает несколько каталогов друг на друга и показывает их как один.
  long: |
    Нижние слои (`lowerdir`) доступны только для чтения, верхний (`upperdir`) — для записи. Читая файл, ядро ищет его сверху вниз; записывая файл из нижнего слоя, копирует его наверх (copy-on-write); удаление отмечается специальным «белым» файлом. Так несколько контейнеров делят одни и те же слои образа, а каждый получает свой тонкий записываемый слой.
  links:
    - title: Документация ядра, overlayfs.rst
oci:
  term: OCI (Open Container Initiative)
  en: Open Container Initiative
  short: Проект Linux Foundation, который стандартизирует формат образа контейнера, формат его запуска и протокол реестров.
  long: |
    Три спецификации — Image Spec (как устроен образ), Runtime Spec (как запускать контейнер из готового rootfs и `config.json`) и Distribution Spec (как передавать образы через реестр). Благодаря им образ, собранный в Docker, запускается и в containerd, и в Podman, и в Kubernetes. Метки образа вида `org.opencontainers.image.source` тоже определены в OCI.
  links:
    - title: OCI Image Specification
      url: https://github.com/opencontainers/image-spec
    - title: OCI Runtime Specification
      url: https://github.com/opencontainers/runtime-spec
container-runtime:
  term: Среда выполнения контейнеров (container runtime)
  en: Container runtime
  short: Программа, которая по готовому rootfs и конфигурации создаёт namespaces и cgroup и запускает в них процесс.
  long: |
    Низкоуровневый рантайм (`runc`) выполняет спецификацию OCI Runtime: делает `clone` с нужными флагами, настраивает cgroup, делает `pivot_root` и запускает процесс. Высокоуровневый (`containerd`) скачивает образы, раскладывает слои и вызывает `runc`. Docker Engine пользуется `containerd`. Наш `minicontainer` — учебный рантайм из сотни строк Go.
privileged-container:
  term: Привилегированный контейнер
  en: Privileged container
  short: Контейнер, запущенный с флагом `--privileged`, то есть почти без ограничений ядра, с доступом к устройствам хоста.
  long: |
    Такой контейнер получает все capabilities, видит устройства хоста и может монтировать файловые системы, поэтому процесс внутри фактически равен root на хосте. Изоляция при этом формально есть, но пробить её тривиально. Для мессенджера он не нужен: сервису хватает непривилегированного пользователя и пустого набора capabilities.
oom-kill:
  term: OOM-kill
  en: Out-of-memory kill
  short: Принудительное завершение процесса ядром, когда группа превысила лимит памяти `memory.max` и память нельзя освободить.
  long: |
    Для контейнера с лимитом 64 МиБ ядро убивает процесс сигналом SIGKILL, как только тому понадобится больше. Код выхода 137 (128 + 9) и поле `OOMKilled` в `docker inspect` — признак именно этого. SIGKILL нельзя перехватить, поэтому корректного завершения не будет. Лимит надо ставить с запасом над реальным потреблением и согласовать с `GOMEMLIMIT`.
cpu-throttling:
  term: Троттлинг CPU
  en: CPU throttling
  short: Принудительная остановка процессов cgroup до конца текущего периода, когда они израсходовали свою квоту процессорного времени.
  long: |
    Лимит `cpu.max` задаётся парой «квота и период», например `50000 100000` — 50 мс из каждых 100 мс, то есть половина ядра. Выбрав квоту, все потоки группы замирают до следующего периода, и запрос, попавший на паузу, получает лишние десятки миллисекунд задержки. Процесс при этом не убит, а просто медленный, поэтому троттлинг заметен лишь по метрикам и по `cpu.stat`.
  links:
    - title: Documentation/admin-guide/cgroup-v2.rst
container-image:
  term: Образ контейнера
  en: Container image
  short: Неизменяемый набор слоёв с файлами и метаданными (команда запуска, переменные окружения, пользователь), из которого создаются контейнеры.
  long: |
    Образ описывается манифестом, где перечислены слои и конфигурация, и адресуется по digest. Образ мессенджера — статический бинарь поверх distroless: кроме него в образе только сертификаты, tzdata и `/etc/passwd`. Образ только читается: контейнер добавляет сверху собственный записываемый слой, который исчезает вместе с контейнером.
  links:
    - title: OCI Image Specification
      url: https://github.com/opencontainers/image-spec
image-layer:
  term: Слой образа
  en: Image layer
  short: Архив с изменениями файловой системы, созданный одной инструкцией Dockerfile; слои образа складываются друг на друга.
  long: |
    Каждая инструкция `COPY` и `RUN` создаёт новый слой с разницей относительно предыдущего. Слои адресуются по хешу содержимого, поэтому одинаковые слои хранятся и передаются один раз, а неизменившиеся пересобирать не нужно. Удаление файла в следующем слое его не убирает из образа — файл остаётся в нижнем слое, поэтому секрет, скопированный и затем удалённый, всё равно можно достать.
build-cache:
  term: Кэш сборки
  en: Build cache
  short: Сохранённые результаты инструкций Dockerfile, которые BuildKit переиспользует, если инструкция и её входные данные не изменились.
  long: |
    Кэш инвалидируется сверху вниз. Как только изменилась одна инструкция или файлы, которые она копирует, все следующие шаги выполняются заново. Поэтому в Dockerfile сначала копируют `go.mod` и `go.sum` и скачивают зависимости, и только потом остальной код: правка исходников не заставит качать модули снова.
  links:
    - title: Документация Docker, Build cache
multi-stage-build:
  term: Многоэтапная сборка (multi-stage build)
  en: Multi-stage build
  short: Dockerfile с несколькими инструкциями `FROM`, в котором в итоговый образ попадает только то, что явно скопировано из предыдущих этапов.
  long: |
    На первом этапе в образе с компилятором Go собирается бинарь, на втором в пустой образ копируется только он (`COPY --from=build`). Компилятор, исходники и кэш модулей остаются в отброшенном этапе и в итог не попадают, поэтому образ мессенджера весит единицы мегабайт вместо сотен.
  links:
    - title: Документация Docker, Multi-stage builds
distroless:
  term: Distroless-образ
  en: Distroless image
  short: Базовый образ без оболочки, пакетного менеджера и лишних утилит, где есть только то, что нужно для запуска программы.
  long: |
    В `gcr.io/distroless/static-debian13` лежат корневые сертификаты, данные часовых поясов и пользователь `nonroot` с UID 65532, а `sh`, `apt` и `curl` нет. Меньше файлов означает меньше уязвимостей для сканера и меньше инструментов у атакующего, который получил выполнение кода. Обратная сторона — в контейнер нельзя зайти через `sh`, а проверку здоровья приходится встраивать в сам бинарь.
  links:
    - title: GoogleContainerTools/distroless
      url: https://github.com/GoogleContainerTools/distroless
static-binary:
  term: Статический бинарь
  en: Static binary
  short: Исполняемый файл, в который включено всё нужное, и ему не требуются внешние библиотеки, в том числе libc.
  long: |
    Go по умолчанию собирает статический бинарь, если отключить cgo (`CGO_ENABLED=0`). Такой файл запускается в пустом образе, где нет ни `libc`, ни динамического загрузчика. Если включён cgo и программа линкуется с glibc, в distroless/static она не запустится — ядро ответит `no such file or directory` про загрузчик.
image-digest:
  term: Digest образа
  en: Image digest
  short: Хеш SHA-256 манифеста образа вида `sha256:…`, который однозначно определяет его содержимое.
  long: |
    Тег, например `golang:1.27`, можно переместить на другой образ, а digest нельзя: если содержимое изменилось, изменится и хеш. Поэтому базовые образы закрепляют по digest (`golang:1.27.3-trixie@sha256:…`), и сборка повторяется бит в бит, а подмена образа в реестре не пройдёт незамеченной.
image-registry:
  term: Реестр образов
  en: Image registry
  short: Сервис, который хранит образы и отдаёт их по протоколу OCI Distribution; примеры — Docker Hub и GitHub Container Registry (GHCR).
  long: |
    Образ адресуется как `ghcr.io/владелец/имя:тег` или `…@sha256:…`. Команда `docker push` загружает слои и манифест, `docker pull` скачивает только недостающие слои. Доступ к приватным образам и публикация требуют аутентификации; в CI для GHCR хватает встроенного `GITHUB_TOKEN` с правом `packages: write`.
  links:
    - title: OCI Distribution Specification
      url: https://github.com/opencontainers/distribution-spec
cve:
  term: CVE (идентификатор уязвимости)
  en: Common Vulnerabilities and Exposures
  short: Общий каталог публично известных уязвимостей; у каждой — номер вида `CVE-2026-12345`, по которому её узнают сканеры, базы и бюллетени.
  long: |
    Каталог ведёт MITRE при участии организаций-нумераторов (CNA), среди которых крупные вендоры и дистрибутивы. Сканер образа (например, `trivy`) составляет список пакетов в образе с версиями и сверяет его с базами уязвимостей: дистрибутивов (Debian, Alpine), языковых экосистем (Go Vulnerability Database даёт идентификаторы `GO-…`) и NVD. Важны два признака находки: уровень (`LOW` … `CRITICAL`) и есть ли уже исправленная версия. Сканер сопоставляет версии, а не проверяет, вызывается ли уязвимый код, поэтому часть находок — шум; достижимость в Go проверяет `govulncheck`.
  links:
    - title: cve.org
      url: https://www.cve.org/
    - title: Go Vulnerability Database
      url: https://pkg.go.dev/vuln/
cgo:
  term: cgo
  en: cgo
  short: Механизм Go для вызова кода на C; когда он включён, программа линкуется с libc и перестаёт быть статическим бинарём.
  long: |
    Переменная `CGO_ENABLED` управляет им при сборке: по умолчанию cgo включён в «родной» сборке, если в системе есть компилятор C, и выключен при кросс-компиляции. Даже без своего кода на C стандартная библиотека использует cgo в пакетах `net` (системный DNS-резолвер) и `os/user` (поиск пользователей через libc). С `CGO_ENABLED=0` они переключаются на реализации на чистом Go, которые читают `/etc/resolv.conf`, `/etc/hosts`, `/etc/nsswitch.conf` и `/etc/passwd` сами.
  links:
    - title: Документация Go, cmd/cgo
      url: https://pkg.go.dev/cmd/cgo
pid-1:
  term: PID 1
  en: PID 1
  short: Первый процесс в своём pid namespace; ядро обращается с ним особо, например не применяет к нему действия сигналов по умолчанию.
  long: |
    В контейнере PID 1 — это сам сервис. Для него ядро не применяет действия по умолчанию: сигнал без установленного обработчика просто игнорируется. На этом попадаются обёртки `sh` без `exec` и программы на многих языках, которые после `docker stop` висят до SIGKILL через 10 секунд. Go-рантайм ставит свои обработчики сам, и необработанный SIGTERM завершает Go-программу сразу с кодом 143 (128+15) в Go 1.27 (в Go 1.26 — 2), резко, без `Shutdown` и без дренажа запросов. Поэтому мессенджер ловит SIGTERM через `signal.NotifyContext` и завершается корректно. Кроме того, PID 1 отвечает за осиротевших потомков: если он не вызывает `wait`, остаются зомби-процессы.
  links:
    - title: pid_namespaces(7)
graceful-shutdown:
  term: Корректное завершение (graceful shutdown)
  en: Graceful shutdown
  short: Остановка сервиса, при которой он перестаёт принимать новые запросы, но дорабатывает уже начатые и только потом выходит.
  long: |
    По SIGTERM мессенджер сначала сообщает, что он не готов (`/readyz` отвечает 503), чтобы балансировщик перестал слать трафик, ждёт короткую паузу, затем вызывает `http.Server.Shutdown`, который закрывает слушающие сокеты и ждёт завершения активных запросов, но не дольше заданного срока. После этого процесс выходит с кодом 0. Если срок вышел, соединения закрываются принудительно, а SIGKILL от оркестратора ещё нескольких секунд спустя убьёт процесс в любом случае.
  links:
    - title: net/http, Server.Shutdown
      url: https://pkg.go.dev/net/http#Server.Shutdown
liveness-probe:
  term: Проба живости (liveness probe)
  en: Liveness probe
  short: Проверка «процесс жив и не завис»; при провале оркестратор перезапускает контейнер.
  long: |
    Проба живости должна проверять только сам процесс и ничего снаружи: ответ `/livez` значит «цикл обработки запросов работает». Если включить в неё проверку базы данных, то при сбое базы оркестратор начнёт перезапускать здоровые экземпляры сервиса, и сбой только усугубится.
readiness-probe:
  term: Проба готовности (readiness probe)
  en: Readiness probe
  short: Проверка «экземпляр готов принимать трафик»; при провале его выводят из балансировки, но не перезапускают.
  long: |
    `/readyz` отвечает 200, когда сервис инициализирован и его зависимости (например, база) доступны, и 503 — пока не готов или уже завершается. Выведенный из балансировки экземпляр продолжает работать и может вернуться, когда проба снова пройдёт. На этом же держится graceful shutdown: первым шагом `/readyz` начинает отвечать 503.
healthcheck:
  term: Healthcheck
  en: Healthcheck
  short: Периодическая проверка состояния контейнера, которую запускает Docker внутри контейнера, и по результатам он помечается healthy или unhealthy.
  long: |
    В образе distroless нет `curl` и оболочки, поэтому проверку делает сам бинарь мессенджера: `messenger healthcheck` обращается к `/livez` на loopback и выходит с кодом 0 или 1. Docker сам контейнер при `unhealthy` не перезапускает, статус нужен Compose (`depends_on: condition: service_healthy`) и оркестраторам.
  links:
    - title: Документация Docker, HEALTHCHECK
      url: https://docs.docker.com/reference/dockerfile/#healthcheck
twelve-factor:
  term: Двенадцать факторов (The Twelve-Factor App)
  en: The Twelve-Factor App
  short: Набор из двенадцати принципов построения сервисов, которые удобно развёртывать и масштабировать; сформулирован в 2011 году разработчиками Heroku.
  long: |
    Среди принципов — конфигурация в переменных окружения, а не в коде, логи как поток событий в stdout, быстрый старт и корректное завершение, паритет окружений разработки и продакшена, процессы без состояния. Мессенджер следует им: адрес и пароли приходят из окружения, журнал пишется в stdout, а секреты читаются из файла, на который указывает переменная.
  links:
    - title: The Twelve-Factor App
      url: https://12factor.net/
request-timeout:
  term: Таймаут запроса
  en: Request timeout
  short: Предельное время, за которое сервер обязан обработать запрос, иначе он прерывает работу и отвечает ошибкой.
  long: |
    Без таймаута зависший вызов в базу держит горутину, соединение и память сколько угодно долго, и пачка таких запросов исчерпывает ресурсы сервиса. В мессенджере middleware `Timeout` вешает на контекст запроса дедлайн; по его истечении ответ — 503 с кодом `timeout`. Таймаут запроса должен быть меньше `WriteTimeout` сервера, иначе клиент увидит обрыв вместо внятной ошибки.
gomemlimit:
  term: GOMEMLIMIT
  en: GOMEMLIMIT
  short: Мягкий лимит памяти для сборщика мусора Go, введён в Go 1.19; сам из cgroup не выставляется.
  long: |
    Когда потребление приближается к `GOMEMLIMIT`, сборщик работает чаще, чтобы остаться в пределах. Лимит именно мягкий: если живых данных больше, ограничитель CPU сборщика (он работает всегда, но здесь срабатывает чаще всего) не даст сборщику взять больше примерно половины процессора, процесс вырастет сверх лимита и в итоге будет убит OOM-kill. Рантайм не читает `memory.max` из cgroup, поэтому значение задают вручную, обычно около 90% лимита контейнера, оставляя запас на память вне кучи.
  links:
    - title: Go GC guide, Memory limit
      url: https://go.dev/doc/gc-guide
gomaxprocs:
  term: GOMAXPROCS
  en: GOMAXPROCS
  short: Число потоков ОС, которые одновременно исполняют Go-код; с Go 1.25 рантайм по умолчанию учитывает лимит CPU cgroup (`cpu.max`).
  long: |
    До Go 1.25 значением по умолчанию было число ядер хоста, и контейнер с лимитом в 1 ядро на 64-ядерной машине запускал 64 потока, которые быстро упирались в троттлинг. Начиная с Go 1.25 рантайм читает `cpu.max` и берёт из него потолок (дробная часть округляется вверх, а лимит меньше 2 — до 2), а также раз в секунду проверяет, не изменился ли он. Явная переменная окружения `GOMAXPROCS` отключает это поведение. Итоговое значение — минимум из числа доступных ядер (с учётом affinity процесса) и квоты cgroup. Разбор планировщика — урок 1.5.1.
  links:
    - title: Go 1.25 Release Notes
      url: https://go.dev/doc/go1.25
startup-probe:
  term: Проба запуска (startup probe)
  en: Startup probe
  short: Проверка «приложение закончило запускаться»; пока она не прошла, Kubernetes не запускает пробы живости и готовности.
  long: |
    Нужна медленно стартующим сервисам: без неё пришлось бы делать пробу живости терпеливой на всё время жизни процесса, лишь бы она не убила его на старте. Проба запуска выполняется только при старте; если она так и не прошла за отведённое число попыток, kubelet убивает контейнер. Мессенджер стартует за миллисекунды, и ему она не нужна.
  links:
    - title: Kubernetes, Liveness, Readiness, and Startup Probes
      url: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
zombie-process:
  term: Процесс-зомби (zombie process)
  en: Zombie process
  short: Завершившийся процесс, код выхода которого ещё никто не забрал вызовом wait; от него остаётся запись в таблице процессов.
  long: |
    Код выхода забирает родитель. Если родитель умер раньше, сироту усыновляет init своего pid namespace — в контейнере это PID 1, — и забирать коды выхода сирот приходится ему. Сервис, который не запускает дочерних процессов, зомби не плодит; тот, что запускает (shell-скрипты, конвертеры медиа), ставит перед собой маленький init вроде `tini` (`docker run --init`).
  links:
    - title: wait(2)
linux-capability:
  term: Capability (Linux)
  en: Linux capability
  short: Отдельная привилегия root (сменить владельца файла, открыть порт ниже 1024, трассировать процесс), которую можно выдать или отнять по одной.
  long: |
    Ядро Linux делит всемогущество root примерно на сорок capabilities. Docker по умолчанию оставляет контейнеру около полутора десятков; `cap_drop: [ALL]` отнимает все. Мессенджер слушает порт 8080 и работает от пользователя 65532, поэтому ни одна capability ему не нужна, а атакующему, получившему выполнение кода, не достанется ни одной.
  links:
    - title: capabilities(7)
ci:
  term: Непрерывная интеграция (CI)
  en: Continuous Integration
  short: Практика, при которой каждое изменение кода автоматически собирается и проверяется тестами и линтерами на чистой машине.
  long: |
    Разработчик открывает pull request, а сервер сам прогоняет сборку, тесты, линтеры и сканеры. Красная проверка блокирует слияние, поэтому в основную ветку не попадает то, что не собирается или ломает тесты. Ценность CI в воспроизводимости: проверка идёт не на машине автора, а в чистом окружении, где нет локальных настроек и забытых файлов.
cd:
  term: Непрерывная доставка (CD)
  en: Continuous Delivery
  short: Практика, при которой любое прошедшее проверки изменение автоматически собирается в готовый к выпуску артефакт, а выкладка происходит по кнопке или сама.
  long: |
    Под CD понимают два разных слова. Continuous Delivery — артефакт всегда готов к выпуску, выкатка запускается человеком; Continuous Deployment — каждое прошедшее проверки изменение выкатывается без участия человека. В курсе конвейер публикует образы в реестр и курс на GitHub Pages после слияния в основную ветку.
pipeline:
  term: Конвейер CI/CD (pipeline)
  en: Pipeline
  short: Описанная в коде последовательность автоматических шагов от изменения кода до проверенного артефакта или выкладки.
  long: |
    Конвейер состоит из джоб (jobs), у джоб есть шаги, а между джобами задаются зависимости: образ собирается, только если прошли тесты. В GitHub Actions конвейер описывается YAML-файлом в `.github/workflows` и хранится вместе с кодом, поэтому его правят тем же pull request, что и код.
  links:
    - title: Документация GitHub Actions
      url: https://docs.github.com/actions
ci-job:
  term: Джоба CI (job)
  en: Job
  short: Единица конвейера, набор шагов, который выполняется на одной машине (раннере) и либо проходит, либо падает целиком.
  long: |
    Джобы по умолчанию идут параллельно и в изолированных окружениях, поэтому общие файлы передаются как артефакты, а порядок задаётся ключом `needs`. У каждой джобы свои права `permissions` и предельное время `timeout-minutes`: зависшая джоба иначе будет занимать раннер до лимита в шесть часов.
runner:
  term: Раннер (runner)
  en: Runner
  short: Машина, на которой выполняется джоба CI; GitHub выдаёт чистую виртуальную машину на каждую джобу.
  long: |
    Раннер с меткой `ubuntu-latest` — свежая виртуальная машина с предустановленными Docker, Go и Node. После джобы она уничтожается, поэтому ничего не переживает между запусками, кроме явно сохранённого кэша или артефактов. Можно подключить и собственный раннер, но тогда безопасность окружения на вашей совести.
  links:
    - title: Документация GitHub Actions, runners
      url: https://docs.github.com/actions/concepts/runners
required-check:
  term: Обязательная проверка (required status check)
  en: Required status check
  short: Проверка, без успешного прохождения которой защищённую ветку нельзя слить.
  long: |
    Настройка защиты ветки (`branch protection` или ruleset) перечисляет джобы, которые обязаны быть зелёными. Тонкость в пропусках. Джоба, пропущенная условием `if:`, сообщает успех. А если весь workflow не запустился из-за фильтра `on.<событие>.paths`, фильтра веток или `[skip ci]`, его обязательные проверки остаются в состоянии Pending, и слияние заблокировано. Поэтому в монорепозитории путь фильтруют на уровне джоб, а не workflow, и добавляют итоговую джобу `ci-ok`: у неё одно стабильное имя для защиты ветки, и она краснеет, если любая джоба упала или отменена, в том числе фильтрующая `changes`. Без неё гейты, пропущенные из-за сбоя выше по цепочке, считались бы пройденными.
  links:
    - title: Документация GitHub, protected branches
      url: https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
monorepo:
  term: Монорепозиторий
  en: Monorepo
  short: Один репозиторий, в котором лежит код нескольких проектов, например курса, мессенджера и лаб.
  long: |
    Преимущество — атомарное изменение: правка контракта API, кода и урока попадает в одном коммите. Цена — конвейер должен запускать только затронутое, иначе правка опечатки в уроке пересобирает образы. Для этого фильтруют пути на уровне джоб, например через `dorny/paths-filter`, а не на уровне workflow: пропущенный целиком workflow оставил бы обязательные проверки в Pending. Единая итоговая джоба `ci-ok` даёт защите ветки одно стабильное имя.
least-privilege:
  term: Принцип минимальных привилегий
  en: Principle of least privilege
  short: Каждому процессу, пользователю или токену даётся ровно тот доступ, который нужен для его задачи, и не больше.
  long: |
    В конвейере это значит, что `GITHUB_TOKEN` по умолчанию только читает, а нужные права (`packages: write`, `id-token: write`) выдаются конкретной джобе, а не всему workflow. В контейнере — запуск от `nonroot`, файловая система только для чтения, пустой набор capabilities. Чем меньше прав у скомпрометированного звена, тем меньше ущерб.
action-pinning:
  term: Закрепление action по SHA
  en: Action pinning
  short: Указание версии action в workflow полным хешем коммита вместо тега, чтобы код action нельзя было подменить задним числом.
  long: |
    Тег вроде `v4` можно переместить, и тогда следующий запуск выполнит чужой код с доступом к секретам репозитория. Полный SHA коммита неизменяем, поэтому пишут `uses: actions/checkout@3d3c42e5… # v7.0.1`, а версию держат в комментарии. Обновлять такие закрепления вручную тяжело, поэтому их доверяют автообновлению зависимостей.
  links:
    - title: GitHub, Security hardening for GitHub Actions
      url: https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
supply-chain-attack:
  term: Атака на цепочку поставок
  en: Supply chain attack
  short: Атака, при которой вредоносный код попадает в продукт не напрямую, а через зависимость, инструмент сборки или образ, которым доверяют.
  long: |
    Атакующий компрометирует библиотеку, action, базовый образ или сам сборочный конвейер, и вредоносный код приезжает в ваш артефакт под видом обычного обновления. Защита многослойна: закрепление версий по хешу, сканирование уязвимостей, SBOM, подписанные аттестации о происхождении сборки и минимальные права у конвейера.
sbom:
  term: SBOM (Software Bill of Materials)
  en: Software Bill of Materials
  short: Машиночитаемый перечень всех компонентов и зависимостей, из которых собрано программное обеспечение.
  long: |
    SBOM в форматах SPDX или CycloneDX отвечает на вопрос «входит ли уязвимая библиотека в этот образ». Когда в открытой библиотеке находят уязвимость, по SBOM можно за минуты найти все затронутые образы, не разбирая их вручную. Для Go-бинаря список модулей встроен в сам файл, его читает `go version -m`.
  links:
    - title: SPDX
      url: https://spdx.dev/
provenance:
  term: Происхождение сборки (provenance)
  en: Build provenance
  short: Подписанное утверждение о том, откуда, из какого коммита и каким конвейером собран артефакт.
  long: |
    Provenance связывает образ (по digest) с репозиторием, коммитом, workflow и раннером, которые его собрали. Потребитель проверяет подпись и убеждается, что образ собран именно вашим конвейером, а не загружен кем-то с ноутбука. В GitHub такие утверждения создаёт `actions/attest-build-provenance`, а проверяет `gh attestation verify`.
  links:
    - title: SLSA Provenance v1.0
      url: https://slsa.dev/spec/v1.0/provenance
slsa:
  term: SLSA
  en: Supply-chain Levels for Software Artifacts
  short: Каркас безопасности цепочки поставок, который описывает уровни зрелости сборки, от «есть provenance» до «сборка изолирована и неподделываема».
  long: |
    SLSA (произносится «сальса») v1.0 в треке Build определяет три уровня. На первом сборка документируется provenance, на втором provenance подписан хостируемой платформой, на третьем сборка ещё и изолирована так, что ключи подписи недоступны шагам сборки. Сборка в GitHub Actions с `attest-build-provenance` даёт, по оценке GitHub, уровень 2 и при использовании изолированных reusable workflow — уровень 3.
  links:
    - title: SLSA v1.0
      url: https://slsa.dev/spec/v1.0/
attestation:
  term: Аттестация (attestation)
  en: Attestation
  short: Подписанное утверждение об артефакте — например, о том, как он собран, — привязанное к его digest.
  long: |
    Аттестация состоит из предмета (digest артефакта), предиката (само утверждение: provenance, SBOM, результаты сканирования) и подписи. Подпись выдаётся без долгоживущих ключей: workflow получает короткоживущий сертификат Sigstore по OIDC-токену GitHub. Аттестации образа хранятся рядом с ним в реестре.
  links:
    - title: in-toto Attestation Framework
      url: https://github.com/in-toto/attestation
    - title: Sigstore
      url: https://www.sigstore.dev/
dependency-update:
  term: Автообновление зависимостей
  en: Automated dependency updates
  short: Бот, который сам открывает pull request с новыми версиями зависимостей, action и базовых образов, чтобы закреплённые версии не устаревали.
  long: |
    Закрепление по хешу защищает от подмены, но даёт обратный риск: версии застывают и копят известные уязвимости. Dependabot или Renovate еженедельно предлагают обновления отдельными PR, которые проходят тот же CI. Человек смотрит на список изменений и решает, сливать ли, а выдержка в две недели для свежих релизов снижает риск попасть на скомпрометированную версию.
  links:
    - title: Документация Dependabot
      url: https://docs.github.com/code-security/dependabot
technical-interview:
  term: Техническое собеседование
  en: Technical interview
  short: Разговор с инженерами компании, на котором проверяют, как кандидат рассуждает о задачах, а не только что он помнит.
  long: |
    Секция по проектированию систем обычно длится 45–60 минут: интервьюер даёт расплывчатую задачу вроде «спроектируй мессенджер», а кандидат уточняет требования, прикидывает нагрузку, рисует архитектуру и обсуждает компромиссы. Оценивают ход мысли, а не единственный верный ответ. Для сервиса из курса типичные вопросы — как он запускается, масштабируется и выкатывается, поэтому в части 1c есть тренажёр собеседования.
goroutine:
  term: Горутина
  en: Goroutine
  short: "Легковесная «нить» исполнения Go: стартует со стека около 2 КБ, а переключением между горутинами занимается рантайм Go, а не ядро ОС."
  long: |
    Запускается словом `go` перед вызовом функции. Поток ОС стоит мегабайты виртуальной памяти и переключается через ядро, а горутина — килобайты, и её переключение происходит в пространстве пользователя, поэтому их можно держать сотни тысяч. Стек горутины растёт по мере надобности: рантайм копирует его в больший участок памяти. Дешевизна не бесплатна: каждая горутина всё равно занимает память и должна кем-то останавливаться, иначе она утечёт. Подробно — урок 1.5.1.
  links:
    - title: Go FAQ, Why goroutines instead of threads?
      url: https://go.dev/doc/faq#goroutines
os-thread:
  term: Поток ОС
  en: OS thread
  short: Единица исполнения, которую создаёт и планирует ядро операционной системы; стоит мегабайты памяти и переключается через ядро.
  long: |
    Ядро выдаёт потоку процессорное время, а при переключении сохраняет и восстанавливает его регистры; это порядка микросекунд и сброс части кэшей. Под стек потока обычно резервируют 8 МБ виртуальной памяти. Поэтому тысячи потоков уже тяжелы, а Go запускает на потоках ОС много горутин сразу. Подробно — урок 1.5.1.
  links:
    - title: Go FAQ, Why goroutines instead of threads?
      url: https://go.dev/doc/faq#goroutines
go-scheduler:
  term: Планировщик Go
  en: Go scheduler
  short: Часть рантайма Go, которая распределяет горутины по потокам ОС и решает, какая горутина исполняется следующей.
  long: |
    Работает в пространстве пользователя и не обращается к ядру на каждое переключение. Планировщик берёт готовую горутину из очереди, запускает её на потоке, а когда она блокируется на канале или мьютексе, ставит на поток другую. Устроен по модели GMP. Подробно — урок 1.5.1.
  links:
    - title: Go runtime, proc.go
      url: https://github.com/golang/go/blob/master/src/runtime/proc.go
gmp:
  term: Модель GMP
  en: G, M, P model
  short: Три сущности планировщика Go — G (горутина), M (поток ОС) и P (право исполнять Go-код); число P равно GOMAXPROCS.
  long: |
    G — горутина с её стеком и состоянием. M — поток ОС, который реально выполняет инструкции. P — «рабочее место»: у него своя очередь горутин и кэши, и без P поток не может исполнять Go-код. Таких мест ровно `GOMAXPROCS`, поэтому одновременно Go-код исполняется не более чем на этом числе потоков. Если поток уходит в блокирующий системный вызов, P забирает другой поток, и работа не простаивает. Подробно — урок 1.5.1.
  links:
    - title: Go runtime, proc.go
      url: https://github.com/golang/go/blob/master/src/runtime/proc.go
run-queue:
  term: Очередь выполнения
  en: Run queue
  short: "Очередь горутин, готовых к запуску: локальная у каждого P (до 256 мест) и одна глобальная на всех."
  long: |
    Новая горутина попадает в локальную очередь того P, который её создал; у P есть ещё слот `runnext` для горутины, которую выгодно запустить следующей. Если локальная очередь переполнена, половина уходит в глобальную. Глобальную очередь проверяют раз в 61 такт планировщика, чтобы горутины в ней не голодали. Подробно — урок 1.5.1.
work-stealing:
  term: Кража работы
  en: Work stealing
  short: "Приём планировщика: P без работы забирает половину очереди у другого P, чтобы ядра не простаивали."
  long: |
    Если локальная и глобальная очереди пусты, P просматривает очереди соседей в случайном порядке и переносит себе половину найденного. Так нагрузка выравнивается без общего замка, на который бы все стояли в очереди. Поток, ищущий работу, «спиннит» (крутится в поиске), прежде чем заснуть. Подробно — урок 1.5.1.
  links:
    - title: Go runtime, proc.go
      url: https://github.com/golang/go/blob/master/src/runtime/proc.go
preemption:
  term: Вытеснение
  en: Preemption
  short: Принудительное снятие горутины с процессора, чтобы одна горутина не заняла его надолго; в Go бывает кооперативным и асинхронным.
  long: |
    Кооперативное вытеснение срабатывает в прологе вызова функции: рантайм помечает горутину, и при следующем вызове она уступает. Цикл `for {}` без вызовов до Go 1.14 так и не уступал и мог повесить программу. С Go 1.14 есть асинхронное вытеснение: поток получает сигнал `SIGURG` и останавливает горутину почти в любом месте. Подробно — урок 1.5.1.
  links:
    - title: Go 1.14 Release Notes
      url: https://go.dev/doc/go1.14
sysmon:
  term: sysmon
  en: sysmon
  short: Служебный поток рантайма Go без P, который следит за долгими системными вызовами и горутинами, занявшими P слишком надолго.
  long: |
    Просыпается по таймеру и отбирает P у потока, застрявшего в системном вызове, отдавая его другому потоку; помечает горутины, работающие дольше 10 мс, для вытеснения; опрашивает сеть, если никто этого не делал. Благодаря ему блокировка одной горутины не останавливает остальные. Подробно — урок 1.5.1.
channel:
  term: Канал
  en: Channel
  short: "Типизированная труба между горутинами в Go: передаёт значения и одновременно синхронизирует отправителя и получателя."
  long: |
    Создаётся через `make(chan T)` или `make(chan T, n)`. Внутри — кольцевой буфер, очереди ждущих отправителей и получателей и замок. Отправка и получение синхронизируют горутины: то, что было записано до отправки, видно после получения. Закрывает канал тот, кто в него пишет, причём один раз. Подробно — урок 1.5.2.
  links:
    - title: Go Spec, Channel types
      url: https://go.dev/ref/spec#Channel_types
unbuffered-channel:
  term: Небуферизованный канал
  en: Unbuffered channel
  short: "Канал без буфера (`make(chan T)`): отправка ждёт получателя, а получение ждёт отправителя — это «рандеву» двух горутин."
  long: |
    Значение передаётся напрямую от отправителя к получателю, мимо любого буфера. Обе стороны должны быть готовы одновременно, поэтому такой канал и передаёт данные, и гарантирует, что обе горутины дошли до этой точки. Подходит для сигналов и строгой синхронизации. Подробно — урок 1.5.2.
buffered-channel:
  term: Буферизованный канал
  en: Buffered channel
  short: "Канал с буфером на n значений (`make(chan T, n)`): отправка блокируется, только когда буфер полон, а получение — когда он пуст."
  long: |
    Это ограниченная очередь: отправитель и получатель работают независимо, пока буфер не заполнился. Размер буфера — решение о том, сколько работы можно накопить, а не способ «убрать блокировки». Полный буфер — готовая точка обратного давления. Подробно — урок 1.5.2.
select:
  term: select
  en: select
  short: Оператор Go, который ждёт сразу несколько операций с каналами и выполняет одну из готовых; если готовых несколько — выбирает случайную.
  long: |
    Есть ветка `default` — тогда `select` не блокируется. Канал `nil` никогда не готов, поэтому присвоив ветке `nil`, её можно временно выключить. Случайный выбор не даёт одной ветке занять всё внимание. Типичное применение — ждать данные и отмену `ctx.Done()` одновременно. Подробно — урок 1.5.2.
  links:
    - title: Go Spec, Select statements
      url: https://go.dev/ref/spec#Select_statements
sudog:
  term: sudog
  en: sudog (pseudo-g)
  short: "Запись рантайма Go «эта горутина ждёт на этом канале»: по ней ждущую горутину ставят в очередь канала и потом будят."
  long: |
    Горутина может ждать сразу на нескольких каналах (в `select`), а на одном канале могут ждать многие горутины, поэтому рантайм не кладёт в очередь саму горутину, а заводит на каждое ожидание отдельную запись `sudog`. В ней — ссылка на горутину, на канал и адрес значения, которое надо отдать или куда записать полученное. Записи берутся из пула (`acquireSudog`/`releaseSudog`), очереди `sendq` и `recvq` канала — двусвязные списки таких записей. Подробно — урок 1.5.2.
  links:
    - title: runtime/runtime2.go, type sudog
      url: https://github.com/golang/go/blob/go1.27.2/src/runtime/runtime2.go
csp:
  term: CSP
  en: Communicating Sequential Processes
  short: "Модель конкурентности Тони Хоара (1978): независимые последовательные процессы без общей памяти обмениваются сообщениями, и обмен сам их синхронизирует."
  long: |
    В статье Хоара отправка и получение — синхронные команды: обе стороны встречаются в одной точке (рандеву), а альтернативная команда с «охраной» ждёт ту из нескольких операций, что готова первой. FAQ Go называет её потомками occam и Erlang, а сам Go взял идею через Newsqueak и Limbo, добавив главное: канал — самостоятельное значение, которое можно передавать. `select` в Go — прямой потомок охраняемой команды Хоара. Подробно — урок 1.5.2.
  links:
    - title: C. A. R. Hoare, Communicating Sequential Processes, CACM, 1978
    - title: Go FAQ, Why build concurrency on the ideas of CSP?
      url: https://go.dev/doc/faq#csp
deadlock:
  term: Взаимная блокировка
  en: Deadlock
  short: "Состояние, в котором горутины ждут друг друга (или то, чего никто никогда не сделает), и ни одна не может продолжить."
  long: |
    Классика — две горутины берут два замка в разном порядке и ждут друг друга вечно. С каналами то же самое выглядит как отправка, которую никто не примет, или получение из канала, в который никто не напишет. Рантайм Go ловит только полный случай: если заблокированы все горутины программы, он падает с `fatal error: all goroutines are asleep - deadlock!`. Если в программе есть хоть что-то живое — работающая горутина, ожидание сети, таймер в куче P (`time.Sleep`, `AfterFunc`, ожидание на канале таймера), — зависшие горутины стоят молча, и это уже утечка горутин. Подробно — урок 1.5.2.
memory-model:
  term: Модель памяти
  en: Memory model
  short: Набор правил языка о том, когда запись одной горутины гарантированно видна чтению в другой.
  long: |
    Без этих правил компилятор и процессор вправе переставлять операции и держать значения в регистрах и буферах, поэтому «прочитать флаг, который выставила другая горутина» ничего не гарантирует. Модель памяти Go определяет события синхронизации (каналы, мьютексы, `sync.Once`, атомики) и порядок «происходит раньше» между ними. Программа без гонок ведёт себя так, будто операции выполняются по очереди. Подробно — урок 1.5.3.
  links:
    - title: The Go Memory Model
      url: https://go.dev/ref/mem
happens-before:
  term: Происходит раньше
  en: Happens-before
  short: "Частичный порядок между операциями: если A происходит раньше B, то результат A гарантированно виден в B."
  long: |
    Порядок возникает из синхронизации: отправка в канал происходит раньше соответствующего получения, `Unlock` — раньше следующего `Lock`, завершение `Once.Do` — раньше возврата любого другого вызова. Если между двумя обращениями к одной переменной (одно — запись) такого порядка нет, это гонка данных. Подробно — урок 1.5.3.
  links:
    - title: The Go Memory Model
      url: https://go.dev/ref/mem
sequential-consistency:
  term: Последовательная согласованность
  en: Sequential consistency
  short: "Свойство исполнения: результат такой, будто операции всех потоков шли по очереди в одном общем порядке, а операции каждого потока — в порядке его программы."
  long: |
    Определение Лесли Лэмпорта (1979). Это самая простая для человека модель: «перемешайте строки горутин, не меняя порядок внутри каждой, — и любое возможное поведение будет одним из таких перемешиваний». Ни современные процессоры, ни оптимизирующие компиляторы её бесплатно не дают. Языки обещают её только программам без гонок данных — это гарантия DRF-SC (data-race-free → sequentially consistent), которую дают Go, Java, C++ и другие. Атомики Go последовательно согласованы между собой. Подробно — урок 1.5.3.
  links:
    - title: Russ Cox, «Hardware Memory Models»
      url: https://research.swtch.com/hwmm
store-buffer:
  term: Буфер записи
  en: Store buffer
  short: Очередь внутри ядра процессора, куда попадают записи, прежде чем дойти до кэша и стать видимыми другим ядрам.
  long: |
    Ядро не ждёт, пока запись дойдёт до памяти: кладёт её в свой буфер и выполняет следующие команды. Своё ядро свои записи из буфера видит, чужие ядра — нет, пока буфер не сольётся. Поэтому даже на x86 чтение может «обогнать» более раннюю запись в другую ячейку, и две горутины, записав каждая свою переменную, могут обе прочитать нули у соседа. Атомарные операции и мьютексы сливают буфер (на x86 — инструкцией `XCHG` с неявной блокировкой). Подробно — урок 1.5.3.
  links:
    - title: "Russ Cox, «Hardware Memory Models», Litmus Test: Write Queue"
      url: https://research.swtch.com/hwmm
vector-clock:
  term: Векторные часы
  en: Vector clock
  short: "Набор логических счётчиков, по одному на каждый поток: по нему можно проверить, «знал» ли один поток о событии другого, то есть упорядочены ли события."
  long: |
    Каждый поток увеличивает свой счётчик на каждом событии. При синхронизации (освобождение и захват мьютекса, отправка и получение) получатель берёт поэлементный максимум со своими часами — так «знание» о чужих событиях передаётся по цепочке. Событие A потока T произошло раньше события B, если часы в момент B хранят для T значение не меньше, чем у A. На этом устроен детектор гонок Go (ThreadSanitizer): если запись другой горутины по часам «не видна», это гонка. Подробно — урок 1.5.3.
shadow-memory:
  term: Теневая память
  en: Shadow memory
  short: Служебная память детектора гонок, где для каждого участка памяти программы хранятся сведения о последних обращениях к нему.
  long: |
    В ThreadSanitizer (на нём построен `-race` в Go) каждым 8 байтам памяти программы соответствуют 4 ячейки теневой памяти по 32 бита: какой поток обращался, в какой момент по его часам, чтение это или запись, какие из 8 байт задеты. Адрес тени вычисляется из адреса данных простой формулой, без поиска. Ячеек всего четыре, поэтому старые обращения вытесняются, и гонка с давним обращением может остаться незамеченной. Подробно — урок 1.5.3.
  links:
    - title: ThreadSanitizer, tsan_defs.h и tsan_shadow.h (LLVM)
      url: https://github.com/llvm/llvm-project/tree/main/compiler-rt/lib/tsan/rtl
mutex:
  term: Мьютекс
  en: Mutex
  short: "Замок взаимного исключения: в критической секции одновременно находится только одна горутина."
  long: |
    В Go это `sync.Mutex`: `Lock` ждёт, пока замок свободен, `Unlock` отпускает его, и записанное до `Unlock` видно после следующего `Lock`. Быстрый путь — одна атомарная операция CAS; при конкуренции горутина немного крутится, а затем встаёт в очередь. Критическую секцию держат минимальной, а `Unlock` вызывают через `defer`. Подробно — урок 1.5.4.
  links:
    - title: sync.Mutex
      url: https://pkg.go.dev/sync#Mutex
rwmutex:
  term: Мьютекс чтения и записи
  en: RWMutex
  short: Замок, который пускает одновременно много читателей или одного писателя; выигрывает не всегда.
  long: |
    `sync.RWMutex` ускоряет код, где долгие чтения заметно преобладают над записями. На коротких секциях выигрыша может не быть вовсе: каждый `RLock` и `RUnlock` — атомарная запись в общий счётчик читателей, и ядра передают его кэш-линию друг другу. В замере урока 1.5.4 на коротком чтении `RWMutex` был медленнее `Mutex` на 4 ядрах и быстрее на 8, а на длинном — быстрее в разы. Рекурсивный `RLock` может повиснуть: ожидающий писатель блокирует новых читателей. Подробно — урок 1.5.4.
  links:
    - title: sync.RWMutex
      url: https://pkg.go.dev/sync#RWMutex
starvation-mode:
  term: Режим голодания
  en: Starvation mode
  short: "Режим `sync.Mutex`, в который он входит, когда горутина ждёт замок дольше 1 мс: замок передаётся строго по очереди."
  long: |
    В обычном режиме только что проснувшаяся горутина конкурирует с теми, кто уже на процессоре, и может проигрывать снова и снова. После 1 мс ожидания замок переходит в режим голодания: `Unlock` отдаёт его напрямую первому в очереди, а новички встают в хвост. Это честнее, но медленнее, поэтому мьютекс возвращается в обычный режим, как только замок получает последний в очереди или горутина, ждавшая меньше 1 мс. Подробно — урок 1.5.4.
critical-section:
  term: Критическая секция
  en: Critical section
  short: Участок кода между захватом и освобождением замка, где горутина работает с общими данными одна.
  long: |
    Пока одна горутина внутри, остальные, кому нужен тот же замок, ждут. Поэтому длина секции прямо ограничивает пропускную способность: если секция длится 1 мкс, через неё пройдёт не больше миллиона операций в секунду, сколько бы ядер ни было. Правило — держать в секции только чтение и изменение общих данных, а ввод-вывод, журналирование и тяжёлые вычисления выносить за её пределы. Подробно — урок 1.5.4.
lock-contention:
  term: Конкуренция за замок
  en: Lock contention
  short: Ситуация, когда несколько горутин одновременно хотят один замок и часть из них вынуждена ждать.
  long: |
    Незанятый `sync.Mutex` стоит одну атомарную операцию, а занятый — спиннинг, сон на семафоре и пробуждение через планировщик. Под сильной конкуренцией добавление ядер не ускоряет, а замедляет программу. Найти такие места помогает профиль mutex (`go test -mutexprofile`, `/debug/pprof/mutex`). Лечат укорочением критической секции, шардированием данных или отказом от общего состояния. Подробно — урок 1.5.4.
lock-free:
  term: Неблокирующий алгоритм
  en: Lock-free
  short: Алгоритм без замков, построенный на атомарных операциях, в котором хотя бы один поток всегда продвигается, даже если другие остановлены.
  long: |
    Это гарантия прогресса, а не скорости. Типичный кирпич — CAS-цикл: прочитать, вычислить, попытаться заменить, повторить при неудаче. Под сильной конкуренцией повторы и передача кэш-линии между ядрами съедают выигрыш, и неблокирующий счётчик на CAS может работать не быстрее мьютекса. Подробно — урок 1.5.4.
atomic-operation:
  term: Атомарная операция
  en: Atomic operation
  short: Операция над памятью, которую другие горутины видят целиком — либо выполненной, либо нет, без промежуточного состояния.
  long: |
    В Go — пакет `sync/atomic` и типы `atomic.Int64`, `atomic.Pointer[T]`. Атомик дешевле мьютекса для одного счётчика или флага, но не защищает несколько связанных полей сразу. Атомарные операции участвуют в порядке «происходит раньше», так что запись через `Store` видна после `Load`. Подробно — урок 1.5.4.
  links:
    - title: sync/atomic
      url: https://pkg.go.dev/sync/atomic
cas:
  term: Сравнить и заменить (CAS)
  en: Compare-and-swap
  short: Атомарная инструкция «если в ячейке сейчас значение X, запиши Y» — основа блокировок и неблокирующих алгоритмов.
  long: |
    Возвращает, удалась ли замена. Типичный приём — CAS-цикл: прочитать значение, вычислить новое, попробовать заменить; если за это время кто-то успел изменить ячейку, повторить. Быстрый путь `sync.Mutex` — это один CAS. Подробно — урок 1.5.4.
  links:
    - title: sync/atomic, CompareAndSwap
      url: https://pkg.go.dev/sync/atomic#CompareAndSwapInt64
false-sharing:
  term: Ложное разделение
  en: False sharing
  short: Замедление, когда два ядра по очереди пишут в разные переменные, лежащие в одной кэш-линии, и постоянно сбрасывают друг другу кэш.
  long: |
    Процессор синхронизирует кэши ядер целыми линиями (обычно 64 байта), а не отдельными переменными. Если два счётчика соседствуют в памяти, запись одного объявляет линию устаревшей у другого ядра, хотя общих данных нет. Лечится выравниванием: поля, которые меняют разные горутины, разводят по разным линиям. Подробно — урок 1.5.4.
cache-line:
  term: Кэш-линия
  en: Cache line
  short: Минимальный блок, которым память обменивается с кэшем процессора, обычно 64 байта.
  long: |
    Читая один байт, процессор загружает всю линию, а кэши ядер согласуют между собой целыми линиями. Поэтому важно не только, что лежит в памяти, но и какие поля делят линию. Подробно — урок 1.5.4.
sync-pool:
  term: Пул объектов
  en: sync.Pool
  short: Потокобезопасный кэш временных объектов в Go, который снижает давление на сборщик мусора; объекты в нём могут исчезнуть в любой момент.
  long: |
    `Get` достаёт объект из пула или создаёт новый, `Put` возвращает. У каждого P свой кэш, поэтому конкуренции почти нет, а между сборками мусора объекты переходят в «жертвенный» кэш и затем освобождаются. Подходит для буферов и временных структур, но не для соединений: пул вправе выбросить любой объект. Подробно — урок 1.5.4.
  links:
    - title: sync.Pool
      url: https://pkg.go.dev/sync#Pool
pipeline-pattern:
  term: Конвейер
  en: Pipeline
  short: Цепочка стадий, каждая из которых читает значения из входного канала, обрабатывает и пишет в выходной.
  long: |
    Стадии работают параллельно, как рабочие на ленте: пока одна обрабатывает пятый элемент, другая берёт четвёртый. Каждая стадия обязана уважать `ctx`, иначе при отмене она зависнет на отправке и утечёт. Подробно — урок 1.5.5.
  links:
    - title: Go Blog, Pipelines and cancellation
      url: https://go.dev/blog/pipelines
fan-in:
  term: Слияние потоков
  en: Fan-in
  short: Сбор результатов нескольких горутин или каналов в один канал.
  long: |
    Парная к fan-out операция (раздаче задач): несколько воркеров пишут в общий выходной канал, а один потребитель его читает. Закрыть выходной канал нужно после того, как все писатели закончили, обычно с помощью `WaitGroup`. Порядок результатов при слиянии не сохраняется, если не позаботиться об этом отдельно. Подробно — урок 1.5.5.
worker-pool:
  term: Пул воркеров
  en: Worker pool
  short: Фиксированное число горутин-воркеров, которые берут задачи из общей очереди; ограничивает параллелизм.
  long: |
    Число воркеров задаёт верхнюю границу одновременной работы, а очередь задач — сколько работы можно накопить. Без ограничения «горутина на задачу» наплыв запросов исчерпает память или нижестоящий сервис. В продакшене часто вместо самописного пула берут `errgroup.SetLimit` или семафор. Подробно — урок 1.5.5.
semaphore:
  term: Семафор
  en: Semaphore
  short: "Счётчик, ограничивающий число одновременных участников: заходящий уменьшает его, уходящий увеличивает."
  long: |
    В Go его просто делают из буферизованного канала: отправка в канал занимает место, получение освобождает. Взвешенный вариант — `golang.org/x/sync/semaphore`. Семафор отвечает на вопрос «сколько одновременно», а не «в каком порядке». Подробно — урок 1.5.5.
  links:
    - title: golang.org/x/sync/semaphore
      url: https://pkg.go.dev/golang.org/x/sync/semaphore
errgroup:
  term: errgroup
  en: errgroup
  short: "Пакет `golang.org/x/sync/errgroup`: запускает группу горутин, ждёт их и возвращает первую ошибку, отменяя остальных через контекст."
  long: |
    `errgroup.WithContext` даёт контекст, который отменяется при первой ошибке, `SetLimit` ограничивает число одновременных горутин, `TryGo` запускает задачу, только если есть свободное место. `Wait` возвращает первую ошибку. Это стандартный способ держать несколько фоновых компонентов под одним владельцем. Подробно — уроки 1.5.5 и 1.5.6.
  links:
    - title: golang.org/x/sync/errgroup
      url: https://pkg.go.dev/golang.org/x/sync/errgroup
backpressure:
  term: Обратное давление
  en: Backpressure
  short: Способ сообщить источнику нагрузки «притормози», когда получатель не справляется, вместо того чтобы копить работу без предела.
  long: |
    Очередь с ограниченным размером заставляет выбрать, что делать при переполнении: подождать (задержка растёт), отбросить (данные теряются) или отказать сразу, например кодом 503 (клиент решает, повторять ли). Неограниченная очередь не решает проблему, а откладывает её до нехватки памяти. Подробно — урок 1.5.5.
goroutine-leak:
  term: Утечка горутин
  en: Goroutine leak
  short: Горутина, которая навсегда осталась ждать (канал, замок, сеть) и держит свою память, потому что никто её не остановит.
  long: |
    Типичные причины: отправка в канал, из которого никто не читает; чтение из канала, который никто не закроет; цикл по `ticker.C` (или ожидание на любом другом канале) без выхода по `ctx.Done()`. Признак — число горутин растёт со временем. Начиная с Go 1.27 профиль `goroutineleak` находит такие горутины с помощью сборщика мусора. Подробно — урок 1.5.5.
  links:
    - title: Go 1.27 Release Notes
      url: https://go.dev/doc/go1.27
synctest:
  term: synctest
  en: synctest
  short: "Пакет `testing/synctest`: запускает тест в «пузыре» с виртуальным временем, где ожидания не занимают реального времени."
  long: |
    Внутри пузыря часы идут вперёд мгновенно, когда все горутины пузыря заблокированы, поэтому тест с таймаутом в минуту проходит за миллисекунды и без `time.Sleep`. `synctest.Wait` ждёт, пока горутины пузыря не упрутся в блокировку. Так тесты конкурентного кода становятся быстрыми и не мигают. Подробно — урок 1.5.5.
  links:
    - title: testing/synctest
      url: https://pkg.go.dev/testing/synctest
generator:
  term: Генератор
  en: Generator
  short: Функция, которая запускает горутину, отдаёт значения в канал и закрывает его, когда значения кончились.
  long: |
    Первая стадия конвейера: она ничего не читает, только производит. Возвращает канал только для чтения (`<-chan T`), поэтому закрыть его может лишь сама. Отправку ставят в `select` рядом с `ctx.Done()`, иначе горутина генератора зависнет, если потребитель ушёл раньше. Подробно — урок 1.5.5.
structured-concurrency:
  term: Структурная конкурентность
  en: Structured concurrency
  short: Правило, по которому горутины, запущенные функцией, заканчиваются до её возврата, а их ошибки возвращаются вызывающему.
  long: |
    Время жизни горутин вложено в блок кода, как время жизни локальных переменных: никакая горутина не переживает функцию, которая её запустила. В Go это не встроено в язык, а достигается дисциплиной: `WaitGroup` или `errgroup` и ожидание всех горутин перед возвратом. `testing/synctest` проверяет это в тестах. Подробно — уроки 1.5.5 и 1.5.6.
  links:
    - title: "Nathaniel J. Smith, «Notes on structured concurrency, or: Go statement considered harmful»"
      url: https://vorpus.org/blog/notes-on-structured-concurrency-or-go-statement-considered-harmful/
load-shedding:
  term: Сброс нагрузки
  en: Load shedding
  short: Сознательный отказ в части запросов при перегрузке, чтобы остальные обслуживались быстро.
  long: |
    Когда работы больше, чем система успевает, лучше сразу ответить части клиентов «перегружено» (HTTP 503, часто с заголовком `Retry-After`), чем принять всех и обслужить каждого слишком поздно. Отказ дешёвый и быстрый, клиент может повторить запрос позже или уйти на другую реплику. Подробно — урок 1.5.5, в мессенджере — урок 1.5.6.
  links:
    - title: Google SRE Book, гл. 22 «Addressing Cascading Failures»
      url: https://sre.google/sre-book/addressing-cascading-failures/
goodput:
  term: Полезная пропускная способность
  en: Goodput
  short: Сколько запросов в секунду система завершает так, что результат ещё нужен клиенту.
  long: |
    Пропускная способность считает все завершённые запросы, а goodput — только успевшие до таймаута клиента. При перегрузке с неограниченной очередью система продолжает работать на полную мощность, но обслуживает запросы, клиенты которых уже ушли: пропускная способность высокая, goodput падает до нуля. Подробно — урок 1.5.5.
flaky-test:
  term: Мигающий тест
  en: Flaky test
  short: Тест, который на одном и том же коде то проходит, то падает.
  long: |
    Частая причина в конкурентном коде — ожидание через `time.Sleep`: на быстрой машине горутина успевает, на загруженном CI-раннере нет. Такие тесты приучают команду перезапускать CI вместо того, чтобы искать ошибку. Лечение — синхронизация вместо сна: каналы, `WaitGroup`, `testing/synctest`. Подробно — урок 1.5.5.
ticker:
  term: Тикер
  en: Ticker
  short: Объект `time.Ticker`, который через равные промежутки времени присылает значение в канал.
  long: |
    Подходит для периодической работы с фиксированным периодом. Если итерация дольше периода, тики не копятся бесконечно: лишние отбрасываются. До Go 1.23 тикер без вызова `Stop` оставался в рантайме навсегда; с Go 1.23 тикер без ссылок собирается сборщиком мусора и без `Stop`, но `Stop` по-прежнему хорошая привычка: он освобождает тикер сразу. Когда нужен разный интервал на каждый запуск (например, с джиттером), удобнее `time.Timer` с `Reset`. Подробно — урок 1.5.6.
  links:
    - title: time.Ticker
      url: https://pkg.go.dev/time#Ticker
jitter:
  term: Джиттер
  en: Jitter
  short: Случайная добавка к интервалу, чтобы много экземпляров не срабатывали в один и тот же момент.
  long: |
    Если сто сервисов запускают очистку ровно раз в минуту, нагрузка приходит синхронной волной. Добавив к интервалу случайные несколько процентов, мы размазываем её по времени. Тот же приём применяют в повторах запросов. Подробно — урок 1.5.6.
thundering-herd:
  term: Эффект стада
  en: Thundering herd
  short: Одновременный наплыв множества одинаковых запросов или пробуждений, которые вместе перегружают ресурс.
  long: |
    Примеры: все клиенты повторяют запрос в одну секунду после сбоя, все кэши протухают одновременно, все экземпляры сервиса просыпаются по одному таймеру. Лечат джиттером, экспоненциальной задержкой повторов и ограничением параллелизма. Подробно — урок 1.5.6.
component-lifecycle:
  term: Жизненный цикл компонента
  en: Component lifecycle
  short: "Договор фонового компонента: он запускается, работает до отмены контекста и останавливается за ограниченное время; при чистой остановке возвращает nil, ошибка — только при сбое."
  long: |
    В Go это метод `Run(ctx) error`: он блокируется, пока компонент работает, и возвращается при отмене `ctx` или ошибке. У каждой горутины есть владелец и способ остановки, а порядок остановки задаётся явно: сначала принимающие запросы компоненты, потом те, от которых они зависят. Подробно — урок 1.5.6.
crash-only:
  term: Crash-only
  en: Crash-only software
  short: Подход, при котором сервис не пытается «чинить» себя после неожиданной ошибки, а падает, а восстанавливает его оркестратор.
  long: |
    Паника в фоновой горутине не перехватывается рантаймом и роняет процесс; перехватывать её и жить дальше значит работать в неизвестном состоянии. Честнее упасть быстро и перезапуститься с чистого листа, поэтому важно, чтобы запуск и остановка были надёжными. Подробно — урок 1.5.6.
netpoller:
  term: Сетевой поллер (netpoller)
  en: Netpoller
  short: Часть рантайма Go, которая через `epoll` узнаёт о готовых сокетах и будит ждущие их горутины, не занимая поток ОС.
  long: |
    Когда чтение из сокета возвращает `EAGAIN`, горутина паркуется, а поток ОС уходит исполнять другие горутины. Планировщик вызывает `netpoll` в `findRunnable`, после остановки мира и из [sysmon](#sysmon), если сеть не опрашивали дольше 10 мс. Поэтому сетевой вызов не держит поток, а обычный файловый — держит. Подробно — урок 1.5.7.
  links:
    - title: Исходники рантайма, runtime/netpoll.go
      url: https://cs.opensource.google/go/go/+/refs/tags/go1.27.2:src/runtime/netpoll.go
epoll:
  term: epoll
  en: epoll
  short: Механизм Linux, который сообщает процессу, какие из тысяч наблюдаемых дескрипторов готовы к вводу-выводу.
  long: |
    В отличие от `select` и `poll`, которым при каждом вызове передают и просматривают весь список дескрипторов, `epoll` хранит набор в ядре и отдаёт только готовые, поэтому цена зависит от числа событий, а не от числа соединений. Рантайм Go регистрирует сокеты в режиме [edge-triggered](#edge-triggered). Подробно — урок 1.5.7.
  links:
    - title: epoll(7), man-страница Linux
      url: https://man7.org/linux/man-pages/man7/epoll.7.html
edge-triggered:
  term: Срабатывание по фронту (edge-triggered)
  en: Edge-triggered
  short: Режим `epoll`, в котором ядро сообщает о готовности только в момент её появления, а не пока данные лежат непрочитанными.
  long: |
    Пример: пришло 512 байт, ядро сообщило один раз. Программа прочитала 100 байт и снова ждёт события — а его не будет, пока не придут новые данные, хотя 412 байт лежат в буфере. Поэтому в этом режиме нельзя ждать уведомления, не попробовав сначала прочитать. Go использует именно этот режим (`EPOLLET`) и соблюдает правило так: `conn.Read` всегда сначала делает системный вызов `read`; ждать он начинает, только если `read` вернул `EAGAIN`, — тогда горутина паркуется на `pollDesc` сокета до следующего события. Данные, оставшиеся в буфере, заберёт следующий `Read` без всякого ожидания. Зато сокет регистрируется в `epoll` один раз, при создании, а не перед каждым ожиданием. Подробно — урок 1.5.7.
  links:
    - title: epoll(7), man-страница Linux
      url: https://man7.org/linux/man-pages/man7/epoll.7.html
io-uring:
  term: io_uring
  en: io_uring
  short: Интерфейс Linux с общими с ядром кольцевыми очередями запросов и завершений, позволяющий пачкой отправлять операции ввода-вывода.
  long: |
    Вместо «спросить, что готово, и затем читать» приложение кладёт запросы в очередь, а ядро кладёт результаты в другую. Пример: чтобы прочитать 100 файлов, программа кладёт в очередь отправки 100 запросов `read` и делает один вызов `io_uring_enter`; ядро выполняет их и складывает 100 результатов в очередь завершений. С [epoll](#epoll) так не выйдет: обычный файл он не поддерживает, и каждое чтение с диска — отдельный блокирующий вызов, держащий поток. В исходниках Go 1.27.2 `io_uring` не используется ни в рантайме, ни в `internal/poll`, `net` и `os`: в стандартной библиотеке есть только номера системных вызовов в пакете `syscall` для linux/loong64. Предложение golang/go#31908 (2019) открыто, сеть Go работает на `epoll`. Подробно — урок 1.5.7.
  links:
    - title: io_uring, Linux man-pages
      url: https://man7.org/linux/man-pages/man7/io_uring.7.html
    - title: "golang/go#31908: internal/poll: transparently support new linux io_uring interface"
      url: https://github.com/golang/go/issues/31908
nonblocking-io:
  term: Неблокирующий ввод-вывод
  en: Non-blocking I/O
  short: Режим, в котором чтение и запись не усыпляют поток, а сразу возвращают ошибку «данных пока нет» (`EAGAIN`).
  long: |
    Блокирующий `read` усыпляет поток до прихода данных, поэтому на 10 000 соединений понадобилось бы 10 000 потоков. Неблокирующий вызов возвращается сразу, а о готовности сообщает [epoll](#epoll). Рантайм Go переводит сокеты в этот режим сам, а программист пишет обычный последовательный код. Подробно — урок 1.5.7.
  links:
    - title: Go, пакет net
      url: https://pkg.go.dev/net
c10k:
  term: Проблема C10K
  en: C10K problem
  short: Задача обслужить десять тысяч одновременных соединений на одном сервере; сформулирована Деном Кегелем в 1999 году.
  long: |
    Тогда подход «поток на соединение» упирался в память и переключения контекста, и пришлось переходить на события ([epoll](#epoll)). Сегодня десять тысяч соединений — рядовая задача, а ориентиром стала C10M. В Go сложность скрыта: горутина на соединение, а ожидание берёт на себя [netpoller](#netpoller). Подробно — урок 1.5.7.
  links:
    - title: Dan Kegel, The C10K problem
      url: http://www.kegel.com/c10k.html
goroutine-stack:
  term: Стек горутины
  en: Goroutine stack
  short: Собственный растущий стек каждой горутины; начинается с малого размера (минимум 2 КиБ) и при нехватке места копируется в больший.
  long: |
    Пролог функции проверяет, хватит ли места, и при нехватке вызывает рост. Дешевизна стека и делает возможными сотни тысяч [горутин](#goroutine). Начальный размер с Go 1.19 пересчитывается каждой сборкой по среднему размеру стеков, а при сборке мусора пустой стек может сжиматься. Подробно — урок 1.5.8.
  links:
    - title: Исходники рантайма, runtime/stack.go
      url: https://cs.opensource.google/go/go/+/refs/tags/go1.27.2:src/runtime/stack.go
stack-growth:
  term: Рост стека
  en: Stack growth
  short: Выделение стека вдвое большего размера и копирование в него содержимого, когда текущий переполняется.
  long: |
    Копировать можно, потому что рантайм знает, где в стеке лежат указатели, и поправляет те, что указывают внутрь самого стека. Поэтому указатель на стек нельзя отдать коду на C: он не обновится. Рост стоит копирования, зато редок: большинству горутин хватает начального размера. Подробно — урок 1.5.8.
  links:
    - title: Исходники рантайма, runtime/stack.go
      url: https://cs.opensource.google/go/go/+/refs/tags/go1.27.2:src/runtime/stack.go
escape-analysis:
  term: Escape-анализ
  en: Escape analysis
  short: Проверка компилятора, переживёт ли переменная вызов функции; если да, она «убегает» в кучу, если нет, остаётся на стеке.
  long: |
    Пример: функция возвращает указатель на свою локальную переменную, значит, переменная должна жить в [куче](#heap-allocation). Решение видно через `go build -gcflags=-m`. Стековая переменная ничего не стоит [сборщику мусора](#garbage-collector): короткоживущие объекты, которые в других языках попали бы в «молодое поколение» кучи, в Go часто живут и умирают на стеке. Поэтому сборка с поколениями дала бы Go меньше, чем другим управляемым средам, — это один из доводов, по которым команда Go от неё отказалась (Рик Хадсон, «Getting to Go», 2018). Подробно — уроки 1.5.8 и 1.5.9.
  links:
    - title: Go GC guide, Escape analysis
      url: https://go.dev/doc/gc-guide
    - title: Rick Hudson, Getting to Go — The Journey of Go's Garbage Collector
      url: https://go.dev/blog/ismmkeynote
inlining:
  term: Встраивание (inlining)
  en: Inlining
  short: Подстановка тела небольшой функции в место вызова; убирает цену вызова и меняет решения escape-анализа.
  long: |
    После встраивания компилятор видит, что делает функция с аргументами, и порой может оставить значение на стеке, которое иначе ушло бы в кучу. Лимит размера — бюджет в 80 «узлов» разбора. Результат смотрят через `-gcflags=-m=2`. Подробно — урок 1.5.8.
  links:
    - title: Документация cmd/compile
      url: https://pkg.go.dev/cmd/compile
heap-allocation:
  term: Выделение в куче
  en: Heap allocation
  short: Размещение объекта в куче. Такой объект переживает вызов функции, а его память освобождает сборщик мусора, когда ссылок на объект не остаётся.
  long: |
    Такая аллокация стоит дороже стековой: нужно найти место и позже обойти объект при разметке. Поэтому нагрузку на память снижают, уменьшая число выделений в куче, а не размер каждого. Узнать число выделений позволяет `-benchmem`. Не путать с [кучей (heap) таблицы](#heap-table) PostgreSQL — файлом, где строки таблицы лежат без порядка. Подробно — урок 1.5.8.
  links:
    - title: Go GC guide
      url: https://go.dev/doc/gc-guide
size-class:
  term: Класс размера
  en: Size class
  short: Одна из 68 фиксированных величин, до которых аллокатор Go округляет размер маленького объекта.
  long: |
    Объекты одного класса лежат вместе в блоках памяти (спанах), поэтому поиск места быстрый, а фрагментация мала. Цена — округление вверх: запрос в 33 байта получит блок побольше. Таблица классов лежит в `internal/runtime/gc/sizeclasses.go`. Подробно — урок 1.5.8.
  links:
    - title: Исходники рантайма, sizeclasses.go
      url: https://cs.opensource.google/go/go/+/refs/tags/go1.27.2:src/internal/runtime/gc/sizeclasses.go
mcache:
  term: mcache
  en: mcache
  short: Кэш свободных блоков памяти у каждого P, из которого маленькие объекты выделяются без замка.
  long: |
    Раз у процессора-P (см. [GMP](#gmp)) свой кэш, два потока не делят его и не ждут друг друга. Когда блоки нужного [класса размера](#size-class) кончаются, кэш пополняется из общего `mcentral`. Подробно — урок 1.5.8.
  links:
    - title: Исходники рантайма, runtime/mcache.go
      url: https://cs.opensource.google/go/go/+/refs/tags/go1.27.2:src/runtime/mcache.go
tiny-allocator:
  term: Мелкий аллокатор (tiny allocator)
  en: Tiny allocator
  short: Приём аллокатора Go, который упаковывает в один 16-байтовый блок несколько мелких объектов без указателей.
  long: |
    Пример: несколько небольших строк или чисел, которые нужны одновременно, могут разделить один блок. Выигрыш в памяти и в числе аллокаций; цена — блок освобождается, только когда мертвы все его жильцы. Подробно — урок 1.5.8.
  links:
    - title: Исходники рантайма, runtime/malloc.go
      url: https://cs.opensource.google/go/go/+/refs/tags/go1.27.2:src/runtime/malloc.go
garbage-collector:
  term: Сборщик мусора (GC)
  en: Garbage collector
  short: Часть рантайма, которая находит недостижимые объекты кучи и освобождает их память; в Go он конкурентный, неперемещающий и без поколений.
  long: |
    «Конкурентный» значит, что почти всё работает параллельно с программой; «неперемещающий» — что объекты остаются на месте, поэтому указатели не меняются. Цена сборки — CPU и короткие паузы, а регулируют её [GOGC](#gogc) и [GOMEMLIMIT](#gomemlimit). Подробно — урок 1.5.9.
  links:
    - title: A Guide to the Go Garbage Collector
      url: https://go.dev/doc/gc-guide
tricolor-marking:
  term: Трёхцветная разметка
  en: Tri-color marking
  short: "Обход объектов с тремя цветами: белые ещё не видели, серые найдены, но не просмотрены, чёрные просмотрены полностью."
  long: |
    Сборка идёт, пока серых объектов не останется; оставшиеся белые — мусор. Инвариант: чёрный объект не указывает на белый напрямую. Пока программа работает параллельно, его защищает [барьер записи](#write-barrier). Подробно — урок 1.5.9.
  links:
    - title: Go GC guide
      url: https://go.dev/doc/gc-guide
write-barrier:
  term: Барьер записи
  en: Write barrier
  short: Небольшой код, который компилятор вставляет в запись указателей и который во время разметки не даёт программе спрятать живой объект от сборщика.
  long: |
    Без него программа могла бы положить указатель на белый объект в чёрный, и сборщик освободил бы живое. В Go с версии 1.8 гибридный барьер (Юаса и Дейкстры) делает это и убирает необходимость перепросматривать стеки. Цена — лишняя работа на записи, но только пока идёт разметка. Подробно — урок 1.5.9.
  links:
    - title: Go 1.8 Release Notes
      url: https://go.dev/doc/go1.8
stop-the-world:
  term: Остановка мира (stop-the-world)
  en: Stop-the-world
  short: Короткий момент, когда рантайм останавливает все горутины, чтобы выполнить шаг, который нельзя делать параллельно.
  long: |
    В сборке мусора Go такой паузы две: перед разметкой и после неё. Обычно они занимают доли миллисекунды, а время сборки определяют не они. Наблюдать их можно в `/gc/pauses:seconds`. Подробно — урок 1.5.9.
  links:
    - title: Go GC guide
      url: https://go.dev/doc/gc-guide
mark-assist:
  term: Помощь разметке (mark assist)
  en: Mark assist
  short: Принудительная работа сборщика, которую выполняет сама горутина, если выделяет память быстрее, чем фоновые воркеры успевают размечать.
  long: |
    Это обратное давление на аллокацию: чем больше горутина выделяет во время сборки, тем больше размечает. В итоге латентность запроса растёт именно у тех, кто нагружает кучу. Время помощи видно в `/cpu/classes/gc/mark/assist:cpu-seconds`. Подробно — урок 1.5.9.
  links:
    - title: Go GC guide
      url: https://go.dev/doc/gc-guide
gc-pacer:
  term: Темпоратор сборщика (pacer)
  en: GC pacer
  short: Алгоритм, выбирающий момент начала сборки так, чтобы она закончилась к достижению цели кучи.
  long: |
    Цель кучи равна живым данным плюс (живые данные + стеки + глобальные переменные) × `GOGC/100`; стеки и глобальные учитываются с Go 1.18. Фоновые воркеры занимают около 25 % CPU, а при отставании подключаются [mark assist](#mark-assist). При заданном [GOMEMLIMIT](#gomemlimit) цель ограничивается ещё и им. Подробно — урок 1.5.9.
  links:
    - title: Исходники рантайма, runtime/mgcpacer.go
      url: https://cs.opensource.google/go/go/+/refs/tags/go1.27.2:src/runtime/mgcpacer.go
gogc:
  term: GOGC
  en: GOGC
  short: Переменная, которая задаёт, на сколько процентов куча может вырасти относительно живых данных до следующей сборки; по умолчанию 100.
  long: |
    При `GOGC=100` и 50 МиБ живых данных следующая сборка начнётся примерно на 100 МиБ. Больше значение — реже сборки и больше памяти, меньше — наоборот. `GOGC=off` отключает сборки по росту кучи, и тогда куча ограничена только [GOMEMLIMIT](#gomemlimit). Подробно — урок 1.5.9.
  links:
    - title: Go GC guide, GOGC
      url: https://go.dev/doc/gc-guide
death-spiral:
  term: Спираль смерти GC
  en: GC death spiral
  short: Ситуация, когда куча упирается в `GOMEMLIMIT`, сборщик работает почти непрерывно и забирает весь CPU, а память всё равно не освобождается.
  long: |
    Программа почти не двигается вперёд, потому что её CPU уходит на сборки. Защита — ограничитель CPU сборщика: дырявое ведро, которое держит долю сборщика около 50 % и отключает помощь разметке. Он включён всегда, задан `GOMEMLIMIT` или нет, но главный его сценарий — живая куча выше лимита. Подробно — урок 1.5.9.
  links:
    - title: Go GC guide, Memory limit
      url: https://go.dev/doc/gc-guide
green-tea-gc:
  term: Green Tea GC
  en: Green Tea GC
  short: Новый алгоритм разметки в сборщике Go, который обходит память по спанам, а не по отдельным объектам; в Go 1.26 включён по умолчанию.
  long: |
    Идея: работать с соседними объектами подряд лучше для кэша процессора, чем прыгать по указателям. Выигрыш зависит от кучи: он заметнее на больших кучах с мелкими объектами. Отключить можно только флагом сборки `GOEXPERIMENT=nogreenteagc`. Подробно — урок 1.5.9.
  links:
    - title: Go 1.26 Release Notes
      url: https://go.dev/doc/go1.26
profiler:
  term: Профилировщик
  en: Profiler
  short: Инструмент, который показывает, где программа тратит CPU, память или время ожидания, измеряя это выборочно.
  long: |
    CPU-профилировщик Go по сигналу `SIGPROF` 100 раз в секунду записывает стек, а аллокации выбираются раз в 512 КиБ. Поэтому профиль — статистика, а не точная трасса: редкое событие в нём может не появиться. Подробно — урок 1.5.10.
  links:
    - title: Go, пакет runtime/pprof
      url: https://pkg.go.dev/runtime/pprof
pprof:
  term: pprof
  en: pprof
  short: Формат профилей и инструмент `go tool pprof` для их чтения; сервис отдаёт профили по HTTP через `net/http/pprof`.
  long: |
    Профили бывают CPU, heap, allocs, goroutine, mutex, block. Читают командами `-top`, `-list` и `-http`, а два профиля сравнивают через `-diff_base`. Например, `go tool pprof -top -cum` по профилю мессенджера показал, что больше трети процессора уходит на проверку подписи JWT, а не на хеш пароля. Служебные адреса нельзя выставлять наружу: они раскрывают устройство сервиса. Подробно — урок 1.5.10.
  links:
    - title: Go, пакет net/http/pprof
      url: https://pkg.go.dev/net/http/pprof
flame-graph:
  term: Флейм-граф
  en: Flame graph
  short: Картинка профиля, где ширина блока — доля времени функции, а блок над ним — функции, которые она вызвала.
  long: |
    Искать нужно широкие блоки на вершине: именно там тратится время само по себе. Высота стека говорит о глубине вызовов, а не о цене. Порядок блоков по горизонтали ничего не значит, они только сгруппированы по имени. Подробно — урок 1.5.10.
  links:
    - title: Brendan Gregg, Flame Graphs
      url: https://www.brendangregg.com/flamegraphs.html
execution-trace:
  term: Трасса исполнения (execution trace)
  en: Execution trace
  short: Подробная запись событий рантайма (планировщик, GC, блокировки) на временной шкале; снимается `runtime/trace`.
  long: |
    В отличие от профиля, трасса показывает порядок событий и задержки планировщика, а не усреднённую долю. Открывается `go tool trace`. Например, у лимита памяти трасса мессенджера показала помощь разметке до 61 мс за раз, которой не было видно в CPU-профиле: горутина в это время ждала, а не считала. Стоит дороже профиля, поэтому снимать её стоит на короткое окно. Подробно — урок 1.5.10.
  links:
    - title: Go, пакет runtime/trace
      url: https://pkg.go.dev/runtime/trace
flight-recorder:
  term: Бортовой самописец (flight recorder)
  en: Flight recorder
  short: Режим трассировки Go (с версии 1.25), который хранит в памяти только последние секунды и сохраняет их по событию.
  long: |
    В мессенджере событием служит медленный запрос: самописец записывает последние секунды работы, и после запроса их можно сохранить в файл и разобрать. Одновременно в процессе активен только один самописец. Подробно — урок 1.5.10.
  links:
    - title: Go 1.25 Release Notes
      url: https://go.dev/doc/go1.25
pgo:
  term: PGO (оптимизация по профилю)
  en: Profile-guided optimization
  short: Режим компилятора, который берёт CPU-профиль реальной нагрузки и по нему решает, что встраивать и что оптимизировать.
  long: |
    Профиль кладут в `default.pgo` рядом с пакетом `main`. Выигрыш обычно составляет единицы процентов, и тем больше, чем ближе профиль к настоящей нагрузке, поэтому его снимают с продакшена, а не с тестов. Подробно — урок 1.5.10.
  links:
    - title: Go, Profile-guided optimization
      url: https://go.dev/doc/pgo
continuous-profiling:
  term: Непрерывное профилирование
  en: Continuous profiling
  short: Практика постоянно снимать профили с работающих сервисов и хранить их, чтобы сравнивать «до» и «после».
  long: |
    Профили снимают с малой частотой на всех экземплярах и складывают в хранилище (Pyroscope, Parca). Тогда регрессию находят сравнением версий, а не воспроизведением нагрузки. Идею впервые описали как Google-Wide Profiling. Подробно — урок 1.5.10.
  links:
    - title: Google-Wide Profiling
      url: https://research.google/pubs/google-wide-profiling-a-continuous-profiling-infrastructure-for-data-centers/
relationship:
  term: Связь
  en: Relationship
  short: Правило, по которому сущности относятся друг к другу; в таблицах выражается внешним ключом или отдельной таблицей-связкой.
  long: |
    Пользователь состоит в чатах, а в чате состоят пользователи: это связь «многие ко многим», и в базе она превращается в таблицу `chat.members` с парой `(chat_id, user_id)`. Связь «один ко многим» (чат и его сообщения) хранится внешним ключом на стороне «многих». Сколько объектов с каждой стороны допустимо, описывает [кардинальность](#cardinality), а наглядно связи показывает [ER-диаграмма](#er-diagram). Подробно — урок 2.1.
cardinality:
  term: Кардинальность связи
  en: Cardinality
  short: Сколько экземпляров одной сущности может быть связано с экземпляром другой, и обязательна ли связь (1:1, 1:N, M:N).
  long: |
    У чата много сообщений, а у сообщения ровно один чат: 1:N, и обязательность «ровно один» превращается в `NOT NULL` на столбце `chat_id`. У пользователя много чатов и у чата много пользователей: M:N, нужна таблица-связка. Пара «пользователь — учётные данные» это 1:1: общий первичный ключ `auth.credentials.user_id` не даёт завести вторую запись. См. [связь](#relationship) и [ограничение](#constraint). Подробно — урок 2.1.
er-diagram:
  term: ER-диаграмма
  en: Entity-relationship diagram
  short: Схема из прямоугольников-сущностей и линий-связей, по которой обсуждают модель данных до написания DDL.
  long: |
    Нотаций две основные: Чена (сущности — прямоугольники, связи — ромбы) и «воронья лапка» (линия с трёхзубым окончанием на стороне «многих»), которая в практике почти вытеснила первую. На диаграмме мессенджера пользователь связан с участием в чатах, а чат — с сообщениями; такую схему удобно рисовать в mermaid прямо в уроке. Элементы диаграммы — [сущности](#entity), [связи](#relationship) и их [кардинальность](#cardinality). Подробно — урок 2.1.
primary-key:
  term: Первичный ключ
  en: Primary key
  short: Столбец или набор столбцов, однозначно определяющий строку таблицы; не бывает NULL и не повторяется (`PRIMARY KEY`).
  long: |
    По первичному ключу на строку ссылаются [внешние ключи](#foreign-key) других таблиц, поэтому он должен быть неизменным. Ключ бывает из одного столбца (`users.users.id`) и составной: у `chat.members` это пара `(chat_id, user_id)`, у `chat.messages` — `(chat_id, seq)`. Составной ключ таблицы-связки одновременно запрещает дубли: одного участника нельзя добавить в чат дважды. Для ключа PostgreSQL сам создаёт уникальный индекс B-дерева. Какой ключ выбрать — [суррогатный](#surrogate-key) или естественный, — тема урока 2.3.
  links:
    - title: Документация PostgreSQL 18, «Constraints», раздел «Primary Keys»
      url: https://www.postgresql.org/docs/18/ddl-constraints.html#DDL-CONSTRAINTS-PRIMARY-KEYS
junction-table:
  term: Таблица-связка
  en: Junction table (associative table)
  short: Таблица, в которой каждая строка — факт связи двух сущностей; так в реляционной базе хранится связь «многие ко многим».
  long: |
    Связь M:N нельзя положить ни в одну из двух таблиц: у пользователя много чатов, у чата много пользователей, а в ячейке — одно значение. Поэтому появляется третья таблица с двумя [внешними ключами](#foreign-key) и составным [первичным ключом](#primary-key) из них: `chat.members (chat_id, user_id)`. M:N распадается на две связи 1:N. У связки бывают и собственные атрибуты — роль участника, время вступления. Хернандес называет её linking table, в литературе встречаются также associative entity и join table.
  links:
    - title: Hernandez, «Database Design for Mere Mortals», 4-е изд., 2020, раздел «Relationship-Related Terms» (с. 50)
db-schema:
  term: Схема базы данных
  en: Schema (namespace)
  short: "В PostgreSQL — именованное пространство внутри одной базы, в котором лежат таблицы и другие объекты: `chat.messages` — таблица `messages` в схеме `chat`."
  long: |
    Схемы делят одну базу на области: одинаковые имена таблиц в разных схемах не конфликтуют, права выдаются на схему целиком, а объекты можно найти по имени с префиксом. Это не отдельная база: запрос и транзакция видят все схемы сразу, а [внешний ключ](#foreign-key) может ссылаться на таблицу другой схемы. В мессенджере каждый [ограниченный контекст](#bounded-context) получает свою схему — `users`, `auth`, `chat`, `platform`. Слово «схема» в другом смысле — описание всех таблиц и ограничений базы («схема данных») — по контексту отличается легко.
  links:
    - title: Документация PostgreSQL 18, «Schemas»
      url: https://www.postgresql.org/docs/18/ddl-schemas.html
functional-dependency:
  term: Функциональная зависимость
  en: Functional dependency
  short: Утверждение «значение A однозначно определяет значение B» (A → B) внутри таблицы.
  long: |
    Если `chat_id → title`, то в любых двух строках с одним `chat_id` заголовок одинаков. Если таблица сообщений хранит заголовок чата в каждой строке, зависимость есть, но ключ строки другой, поэтому заголовок повторяется и при переименовании чата его придётся менять во многих местах. Поиск таких зависимостей лежит в основе [нормальных форм](#normal-form). Подробно — урок 2.2.
candidate-key:
  term: Потенциальный ключ
  en: Candidate key
  short: Минимальный набор столбцов, значения которого не повторяются ни в одной паре строк; из потенциальных ключей выбирают первичный.
  long: |
    «Минимальный» значит: убери любой столбец — и уникальность пропадёт. Набор, который уникален, но не обязательно минимален, называют надключом (superkey): `(message_id, text)` — надключ таблицы сообщений, `message_id` — потенциальный ключ. У таблицы может быть несколько потенциальных ключей: у `users.users` это `id` и `username`. Один из них объявляют [первичным ключом](#primary-key), остальные — ограничением `UNIQUE`. Столбец, входящий хотя бы в один потенциальный ключ, называют ключевым (prime attribute); на этом различии построены определения 2НФ и 3НФ — см. [нормальную форму](#normal-form). Подробно — урок 2.2.
data-anomaly:
  term: Аномалия модификации
  en: Modification anomaly
  short: Побочный эффект избыточной схемы, при котором вставка, обновление или удаление строки искажает или теряет факты, которых операция не касалась.
  long: |
    Их три. Аномалия вставки — факт нельзя записать без другого, несвязанного: пользователя без сообщения не сохранить, если строка таблицы — это сообщение. Аномалия обновления — факт хранится в нескольких строках, и правка части из них оставляет противоречие: у одного автора два имени. Аномалия удаления — вместе с одним фактом пропадает другой: удалили последнее сообщение — пропало имя автора. Причина у всех трёх одна: [функциональная зависимость](#functional-dependency), левая часть которой не надключ таблицы. Лечит их [нормализация](#normal-form). Подробно — урок 2.2.
normal-form:
  term: Нормальная форма
  en: Normal form
  short: Набор правил о функциональных зависимостях в таблице; чем выше форма (1НФ, 2НФ, 3НФ), тем меньше в ней избыточности и аномалий.
  long: |
    1НФ требует атомарных значений в ячейках (не «списка через запятую»), 2НФ запрещает зависимость от части составного ключа, 3НФ — зависимость неключевого столбца от другого неключевого. Практически это значит: «каждый факт хранится в одном месте». Если в `chat.messages` хранить имя автора, при смене имени придётся обновлять тысячи строк, а в 3НФ имя лежит только в `users.users`. Более строгая форма — [НФБК](#bcnf); когда нормализацию нарушают намеренно — [денормализация](#denormalization). Основа — [функциональные зависимости](#functional-dependency). Подробно — урок 2.2.
bcnf:
  term: Нормальная форма Бойса — Кодда (НФБК)
  en: Boyce-Codd normal form (BCNF)
  short: "Усиление 3НФ: каждая функциональная зависимость в таблице должна иметь в левой части надключ."
  long: |
    Отличие от 3НФ видно, когда у таблицы несколько пересекающихся [потенциальных ключей](#candidate-key). Пример из лабы урока 2.2: таблица дежурных поддержки `(client_id, topic, agent)`, где у клиента по каждой теме один дежурный (`(client_id, topic) → agent`), а дежурный ведёт ровно одну тему (`agent → topic`). Ключи — `(client_id, topic)` и `(client_id, agent)`. Каждый столбец входит в какой-нибудь ключ, поэтому 3НФ выполнена, а НФБК нет: `agent` определяет `topic`, но сам не ключ. Тема дежурного повторяется в каждой строке его клиента и может разойтись. Разбиение на `(agent, topic)` и `(client_id, agent)` даёт НФБК, но правило «у клиента по теме один дежурный» больше не выражается одним `UNIQUE`. В реальных схемах разница встречается редко. См. [нормальную форму](#normal-form). Подробно — урок 2.2.
denormalization:
  term: Денормализация
  en: Denormalization
  short: Осознанное хранение производного или повторяющегося значения ради скорости чтения; цена — нужно поддерживать его согласованность.
  long: |
    В мессенджере `chat.chats.last_seq` и `last_activity_at` можно вычислить по сообщениям (`max(seq)`), но список чатов по активности нужен на каждом открытии приложения, и считать его через `chat.messages` дорого. Поэтому значения хранятся в чате и обновляются в той же транзакции, что и вставка сообщения. Это отступление от [нормальной формы](#normal-form) со своей ценой: если обновить только одно из мест, данные разойдутся. Решение принимают по [паттерну доступа](#access-pattern), а не «на всякий случай». Подробно — урок 2.2.
surrogate-key:
  term: Суррогатный ключ
  en: Surrogate key
  short: Идентификатор, созданный только ради идентификации строки и не несущий бизнес-смысла (`bigint identity`, UUID).
  long: |
    Он не меняется, когда меняется мир: пользователь переименовался, а его id остался, поэтому внешние ключи не нужно править. В мессенджере суррогатные ключи — [UUIDv7](#uuidv7), создаваемые приложением. Против них стоит [естественный ключ](#natural-key) — реальный признак вроде имени пользователя; `username` в мессенджере уникален, но не первичный ключ, потому что может понадобиться его смена. Выбор влияет на размер индексов и локальность вставок ([разделение страниц B-дерева](#b-tree-page-split)). Подробно — урок 2.3.
b-tree-page-split:
  term: Разделение страницы B-дерева
  en: B-tree page split
  short: Когда в заполненную страницу индекса нужно вставить ключ, страница делится на две; случайные ключи вызывают это часто.
  long: |
    Страница индекса PostgreSQL — 8 КБ, и ключи на ней лежат по порядку. Если вставляется ключ в середину полной страницы, она делится пополам, и обе половины заполнены наполовину; индекс растёт и хуже помещается в память. Случайные UUIDv4 попадают в произвольные страницы, а возрастающие [UUIDv7](#uuidv7) и `bigint` — в правый край, где страница заполняется целиком. Дробление страниц ещё и увеличивает объём [WAL](#wal). Само B-дерево — это обычный [индекс](#index). Подробно — урок 2.3 и модуль 2b.
constraint:
  term: Ограничение целостности
  en: Constraint
  short: "Правило, которое база проверяет сама при каждой записи и отклоняет данные, нарушающие его: `NOT NULL`, `CHECK`, `UNIQUE`, `PRIMARY KEY`, `FOREIGN KEY`, `EXCLUDE`."
  long: |
    Домен тоже проверяет правила (например, длину имени), но домен проверяет только код этого процесса. Второй экземпляр сервиса, ручной SQL или скрипт миграции его не вызывают, а две параллельные регистрации с одним именем обе пройдут проверку «имя свободно». Ограничение `UNIQUE (username)` держит это правило в самой базе, и нарушение приходит в адаптер ошибкой с кодом SQLSTATE (`23505` и др.), которую адаптер переводит в доменную ошибку. Виды: [внешний ключ](#foreign-key), [CHECK](#check-constraint), [исключающее](#exclusion-constraint), [откладываемое](#deferrable-constraint). Подробно — урок 2.4.
foreign-key:
  term: Внешний ключ
  en: Foreign key
  short: Ограничение «значение этого столбца должно существовать в таблице-родителе»; задаёт, что произойдёт с дочерними строками при удалении родителя (`ON DELETE`).
  long: |
    `chat.members.user_id REFERENCES users.users(id)` не даёт добавить участником несуществующего пользователя. `ON DELETE CASCADE` удалит дочерние строки вместе с родителем (участники уходят вместе с чатом), `RESTRICT` запретит удаление родителя, пока есть дочерние строки. Внешний ключ — [ограничение](#constraint) и выражает [связь](#relationship) 1:N. Он стоит записи: при вставке база проверяет родителя, а столбец ссылки обычно нужно индексировать самому. Ошибка нарушения — SQLSTATE `23503`. Подробно — урок 2.4.
check-constraint:
  term: Ограничение CHECK
  en: CHECK constraint
  short: Ограничение, которое проверяет булево выражение над значениями строки, например `length(text) <= 4096`.
  long: |
    Годится для правил, видящих только эту строку: диапазон числа, формат, длина, согласованность двух столбцов (`kind = 'direct'` равносильно наличию `direct_key`). Выражение не может обращаться к другим таблицам, поэтому «в чате не больше 100 участников» через `CHECK` не выразить. Нарушение — SQLSTATE `23514`. Отложить проверку `CHECK` до конца транзакции нельзя ([откладываемыми](#deferrable-constraint) бывают другие виды). Это один из видов [ограничений](#constraint). Подробно — урок 2.4.
exclusion-constraint:
  term: Ограничение исключения
  en: Exclusion constraint (EXCLUDE)
  short: "Обобщение `UNIQUE`: никакие две строки не должны «конфликтовать» по заданному оператору, например пересекаться по диапазону времени."
  long: |
    `UNIQUE` запрещает равные значения, `EXCLUDE USING gist (room WITH =, during WITH &&)` запрещает пересекающиеся диапазоны в одной комнате: двойное бронирование невозможно, даже если два запроса пришли одновременно. Для работы нужен индекс GiST и, для сравнения скаляров на равенство, расширение `btree_gist`. В мессенджере прямого применения нет, зато это типичный пример инварианта, который нельзя надёжно проверить в коде. Нарушение — SQLSTATE `23P01`. См. [ограничение](#constraint). Подробно — урок 2.4.
deferrable-constraint:
  term: Откладываемое ограничение
  en: Deferrable constraint
  short: Ограничение, проверку которого можно перенести с конца оператора на конец транзакции (`DEFERRABLE INITIALLY DEFERRED`); бывает только у `UNIQUE`, `PRIMARY KEY`, `FOREIGN KEY` и `EXCLUDE`.
  long: |
    Нужно, когда в рамках одной транзакции данные на время нарушают правило: вставить две взаимно ссылающиеся строки или поменять местами два значения уникального столбца. Проверка произойдёт на `COMMIT`. `CHECK` и `NOT NULL` проверяются сразу и отложены быть не могут. Платите тем, что ошибка приходит позже, не на строке, которая её вызвала. См. [внешний ключ](#foreign-key) и [ограничение](#constraint). Подробно — урок 2.4.
check-then-act:
  term: Гонка «проверь, потом действуй»
  en: Check-then-act race
  short: "Код сначала проверяет условие («имя свободно»), потом действует («вставить»), а между проверкой и действием условие успевает измениться."
  long: |
    Классическая логическая гонка: два экземпляра сервиса одновременно делают `SELECT` по имени, оба видят «свободно», оба вставляют. Проверка была верна в момент проверки, но окно между ней и записью открыто для чужой записи. Мьютекс закрывает окно только внутри одного процесса; уровни изоляции `READ COMMITTED` и `REPEATABLE READ` его не закрывают (снимок не видит незафиксированную строку соседа). Надёжно закрывает [ограничение](#constraint) базы: проверка и запись — одно действие внутри уникального [индекса](#index). Это не [гонка данных](#data-race) в памяти Go — детектор гонок её не найдёт. Подробно — урок 2.4.
isolation-level:
  term: Уровень изоляции
  en: Isolation level
  short: "Насколько транзакция защищена от одновременных чужих изменений: в PostgreSQL `READ COMMITTED` (по умолчанию), `REPEATABLE READ` и `SERIALIZABLE`."
  long: |
    На `READ COMMITTED` каждая команда видит данные, зафиксированные к её началу, — свой [снимок](#snapshot) на каждую команду. На `REPEATABLE READ` вся транзакция видит один снимок, сделанный при первой команде. Ни на одном из этих уровней транзакция не видит незафиксированных строк соседей, поэтому проверка «`SELECT`, потом `INSERT`» на обоих оставляет [гонку](#check-then-act). `SERIALIZABLE` гарантирует результат, как если бы транзакции шли по очереди: заметив опасное пересечение, база откатывает одну из них с кодом `40001`, и её нужно повторить. Подробно — часть 2b; ограничения урока 2.4 работают на любом уровне.
  links:
    - title: Документация PostgreSQL 18, «Transaction Isolation»
      url: https://www.postgresql.org/docs/18/transaction-iso.html
snapshot:
  term: Снимок
  en: Snapshot
  short: "Набор версий строк, которые видит команда или транзакция: всё, что зафиксировано к моменту снимка, и ничего из незавершённых чужих транзакций."
  long: |
    PostgreSQL не перезаписывает строку на месте, а хранит её версии (MVCC), и снимок решает, какая версия видна. Поэтому читатель не ждёт писателя и не видит его незафиксированных изменений. На `READ COMMITTED` снимок берётся на каждую команду, на `REPEATABLE READ` — один на транзакцию ([уровни изоляции](#isolation-level)). Проверки [ограничений](#constraint) `UNIQUE` и `EXCLUDE` снимком не ограничены: они видят и незафиксированные чужие записи и ждут их исхода. Подробно — MVCC в части 2b.
cte:
  term: CTE (общее табличное выражение)
  en: Common Table Expression
  short: "Именованный подзапрос в начале команды: `WITH x AS (…) SELECT … FROM x`; в PostgreSQL в нём может быть и `INSERT`, `UPDATE` или `DELETE`."
  long: |
    CTE с изменяющей командой (`WITH chat AS (UPDATE … RETURNING …) INSERT … SELECT … FROM chat`) позволяет сделать несколько изменений **одной** командой: они выполняются вместе и вместе откатываются, если команда упала. Мессенджер так выдаёт номер сообщения и вставляет его, и так вставляет чат с участниками. Проверки ограничений, которые идут после команды (внешний ключ), видят строки, вставленные в CTE. Разбор — уроки 2.4 и 2.9.
  links:
    - title: Документация PostgreSQL 18, «WITH Queries»
      url: https://www.postgresql.org/docs/18/queries-with.html
gist:
  term: GiST
  en: Generalized Search Tree
  short: "Вид индекса PostgreSQL для данных без линейного порядка — диапазонов, геометрии, полнотекстового поиска; понимает операторы вроде «пересекается» (`&&`)."
  long: |
    B-дерево умеет только «равно», «меньше» и «больше»; GiST — дерево, в узлах которого лежат обобщения ключей (например, охватывающий диапазон), и поиск спускается в те ветви, которые могут пересекаться с искомым. На нём строятся исключающие ограничения (`EXCLUDE USING gist`); чтобы в том же ограничении сравнивать на равенство обычные числа, нужно расширение `btree_gist`. Подробно об индексах — часть 2b.
  links:
    - title: Документация PostgreSQL 18, «GiST Indexes»
      url: https://www.postgresql.org/docs/18/gist.html
sqlstate:
  term: SQLSTATE
  en: SQLSTATE
  short: "Пятисимвольный код ошибки SQL, по которому программа узнаёт, что случилось: `23505` — нарушена уникальность, `23503` — внешний ключ, `23514` — `CHECK`."
  long: |
    Коды определены стандартом SQL и расширены PostgreSQL; первые два символа — класс (`23` — нарушение ограничения целостности, `40` — откат транзакции, `25` — неверное состояние транзакции). В отличие от текста сообщения код не переводится на язык сервера (`lc_messages`) и почти не меняется между версиями, поэтому ошибку различают по коду, а конкретное [ограничение](#constraint) — по его имени. В `pgx` код и имя лежат в полях `Code` и `ConstraintName` у `*pgconn.PgError`. Подробно — урок 2.4.
  links:
    - title: Документация PostgreSQL 18, «PostgreSQL Error Codes»
      url: https://www.postgresql.org/docs/18/errcodes-appendix.html
access-pattern:
  term: Паттерн доступа
  en: Access pattern
  short: Конкретный запрос или операция, которую приложение выполняет с данными, с частотой и требованиями к скорости.
  long: |
    Схему проектируют не «по сущностям вообще», а по тому, как её будут читать. Мессенджеру нужны: лента сообщений чата по `seq`, список чатов участника по активности, «состоит ли пользователь в чате». Из этих запросов следуют порядок столбцов первичного ключа `(chat_id, seq)`, индексы и [денормализация](#denormalization). Чтение ленты реализуется [keyset-пагинацией](#keyset-pagination), а запись — с [оптимистичной блокировкой](#optimistic-locking). Подробно — урок 2.5.
jsonb:
  term: JSONB
  en: JSONB
  short: Тип PostgreSQL для хранения JSON в бинарном разобранном виде, с операторами поиска по содержимому и индексами GIN.
  long: |
    Удобен для данных, у которых нет единой структуры или которые редко фильтруют: настройки клиента, вложения разных типов. Это не замена колонкам: `CHECK` по выражению над JSON и уникальный индекс по выражению сделать можно, но `FOREIGN KEY` на значение внутри JSON повесить нельзя, а частое чтение одного поля дороже, чем из обычного столбца. Злоупотребление превращается в [EAV](#eav) в одежде JSON. Подробно — урок 2.6.
  links:
    - title: Документация PostgreSQL, «JSON Types»
      url: https://www.postgresql.org/docs/18/datatype-json.html
soft-delete:
  term: Мягкое удаление
  en: Soft delete
  short: Вместо `DELETE` строку помечают удалённой (`deleted_at`) и скрывают из запросов, сохраняя в таблице.
  long: |
    Позволяет «восстановить» данные, но тянет за собой цену: каждый запрос должен помнить условие `deleted_at IS NULL`, уникальность приходится делать частичным индексом (иначе удалённое имя пользователя навсегда занято), внешние ключи видят удалённые строки, а право на удаление персональных данных остаётся невыполненным. Альтернативы: перенос в архивную таблицу и настоящее удаление с [журналом аудита](#audit-log). Подробно — урок 2.6.
audit-log:
  term: Журнал аудита
  en: Audit log
  short: Неизменяемая запись о том, кто, когда и что изменил в данных; ведётся триггером в базе или событиями из приложения.
  long: |
    Триггер в базе ловит любые изменения, включая ручной SQL, но не знает, кто из пользователей приложения их сделал. Запись из приложения знает контекст (пользователь, запрос), но обходится ручными правками. Журнал хранят append-only отдельной таблицей, и он закрывает часть задач, ради которых используют [мягкое удаление](#soft-delete). Подробно — урок 2.6.
multi-tenancy:
  term: Мультиарендность
  en: Multi-tenancy
  short: Архитектура, в которой один экземпляр системы обслуживает много независимых клиентов (арендаторов) с изолированными данными.
  long: |
    Три подхода по возрастанию изоляции и цены: общие таблицы со столбцом `tenant_id` (плюс [RLS](#row-level-security)), схема PostgreSQL на клиента, отдельная база на клиента. Мессенджер курса — не multi-tenant: все пользователи в одном пространстве. Урок показывает, где проходит граница, чтобы вы узнали задачу, когда она появится. Подробно — урок 2.7.
row-level-security:
  term: Защита на уровне строк (RLS)
  en: Row-level security
  short: Механизм PostgreSQL, при котором политики таблицы сами добавляют условие в каждый запрос, скрывая чужие строки.
  long: |
    После `ALTER TABLE ... ENABLE ROW LEVEL SECURITY` и политики вида `USING (tenant_id = current_setting('app.tenant')::uuid)` запрос арендатора физически не видит чужих строк, даже если разработчик забыл написать `WHERE`. Это защита «в глубину» для [мультиарендности](#multi-tenancy), но не замена прав приложения; владелец таблицы и суперпользователь по умолчанию политики обходят. Подробно — урок 2.7.
  links:
    - title: Документация PostgreSQL, «Row Security Policies»
      url: https://www.postgresql.org/docs/18/ddl-rowsecurity.html
eav:
  term: EAV (сущность — атрибут — значение)
  en: Entity-attribute-value
  short: "Антипаттерн: вместо столбцов хранить таблицу строк «объект, имя атрибута, значение»."
  long: |
    Гибко на вид: новый атрибут не требует миграции. Но тип у всех значений общий (текст), `NOT NULL`, `CHECK` и внешние ключи не работают, а чтобы собрать один объект, нужно соединять таблицу сама с собой столько раз, сколько атрибутов. В мессенджере так выглядели бы настройки пользователя строками `(user_id, attr, value)`: `value` — текст, поэтому «уведомления включены» и «размер шрифта» не отличить по типу, а выбрать пользователя с тёмной темой и крупным шрифтом — два соединения таблицы с собой. Если неструктурированность действительно нужна, честнее взять [JSONB](#jsonb) в одном столбце. Разбор среди антипаттернов Карвина — урок 2.7.
polymorphic-association:
  term: Полиморфная связь
  en: Polymorphic association
  short: "Антипаттерн: столбец ссылается на строку одной из нескольких таблиц, а какой именно, указывает отдельный столбец-тип."
  long: |
    Например, `comments(target_type, target_id)`, где комментарий относится то к сообщению, то к чату. База не может повесить на `target_id` [внешний ключ](#foreign-key), потому что целевых таблиц несколько, и ссылка на несуществующую строку проходит молча. Исправления по Карвину: обратить связь и завести таблицу-пересечение на каждый тип (`message_comments`, `chat_comments`) либо сделать общую родительскую таблицу, на которую ссылаются и комментарии, и все целевые таблицы. Подробно — урок 2.7.
migration:
  term: Миграция схемы
  en: Schema migration
  short: Версионированный скрипт, который переводит схему базы из одного состояния в другое; хранится в репозитории вместе с кодом.
  long: |
    Схему не правят руками на сервере: каждое изменение — файл с номером (`00001_init.sql`) с шагами «вверх» и, при необходимости, «вниз». Инструмент (в курсе — goose) помнит в служебной таблице, какие версии применены, и накатывает недостающие. В PostgreSQL DDL транзакционен, поэтому неудачная миграция откатывается целиком. Миграции выполняют отдельным шагом, а не при старте каждого экземпляра сервиса: иначе два экземпляра гоняются, а у приложения появляются лишние права. Подробно — урок 2.8.
  links:
    - title: goose
      url: https://github.com/pressly/goose
transaction:
  term: Транзакция
  en: Transaction
  short: Группа операций с базой, которая либо применяется целиком (`COMMIT`), либо не применяется вовсе (`ROLLBACK`).
  long: |
    Отправка сообщения в мессенджере — две записи: увеличить `last_seq` чата и вставить строку сообщения. Без транзакции сбой между ними оставит чат со «съеденным» номером. Границу транзакции задаёт use case, потому что только он знает, какие шаги составляют одну бизнес-операцию, поэтому он вызывает порт `Transactor`, а адаптер на `pgx` открывает транзакцию. Уровни изоляции и блокировки — модуль 2b. Подробно — урок 2.9.
  links:
    - title: Документация PostgreSQL, «Transactions»
      url: https://www.postgresql.org/docs/18/tutorial-transactions.html
testcontainers:
  term: Testcontainers
  en: Testcontainers
  short: Библиотека, которая запускает в тесте настоящую зависимость (например, PostgreSQL) в одноразовом Docker-контейнере.
  long: |
    Тесты Postgres-адаптеров должны идти против настоящего PostgreSQL, а не против имитации: поведение `UNIQUE`, `FOR UPDATE` и кодов ошибок воспроизводит только он. Пакет `testcontainers-go` поднимает контейнер на пакет тестов, применяет миграции, делает снимок состояния и восстанавливает его перед каждым тестом. Без Docker такие тесты пропускаются, а в CI идут отдельной джобой. Подробно — урок 2.9.
  links:
    - title: testcontainers-go
      url: https://golang.testcontainers.org/
savepoint:
  term: Точка сохранения
  en: Savepoint
  short: Метка внутри транзакции, до которой можно откатиться (`ROLLBACK TO SAVEPOINT`), не отменяя всю транзакцию.
  long: |
    `SAVEPOINT sp_1` запоминает состояние транзакции; если следующий шаг упал, `ROLLBACK TO SAVEPOINT sp_1` отменяет только его, и транзакция продолжается — даже после ошибки Postgres, которая иначе оборвала бы её (`25P02`). Так устроены «вложенные транзакции» в библиотеках: `Begin` у `pgx.Tx` ставит точку сохранения, режим `PropagationNested` у `go-transaction-manager` — тоже. Цена — лишний обмен с сервером на каждый шаг и соблазн проглотить ошибку шага. Мессенджер вложенный `WithinTx` выполняет во внешней транзакции без точек сохранения: операция удаётся или откатывается целиком. Подробно — урок 2.9 и ADR-0015.
  links:
    - title: Документация PostgreSQL 18, «SAVEPOINT»
      url: https://www.postgresql.org/docs/18/sql-savepoint.html
outbox:
  term: Transactional outbox
  en: Transactional outbox
  short: Приём, при котором сервис записывает событие для другой системы в свою базу в той же транзакции, что и изменение данных, а отдельный процесс потом доставляет его.
  long: |
    Две системы (две базы, база и брокер) одной транзакцией не охватить, а «записать в базу, потом отправить» теряет событие при падении между шагами. Outbox сводит задачу к одной базе: изменение и строка в таблице исходящих событий фиксируются вместе, а доставщик читает таблицу и отправляет события, пока получатель не подтвердит (доставка как минимум один раз, получатель обязан быть идемпотентным). В мессенджере регистрация пишет два контекста одной транзакцией, пока они в одной базе (урок 2.9, ADR-0015); при разделении на сервисы её место займут outbox или сага — модуль 7.
  links:
    - title: "Chris Richardson, «Pattern: Transactional outbox»"
      url: https://microservices.io/patterns/data/transactional-outbox.html
identity-column:
  term: Столбец identity
  en: Identity column
  short: "Столбец, значения которого выдаёт неявная последовательность базы: `bigint GENERATED ALWAYS AS IDENTITY` — стандартная SQL-замена `serial`."
  long: |
    Под капотом та же последовательность (объект sequence), что у `serial`, но она внутренне привязана к столбцу: удаляется и меняется вместе с ним, и отдельные права на неё для `INSERT` не нужны. Вариант `ALWAYS` отвергает явное значение в `INSERT`, если не написано `OVERRIDING SYSTEM VALUE`, — так никто случайно не вставит id руками и не обгонит последовательность. `serial` — не тип, а сокращение: последовательность плюс `DEFAULT nextval(…)`; для новых схем вики PostgreSQL рекомендует identity. Сравнение с [UUIDv7](#uuidv7) как [суррогатным ключом](#surrogate-key) — урок 2.3.
  links:
    - title: Документация PostgreSQL 18, «Identity Columns»
      url: https://www.postgresql.org/docs/18/ddl-identity-columns.html
checkpoint:
  term: Контрольная точка
  en: Checkpoint
  short: Момент, когда база сбрасывает на диск все изменённые страницы, после чего журнал до этой точки для восстановления больше не нужен.
  long: |
    После сбоя PostgreSQL проигрывает [WAL](#wal) не с начала времён, а с последней контрольной точки. Цена: первое изменение каждой страницы после контрольной точки пишет в журнал её [полный образ](#full-page-image). Поэтому вставки, которые трогают немного страниц (возрастающий ключ), пишут в журнал гораздо меньше, чем вставки по всему индексу (UUIDv4). По умолчанию контрольная точка — раз в `checkpoint_timeout` = 5 минут или по достижении `max_wal_size`. Замер — урок 2.3, устройство — модуль 2b.
  links:
    - title: Документация PostgreSQL 18, «WAL Configuration»
      url: https://www.postgresql.org/docs/18/wal-configuration.html
full-page-image:
  term: Полный образ страницы
  en: Full-page image (FPI)
  short: Копия всей 8-КиБ страницы, которую PostgreSQL пишет в WAL при первом изменении страницы после контрольной точки.
  long: |
    Запись страницы на диск не атомарна: при сбое посреди записи на диске окажется половина старой и половина новой страницы, и обычная запись журнала «вставь ключ в позицию 17» к такой странице неприменима. Поэтому при `full_page_writes = on` (по умолчанию) первое изменение каждой страницы после [контрольной точки](#checkpoint) кладёт в [WAL](#wal) её целую копию; пустую середину страницы PostgreSQL при этом пропускает. Счётчик таких записей — `wal_fpi` в `pg_stat_wal`. Сколько их пишут случайные и возрастающие ключи — урок 2.3.
  links:
    - title: Документация PostgreSQL 18, «full_page_writes»
      url: https://www.postgresql.org/docs/18/runtime-config-wal.html#GUC-FULL-PAGE-WRITES
collation:
  term: Коллация
  en: Collation
  short: "Правила, по которым база сравнивает и сортирует строки: порядок букв, учёт регистра и диакритики."
  long: |
    У каждого текстового столбца и выражения в PostgreSQL есть коллация. Её даёт провайдер: `libc` операционной системы, ICU или встроенный (`builtin`; в PostgreSQL 18 появилась встроенная `PG_UNICODE_FAST`). Детерминированная коллация считает строки равными, только если совпадают их байты; недетерминированная (только ICU) может считать равными `Alice` и `alice` — тогда без учёта регистра работают `=`, `UNIQUE` и (с PostgreSQL 18) `LIKE`, но не регулярные выражения. Смена версии библиотеки коллаций может поменять порядок строк и испортить индексы. Альтернативы для имён без учёта регистра — `citext` и уникальный индекс по `lower()`; выбор — урок 2.3.
  links:
    - title: Документация PostgreSQL 18, «Collation Support»
      url: https://www.postgresql.org/docs/18/collation.html
composite-index:
  term: Составной индекс
  en: Composite (multicolumn) index
  short: "Индекс по нескольким столбцам, упорядоченный как телефонная книга: сначала по первому столбцу, при равенстве — по второму."
  long: |
    B-дерево по `(chat_id, seq)` хранит ключи отсортированными по `chat_id`, а внутри одного `chat_id` — по `seq`. Поэтому оно быстро отвечает на запросы с условием на **левый префикс**: «все сообщения чата» или «сообщения чата с `seq` меньше 500 в порядке убывания», но почти бесполезно для «все сообщения с `seq` = 7 во всех чатах». Правило выбора порядка: сначала столбцы с условием равенства, потом столбец диапазона или сортировки. Первичный ключ из нескольких столбцов — тоже составной индекс. Подробно — урок 2.5, устройство B-дерева — часть 2b.
  links:
    - title: Документация PostgreSQL 18, «Multicolumn Indexes»
      url: https://www.postgresql.org/docs/18/indexes-multicolumn.html
index-only-scan:
  term: Сканирование только индекса
  en: Index-only scan
  short: План, который берёт все нужные столбцы из самого индекса и не читает строки таблицы.
  long: |
    Обычный поиск по [индексу](#index) находит в нём ссылку на строку и идёт за строкой в таблицу. Если запросу нужны только столбцы, которые уже лежат в индексе, второй шаг можно пропустить, — но только для страниц таблицы, которые карта видимости (visibility map) отмечает как «все строки видны всем»; для остальных PostgreSQL всё равно заглядывает в таблицу (`Heap Fetches` в `EXPLAIN`). Мессенджер так читает участников чата из первичного ключа `chat.members`. Подробно — часть 2b.
  links:
    - title: Документация PostgreSQL 18, «Index-Only Scans and Covering Indexes»
      url: https://www.postgresql.org/docs/18/indexes-index-only-scans.html
explain:
  term: EXPLAIN
  en: EXPLAIN
  short: "Команда, которая показывает план выполнения запроса; с `ANALYZE` — выполняет его и добавляет настоящие числа строк, циклов и прочитанных страниц."
  long: |
    План — дерево узлов: как читаются таблицы (полный проход, по индексу), как соединяются и сортируются. `EXPLAIN (ANALYZE, BUFFERS)` выполняет запрос и для каждого узла печатает `actual rows` (сколько строк он отдал за один цикл), `loops` (сколько раз выполнялся) и `Buffers` — сколько страниц по 8 КиБ найдено в общем кеше PostgreSQL (`shared hit`) и сколько пришлось читать из файлов (`read`: это не обязательно диск — страница может прийти из кеша операционной системы). Число страниц воспроизводится лучше времени и потому годится для сравнения планов. Осторожно: `ANALYZE` действительно выполняет запрос, в том числе `UPDATE`. Читать планы учит урок 2.5, устройство планировщика — часть 2b.
  links:
    - title: Документация PostgreSQL 18, «Using EXPLAIN»
      url: https://www.postgresql.org/docs/18/using-explain.html
hot-update:
  term: HOT-обновление
  en: Heap-only tuple (HOT) update
  short: "Обновление строки, при котором PostgreSQL не трогает индексы: новая версия строки ложится на ту же страницу и связывается со старой."
  long: |
    `UPDATE` в PostgreSQL не меняет строку на месте, а пишет её новую версию. Обычно на новую версию должны указать **все** индексы таблицы — по новой записи в каждом. Если же `UPDATE` не меняет ни одного проиндексированного столбца и на странице хватает места, новая версия становится «только кучевой» (heap-only tuple): индексы продолжают указывать на старую версию, а от неё по цепочке находится новая. Это экономит запись в индексы, WAL и разрастание индексов. Один лишний индекс по часто меняемому столбцу отключает HOT для всех обновлений этого столбца: в лабе урока 2.5 индекс по `chat.chats.last_activity_at` превратил 200 HOT-обновлений из 200 в 0 из 200. Подробно — часть 2b.
  links:
    - title: Документация PostgreSQL 18, «Heap-Only Tuples (HOT)»
      url: https://www.postgresql.org/docs/18/storage-hot.html
pessimistic-locking:
  term: Пессимистическая блокировка
  en: Pessimistic locking
  short: "Способ избежать потерянных обновлений: объект запирают при чтении, и другие писатели ждут, пока владелец замка не закончит."
  long: |
    Противоположность [оптимистической блокировке](#optimistic-locking): конфликт не обнаруживают при записи, а не допускают заранее. В PostgreSQL это `SELECT … FOR UPDATE` (или более слабый `FOR NO KEY UPDATE`): строка заперта до конца транзакции, второй такой `SELECT` ждёт. Повторов нет, но замок держится всё время между чтением и `COMMIT`, а несколько замков, взятых в разном порядке, могут дать взаимоблокировку. Выбор между двумя подходами для мессенджера — урок 2.5.
  links:
    - title: Документация PostgreSQL 18, «Explicit Locking» — Row-Level Locks
      url: https://www.postgresql.org/docs/18/explicit-locking.html#LOCKING-ROWS
partial-index:
  term: Частичный индекс
  en: Partial index
  short: Индекс не по всем строкам таблицы, а только по тем, что подходят под условие `WHERE` из его определения.
  long: |
    `CREATE INDEX … WHERE deleted_at IS NULL` хранит записи только для живых строк: индекс меньше, а уникальный частичный индекс проверяет уникальность только среди них — так [мягкое удаление](#soft-delete) не держит имя удалённого пользователя занятым навсегда. Планировщик берёт такой индекс, только если из условия запроса следует условие индекса: запрос без `deleted_at IS NULL` его не использует. На уникальный частичный индекс нельзя сослаться [внешним ключом](#foreign-key). Подробно — уроки 2.4 и 2.6.
  links:
    - title: Документация PostgreSQL 18, «Partial Indexes»
      url: https://www.postgresql.org/docs/18/indexes-partial.html
db-trigger:
  term: Триггер
  en: Trigger
  short: Функция, которую база сама вызывает при `INSERT`, `UPDATE` или `DELETE` в таблице — до или после изменения, для каждой строки или для команды целиком.
  long: |
    Триггер срабатывает при любом писателе: приложении, ручном SQL, скрипте миграции, — поэтому на нём строят [журнал аудита](#audit-log), который нельзя обойти. Цена — работа внутри каждой команды записи (в лабе урока 2.6 `UPDATE` 100 000 строк с триггером аудита шёл втрое дольше и писал почти вдвое больше WAL) и логика, которую не видно из кода приложения. Ограничения целостности (`FOREIGN KEY`) PostgreSQL тоже реализует системными триггерами. Подробно — урок 2.6.
  links:
    - title: Документация PostgreSQL 18, «Triggers»
      url: https://www.postgresql.org/docs/18/triggers.html
right-to-erasure:
  term: Право на удаление
  en: Right to erasure
  short: Право человека потребовать, чтобы сервис удалил его персональные данные; в GDPR — статья 17, «право быть забытым».
  long: |
    В России похожее требование — в 152-ФЗ «О персональных данных» (статья 21: уничтожение данных после отзыва согласия). Для базы это значит: [мягкое удаление](#soft-delete) не годится, потому что данные остаются в таблице; настоящее удаление упирается во [внешние ключи](#foreign-key) и чужие данные (сообщения в чужих чатах). Обычный путь — обезличить строку (заменить имя и контакты, оставить идентификатор ради ссылок) и пройти по всем копиям: [журналу аудита](#audit-log), архивам, кешам; резервные копии очищаются сроком хранения. Подробно — урок 2.6.
  links:
    - title: GDPR, статья 17 «Right to erasure»
      url: https://gdpr-info.eu/art-17-gdpr/
gin-index:
  term: GIN-индекс
  en: Generalized inverted index (GIN)
  short: "Обратный индекс PostgreSQL для составных значений — JSONB, массивов, полнотекстового поиска: по каждому элементу хранит список строк, где он встречается."
  long: |
    B-дерево индексирует значение целиком, а GIN раскладывает его на элементы (ключи и значения JSONB, элементы массива, слова) и для каждого элемента хранит список адресов строк. Поэтому он отвечает на «содержит» (`@>` у [JSONB](#jsonb)) и «есть ключ» (`?`), но не на сравнение извлечённого текста (`settings ->> 'language' = 'kk'`) — для него строят B-дерево по выражению. Для JSONB два класса операторов: `jsonb_ops` (по умолчанию, умеет `@>`, `?`, `?|`, `?&`) и меньший `jsonb_path_ops` (только `@>` и jsonpath). Подробно — урок 2.6 и часть 2b.
  links:
    - title: Документация PostgreSQL 18, «GIN Indexes»
      url: https://www.postgresql.org/docs/18/gin.html
temporal-table:
  term: Темпоральная таблица
  en: Temporal table
  short: Таблица, которая хранит не только текущее состояние строк, но и периоды, когда каждая версия была верна, — и умеет отвечать «каким было значение на момент T».
  long: |
    Стандарт SQL:2011 различает два времени: системное (когда версия была записана в базу — system-versioned таблицы: `WITH SYSTEM VERSIONING` в стандарте и MariaDB, `SYSTEM_VERSIONING = ON` в SQL Server, `ADD VERSIONING` в Db2) и прикладное (когда факт верен в мире — например, период действия тарифа). В PostgreSQL 18 есть только часть второго: ограничения `WITHOUT OVERLAPS` для первичного ключа и `UNIQUE` и `PERIOD` для внешних ключей; системного версионирования нет, и историю строк ведут [триггером](#db-trigger) в отдельную таблицу или событиями из приложения. Подробно — урок 2.6.
  links:
    - title: Документация PostgreSQL 18, «CREATE TABLE» — WITHOUT OVERLAPS и PERIOD
      url: https://www.postgresql.org/docs/18/sql-createtable.html
noisy-neighbor:
  term: Шумный сосед
  en: Noisy neighbor
  short: Арендатор или нагрузка, которая на общих ресурсах (процессор, диск, соединения, кеш) ухудшает работу всех остальных.
  long: |
    Когда клиенты делят одну базу, тяжёлый отчёт одного из них вытесняет из кеша страницы остальных, занимает соединения пула и диск, и у всех растут задержки, хотя «их» запросы не менялись. Это главная эксплуатационная цена общей схемы в [мультиарендности](#multi-tenancy): изоляция данных есть, а изоляции ресурсов нет. Лечат лимитами на арендатора в приложении, тайм-аутами запросов и переносом крупного клиента в отдельную схему или базу. Подробно — урок 2.7.
  links:
    - title: AWS SaaS Lens, «Silo, Pool, and Bridge Models»
      url: https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/silo-pool-and-bridge-models.html
adjacency-list:
  term: Список смежности
  en: Adjacency list
  short: Хранение дерева в таблице, где у каждой строки есть ссылка на родителя (`parent_id`).
  long: |
    Самая простая и самая частая модель дерева: вставка и перенос ветки — одна строка, ссылочная целостность — обычный внешний ключ на ту же таблицу. Её слабое место — чтение ветки: запрос с фиксированным числом самосоединений знает глубину заранее и теряет всё, что глубже. Карвин называет список смежности, который читают такими запросами, «наивными деревьями». В PostgreSQL ветку любой глубины читает рекурсивный запрос `WITH RECURSIVE`, поэтому список смежности остаётся хорошим выбором; для очень частого чтения глубоких деревьев есть [таблица замыканий](#closure-table). Подробно — урок 2.7.
  links:
    - title: Документация PostgreSQL 18, «WITH Queries» — рекурсивные запросы
      url: https://www.postgresql.org/docs/18/queries-with.html
closure-table:
  term: Таблица замыканий
  en: Closure table
  short: "Отдельная таблица всех пар «предок — потомок» дерева с глубиной: ветка любого узла читается одним запросом по индексу."
  long: |
    Для каждого узла в таблице хранится строка на каждого его предка, включая сам узел: `(ancestor_id, descendant_id, depth)`. «Вся ветка сообщения 1» — `WHERE ancestor_id = 1`, без рекурсии. Цена — место (строк столько, сколько пар предок — потомок) и запись: вставка листа добавляет по строке на каждого предка, перенос ветки переписывает пары. Карвин предлагает её как одно из исправлений «наивных деревьев» наряду с перечислением путей и вложенными множествами. Подробно — урок 2.7.
  links:
    - title: Bill Karwin, «SQL Antipatterns, Volume 1», глава «Naive Trees»
ddl:
  term: DDL
  en: Data Definition Language
  short: Команды SQL, которые меняют не данные, а саму схему — `CREATE`, `ALTER`, `DROP` таблиц, индексов, схем и ограничений.
  long: |
    SQL делят на DDL (определение схемы) и DML (`SELECT`, `INSERT`, `UPDATE`, `DELETE` — работа с данными). В PostgreSQL почти весь DDL транзакционен: `CREATE TABLE` и `ALTER TABLE` внутри `BEGIN … ROLLBACK` бесследно откатываются, и миграция из нескольких операторов применяется целиком или никак. Исключения — команды, которые нельзя выполнять в транзакции: `CREATE INDEX CONCURRENTLY`, `CREATE DATABASE`, `VACUUM`. В MySQL DDL вызывает неявный `COMMIT`, поэтому там сбой посередине миграции оставляет схему наполовину изменённой. Подробно — урок 2.8.
  links:
    - title: Документация PostgreSQL 18, «Data Definition»
      url: https://www.postgresql.org/docs/18/ddl.html
advisory-lock:
  term: Рекомендательная блокировка
  en: Advisory lock
  short: Блокировка PostgreSQL на произвольное число, смысл которого задаёт приложение; база её только выдаёт и освобождает.
  long: |
    `pg_advisory_lock(42)` ничего не блокирует в таблицах: он лишь гарантирует, что второй сеанс с тем же числом подождёт (или, с `pg_try_advisory_lock`, сразу получит `false`), пока первый не вызовет `pg_advisory_unlock(42)` или не закроет соединение. Ею сериализуют действия, которые должны выполняться по одному на всю базу, — например, применение миграций: goose берёт рекомендательную блокировку сеанса с фиксированным номером, и второй одновременный `migrate up` ждёт первого. Блокировка сеанса живёт на соединении, поэтому с пулом и PgBouncer в режиме транзакций ею пользуются осторожно. Подробно — урок 2.8.
  links:
    - title: Документация PostgreSQL 18, «Advisory Locks»
      url: https://www.postgresql.org/docs/18/explicit-locking.html#ADVISORY-LOCKS
expand-contract:
  term: Expand/contract (расширить и сузить)
  en: Expand/contract, parallel change
  short: Изменение схемы в несколько выкладок так, чтобы на каждом шаге и старая, и новая версия кода работали с базой.
  long: |
    Переименовать столбец одной миграцией нельзя без простоя: старые экземпляры сервиса ещё читают старое имя. Поэтому изменение делят: сначала **расширяют** схему (добавляют новый столбец, код пишет в оба), затем переносят данные и переключают чтение, и только когда старого кода не осталось, **сужают** (удаляют старый столбец). Каждая миграция при этом совместима с предыдущим выпуском. Мартин Фаулер называет приём parallel change. Анонс — урок 2.8, подробно — модуль 2b.
  links:
    - title: Martin Fowler, «ParallelChange»
      url: https://martinfowler.com/bliki/ParallelChange.html
mvcc:
  term: MVCC (многоверсионность)
  en: Multiversion concurrency control
  short: Способ PostgreSQL работать с параллельными транзакциями, при котором строка не перезаписывается на месте, а получает новую версию, и каждый читатель видит свою версию.
  long: |
    `UPDATE` строки `chat.members` не меняет её байты: PostgreSQL пишет рядом новую версию, а у старой проставляет `xmax` — номер транзакции, которая её заменила; у новой версии `xmin` — номер транзакции, которая её создала. Какая из версий видна команде, решает её [снимок](#snapshot): зафиксирована ли транзакция из `xmin`, не зафиксирована ли транзакция из `xmax`. Поэтому читатель не ждёт писателя, а писатель — читателя. Цена — старые версии остаются в таблице и после `COMMIT`: когда их уже не видит ни один снимок, они становятся [мёртвыми строками](#dead-tuple), и убирает их [VACUUM](#vacuum). Подробно — модуль 2b.
  links:
    - title: Документация PostgreSQL, «Concurrency Control — Introduction»
      url: https://www.postgresql.org/docs/current/mvcc-intro.html
vacuum:
  term: VACUUM (и autovacuum)
  en: VACUUM, autovacuum
  short: Фоновая уборка PostgreSQL, которая удаляет мёртвые версии строк, освобождает их место на страницах и обновляет карту видимости.
  long: |
    Из-за [MVCC](#mvcc) каждый `UPDATE` и `DELETE` оставляет в таблице [мёртвую строку](#dead-tuple), а в индексах — записи, которые на неё указывают. `VACUUM` удаляет такие версии из таблицы и их записи из индексов, отмечает освободившееся место в [карте свободного места](#free-space-map), чтобы новые строки легли туда, и ставит отметки all-visible в [карте видимости](#visibility-map) — без них [Index Only Scan](#index-only-scan) ходит в таблицу. Файл при этом обычно не уменьшается (отрезаются только пустые страницы в конце): место переиспользуется, а не возвращается системе; ужимает файл лишь `VACUUM FULL`, переписывая таблицу под эксклюзивной блокировкой. Вручную его запускают редко: autovacuum сам берётся за таблицу, когда мёртвых строк больше порога (по умолчанию 50 + 20 % строк таблицы), а по своему порогу запускает и `ANALYZE` — обновляет статистику для [планировщика](#query-planner). Если уборка не успевает, таблица и индексы «пухнут», и каждый запрос читает больше страниц; подробно — модуль 2b.
  links:
    - title: Документация PostgreSQL, «Routine Vacuuming»
      url: https://www.postgresql.org/docs/current/routine-vacuuming.html
dead-tuple:
  term: Мёртвая строка
  en: Dead tuple
  short: Старая версия строки, которую уже не видит ни одна транзакция, но которая ещё занимает место на странице таблицы.
  long: |
    Появляется после `UPDATE` (старая версия) и `DELETE` (удалённая строка): по правилам [MVCC](#mvcc) их нельзя стереть сразу, пока их может видеть чей-то [снимок](#snapshot). Когда такие снимки закончились, версия мертва: читать её никто не будет, но место она занимает, и индексы по-прежнему указывают на неё. Убирает мёртвые строки [VACUUM](#vacuum); долгая открытая транзакция мешает ему, потому что её снимок держит старые версии «живыми». Сколько мёртвых строк в таблице, показывает `n_dead_tup` в `pg_stat_user_tables`.
  links:
    - title: Документация PostgreSQL, «Routine Vacuuming»
      url: https://www.postgresql.org/docs/current/routine-vacuuming.html
tuple:
  term: Кортеж (версия строки)
  en: Tuple, heap tuple
  short: Одна версия строки в таблице PostgreSQL — служебный заголовок плюс значения столбцов.
  long: |
    В документации PostgreSQL строку на странице называют кортежем, потому что при [MVCC](#mvcc) у одной логической строки может быть несколько физических версий. Заголовок (около 23 байт) хранит `xmin` и `xmax` — какие транзакции создали и заменили версию, — и ссылку на следующую версию; за ним идут значения, например `chat_id` и `user_id` строки `chat.members`. Кортеж лежит на [странице](#db-page) [таблицы](#heap-table), и его адрес — [TID](#tid). Поэтому строка `chat.members` из двух uuid весит заметно больше 32 байт.
  links:
    - title: Документация PostgreSQL, «Database Page Layout»
      url: https://www.postgresql.org/docs/current/storage-page-layout.html
tid:
  term: TID (ctid)
  en: Tuple identifier
  short: Адрес версии строки в таблице — пара «номер страницы, номер позиции на ней», например `(0,1)`.
  long: |
    Индекс хранит не строку, а ключ и TID: найдя в `members_user_id_idx` ключ `user_id = 42` с TID `(3,2)` (числа учебные), PostgreSQL читает ровно одну страницу таблицы — третью — и берёт её второй указатель строки. Позиции на странице нумеруются с 1. Увидеть адрес можно скрытым столбцом: `SELECT ctid, * FROM chat.members`. TID — физический адрес, а не идентификатор: после `UPDATE` у новой версии строки свой TID, а `VACUUM FULL` переписывает таблицу и меняет все адреса, поэтому хранить ctid в приложении нельзя. Каждый TID в [Index Scan](#index-scan) — отдельное, обычно случайное чтение страницы.
  links:
    - title: Документация PostgreSQL, «System Columns»
      url: https://www.postgresql.org/docs/current/ddl-system-columns.html
    - title: Документация PostgreSQL, «Database Page Layout»
      url: https://www.postgresql.org/docs/current/storage-page-layout.html
visibility-map:
  term: Карта видимости
  en: Visibility map
  short: Маленький файл рядом с таблицей, где на каждую страницу таблицы два бита — «все строки видны всем» (all-visible) и «все строки заморожены» (all-frozen).
  long: |
    Индекс не знает, видна ли строка транзакции: `xmin` и `xmax` лежат только в [кортеже](#tuple). Если же у страницы таблицы стоит бит all-visible, [Index Only Scan](#index-only-scan) верит индексу и в таблицу не идёт; иначе читает страницу — это `Heap Fetches` в `EXPLAIN`. Биты ставит [VACUUM](#vacuum), а любое изменение страницы снимает all-visible; второй бит, all-frozen, позволяет VACUUM пропускать страницу при заморозке старых номеров транзакций. В лабе 2a подзапрос «участники чата» после `VACUUM` шёл как `Index Only Scan using members_pkey … Heap Fetches: 0` — в таблицу не пошёл ни разу (`labs/2a/results/messenger-explain.txt`).
  links:
    - title: Документация PostgreSQL, «Visibility Map»
      url: https://www.postgresql.org/docs/current/storage-vm.html
heap-table:
  term: Куча (heap) таблицы
  en: Heap
  short: Основной файл таблицы PostgreSQL, где строки лежат без порядка — туда, где нашлось свободное место.
  long: |
    Не путать с двоичной кучей из алгоритмов и с [кучей Go](#heap-allocation) — областью памяти, где живут объекты процесса. Строки `chat.members` лежат в heap в порядке вставки, а не по `user_id`, поэтому найти «все чаты пользователя» без [индекса](#index) можно только [полным проходом](#seq-scan). Файл нарезан на [страницы](#db-page) по 8 КБ, место для новой строки подсказывает [карта свободного места](#free-space-map). Индексы ссылаются на строки heap по [TID](#tid).
  links:
    - title: Документация PostgreSQL, «Database File Layout»
      url: https://www.postgresql.org/docs/current/storage-file-layout.html
db-page:
  term: Страница (блок) базы
  en: Page, block
  short: Кусок файла таблицы или индекса фиксированного размера (в PostgreSQL 8 КБ); единица чтения, записи и кэширования.
  long: |
    Чтобы получить одну строку, PostgreSQL читает её страницу целиком и держит страницы в своём кэше (`shared_buffers`), поэтому стоимость запроса меряют в страницах — `Buffers` в [EXPLAIN](#explain). Страница таблицы — заголовок, массив указателей строк (растёт от начала) и сами [кортежи](#tuple) (растут от конца), между ними — свободное место. Страницы [B-дерева](#b-tree) устроены так же, но хранят индексные записи. Оценка порядка величины: при ~60 байтах на строку таблица `chat.members` из 2 млн строк занимает около 15 тыс. страниц.
  links:
    - title: Документация PostgreSQL, «Database Page Layout»
      url: https://www.postgresql.org/docs/current/storage-page-layout.html
b-tree:
  term: B-дерево (B-tree)
  en: B-tree
  short: Сбалансированное дерево страниц, в листьях которого лежат отсортированные ключи с адресами строк; тип индекса PostgreSQL по умолчанию.
  long: |
    Листья — отсортированные пары «ключ → [TID](#tid)», над ними — внутренние страницы и корень с записями «разделитель → номер страницы уровнем ниже»; с чего начинать спуск, говорит [метастраница](#metapage). Страница вмещает сотни разделителей, поэтому каждый уровень сужает поиск в сотни раз: в лабе 2a спуск по `members_user_id_idx` на 2 млн строк читает 3 страницы (`Buffers: shared hit=3`). Листья связаны ссылками на соседей, так что диапазон и `ORDER BY` читаются проходом вправо без возврата к корню. Дерево растёт в высоту только когда [делится](#b-tree-page-split) корень, поэтому все листья всегда на одной глубине. Подробно — модуль 2b.
  links:
    - title: Документация PostgreSQL, «B-Tree Indexes»
      url: https://www.postgresql.org/docs/current/btree.html
seq-scan:
  term: Последовательное сканирование (Seq Scan)
  en: Sequential scan
  short: План, который читает все страницы таблицы подряд и проверяет условие у каждой строки.
  long: |
    Без [индекса](#index) найти строки `chat.members` с нужным `user_id` можно только так: строки в [heap](#heap-table) не отсортированы, и остановиться раньше нельзя — дальше может найтись ещё одна. Зато страницы читаются подряд, а последовательное чтение дешевле случайного, поэтому, когда условие выбирает большую долю строк или таблица маленькая, [планировщик](#query-planner) выбирает Seq Scan и правильно делает. Стоимость растёт вместе с таблицей, а спуск по индексу почти нет.
  links:
    - title: Документация PostgreSQL, «Using EXPLAIN»
      url: https://www.postgresql.org/docs/current/using-explain.html
index-scan:
  term: Сканирование по индексу (Index Scan)
  en: Index scan
  short: "План, который спускается по индексу к нужным ключам и по каждому найденному TID читает строку из таблицы."
  long: |
    Спуск по [B-дереву](#b-tree) находит в листе ключ и его [TID](#tid), затем — страница таблицы, строка, проверка её видимости, следующий TID. Строки выходят в порядке индекса, поэтому такой план годится и для `ORDER BY`. Каждое обращение к таблице — обычно случайное чтение, так что Index Scan выгоден, когда строк мало: в лабе 2a для пользователя с 20 чатами `Index Scan using members_user_id_idx` прочитал 23 страницы — 3 спуска по индексу и по странице таблицы на чат (`labs/2a/results/messenger-explain.txt`). Когда строк много, планировщик переходит на [Bitmap Scan](#bitmap-scan) или [Seq Scan](#seq-scan).
  links:
    - title: Документация PostgreSQL, «Using EXPLAIN»
      url: https://www.postgresql.org/docs/current/using-explain.html
bitmap-scan:
  term: Сканирование по битовой карте (Bitmap Scan)
  en: Bitmap index scan, bitmap heap scan
  short: "План из двух шагов: сначала собрать из индекса все подходящие TID в битовую карту по страницам, потом прочитать каждую нужную страницу таблицы один раз, по порядку."
  long: |
    `Bitmap Index Scan` проходит индекс и отмечает, на каких страницах есть подходящие строки; `Bitmap Heap Scan` читает эти страницы в порядке их номеров в файле, и страница, где лежат три нужные строки, читается один раз, а не три. Это середина между [Index Scan](#index-scan) и [Seq Scan](#seq-scan): чтений меньше и они ближе к последовательным, но порядок индекса теряется, и для `ORDER BY` нужна отдельная сортировка. В лабе 2a для пользователя с 1000 чатов тот же запрос пошёл так: 3 страницы индекса и `Heap Blocks: exact=960` — 960 страниц таблицы (`labs/2a/results/messenger-explain.txt`). Если карта не помещается в `work_mem`, часть её хранит только номера страниц, и на таких страницах условие `Recheck Cond` перепроверяется у каждой строки (`Heap Blocks: lossy`).
  links:
    - title: Документация PostgreSQL, «Combining Multiple Indexes»
      url: https://www.postgresql.org/docs/current/indexes-bitmap-scans.html
    - title: Документация PostgreSQL, «Using EXPLAIN»
      url: https://www.postgresql.org/docs/current/using-explain.html
query-planner:
  term: Планировщик запросов
  en: Query planner, optimizer
  short: Часть PostgreSQL, которая решает, как выполнить SQL-запрос, — перебирает способы и выбирает самый дешёвый по оценке.
  long: |
    SQL говорит, что нужно, а план — как это достать: прочитать таблицу целиком ([Seq Scan](#seq-scan)), спуститься по индексу ([Index Scan](#index-scan)) или собрать адреса и читать таблицу по порядку ([Bitmap Scan](#bitmap-scan)). Число строк планировщик оценивает по статистике `pg_stats`, которую собирает `ANALYZE` (число различных значений, частые значения, гистограмма), то есть по селективности условия, а стоимость считает в условных единицах, где чтение страницы подряд стоит `seq_page_cost = 1`, а случайное — `random_page_cost = 4`. Поэтому индекс — не приказ, а возможность: в лабе 2a один и тот же запрос дал Index Scan для пользователя с 20 чатами и Bitmap Heap Scan для пользователя с 1000. Посмотреть выбор — [EXPLAIN](#explain); устройство планировщика — модуль 2b.
  links:
    - title: Документация PostgreSQL, «Statistics Used by the Planner»
      url: https://www.postgresql.org/docs/current/planner-stats.html
    - title: Документация PostgreSQL, «Using EXPLAIN»
      url: https://www.postgresql.org/docs/current/using-explain.html
fillfactor:
  term: Fillfactor (коэффициент заполнения)
  en: Fillfactor
  short: Сколько процентов страницы PostgreSQL заполняет при вставке или построении индекса, оставляя остальное под будущие изменения.
  long: |
    У таблиц по умолчанию 100 %: страница забивается целиком. Если строки часто обновляют, `fillfactor = 90` оставляет на каждой странице место для новой версии, и обновление может стать [HOT](#hot-update) — без записи в индексы. У [B-дерева](#b-tree) по умолчанию 90 %: `CREATE INDEX` заполняет листья не до конца, чтобы ближайшие вставки не вызывали [разделения страниц](#b-tree-page-split). Цена меньшего fillfactor — больше страниц и, значит, больше чтений. Задаётся параметром хранения: `CREATE TABLE … WITH (fillfactor = 90)`.
  links:
    - title: Документация PostgreSQL, «CREATE TABLE» — параметры хранения
      url: https://www.postgresql.org/docs/current/sql-createtable.html
    - title: Документация PostgreSQL, «Heap-Only Tuples (HOT)»
      url: https://www.postgresql.org/docs/current/storage-hot.html
posting-list:
  term: Posting list (дедупликация B-дерева)
  en: Posting list, B-tree deduplication
  short: Запись листа B-дерева, где повторяющийся ключ хранится один раз со списком адресов строк; есть в PostgreSQL с версии 13.
  long: |
    Пользователь мессенджера состоит во многих чатах, поэтому в `members_user_id_idx` ключ `user_id` повторяется постоянно. Без дедупликации на каждую пару был бы отдельный ключ с отдельным [TID](#tid); с ней ключ (в учебной модели — 42) записан один раз со списком своих TID, отсортированных по адресу, и индекс заметно меньше. `CREATE INDEX` строит списки сразу, а при обычных вставках они собираются, когда лист заполнился: перед [разделением страницы](#b-tree-page-split) PostgreSQL пробует дедуплицировать её и делит, только если места всё равно не хватило. Для некоторых типов (например, `numeric`, `jsonb`) и индексов с `INCLUDE` дедупликация не применяется.
  links:
    - title: Документация PostgreSQL, «B-Tree Implementation» — Deduplication
      url: https://www.postgresql.org/docs/current/btree-implementation.html
metapage:
  term: Метастраница
  en: Metapage
  short: Служебная страница в начале файла индекса (блок 0), где B-дерево хранит номер корневой страницы и высоту дерева.
  long: |
    Поиск по [B-дереву](#b-tree) начинается с вопроса «где корень?», и ответ лежит здесь. Корень не прибит к одному месту: когда он [делится](#b-tree-page-split), над ним появляется новый, и переписывают только метастраницу. Её копию PostgreSQL держит в памяти, поэтому в `Buffers` у [EXPLAIN](#explain) это чтение обычно не видно.
  links:
    - title: Документация PostgreSQL, «B-Tree Implementation»
      url: https://www.postgresql.org/docs/current/btree-implementation.html
free-space-map:
  term: Карта свободного места (FSM)
  en: Free space map
  short: Файл рядом с таблицей или индексом, где PostgreSQL примерно отмечает, сколько свободного места на каждой странице.
  long: |
    Когда `INSERT` кладёт новую строку `chat.members`, PostgreSQL ищет по этой карте страницу [heap](#heap-table), где хватит места, а не дописывает строго в конец и тем более не ставит строку по порядку ключа. Поэтому строки одного пользователя оказываются на разных страницах. Место, освобождённое [VACUUM](#vacuum), попадает в карту, и новые строки занимают его вместо роста файла. У индекса своя карта: в ней отмечены целиком пустые страницы, которые можно взять заново.
  links:
    - title: Документация PostgreSQL, «Free Space Map»
      url: https://www.postgresql.org/docs/current/storage-fsm.html
