system-design:
  term: Проектирование систем (system design)
  en: System Design
  short: Выбор компонентов системы, связей между ними и компромиссов так, чтобы система выполняла требования при реальной нагрузке.
  long: |
    Это ответ на вопрос «из чего собрать систему и почему именно так». Если код — это кирпичи, то system design — план здания: где несущие стены, сколько этажей выдержит фундамент и что будет, если половина лифтов сломается. В курсе мы проектируем мессенджер и каждое решение фиксируем вместе с причинами.
  links:
    - title: Клеппман, «Высоконагруженные приложения», гл. 1
functional-requirements:
  term: Функциональные требования
  en: Functional requirements
  short: Что система должна делать — её возможности с точки зрения пользователя.
  long: |
    Отвечают на вопрос «что?»: отправить сообщение, создать группу, найти сообщение по слову. Обычно формулируются как «пользователь может…». Не говорят ничего о скорости и надёжности — это задача нефункциональных требований.
non-functional-requirements:
  term: Нефункциональные требования
  en: Non-functional requirements
  short: Насколько хорошо система должна работать — скорость, доступность, надёжность, масштабируемость, стоимость.
  long: |
    Отвечают на вопрос «как хорошо?»: сообщение доставляется за 1 секунду в 99% случаев, сервис доступен 99,95% времени. Именно они определяют архитектуру: функция «отправить сообщение» одинакова для 100 и для 100 миллионов пользователей, а архитектура — совершенно разная.
scalability:
  term: Масштабируемость
  en: Scalability
  short: Способность системы справляться с ростом нагрузки за счёт добавления ресурсов.
  long: |
    Вертикальное масштабирование — купить сервер мощнее; горизонтальное — добавить ещё серверов. Вертикальное проще, но упирается в потолок самой большой машины. Горизонтальное почти не ограничено, но требует, чтобы систему можно было разделить. Подробно — модули 2.5 и 9.
  links:
    - title: Клеппман, гл. 1, «Масштабируемость»
availability:
  term: Доступность
  en: Availability
  short: Доля времени, когда система отвечает на запросы корректно; обычно выражается в «девятках» (99,9%).
  long: |
    99,9% в год означает до 8,76 часа простоя, 99,99% — до 52,6 минуты. Каждая следующая «девятка» стоит заметно дороже: нужны резервирование, автоматическое переключение и дисциплина выкаток.
  links:
    - title: Google SRE Book, гл. 3 «Embracing Risk»
      url: https://sre.google/sre-book/embracing-risk/
reliability:
  term: Надёжность
  en: Reliability
  short: Способность системы продолжать работать правильно, даже когда что-то ломается.
  long: |
    Сбои неизбежны: диски умирают, сеть теряет пакеты, программисты ошибаются. Надёжная система не та, где ничего не ломается, а та, где поломка одной части не превращается в аварию для пользователя. Клеппман разделяет сбой (fault) — отказ компонента — и отказ (failure) — когда система перестала обслуживать пользователя.
  links:
    - title: Клеппман, гл. 1, «Надёжность»
durability:
  term: Долговечность данных
  en: Durability
  short: Гарантия, что подтверждённые данные не потеряются даже при сбое сервера.
  long: |
    Если мессенджер ответил «отправлено», сообщение не должно исчезнуть после перезагрузки сервера. Достигается записью на диск до подтверждения (fsync) и копиями на других машинах (репликация, модуль 8).
consistency:
  term: Согласованность
  en: Consistency
  short: Насколько одинаково и актуально разные пользователи и копии данных видят одно и то же состояние системы.
  long: |
    Пока данные лежат в одной базе на одном сервере, вопрос почти не возникает. Как только появляются копии на разных машинах, копия может отставать: вы отправили сообщение, обновили страницу — а его нет, потому что чтение ушло на отстающую копию. Строгая согласованность обещает, что все видят одно и то же сразу, но стоит задержки и доступности; слабая — дешевле, но допускает такие сюрпризы. Слово многозначное: «C» в ACID (модуль 2b) означает другое — соблюдение инвариантов базы. Подробно — модули 8 и 10.
  links:
    - title: Клеппман, гл. 5 и 9
latency:
  term: Задержка
  en: Latency
  short: Время, которое проходит от отправки запроса до получения ответа (или одного шага этого пути).
  long: |
    Измеряется в единицах времени: наносекундах для памяти, миллисекундах для сети. Пользователь ощущает именно задержку. Описывать её нужно перцентилями, а не средним — среднее скрывает самых медленных и самых недовольных пользователей.
  links:
    - title: Клеппман, гл. 1, «Описание производительности»
throughput:
  term: Пропускная способность (фактическая)
  en: Throughput
  short: Сколько работы система выполняет за единицу времени — например, запросов в секунду.
  long: |
    Задержка — «как быстро обслуживается один клиент», throughput — «сколько клиентов обслуживается за секунду». Они связаны, но не одно и то же: можно повысить throughput пачками (батчингом), но при этом увеличить задержку отдельного запроса.
bandwidth:
  term: Ширина канала
  en: Bandwidth
  short: Максимальный объём данных, который канал может передать за единицу времени (например, 1 Гбит/с).
  long: |
    Аналогия — число полос на шоссе. Больше полос — больше машин в час, но каждая машина едет до цели не быстрее. Поэтому «более толстый канал» не уменьшает задержку запроса через океан.
rps:
  term: RPS (запросов в секунду)
  en: Requests Per Second
  short: Число запросов, которые система получает или обрабатывает за одну секунду.
  long: |
    Главная единица нагрузки. Часто встречается также QPS (queries per second) — по смыслу то же самое. Удобное правило: 1 миллион запросов в сутки ≈ 12 RPS в среднем.
dau:
  term: DAU (активные пользователи за день)
  en: Daily Active Users
  short: Число уникальных пользователей, которые хотя бы раз воспользовались продуктом за сутки.
  long: |
    Отправная точка почти любой оценки нагрузки. Рядом встречается MAU (Monthly Active Users) — за месяц; DAU всегда не больше MAU.
percentile:
  term: Перцентиль (p50, p95, p99)
  en: Percentile
  short: Значение, ниже которого лежит заданная доля измерений; p99 = 120 мс значит, что 99% запросов быстрее 120 мс.
  long: |
    p50 — медиана, «типичный» запрос. p99 — хвост: 1 из 100 запросов медленнее. Хвосты важны, потому что при загрузке одной страницы делается много запросов, и шанс встретить медленный растёт.
  links:
    - title: Клеппман, гл. 1, «Перцентили»
sli:
  term: SLI (индикатор уровня обслуживания)
  en: Service Level Indicator
  short: Измеряемая метрика качества сервиса — например, доля запросов, выполненных успешно быстрее 300 мс.
  long: |
    SLI — это «градусник» сервиса: число, которое можно снять и сравнить с целью. Берут то, что чувствует пользователь: долю успешных ответов, задержку по p99, свежесть данных. Например, «за последние 5 минут 99,95% запросов отправки сообщения завершились успехом быстрее 300 мс». Из SLI строится SLO, а следят за ним в модуле 12.
  links:
    - title: Google SRE Book, гл. 4
      url: https://sre.google/sre-book/service-level-objectives/
slo:
  term: SLO (цель уровня обслуживания)
  en: Service Level Objective
  short: Целевое значение SLI за период — например, «99,9% запросов за 30 дней успешны и быстрее 300 мс».
  long: |
    Если SLI — градусник, то SLO — отметка «нормальная температура». Это внутренняя цель команды: достаточно строгая, чтобы пользователи были довольны, и достаточно мягкая, чтобы её можно было выполнять. Цель 99,9% за 30 дней допускает примерно 43 минуты «плохой» работы. SLO определяет бюджет ошибок и появляется в расчётах модуля 0, а мониторинг — в модуле 12.
  links:
    - title: Google SRE Book, гл. 4
      url: https://sre.google/sre-book/service-level-objectives/
sla:
  term: SLA (соглашение об уровне обслуживания)
  en: Service Level Agreement
  short: Договор с клиентом о качестве сервиса с последствиями (например, компенсацией) при нарушении.
  long: |
    SLA — юридическое обещание, SLO — внутренняя цель. SLO обычно строже SLA, чтобы команда успела отреагировать до того, как придётся платить.
error-budget:
  term: Бюджет ошибок
  en: Error budget
  short: Допустимый объём «плохой» работы, следующий из SLO; при SLO 99,9% за 30 дней это около 43 минут.
  long: |
    Бюджет можно «тратить» на рискованные выкатки и эксперименты. Когда он исчерпан, команда переключается с новых функций на надёжность.
  links:
    - title: Google SRE Book, гл. 3
      url: https://sre.google/sre-book/embracing-risk/
ip-address:
  term: IP-адрес
  en: IP address
  short: Числовой адрес устройства в сети, по которому доставляются пакеты (например, 93.184.216.34).
dns:
  term: DNS (система доменных имён)
  en: Domain Name System
  short: Распределённая «телефонная книга» интернета — переводит имя вроде api.example.com в IP-адрес.
  long: |
    Ответы DNS кэшируются на устройстве и у провайдера на время TTL. Поэтому повторные запросы почти бесплатны, а смена IP-адреса сервера доходит до пользователей не мгновенно.
tcp:
  term: TCP
  en: Transmission Control Protocol
  short: Протокол, который поверх ненадёжной сети даёт надёжный упорядоченный поток байтов между двумя программами.
  long: |
    TCP пересылает потерянные пакеты и восстанавливает порядок. Плата за это — установка соединения («рукопожатие», 1 RTT) до передачи данных. Подробно — модуль 0b.
tls:
  term: TLS
  en: Transport Layer Security
  short: Протокол шифрования поверх TCP; именно он превращает HTTP в HTTPS.
  long: |
    TLS 1.3 договаривается о ключах за 1 RTT (TLS 1.2 — за 2). Также проверяет сертификат, то есть что вы говорите именно с тем сервером, а не с подменой.
  links:
    - title: RFC 8446 (TLS 1.3)
      url: https://www.rfc-editor.org/rfc/rfc8446
rtt:
  term: RTT (время кругового пути)
  en: Round-Trip Time
  short: Время, за которое пакет доходит до получателя и ответ возвращается обратно.
  long: |
    Внутри одного дата-центра — около 0,5 мс, между континентами — 100–150 мс. Нижняя граница — скорость света в оптоволокне (~200 000 км/с), поэтому никакие оптимизации кода не сделают запрос через океан быстрее нескольких десятков миллисекунд.
http:
  term: HTTP
  en: HyperText Transfer Protocol
  short: Протокол «запрос — ответ» поверх TCP (или QUIC), на котором работают веб и большинство API.
load-balancer:
  term: Балансировщик нагрузки
  en: Load balancer
  short: Компонент, который принимает входящие запросы и распределяет их между несколькими серверами.
  long: |
    Позволяет добавлять серверы незаметно для клиента и выводить из работы сломанные. Подробно — модуль 2.5 (в том числе Nginx).
tls-termination:
  term: TLS-терминация
  en: TLS termination
  short: Расшифровка TLS на балансировщике, после которой запрос внутри дата-центра идёт к серверам уже без шифрования (или с отдельным внутренним).
  long: |
    Представьте охранника на входе в офис: он один проверяет документы у всех посетителей, а внутри сотрудники уже не проверяют друг друга на каждом шагу. Так и балансировщик берёт на себя тяжёлую работу по шифрованию, и серверам приложения не нужно держать сертификаты и тратить на это процессор. Цена вопроса — внутри сети трафик идёт открытым, поэтому в строгих системах его шифруют отдельно (mTLS — взаимная проверка сертификатов обеими сторонами, модуль 6.7). Настраиваем в модуле 2.5.
application-server:
  term: Сервер приложения
  en: Application server
  short: Процесс с бизнес-логикой (в нашем курсе — Go-сервис), который обрабатывает запрос и обращается к базе данных.
  long: |
    Это «повар» на кухне: балансировщик принёс заказ, сервер приложения проверил его, сходил в базу за продуктами и отдал готовый ответ. Хорошая привычка — делать его stateless, то есть не хранить состояние между запросами в памяти процесса: тогда любой из десяти одинаковых серверов может обработать любой запрос. Первый такой сервис мы пишем в модуле 1.
database:
  term: База данных
  en: Database
  short: Система, которая надёжно хранит данные и позволяет их эффективно искать и изменять (у нас — PostgreSQL).
fsync:
  term: fsync
  en: fsync
  short: Системный вызов, который заставляет ОС реально записать данные из памяти на диск, а не только в кэш.
  long: |
    Без fsync данные могут «жить» в кэше ОС и пропасть при отключении питания. Базы данных вызывают fsync перед тем, как подтвердить транзакцию, — это часть гарантии долговечности. Подробно — модуль 2b (WAL).
data-center:
  term: Дата-центр (ЦОД)
  en: Data center
  short: Здание с серверами, сетью и питанием; сетевые задержки внутри одного ЦОД — доли миллисекунды.
cpu-cache:
  term: Кэш процессора (L1, L2, L3)
  en: CPU cache
  short: Очень быстрая маленькая память внутри процессора; обращение к L1 — около 1 нс, в ~100 раз быстрее RAM.
  long: |
    Аналогия — рабочий стол: самое нужное лежит под рукой (L1), остальное в ящике стола (L2, L3), а всё прочее в архиве через коридор (RAM). Размер L1 — десятки килобайт, L3 — десятки мегабайт, и чем дальше уровень, тем он медленнее: порядка 1 нс, нескольких нс и десятков нс соответственно (порядок величины). Поэтому код, который обходит массив подряд, работает заметно быстрее кода, прыгающего по памяти. Встретится в уроке про таблицу задержек в модуле 0.
ram:
  term: Оперативная память (RAM)
  en: Random Access Memory
  short: Основная рабочая память сервера; быстрая (~100 нс на обращение), но теряет данные при выключении.
  long: |
    RAM — это стол, на котором разложена текущая работа: быстрый, но небольшой и пропадающий при выключении. Обращение к ней занимает порядка 100 нс, а у сервера её обычно десятки или сотни гигабайт. Сравните с диском: SSD медленнее на два-три порядка, HDD — ещё больше. Поэтому кэши (модуль 4) держат в памяти то, что читают чаще всего.
ssd:
  term: SSD
  en: Solid-State Drive
  short: Твердотельный накопитель без движущихся частей; случайное чтение — десятки микросекунд.
  long: |
    SSD хранит данные в микросхемах флеш-памяти, поэтому ему не нужно ничего перемещать механически, как жёсткому диску. Случайное чтение блока в 4 КБ занимает порядка десятков микросекунд (около 16 мкс по оценке Colin Scott, 2020; порядок величины, зависит от модели), то есть в сотни раз дольше обращения к RAM, но в сотни раз быстрее HDD. Именно SSD сегодня стоят под большинством баз данных, о чём мы говорим в модулях 2a и 2b.
hdd:
  term: HDD
  en: Hard Disk Drive
  short: Жёсткий диск с вращающимися пластинами; перемещение головки (seek) занимает миллисекунды.
  long: |
    Это проигрыватель винила: чтобы прочитать нужное место, головку надо подвести к дорожке (seek, порядка 5–10 мс) и дождаться, пока пластина провернётся. Поэтому последовательное чтение у HDD быстрое, а случайное — очень медленное: порядка сотен операций в секунду против десятков тысяч у SSD (порядок величины). За гигабайт HDD зато дешевле, и их используют для архивов и холодных данных (к которым обращаются редко). В таблице задержек модуля 0 это самая медленная ступень.
log-scale:
  term: Логарифмическая шкала
  en: Logarithmic scale
  short: Шкала, на которой каждое деление означает умножение (×10), а не прибавление; позволяет на одном графике показать и 1 нс, и 150 мс.
  long: |
    На обычной линейной шкале рядом с 150 мс отрезок в 1 нс невозможно разглядеть: это в 150 миллионов раз меньше. На логарифмической каждое деление — это ×10 (1 нс, 10 нс, 100 нс, 1 мкс и так далее), поэтому все числа умещаются на одном графике. Расплата в том, что на глаз разница кажется меньше, чем на деле: два соседних деления — это уже в 10 раз. Так устроена визуализация задержек в модуле 0.
littles-law:
  term: Закон Литтла
  en: Little's law
  short: L = λ × W — среднее число запросов в системе равно интенсивности потока, умноженной на среднее время пребывания.
  long: |
    Пример: 1000 RPS × 0,1 с = в среднем 100 одновременно обрабатываемых запросов. Отсюда размеры пулов соединений и число воркеров.
back-of-envelope:
  term: Оценка «на салфетке»
  en: Back-of-the-envelope estimation
  short: Быстрый приблизительный расчёт нагрузки и объёмов с округлением до порядка величины.
  long: |
    Цель — не точное число, а ответ на вопрос «это 10 серверов или 10 000?». Для этого числа округляют до удобных: в сутках примерно 100 тысяч секунд, миллион запросов в сутки — это около 12 RPS. Например, 10 млн пользователей по 40 сообщений в день дают 400 млн сообщений, то есть около 4000 записей в секунду в среднем. Такие расчёты мы делаем для мессенджера в модуле 0, а тренируем в мини-интервью каждого модуля.
  links:
    - title: Сюй, «System Design», т. 1, гл. 2
peak-factor:
  term: Коэффициент пика
  en: Peak factor
  short: Во сколько раз пиковая нагрузка выше средней (например, вечером или в Новый год).
  long: |
    Система обязана выдержать пик, а не среднее: мост рассчитывают не на среднее число машин в сутки, а на вечернюю пробку. Если в среднем 4000 RPS, а пик вдвое выше, проектировать нужно под 8000 RPS и выше. Ориентировочно это 2–5 раз (оценка, порядок величины, а не факт), а для конкретного продукта значение берут из данных или осознанно оценивают. Используется в расчёте нагрузки мессенджера в модуле 0.
replication-factor:
  term: Коэффициент репликации
  en: Replication factor
  short: Сколько копий каждого фрагмента данных хранится (обычно 3) — ради надёжности и доступности.
  long: |
    Это число копий важного документа в разных сейфах: потеряли один, остаются другие. При коэффициенте 3 данные переживают потерю двух машин, но занимают в три раза больше места. Поэтому при оценке хранилища объём сырых данных умножают на коэффициент репликации: 10 ТБ сообщений превращаются в 30 ТБ на дисках. В расчётах он появляется в модуле 0, а сама репликация разбирается в модуле 8.
retention:
  term: Срок хранения
  en: Retention
  short: Как долго система хранит данные, прежде чем удалить или перенести их в архив.
  long: |
    Данные не бесплатны: чем дольше мы их храним, тем больше дисков, резервных копий и денег. Если мессенджер хранит сообщения 5 лет, а за год набегает 10 ТБ, хранилище вырастет примерно до 50 ТБ (до учёта репликации и роста аудитории). Срок хранения также может диктоваться законом или продуктом, и его выбирают при сборе требований. Учитываем в оценке хранилища в модуле 0.
metadata:
  term: Метаданные
  en: Metadata
  short: Данные о данных — например, у сообщения это id, автор, чат, время отправки, статус.
  long: |
    Это библиотечная карточка: сама книга лежит на полке, а в карточке написано, кто автор, когда издана и где стоит. У сообщения текст — это «книга», а id, автор, чат, время и статус доставки — карточка. Метаданные малы (сотни байт) и их читают очень часто, поэтому их хранят отдельно от тяжёлого содержимого вроде файлов и картинок. В оценке объёма хранилища в модуле 0 мы считаем их отдельной строкой.
active-recall:
  term: Активное воспроизведение
  en: Active recall
  short: Приём обучения — вспомнить и объяснить материал самому, не подглядывая, вместо перечитывания.
  long: |
    Перечитывание создаёт иллюзию знания: текст кажется знакомым, но воспроизвести его трудно. Усилие вспомнить, наоборот, укрепляет память, как нагрузка укрепляет мышцу. Закройте урок и попробуйте объяснить его вслух за минуту. Поэтому в курсе после уроков идут вопросы для самопроверки, а в конце каждого модуля — мини-интервью.
  links:
    - title: Brown, Roediger, McDaniel, «Make It Stick»
spaced-repetition:
  term: Интервальное повторение
  en: Spaced repetition
  short: Повторение материала с растущими паузами (через день, неделю, месяц), чтобы он перешёл в долговременную память.
  long: |
    Знания забываются быстрее всего сразу после изучения, и каждое своевременное повторение замедляет забывание. Поэтому повторять лучше редко, но вовремя: например, через день, через неделю, через месяц, а не пять раз подряд в один вечер. Это как поливать растение по расписанию, а не заливать за раз. В курсе к ранним темам намеренно возвращаются в более поздних модулях.
  links:
    - title: Brown, Roediger, McDaniel, «Make It Stick»
adr:
  term: ADR (запись архитектурного решения)
  en: Architecture Decision Record
  short: Короткий документ — контекст, рассмотренные варианты, принятое решение и его последствия.
  long: |
    ADR — это судовой журнал решений: через год никто не помнит, почему выбрали именно эту базу, и запись отвечает на вопрос «а почему так?». Обычно хватает одной страницы: что мы решали, какие варианты рассматривали, что выбрали и чем за это заплатили. В курсе мы пишем ADR на ключевых развилках мессенджера, начиная с модуля 0; шаблон и первый ADR мессенджера — в уроке 1.1.
  links:
    - title: Michael Nygard, «Documenting Architecture Decisions»
      url: https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
websocket:
  term: WebSocket
  en: WebSocket
  short: Протокол постоянного двустороннего соединения поверх TCP, по которому сервер сам присылает данные клиенту без нового запроса.
  long: |
    Обычный HTTP устроен как письмо: клиент спрашивает — сервер отвечает, и без вопроса сервер ничего прислать не может. WebSocket похож на телефонный звонок: соединение открывается один раз (начинается как HTTP-запрос и «переключается» на другой протокол) и остаётся открытым, а говорить могут обе стороны в любой момент. Поэтому мессенджеры доставляют по нему новые сообщения мгновенно. Цена — состояние: каждое открытое соединение занимает память сервера, и при падении сервера все его клиенты разом переподключаются. Строим WebSocket-шлюз в модуле 3.
  links:
    - title: RFC 6455 (The WebSocket Protocol)
      url: https://www.rfc-editor.org/rfc/rfc6455
sharding:
  term: Шардирование
  en: Sharding
  short: Разбиение данных на части (шарды), которые хранятся на разных серверах, — чтобы распределить объём и нагрузку на запись.
  long: |
    Представьте картотеку, которая перестала помещаться в один шкаф: карточки на А–К ставят в первый шкаф, на Л–Я — во второй. Каждый шкаф — шард, а правило «какая карточка в каком шкафу» задаёт ключ шардирования (например, идентификатор чата). Шардирование помогает, когда один сервер не вмещает данные или не успевает их записывать. Платим сложностью: запросы, которым нужны данные из нескольких шардов, становятся дорогими, а перенос данных при добавлении серверов — отдельная задача. Подробно — модуль 9.
  links:
    - title: Клеппман, гл. 6
fan-out:
  term: Веерная рассылка
  en: Fan-out
  short: Размножение одного события на многих получателей — например, доставка одного сообщения всем участникам группы.
  long: |
    Одна запись превращается во много доставок, как одно объявление по радио слышат все приёмники. В личном чате веер маленький, в группе на тысячу человек — тысяча доставок, в канале на миллион подписчиков — миллион. Есть два подхода: разложить копии получателям сразу при записи (fan-out on write) или собирать ленту при чтении (fan-out on read); у каждого свои компромиссы по нагрузке и задержке. Разбираем в модуле 7.
  links:
    - title: Клеппман, гл. 1 (пример с Twitter)
e2e-encryption:
  term: Сквозное шифрование (E2E)
  en: End-to-end encryption
  short: Шифрование, при котором сообщение могут прочитать только отправитель и получатель, а сервер передаёт его, не видя содержимого.
  long: |
    При обычном TLS письмо шифруется только «в пути»: сервер мессенджера его расшифровывает, хранит и может прочитать. При сквозном шифровании ключи есть только у устройств собеседников, и сервер работает как почтальон с запечатанным конвертом. Платим функциями: сервер не может искать по сообщениям, а синхронизация истории на новое устройство и групповые чаты сильно усложняются. В курсе полноценное E2E не реализуем, только разбираем идею в модуле 6.7.
middleware:
  term: Middleware (промежуточный обработчик)
  en: Middleware
  short: Обёртка вокруг обработчика, которая выполняется до и после него и делает общую для всех запросов работу.
  long: |
    Проверка токена, логирование, метрики, ограничение скорости — всё это нужно каждому запросу, и писать это в каждом обработчике незачем. Middleware принимает обработчик и возвращает новый, который сначала делает свою часть, потом вызывает исходный. Обработчики оборачивают друг в друга цепочкой, и порядок важен: сначала идёт присвоение id запроса и восстановление после паники, потом логирование, потом аутентификация, а за ней уже бизнес-обработчик. Подробно — часть 1b (middleware аутентификации) и модуль 12.
dto:
  term: DTO (объект передачи данных)
  en: Data Transfer Object
  short: Структура, которая описывает данные на границе системы, например тело HTTP-запроса, и не совпадает с доменной моделью.
  long: |
    Формат запроса и ответа меняется по своим причинам, а доменная модель — по своим. DTO разводит их: на границе данные разбираются в DTO, проверяются и явно переводятся в доменные сущности. Подробно — урок 1.7.
wal:
  term: WAL (журнал предзаписи)
  en: Write-ahead log
  short: Журнал, в конец которого база сначала дописывает каждое изменение и сбрасывает его на диск, а сами таблицы обновляет позже.
  long: |
    Правило «сначала журнал, потом данные» делает долговечность дешёвой: чтобы подтвердить транзакцию, достаточно одной последовательной записи в конец журнала и одного fsync, а страницы таблиц, разбросанные по диску, можно обновить позже, в фоне. После сбоя база перечитывает журнал и восстанавливает всё, что успела подтвердить. В PostgreSQL журнал лежит в каталоге pg_wal. Подробно — модуль 2b.
index:
  term: Индекс
  en: Index
  short: Отдельная структура рядом с таблицей, по которой база находит строки по значению столбца, не читая всю таблицу.
  long: |
    Как алфавитный указатель в конце книги: чтобы найти страницу про WAL, не нужно листать книгу целиком. В PostgreSQL обычный индекс — B-дерево: отсортированные значения ключа со ссылками на строки таблицы. Платим за это местом на диске и скоростью записи: каждая вставка или изменение строки обновляет и все индексы таблицы. Подробно — модуль 2b.
  links:
    - title: Документация PostgreSQL, гл. «Indexes»
      url: https://www.postgresql.org/docs/current/indexes.html
udp:
  term: UDP
  en: User Datagram Protocol
  short: "Протокол доставки отдельных датаграмм без соединения, подтверждений и порядка."
  long: |
    UDP просто отправляет датаграмму и забывает о ней: ни рукопожатия, ни повторной отправки, ни гарантии порядка. Зато нет ни задержки на установку соединения, ни блокировки очереди из-за одного потерянного пакета. Поэтому на UDP работают DNS-запросы, видеозвонки и QUIC, а надёжность, если она нужна, строят сверху. Подробно — модуль 0b.
socket:
  term: Сокет
  en: Socket
  short: "Конечная точка соединения в программе: адрес и порт; в ОС — файловый дескриптор."
  long: |
    Сокет — это «розетка», в которую программа включает сетевое соединение: для ОС это обычный файловый дескриптор, из которого читают и в который пишут. TCP-соединение однозначно задаётся четвёркой: IP и порт клиента, IP и порт сервера. Поэтому один серверный порт обслуживает тысячи клиентов, а упереться можно в лимит открытых дескрипторов (`ulimit -n`). В Go за сокетом стоит `net.Conn`. Подробно — модуль 0b.
port:
  term: Порт
  en: Port
  short: "Число 0–65535, по которому ОС понимает, какой программе отдать пакет."
  long: |
    IP-адрес приводит пакет на нужную машину, порт — к нужной программе на ней, как номер квартиры после адреса дома. Порты ниже 1024 по традиции отдают системным службам (HTTP — 80, HTTPS — 443), остальные клиентская сторона берёт временно из эфемерного диапазона. В Linux по умолчанию это около 28 тысяч портов (32768–60999), и при множестве коротких соединений к одному серверу они могут закончиться. Подробно — модуль 0b.
mtu:
  term: MTU
  en: Maximum Transmission Unit
  short: "Максимальный размер пакета, который проходит через сетевой интерфейс без деления; в Ethernet — 1500 байт."
  long: |
    Это размер «конверта», который сеть пропускает целиком. В Ethernet MTU равен 1500 байт; за вычетом заголовков IP (20 байт) и TCP (20 байт) на данные остаётся 1460 байт — это и есть типичный MSS. Если пакет больше, его либо делят на части, либо отбрасывают с сообщением об ошибке. Поэтому MTU важен для VPN и туннелей: их заголовки отъедают место. Подробно — модуль 0b.
encapsulation:
  term: Инкапсуляция
  en: Encapsulation
  short: "Каждый уровень сети заворачивает данные верхнего уровня в свой заголовок, как письмо в конверт."
  long: |
    HTTP-запрос уходит в TCP-сегмент с заголовком из портов и номеров, сегмент — в IP-пакет с адресами, пакет — в Ethernet-кадр с MAC-адресами. На приёмной стороне каждый уровень снимает свой конверт и отдаёт содержимое выше. Благодаря этому уровни независимы: HTTP не знает, идёт ли он по Wi-Fi или по оптике. Цена — накладные расходы: на каждый пакет в Ethernet приходится порядка 54 байт заголовков (14 + 20 + 20). Подробно — модуль 0b.
cwnd:
  term: Окно перегрузки
  en: Congestion window, cwnd
  short: "Сколько байт TCP-отправитель может держать в полёте без подтверждения, чтобы не перегрузить сеть."
  long: |
    Отправитель не знает, сколько данных выдержит сеть, поэтому начинает осторожно и наращивает окно, пока всё доходит. Потеря пакета — сигнал перегрузки, и окно резко сокращается. В Linux начальное окно — 10 сегментов, около 14,6 КБ (RFC 6928), поэтому маленький ответ уходит за один RTT, а большой разгоняется несколько RTT. Подробно — модуль 0b.
slow-start:
  term: Медленный старт
  en: Slow start
  short: "Начальная фаза TCP: окно перегрузки растёт вдвое каждый RTT, пока не случится потеря или порог."
  long: |
    Название обманчиво: рост экспоненциальный, просто старт с малого окна. Каждый подтверждённый сегмент увеличивает окно на сегмент, поэтому за RTT оно удваивается: 10, 20, 40, 80 сегментов. Фаза кончается при потере пакета или на пороге slow start threshold, дальше окно растёт медленнее (в учебной модели Reno — линейно; Linux по умолчанию использует CUBIC, и это упрощение). Для вас это значит, что свежее соединение медленнее прогретого — ещё один довод за пул соединений. Подробно — модуль 0b.
retransmission:
  term: Повторная передача
  en: Retransmission
  short: "Повторная отправка сегмента, который TCP считает потерянным: по таймеру или после трёх дубликатов ACK."
  long: |
    TCP нумерует байты, и получатель в каждом ACK говорит, какой байт ждёт следующим. Если пришли три дубликата ACK (то есть четыре ACK с одним и тем же номером), отправитель решает, что сегмент потерян, и шлёт его заново, не дожидаясь таймера (fast retransmit). Если ACK нет совсем, срабатывает таймер повторной передачи, и он гораздо медленнее: в Linux минимум 200 мс (RFC 6298 задаёт начальный RTO в 1 с), а после каждой неудачи срок удваивается. Каждая потеря стоит минимум одного дополнительного RTT. Подробно — модуль 0b.
time-wait:
  term: TIME_WAIT
  en: TIME_WAIT
  short: "Состояние закрытого TCP-соединения на стороне, закрывшей первой; в Linux длится 60 с."
  long: |
    Сторона, первой закрывшая соединение, ещё минуту держит его в памяти, чтобы запоздавший пакет старого соединения не попал в новое с теми же адресами и портами. Само по себе состояние безвредно, но при тысячах коротких соединений в секунду оно копится и съедает эфемерные порты клиента. Типичный пример — сервис, который на каждый запрос открывает новое соединение вместо пула. Подробно — модуль 0b.
nagle:
  term: Алгоритм Нейгла
  en: Nagle's algorithm
  short: "Склеивание мелких записей в один сегмент, пока ждём ACK; в Go по умолчанию отключён (TCP_NODELAY)."
  long: |
    Если приложение пишет по пять байт, каждый такой кусок в своём пакете с 40 байтами заголовков — расточительно. Алгоритм Нейгла держит мелкие записи, пока не придёт ACK на предыдущие, и отправляет их вместе. Для интерактивных запросов это добавляет задержку, особенно в паре с отложенными ACK на другой стороне (в Linux обычно от 40 мс, до 200 мс). Go включает `TCP_NODELAY` по умолчанию, поэтому буферизовать записи нужно самому, через `bufio`. Подробно — модуль 0b.
datagram:
  term: Датаграмма
  en: Datagram
  short: "Отдельное самостоятельное сообщение UDP: дойдёт целиком или не дойдёт вовсе."
  long: |
    В отличие от потока байтов TCP, датаграмма — это сообщение со своими границами: сколько отправили, столько получатель и прочитает за один раз. Ни нумерации, ни подтверждения нет: пакеты могут потеряться, прийти не по порядку или продублироваться. Максимальная полезная нагрузка UDP по IPv4 — 65 507 байт, но на практике держат её в пределах MTU, чтобы не делить пакет. Подробно — модуль 0b.
dns-record:
  term: DNS-запись
  en: DNS resource record
  short: "Строка в зоне DNS: имя, тип (A, AAAA, CNAME, MX, TXT…), значение и TTL."
  long: |
    Зона DNS — это, по сути, таблица таких строк. Запись A сопоставляет имя IPv4-адресу, AAAA — IPv6, CNAME — это псевдоним на другое имя, MX указывает почтовый сервер, TXT хранит произвольный текст (например, подтверждения владения доменом). У каждой записи есть TTL, который говорит кэшам, как долго ей верить. Подробно — модуль 0b.
ttl:
  term: TTL
  en: Time To Live
  short: "Сколько секунд ответ разрешено хранить в кэше (в DNS); в IP — счётчик переходов."
  long: |
    В DNS это срок годности записи: пока он не истёк, резолвер отвечает из кэша и не ходит дальше. Типичные значения — от 60 секунд до суток; чем больше TTL, тем меньше нагрузка, но тем дольше до пользователей доходит смена IP. В заголовке IP одноимённое поле — это другое: счётчик переходов через маршрутизаторы (обычно 64), по нему пакет, зациклившийся в сети, в конце концов отбрасывается. Подробно — модуль 0b.
resolver:
  term: Резолвер
  en: Resolver
  short: "Программа или сервер, который находит IP-адрес по имени, обходя DNS-серверы и кэшируя ответы."
  long: |
    Ваше приложение не обходит корневые, TLD- и авторитетные серверы само — оно спрашивает резолвер (у провайдера, 8.8.8.8 или в локальной сети), а тот делает обход и запоминает результат на время TTL. Есть и «заглушка» в самой ОС или библиотеке: в Go это встроенный резолвер либо вызов `getaddrinfo` из libc. Ошибки здесь выглядят как «no such host» или таймаут, хотя сервер жив. Подробно — модуль 0b.
certificate:
  term: Сертификат
  en: X.509 certificate
  short: "Документ «этот открытый ключ принадлежит этому имени», подписанный центром сертификации."
  long: |
    Это как паспорт сервера: имя (например, example.com), открытый ключ, срок действия и подпись центра сертификации. Клиент проверяет подпись по цепочке до корневого сертификата, которому доверяет, сверяет имя с тем, что набрал пользователь, и срок действия. Не прошла любая проверка — соединение рвётся. Типичный срок жизни сертификата Let's Encrypt — 90 дней, и сроки сокращаются, поэтому продление автоматизируют. Подробно — модуль 0b.
ca:
  term: Центр сертификации
  en: Certificate Authority, CA
  short: "Организация, чьей подписи на сертификатах доверяют клиенты; корневые CA встроены в ОС и браузеры."
  long: |
    CA проверяет, что запрашивающий действительно управляет доменом, и подписывает его сертификат. Клиенту не нужно знать каждый сервер: достаточно доверять примерно полутора сотням корневых сертификатов из хранилища ОС или браузера. Это точка общего доверия, и ошибка CA бьёт по всем: поэтому сертификаты публикуют в открытых журналах (Certificate Transparency). Во внутренних сетях используют собственный CA. Подробно — модуль 0b.
sni:
  term: SNI
  en: Server Name Indication
  short: "Расширение TLS: клиент сообщает имя сайта в начале рукопожатия, чтобы сервер выбрал нужный сертификат."
  long: |
    Один IP-адрес часто обслуживает сотни сайтов, а сертификат нужен до того, как HTTP-запрос с заголовком Host вообще отправлен. Поэтому клиент пишет имя сайта прямо в первое сообщение TLS, и сервер выбирает подходящий сертификат. Без SNI вы получите сертификат по умолчанию и ошибку «имя не совпадает». В классическом TLS имя передаётся открытым текстом; шифрует его только расширение ECH. Подробно — модуль 0b.
alpn:
  term: ALPN
  en: Application-Layer Protocol Negotiation
  short: "Расширение TLS, через которое клиент и сервер договариваются о протоколе — h2 или http/1.1."
  long: |
    Клиент в первом сообщении TLS перечисляет, какие протоколы умеет: например, h2 и http/1.1. Сервер выбирает один в ответе, и никаких дополнительных RTT на выбор не тратится. Так браузеры и Go-клиент узнают, что можно говорить по HTTP/2. Если сервер h2 не предложил, разговор идёт по HTTP/1.1. Подробно — модуль 0b.
session-resumption:
  term: Возобновление TLS-сессии
  en: Session resumption
  short: "Повторное подключение по сохранённому секрету без полного рукопожатия и проверки сертификата."
  long: |
    После полного рукопожатия сервер выдаёт клиенту билет — зашифрованный секрет предыдущей сессии. При следующем подключении клиент предъявляет билет, и стороны пропускают проверку сертификата и подпись CertificateVerify: личность сервера уже подтверждена в прошлый раз. Обмен ключами ECDHE при этом остаётся (режим psk_dhe_ke, в Go-клиенте он единственный), поэтому прошлые сессии не расшифровать, даже если билет украдут позже. Возобновление укладывается в тот же 1 RTT, а с 0-RTT данные уходят уже в первом пакете. Подробно — модуль 0b.
keep-alive:
  term: Keep-alive
  en: HTTP persistent connection
  short: "Повторное использование одного TCP-соединения для нескольких HTTP-запросов."
  long: |
    Открывать TCP и TLS на каждый запрос дорого: это 2–3 RTT до первого байта данных. В HTTP/1.1 соединение по умолчанию остаётся открытым, и следующий запрос идёт по тому же каналу без рукопожатий. Go-клиент делает это сам, но только если вы прочитали и закрыли тело ответа. Не путайте с TCP keep-alive: тот лишь проверяет, жив ли собеседник. Подробно — модуль 0b.
connection-pool:
  term: Пул соединений
  en: Connection pool
  short: "Набор открытых соединений, которые программа держит и переиспользует вместо открытия новых."
  long: |
    Как стоянка такси: машины уже ждут, и не нужно каждый раз вызывать новую. В Go за пул HTTP-соединений отвечает `http.Transport`; его настройки (`MaxIdleConnsPerHost` по умолчанию равен 2!) прямо влияют на задержки при нагрузке. Слишком мал — соединения постоянно открываются заново, слишком велик — вы держите лишние дескрипторы и нагружаете сервер. Тот же приём применяют для баз данных. Подробно — модуль 0b.
multiplexing:
  term: Мультиплексирование
  en: Multiplexing
  short: "Передача нескольких независимых потоков по одному соединению вперемешку."
  long: |
    В HTTP/1.1 на одном соединении запросы идут по очереди, поэтому браузер открывает до шести соединений на хост. В HTTP/2 каждый запрос получает номер потока, а кадры разных потоков чередуются в одном TCP-соединении. Получается одно соединение вместо шести и общий разогнанный cwnd. Но потеря одного TCP-пакета всё равно задерживает все потоки: это блокировка начала очереди уровня TCP. Подробно — модуль 0b.
head-of-line-blocking:
  term: Блокировка начала очереди
  en: Head-of-line blocking
  short: "Задержка всех следующих данных из-за одного застрявшего впереди пакета или запроса."
  long: |
    Как очередь в кассу, где у первого человека зависла карта: стоят все, хотя их покупки готовы. В HTTP/1.1 медленный ответ блокирует следующие на том же соединении. В HTTP/2 эту проблему решили на уровне HTTP, но она осталась на уровне TCP: TCP отдаёт данные строго по порядку, и потерянный пакет задерживает все потоки. HTTP/3 убирает её, потому что QUIC делает потоки независимыми. Подробно — модуль 0b.
hpack:
  term: HPACK
  en: HPACK
  short: "Сжатие HTTP-заголовков в HTTP/2 через общий словарь уже переданных заголовков."
  long: |
    Заголовки запросов к одному сервису почти одинаковы: Host, User-Agent, Cookie повторяются сотни раз. HPACK хранит таблицу уже переданных заголовков на обеих сторонах и вместо повторного текста шлёт индекс записи. Так заголовок в 500 байт во втором запросе занимает несколько байт. Таблица привязана к соединению, ещё один довод за его переиспользование. Подробно — модуль 0b.
quic:
  term: QUIC
  en: QUIC
  short: "Транспорт поверх UDP со встроенным TLS 1.3 и независимыми потоками; основа HTTP/3."
  long: |
    QUIC объединяет то, что в TCP+TLS шло раздельно: надёжную доставку, шифрование и мультиплексирование. Рукопожатие занимает 1 RTT вместо 2–3, а потеря пакета задерживает только тот поток, которому он принадлежал. Работает поверх UDP в пространстве пользователя, а не в ядре, поэтому развивается быстрее, но и процессора пока ест больше. Подробно — модуль 0b.
zero-rtt:
  term: 0-RTT
  en: Zero round-trip time resumption
  short: "Отправка данных в первом же пакете повторного подключения; ценой возможного повтора запроса."
  long: |
    При повторном подключении клиент использует сохранённый секрет и отправляет данные приложения сразу вместе с первым сообщением, без ожидания рукопожатия. Задержка до первого байта сокращается на 1 RTT. Цена: злоумышленник может перехватить и повторить такой пакет, и сервер выполнит запрос дважды. Поэтому по 0-RTT безопасно слать только идемпотентные запросы, например GET. Подробно — модуль 0b.
netem:
  term: netem
  en: Network emulator
  short: "Модуль Linux tc, который добавляет на интерфейс задержку, потери и переупорядочивание пакетов."
  long: |
    Это способ превратить быструю локальную сеть в плохую: например, `tc qdisc add dev eth0 root netem delay 100ms loss 1%` добавляет 100 мс и 1% потерь на исходящий трафик интерфейса. Так на ноутбуке воспроизводят поведение сети между континентами или перегруженного мобильного канала. В лабораторных модуля 0b мы применяем его внутри контейнеров. Подробно — модуль 0b.
pcap:
  term: pcap
  en: Packet capture
  short: "Формат файла с записанными сетевыми пакетами; его пишет tcpdump и открывает Wireshark."
  long: |
    Это «видеозапись» сетевого трафика: каждый пакет с временной меткой и всеми заголовками. `tcpdump -w trace.pcap` записывает её на сервере, а Wireshark открывает на ноутбуке и разбирает по уровням. Чаще всего запись решает споры вроде «сеть виновата или приложение»: видно, кто и когда отправил запрос, и сколько секунд ушло на ответ. Подробно — модуль 0b.
clean-architecture:
  term: Чистая архитектура
  en: Clean Architecture
  short: "Подход, при котором бизнес-логика лежит в центре и не знает про базу, HTTP и фреймворки, а все зависимости направлены к ней."
  long: |
    Представьте луковицу: в центре правила предметной области, вокруг сценарии, дальше адаптеры, снаружи фреймворки и базы. Внешний слой можно заменить, не трогая внутренний, потому что внутренний про внешний ничего не знает. Подробно — урок 1.1.
dependency-rule:
  term: Правило зависимостей
  en: Dependency Rule
  short: "Код внутреннего слоя не импортирует код внешнего: зависимости направлены только к центру."
  long: |
    Это главное правило слоистой архитектуры: domain не знает про usecase, usecase не знает про adapters. Нарушение легко заметить по импортам, поэтому в мессенджере его проверяет линтер. Как только внутренний слой начинает зависеть от внешнего, заменить внешний без переписывания внутреннего уже нельзя. Подробно — урок 1.1.
hexagonal-port:
  term: Порт (портов и адаптеров)
  en: Port
  short: "Интерфейс, который объявляет потребитель и через который он общается с внешним миром, не зная реализации."
  long: |
    Порт похож на розетку: сценарию нужно «сохранить пользователя», и он описывает это интерфейсом у себя дома. Что за розеткой, Postgres или память, ему безразлично. Порт объявляют в пакете потребителя, а не реализации, иначе зависимость развернётся не в ту сторону. Не путать с сетевым портом. Подробно — урок 1.1.
adapter:
  term: Адаптер
  en: Adapter
  short: "Код, который подключает внешний мир к ядру: реализует порт или переводит внешний запрос в вызов use case."
  long: |
    Бывает входящий (HTTP-обработчик превращает запрос в вызов use case) и исходящий (репозиторий на Postgres реализует порт хранилища). Как переходник для розетки: ядро остаётся прежним, меняется только переходник. Адаптеры не знают друг о друге. Подробно — урок 1.1.
composition-root:
  term: Корень композиции
  en: Composition Root
  short: "Единственное место, где создаются все объекты приложения и связываются друг с другом, обычно main."
  long: |
    Остальной код получает зависимости в конструктор и сам ничего не создаёт. Поэтому в main видно весь граф приложения целиком, а в тестах любую зависимость можно подменить. Это сборочный цех, а не бизнес-логика. Подробно — урок 1.1.
big-ball-of-mud:
  term: Большой ком грязи
  en: Big Ball of Mud
  short: "Система без внятной структуры, где всё зависит от всего и любая правка ломает что-то далёкое."
  long: |
    Так выглядит проект, в котором обработчик сам ходит в базу, считает бизнес-правила и шлёт уведомления. Каждая новая функция попадает в самое удобное место, и через год никто не понимает, что на что влияет. Слои и правило зависимостей нужны, чтобы ком не вырос. Подробно — урок 1.1.
ddd:
  term: DDD (предметно-ориентированное проектирование)
  en: Domain-Driven Design
  short: "Подход, в котором структуру кода строят по языку и правилам предметной области, а не по технологиям."
  long: |
    Сначала разбираемся, что на самом деле значит «чат», «участник» и «сообщение» для бизнеса, и только потом пишем структуры. В курсе мы берём лёгкую версию: единый язык, ограниченные контексты, сущности и инварианты. Подробно — урок 1.2.
bounded-context:
  term: Ограниченный контекст
  en: Bounded Context
  short: "Граница, внутри которой слова предметной области имеют одно точное значение."
  long: |
    Слово «пользователь» в контексте регистрации — это логин и профиль, а в контексте чата — участник с ролью. Один общий класс на оба значения разрастается и путает, поэтому у каждого контекста своя модель. В мессенджере два контекста: user и chat. Подробно — урок 1.2.
ubiquitous-language:
  term: Единый язык
  en: Ubiquitous Language
  short: "Общий словарь терминов, одинаковый в разговорах, документах и именах в коде."
  long: |
    Если продакт говорит «участник чата», то в коде должен быть Member, а не User2 или ChatPerson. Когда названия в коде и в речи расходятся, на переводе между ними теряются смысл и время. Подробно — урок 1.2.
entity:
  term: Сущность
  en: Entity
  short: "Объект предметной области с собственной идентичностью: два объекта с одинаковыми полями остаются разными, если у них разные id."
  long: |
    Пользователь меняет имя, но остаётся тем же пользователем, потому что его определяет id, а не набор полей. Сущность живёт долго и меняется. Противоположность — объект-значение. Подробно — урок 1.2.
value-object:
  term: Объект-значение
  en: Value Object
  short: "Неизменяемый объект без идентичности, который определяется только своими значениями."
  long: |
    Сумма денег 100 рублей равна любой другой сумме в 100 рублей, их можно свободно подменять. Так же устроен текст сообщения: после создания не меняется, а правила проверяются при создании. Значение, которое нельзя создать невалидным, упрощает весь остальной код. Подробно — урок 1.2.
aggregate:
  term: Агрегат
  en: Aggregate
  short: "Группа связанных объектов, которую меняют только целиком через один корневой объект, чтобы сохранять инварианты."
  long: |
    Чат с его участниками и счётчиком сообщений: нельзя добавить сообщение в обход чата, иначе нарушится нумерация. Корень агрегата — единственная точка входа, он же отвечает за целостность. Хранят и блокируют агрегат целиком. Подробно — уроки 1.2 и 1.4.
invariant:
  term: Инвариант
  en: Invariant
  short: "Условие, которое должно быть истинным всегда, пока объект существует."
  long: |
    Например, «имя пользователя от 3 до 32 символов» или «отправитель — участник чата». Инвариант охраняется там, где объект создаётся и меняется, а не в HTTP-обработчике: обработчик можно обойти, домен нет. Подробно — урок 1.2.
use-case:
  term: Use case (сценарий использования)
  en: Use Case
  short: "Один сценарий работы приложения, например «отправить сообщение», оформленный отдельным типом с одним методом."
  long: |
    Use case оркестрирует: получает данные, загружает агрегаты через порты, вызывает доменную логику и сохраняет результат. Правил предметной области в нём почти нет, они в домене. Один сценарий — один тип с методом Execute. Подробно — урок 1.4.
sentinel-error:
  term: Сигнальная ошибка
  en: Sentinel Error
  short: "Ошибка, объявленная как переменная пакета, по которой вызывающий узнаёт, что именно случилось."
  long: |
    В Go это var ErrChatNotFound = errors.New(...). Вызывающий сравнивает через errors.Is, а не по тексту. Переменная становится частью публичного контракта пакета, так что называть и добавлять такие ошибки стоит осторожно. Подробно — урок 1.3.
error-wrapping:
  term: Обёртка ошибки
  en: Error wrapping
  short: "Добавление контекста к ошибке через fmt.Errorf с глаголом %w без потери исходной ошибки."
  long: |
    Получается цепочка: «отправка сообщения: загрузка чата: чат не найден». Читателю лога понятно, где случилось, а errors.Is всё равно находит исходную причину в глубине цепочки. Подробно — урок 1.3.
go-context:
  term: context.Context
  en: context.Context
  short: "Объект Go, который несёт через цепочку вызовов сигнал отмены, дедлайн и несколько значений запроса."
  long: |
    Его передают первым аргументом во всё, что может долго ждать: запросы к базе, сети, другие сервисы. Когда клиент закрыл соединение, контекст отменяется, и вся цепочка может прекратить работу. В структуре его хранить нельзя. Подробно — урок 1.5.
cancellation:
  term: Отмена
  en: Cancellation
  short: "Сигнал «результат больше не нужен, прекращай работу», который доходит до всех, кто работает на этот запрос."
  long: |
    Без отмены закрытый клиентом запрос продолжает грузить базу ради никому не нужного ответа. В Go отмена кооперативная: работа сама проверяет ctx.Done() или ctx.Err() и аккуратно останавливается. Подробно — урок 1.5.
deadline:
  term: Дедлайн
  en: Deadline
  short: "Момент времени, после которого операция считается проваленной и должна остановиться."
  long: |
    В отличие от таймаута «не дольше 2 секунд» дедлайн абсолютный: «до 12:00:03». Поэтому его удобно передавать вниз по цепочке: каждый следующий вызов видит, сколько времени осталось всей операции, а не начинает отсчёт заново. Подробно — урок 1.5.
data-race:
  term: Гонка данных
  en: Data race
  short: "Одновременный доступ двух горутин к одной памяти без синхронизации, где хотя бы один доступ — запись."
  long: |
    Результат непредсказуем: счётчик теряет приращения, структура читается наполовину обновлённой. Лечится мьютексом, каналом или атомарными операциями. Гонка данных — не то же самое, что логическая гонка за порядком событий. Подробно — урок 1.6.
race-detector:
  term: Детектор гонок
  en: Race detector
  short: "Режим -race в Go, который во время работы программы замечает одновременный доступ к памяти без синхронизации."
  long: |
    Ловит только те гонки, которые реально случились в этом прогоне, поэтому нужны тесты, нагружающие код из нескольких горутин. Замедляет программу в несколько раз, так что используется в тестах и CI, а не в проде. Подробно — урок 1.6.
test-double:
  term: Тестовый дубль
  en: Test double
  short: "Заменитель настоящей зависимости в тесте: фейк, стаб или мок."
  long: |
    Как дублёр в кино: делает то, что нужно сцене, без риска для оригинала. Дубли позволяют проверить use case без базы и сети. По классификации Месароша их пять: пустышка (dummy) только заполняет параметр и не вызывается; стаб (stub) возвращает заранее заданные ответы; шпион (spy) — стаб, который ещё и записывает, как его вызывали; фейк (fake) — упрощённая, но рабочая реализация; мок (mock) заранее знает, каких вызовов ждать, и сам проверяет их. Подробно — урок 1.6.
fake:
  term: Фейк
  en: Fake
  short: "Упрощённая рабочая реализация зависимости, например хранилище в памяти вместо Postgres."
  long: |
    Настоящая логика, но без настоящих затрат: данные лежат в map, а не на диске. Тест проверяет итоговое состояние, а не последовательность вызовов, поэтому не ломается от рефакторинга. Подробно — урок 1.6.
mock:
  term: Мок
  en: Mock
  short: "Тестовый дубль, который заранее знает, какие вызовы ожидает, и проваливает тест, если вызовы не те."
  long: |
    Проверяет поведение: «метод Save вызван ровно один раз с таким аргументом». Полезен для побочных эффектов вроде отправки письма, но на каждый вызов его применять вредно: тест тогда повторяет код и ломается при любом рефакторинге. Подробно — урок 1.6.
contract-test:
  term: Контрактный тест
  en: Contract test
  short: "Набор тестов, который одинаково проверяет любую реализацию порта и фиксирует его обязательное поведение."
  long: |
    Одну батарею запускают против хранилища в памяти и, позже, против Postgres. Если оба проходят, подменять одно другим безопасно. Так контракт порта становится исполняемой проверкой, а не комментарием. Подробно — урок 1.6.
table-driven-test:
  term: Табличный тест
  en: Table-driven test
  short: "Тест, в котором список случаев задан таблицей, а логика проверки написана один раз."
  long: |
    Каждая строка таблицы — имя, вход и ожидаемый результат, а цикл с t.Run запускает их по очереди. Добавить случай — значит добавить строку, а не копировать функцию. Стандартная идиома Go. Подробно — урок 1.6.
test-pyramid:
  term: Пирамида тестов
  en: Test pyramid
  short: "Модель, по которой быстрых изолированных тестов много, интеграционных меньше, а сквозных совсем немного."
  long: |
    Чем выше уровень, тем тест медленнее, хрупче и дороже в поддержке, зато ближе к настоящему поведению. Домен и use case проверяют юнит-тестами, адаптеры на реальной базе — интеграционными, а сквозные оставляют для главных сценариев. Подробно — урок 1.6.
optimistic-locking:
  term: Оптимистическая блокировка
  en: Optimistic locking
  short: "Способ избежать потерянных обновлений: изменение принимается, только если версия объекта не изменилась с момента чтения."
  long: |
    Мы не запираем объект на время работы, а надеемся, что конфликтов мало. При записи сравниваем версию: если кто-то успел изменить раньше, получаем конфликт и повторяем попытку. Дёшево при редких конфликтах. Подробно — урок 1.4.
mapper:
  term: Маппер
  en: Mapper
  short: "Функция, которая явно переводит одну структуру в другую, например DTO запроса в доменный объект."
  long: |
    Скучный, но важный код: он держит модели разных слоёв независимыми. Изменение формата JSON затрагивает только DTO и маппер, а доменные структуры остаются нетронутыми. Подробно — урок 1.7.
linter:
  term: Линтер
  en: Linter
  short: "Программа, которая автоматически находит в коде подозрительные места и нарушения правил, не запуская его."
  long: |
    В Go обычно запускают golangci-lint — больше сотни линтеров под одной командой. В мессенджере один из них, depguard, ещё и страж архитектуры: он запрещает лишние импорты между слоями, и проверка (golangci-lint run локально и в CI) падает на нарушении. Компилятор такой код соберёт — остановит его именно линтер. Правило, которое проверяет машина, не зависит от внимательности ревьюера. Подробно — урок 1.1.
uuidv7:
  term: UUIDv7
  en: UUID version 7
  short: "Формат идентификатора, в начале которого лежит время создания, так что новые id идут по возрастанию."
  long: |
    Обычные случайные UUID разбросаны по индексу, и вставки в базу дороже. В UUIDv7 первые 48 бит — время в миллисекундах, поэтому записи падают в конец индекса, а сортировка по id почти совпадает со временем создания. Подробно — урок 1.4.
rest:
  term: REST
  en: Representational State Transfer
  short: Архитектурный стиль Филдинга для сетевых API — ресурсы, единый интерфейс методов и отсутствие состояния сессии на сервере.
  long: |
    Идея простая. Всё, чем оперирует API, — это ресурсы с адресами, а действия над ними выражаются небольшим общим набором методов (GET, POST, PUT, DELETE). Сервер не помнит клиента между запросами: каждый запрос несёт всё нужное, например токен в заголовке, поэтому любой экземпляр сервера может ответить на любой запрос. В мессенджере `GET /v1/chats` вернёт список чатов, а `POST /v1/chats` создаст новый — и ни тот ни другой не зависят от того, какой процесс обработал предыдущий запрос.
  links:
    - title: Fielding, «Architectural Styles and the Design of Network-based Software Architectures», гл. 5
resource:
  term: Ресурс
  en: Resource
  short: То, на что указывает URI — отдельная сущность или их коллекция.
  long: |
    Ресурс — это существительное API, а не действие. Различают коллекцию (`/v1/chats` — все чаты) и элемент (`/v1/chats/{id}` — конкретный чат). Глагол берётся из метода HTTP, поэтому мы пишем `POST /v1/chats`, а не `/createChat`. Так адресов остаётся мало, а действия над ними единообразны.
safe-method:
  term: Безопасный метод
  en: Safe method
  short: Метод HTTP, который по определению не меняет состояние сервера, — GET, HEAD, OPTIONS.
  long: |
    По RFC 9110 клиент, вызывая безопасный метод, не просит ничего менять и не несёт ответственности за последствия. Поэтому такие запросы можно свободно кешировать, предзагружать и повторять. Если `GET /v1/chats` вдруг удалял бы чат, любой поисковый робот или предзагрузка браузера стали бы причиной потери данных.
  links:
    - title: RFC 9110, раздел 9.2.1 «Safe Methods»
idempotent-method:
  term: Идемпотентный метод
  en: Idempotent method
  short: Метод HTTP, повтор которого даёт тот же эффект, что и один вызов, — безопасные методы, а также PUT и DELETE.
  long: |
    Повторив `DELETE /v1/chats/42` три раза, вы получите тот же итог, что и после одного: чата нет. Это позволяет клиенту без страха повторить запрос, если ответ потерялся в сети. POST этим свойством не обладает: два одинаковых `POST /v1/chats/42/messages` создадут два сообщения. Чтобы сделать POST безопасным для повтора, нужен ключ идемпотентности.
  links:
    - title: RFC 9110, раздел 9.2.2 «Idempotent Methods»
status-code:
  term: Код статуса
  en: HTTP status code
  short: Трёхзначное число в ответе HTTP, которое коротко сообщает, чем закончился запрос; часть контракта API.
  long: |
    Первая цифра задаёт класс: 2xx — успех, 3xx — перенаправление, 4xx — ошибка клиента, 5xx — ошибка сервера. Клиентский код ветвится именно по статусу, поэтому его выбор — не украшение, а обещание. Например, мессенджер отвечает 201 на создание сообщения, 404 на несуществующий чат и 409 на конфликт, а клиент знает, что 5xx можно повторить, а 4xx — нет.
  links:
    - title: RFC 9110, раздел 15 «Status Codes»
api-versioning:
  term: Версионирование API
  en: API versioning
  short: Способ выпускать несовместимые изменения, не ломая старых клиентов; у нас версия живёт в пути, `/v1`.
  long: |
    Мобильное приложение нельзя обновить у всех пользователей одновременно, поэтому сервер должен годами понимать старых клиентов. Когда изменение нельзя сделать совместимым, появляется новая версия, `/v2`, а `/v1` продолжает работать до объявленной даты вывода. Версия в пути проста и заметна в логах; альтернативы — заголовок или параметр медиатипа — чище в теории, но неудобнее на практике.
breaking-change:
  term: Ломающее изменение
  en: Breaking change
  short: Изменение контракта, после которого ранее работавший клиент перестаёт работать.
  long: |
    Ломают: удаление или переименование поля, смена типа, превращение необязательного параметра в обязательный, изменение смысла статуса. Не ломают: новое необязательное поле в ответе или новый эндпоинт, если клиенты не падают на незнакомых полях. Поэтому в мессенджере поле `last_message` в ответе добавить можно, а переименовать `title` в `name` — только в новой версии API.
content-type:
  term: Content-Type
  en: Content-Type
  short: Заголовок HTTP с медиатипом тела сообщения, например `application/json` или `application/problem+json`.
  long: |
    Тело запроса или ответа — просто байты, и получатель должен знать, как их читать. Content-Type это сообщает: `application/json` для обычных данных и `application/problem+json` для ошибок в формате Problem Details. Сервер вправе отвергнуть тело с неожиданным типом кодом 415, а клиент по типу ответа понимает, пришли ему данные или описание ошибки.
  links:
    - title: RFC 9110, раздел 8.3 «Content-Type»
openapi:
  term: OpenAPI
  en: OpenAPI Specification
  short: Машиночитаемое описание HTTP API в формате YAML или JSON — пути, методы, параметры, тела и ошибки.
  long: |
    Один файл `api/openapi.yaml` отвечает на вопросы «какие есть эндпоинты, что в них отправлять и что вернётся». Из него получают документацию, клиентские SDK, серверные заготовки и тесты. Для команды это единый источник правды: если фронтенд и бэкенд расходятся во мнении, прав тот, чьё описание совпадает с файлом.
  links:
    - title: OpenAPI Specification
contract-first:
  term: Contract-first
  en: Contract-first (API-first)
  short: Подход, при котором сначала пишется контракт API, а код подгоняется под него, — в противовес code-first.
  long: |
    При code-first контракт получается побочным продуктом кода, и любая правка обработчика может незаметно изменить API. При contract-first мы сначала согласуем `openapi.yaml`, обсуждаем его с командами клиентов, а потом генерируем из него код. Цена — дисциплина и генератор в сборке, выигрыш — клиенты и сервер могут разрабатываться параллельно и не расходятся.
code-generation:
  term: Генерация кода
  en: Code generation
  short: Получение исходного кода программой из описания; такой код не правится руками.
  long: |
    Из `openapi.yaml` генератор строит типы запросов и ответов и интерфейс сервера, и мы реализуем только интерфейс. Сгенерированные файлы лежат в каталогах `gen/`, помечены строкой `Code generated … DO NOT EDIT.` и коммитятся в репозиторий. Правка вручную бессмысленна: следующий запуск `go generate` её затрёт, поэтому чинят контракт или шаблон, а не результат. Свежесть генерации проверяет `npm run check:messenger`.
json-schema:
  term: JSON Schema
  en: JSON Schema
  short: Язык описания формы JSON-документа — типов полей, обязательности, ограничений.
  long: |
    Схема говорит: «это объект, поле `text` — строка длиной от 1 до 4000 символов, поле `chat_id` обязательно». В OpenAPI на JSON Schema описаны все тела запросов и ответов, поэтому одну и ту же схему можно использовать и для генерации кода, и для валидации входа на границе системы.
  links:
    - title: json-schema.org
backward-compatibility:
  term: Обратная совместимость
  en: Backward compatibility
  short: Свойство нового кода понимать данные и запросы, созданные старой версией.
  long: |
    Новый сервер обязан принимать запросы старых клиентов, а в паре с прямой совместимостью (старый код читает данные нового) это позволяет обновлять части системы по очереди, без остановки. На практике это правило аддитивности: добавлять можно, удалять и менять смысл нельзя. Клеппман показывает, что та же задача возникает при формате хранимых данных и сообщений в очередях, а не только в REST.
  links:
    - title: Клеппман, гл. 4 «Кодирование и эволюция»
problem-details:
  term: Problem Details (RFC 9457)
  en: Problem Details for HTTP APIs
  short: Стандартный JSON-формат описания ошибки HTTP API с полями `type`, `title`, `status`, `detail`.
  long: |
    Вместо собственного формата ошибок в каждом сервисе берут общий, с типом `application/problem+json`. Поле `type` — устойчивый идентификатор проблемы, на который клиент может опираться, `detail` — подробность для человека, а можно добавлять свои поля. Мессенджер отвечает на отправку в несуществующий чат объектом с `status: 404` и понятным `type`, и клиенту не нужно разбирать текст.
  links:
    - title: RFC 9457
offset-pagination:
  term: Offset-пагинация
  en: Offset pagination
  short: Постраничная выдача по схеме «пропусти N записей, верни M»; проста, но страдает от дрейфа и дорогих больших смещений.
  long: |
    Запрос `?offset=100&limit=50` буквально превращается в `OFFSET 100 LIMIT 50`. База вынуждена прочитать и выбросить первые 100 строк, поэтому чем глубже страница, тем дороже запрос. Кроме того, пока клиент листает, в начало списка приходят новые сообщения, и страницы сдвигаются — это дрейф страниц. Для ленты чата, которая постоянно растёт, такой способ плох.
keyset-pagination:
  term: Keyset-пагинация
  en: Keyset (seek) pagination
  short: Постраничная выдача по схеме «дай M записей после последнего увиденного ключа»; стабильна при вставках и не дорожает с глубиной.
  long: |
    Клиент говорит: «дай 50 сообщений старше сообщения X», и база идёт по индексу прямо к нужному месту, ничего не пропуская. Новые записи в начале списка не сдвигают уже просмотренное, поэтому дублей и пропусков нет. Цена — нельзя прыгнуть сразу на страницу 17, только вперёд и назад, но для ленты сообщений это именно то, что нужно.
  links:
    - title: Use The Index, Luke — «Paging Through Results»
cursor:
  term: Курсор пагинации
  en: Pagination cursor
  short: Непрозрачная для клиента строка, в которой сервер закодировал, с какого места продолжать выдачу.
  long: |
    Ответ содержит поле `next_cursor`, а клиент просто возвращает его в следующем запросе, не заглядывая внутрь. Внутри обычно закодирован ключ последней записи, например время и id сообщения. Раз содержимое курсора не часть контракта, сервер вправе потом поменять устройство ключа, не сломав клиентов.
page-drift:
  term: Дрейф страниц
  en: Page drift
  short: Дубли и пропуски записей при листании offset-ом списка, который меняется во время просмотра.
  long: |
    Вы прочли страницу 1 из 50 сообщений, и за это время пришли ещё 3. Теперь страница 2 начнётся на три записи раньше, чем вы ожидали, и вы увидите дубли. Если же сообщения удаляются, часть записей проскочит незамеченной. Лекарство — keyset-пагинация, привязанная к ключу, а не к номеру позиции.
idempotency:
  term: Идемпотентность
  en: Idempotency
  short: Свойство операции, при котором повторный вызов не меняет результат сверх первого раза.
  long: |
    В сети запрос может дойти, а ответ — потеряться, и клиент не знает, выполнилось ли действие. Если операция идемпотентна, он просто повторит её и не создаст дубль. Для мессенджера это критично: нажатие «отправить» при плохой связи не должно породить два одинаковых сообщения.
  links:
    - title: Клеппман, гл. 11, «Идемпотентность»
idempotency-key:
  term: Ключ идемпотентности
  en: Idempotency key
  short: Заголовок `Idempotency-Key`, которым клиент помечает попытку, чтобы сервер мог узнать повтор и не выполнять действие дважды.
  long: |
    Клиент генерирует уникальный ключ для каждого логического действия и посылает его при каждой попытке. Сервер запоминает ключ вместе с результатом: увидев тот же ключ снова, он возвращает сохранённый ответ, а не выполняет работу заново. Если ключ совпал, а запрос другой, это ошибка клиента, и различить случаи помогает отпечаток запроса.
  links:
    - title: IETF draft «The Idempotency-Key HTTP Header Field»
natural-key:
  term: Естественный ключ
  en: Natural key
  short: Уникальный признак самой сущности, дающий идемпотентность без отдельной таблицы ключей; у нас это `client_message_id`.
  long: |
    Клиент мессенджера сам присваивает сообщению идентификатор до отправки. Уникальность пары «чат и `client_message_id`» в хранилище гарантирует, что повторная отправка не создаст второе сообщение, а вернёт уже созданное. Такой подход проще и надёжнее общего механизма с заголовком, но работает только там, где у сущности есть подходящий ключ.
at-least-once:
  term: Как минимум один раз
  en: At-least-once delivery
  short: Гарантия доставки, при которой сообщение может прийти повторно, но не пропадёт.
  long: |
    Чтобы не терять данные, отправитель повторяет попытку, пока не получит подтверждение. Подтверждение само может потеряться, и тогда получатель увидит дубль. Поэтому at-least-once почти всегда сочетают с идемпотентной обработкой на стороне получателя: повтор безвреден. Противоположные гарантии — at-most-once (может потеряться) и недостижимо дорогое exactly-once.
  links:
    - title: Клеппман, гл. 11
request-fingerprint:
  term: Отпечаток запроса
  en: Request fingerprint
  short: Хеш метода, пути и тела запроса, по которому отличают настоящий повтор от другого запроса с тем же ключом идемпотентности.
  long: |
    Клиент мог по ошибке использовать один `Idempotency-Key` для двух разных запросов. Сервер хранит вместе с ключом отпечаток первого запроса и сравнивает его с новым. Совпал — это повтор, возвращаем сохранённый ответ; не совпал — отвечаем ошибкой, а не молча отдаём результат чужой операции.
authentication:
  term: Аутентификация
  en: Authentication
  short: Проверка того, кто вы, — подтверждение личности вызывающего.
  long: |
    Вопрос аутентификации — «кто делает запрос?». В мессенджере пользователь предъявляет логин и пароль и получает токен, а дальше каждый запрос несёт токен, по которому сервер определяет личность. Не путайте с авторизацией: знать, кто вы, ещё не значит разрешать вам читать чужие чаты.
authorization:
  term: Авторизация
  en: Authorization
  short: Проверка того, что вам можно, — решение о том, разрешено ли данному пользователю данное действие.
  long: |
    Личность уже известна из аутентификации, теперь решаем, позволить ли ей действие. В мессенджере читать сообщения чата может только его участник, и это правило проверяет use case, а не транспорт. Отказ в аутентификации даёт 401, отказ в авторизации — 403.
password-hashing:
  term: Хеширование паролей
  en: Password hashing
  short: Хранение не самого пароля, а результата специально медленной функции от пароля и соли.
  long: |
    Если база утечёт, злоумышленник не должен получить пароли. Обычный быстрый хеш вроде SHA-256 не годится: видеокарта перебирает миллиарды вариантов в секунду. Для паролей используют намеренно дорогие функции, такие как Argon2id, bcrypt или scrypt, которые замедляют перебор до непрактичного.
  links:
    - title: OWASP Password Storage Cheat Sheet
salt:
  term: Соль
  en: Salt
  short: Случайные байты, уникальные для каждого хеша пароля, которые не позволяют использовать готовые радужные таблицы.
  long: |
    Без соли два пользователя с одинаковым паролем получили бы одинаковые хеши, а злоумышленник мог бы заранее вычислить хеши популярных паролей. Соль добавляется к паролю перед хешированием и хранится рядом с хешем открыто: её цель не секретность, а уникальность. Современные функции вроде Argon2id генерируют соль сами и кладут её в итоговую строку.
argon2id:
  term: Argon2id
  en: Argon2id
  short: Функция хеширования паролей, требующая много памяти и потому дорогая для перебора на GPU; первый выбор OWASP.
  long: |
    Победитель конкурса Password Hashing Competition 2015. Её стоимость задаётся тремя параметрами — памятью, числом проходов и параллелизмом, — и именно память делает массовый перебор на видеокартах невыгодным. Вариант id сочетает защиту от атак по сторонним каналам и от перебора на GPU. В мессенджере пароли хранятся как строка Argon2id вместе с параметрами и солью.
  links:
    - title: RFC 9106
timing-attack:
  term: Атака по времени
  en: Timing attack
  short: Вывод секрета из того, сколько времени сервер тратит на ответ.
  long: |
    Сравнение строк, которое останавливается на первом несовпавшем символе, отвечает быстрее при раннем расхождении, и атакующий по замерам подбирает значение символ за символом. Для сравнения секретов используют функции с постоянным временем, например `subtle.ConstantTimeCompare`. Та же проблема в логине: если для несуществующего имени ответ приходит быстрее, чем для существующего, мы раскрываем, кто зарегистрирован.
user-enumeration:
  term: Перебор пользователей
  en: User enumeration
  short: Выяснение, какие имена или адреса зарегистрированы, по различиям в ответах или времени ответа.
  long: |
    Если сервер отвечает «такого пользователя нет» на одно имя и «неверный пароль» на другое, атакующий получает список настоящих аккаунтов. Поэтому логин отвечает одинаково в обоих случаях и тратит одно и то же время, в том числе хеширует пароль для несуществующего пользователя. Исключения неизбежны, например при регистрации: имя занято, и это придётся сообщить.
jwt:
  term: JWT
  en: JSON Web Token
  short: Токен по RFC 7519 из трёх частей — заголовка, набора утверждений и подписи, закодированных в base64url.
  long: |
    JWT самодостаточен: сервер проверяет подпись и читает из токена, кто пользователь и до какого времени он действует, не обращаясь к базе. Это удобно для масштабирования, но у токена нет «кнопки отзыва» — он действует, пока не истечёт срок. Содержимое не зашифровано, только подписано, поэтому секреты в токен класть нельзя.
  links:
    - title: RFC 7519
claim:
  term: Claim
  en: Claim
  short: Утверждение внутри токена, например `sub` (субъект), `exp` (срок действия), `aud` (адресат).
  long: |
    Claims — это пары «ключ и значение» в теле JWT. Зарегистрированные имена несут определённый смысл: `sub` — идентификатор пользователя, `iat` — время выдачи, `exp` — момент истечения. Сервер проверяет не только подпись, но и сами утверждения: токен с истёкшим `exp` или чужим `aud` отвергается, даже если подпись верна.
digital-signature:
  term: Цифровая подпись
  en: Digital signature
  short: Доказательство, что данные подписал владелец закрытого ключа и что с тех пор они не менялись.
  long: |
    Подписывающий вычисляет подпись от данных своим закрытым ключом, а проверяющий убеждается в ней открытым. Любое изменение данных делает подпись недействительной, а подделать её без закрытого ключа нельзя. Так сервер доверяет JWT, не храня никакого состояния о выданных токенах.
public-key-cryptography:
  term: Криптография с открытым ключом
  en: Public-key cryptography
  short: Схема с парой ключей — закрытым, которым подписывают, и открытым, которым проверяют.
  long: |
    Закрытый ключ хранится только у того, кто подписывает, а открытый можно раздать всем. Для токенов это означает, что проверять подпись могут многие сервисы, но выпускать токены умеет только один. С симметричной схемой (общий секрет, HMAC) любой, кто умеет проверять, умеет и подделывать, поэтому с ростом числа сервисов асимметричная становится безопаснее.
bearer-token:
  term: Bearer-токен
  en: Bearer token
  short: "Токен «предъявителя» — кто его держит, тот и проходит; передаётся в заголовке `Authorization: Bearer …`."
  long: |
    Сервер не проверяет, тот ли это человек, которому токен выдан, — достаточно самого токена. Поэтому токен нужно защищать так же, как пароль: передавать только по TLS, не писать в логи и не хранить в URL. Короткий срок жизни ограничивает ущерб, если токен всё же утёк.
  links:
    - title: RFC 6750
token-expiry:
  term: Срок жизни токена
  en: Token expiry
  short: Момент, после которого токен недействителен (claim `exp`); короткий срок заменяет мгновенный отзыв.
  long: |
    Самодостаточный токен нельзя отозвать, не заведя на сервере список отозванных, а это возвращает состояние, от которого мы хотели избавиться. Выход — выдавать токены на короткое время, например 15 минут: даже украденный токен быстро перестанет работать. Платой становится необходимость продлевать токен, обычно через отдельный долгоживущий refresh-токен.
request-id:
  term: Идентификатор запроса
  en: Request ID
  short: Метка, по которой ответ клиента связывают со строками в логах сервера.
  long: |
    Middleware присваивает каждому запросу уникальный id, кладёт его в контекст, пишет в каждую строку лога и возвращает клиенту в заголовке `X-Request-ID`. Когда пользователь жалуется на ошибку, он называет этот id, и разработчик за секунды находит всю цепочку событий. В распределённой системе тот же id передают между сервисами.
shared-kernel:
  term: Общее ядро
  en: Shared Kernel
  short: Небольшая часть модели и кода, общая для двух контекстов и меняемая только по соглашению между командами.
  long: |
    Это паттерн из DDD Эванса: два ограниченных контекста совместно владеют узким набором понятий. В мессенджере это `kernel/ident` — проверка формата идентификатора, нужная и чату, и пользователю. Ядро должно быть маленьким и ни от чего проектного не зависеть, иначе оно превратится в свалку, которую никто не смеет менять.
  links:
    - title: Эванс, «Предметно-ориентированное проектирование», гл. 14
anti-corruption-layer:
  term: Антикоррупционный слой
  en: Anti-Corruption Layer
  short: Переводчик между моделями двух контекстов, не дающий чужим понятиям просочиться в вашу модель.
  long: |
    Контекст чатов не должен знать, как устроен пользователь, но ему нужно проверить, что участник существует. Поэтому он объявляет у себя узкий порт `UserChecker`, а адаптер `userchecker` переводит вызов на язык контекста user. Если user поменяет свою модель, правка останется в одном адаптере, а домен чатов не заметит. Тот же приём применён между auth и user в адаптере `userbridge`.
  links:
    - title: Эванс, «Предметно-ориентированное проектирование», гл. 14
unit-of-work:
  term: Unit of Work
  en: Unit of Work
  short: Объект, который собирает изменения одной бизнес-операции и фиксирует их единой транзакцией.
  long: |
    Регистрация пользователя меняет сразу несколько агрегатов: учётную запись и профиль. Unit of Work открывает транзакцию, даёт репозиториям работать внутри неё и в конце делает commit либо rollback, так что наполовину выполненной операции не остаётся. Use case видит лишь узкий порт и не знает про `*sql.Tx`.
  links:
    - title: Фаулер, «Patterns of Enterprise Application Architecture»
