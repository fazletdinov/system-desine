# region dependabot
version: 2
updates:
  # course/scripts/go-harness — версии внешних пакетов Go-фрагментов уроков (pgx): они
  # должны идти за мессенджером, иначе урок покажет код под старую версию драйвера.
  - package-ecosystem: gomod
    directories: ["/messenger", "/labs", "/course/scripts/go-harness"]
    schedule:
      interval: weekly
    # Не брать версии моложе двух недель: у свежего релиза ещё не нашли регрессии и
    # не успели отозвать скомпрометированный (то же правило, что для ручных обновлений).
    cooldown:
      default-days: 14
    groups:
      go-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /course
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor:
        update-types: [minor, patch]
    # TypeScript 7 — компилятор на Go без JS-API, а vue-tsc вызывает typescript/lib/tsc.
    # Снять, когда vue-tsc начнёт поддерживать 7.x.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # Обновляет SHA закреплённых actions вместе с комментарием версии.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]
  # Обновляет digest базовых образов: закрепление по digest без этого — замороженные уязвимости.
  - package-ecosystem: docker
    directories: ["/messenger", "/labs/0b", "/labs/1c"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # Линия Go одна на весь репозиторий: go.mod, GO_VERSION в ci.yml, образы, тексты уроков.
    # Бот приносит патчи; переход на новую минорную версию — отдельная задача, а не PR бота.
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Образ Postgres закреплён по digest в compose-файлах (мессенджер и лаба 2a; тот же
  # digest — в platform/pgtest.Image, его сверяет тест): экосистема docker читает только
  # Dockerfile, compose-файлы — отдельная docker-compose. Major-версию Postgres бот не
  # предлагает: переход 18 → 19 — это pg_upgrade данных, а не замена строки.
  - package-ecosystem: docker-compose
    directories: ["/messenger", "/labs/2a"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
# endregion dependabot
