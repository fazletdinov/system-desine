# Лаба 2a: одноразовый PostgreSQL для SQL-скриптов и программы keys.
# Запуск из labs/: docker compose -f 2a/compose.yaml up -d --wait
name: lab2a

services:
  db:
    # Тег для человека, digest — для воспроизводимости: тег 18.6-trixie могут перепубликовать
    # с новой Debian-базой, а digest указывает ровно на тот образ, на котором сняты results/.
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: lab
      # Пароль в открытом виде допустим только здесь: база одноразовая и слушает лишь 127.0.0.1.
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
      # Для psql внутри контейнера: docker compose exec db psql — без -U и -d.
      PGUSER: lab
      PGDATABASE: lab
    ports:
      # Только loopback: порт 5432 на всех интерфейсах открыл бы базу с паролем «lab» всей сети.
      - "127.0.0.1:${LAB2A_PORT:-55432}:5432"
    # Данные в памяти: лаба одноразовая, после down -v ничего не остаётся, а диск не тормозит замеры.
    # Скрипты лабы внутри контейнера: psql -f /lab/anomalies.sql печатает в ошибках файл и строку.
    volumes:
      - ./:/lab:ro
    tmpfs:
      - /var/lib/postgresql:size=2g
    # Разделяемая память контейнера по умолчанию 64 МиБ — мало для shared_buffers по умолчанию (128 МиБ).
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30
